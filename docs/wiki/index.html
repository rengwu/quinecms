erview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `b9adf54c-f21e-4219-b2a3-932c862859dc`\n\n## Question 40\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: Which UI approach should the React editor use?\nContext: This affects dialogs, menus, field controls, and the drawer. Base UI provides unstyled React primitives; a styled kit provides more ready-made design. The native-only rule remains specific to the throwaway grill-form.\nRecommendation: Use Base UI for complex controls, native elements where sufficient, and CSS Modules for a small custom design. Import only what the editor uses.\nOptions: Base UI plus CSS Modules / A styled shadcn/ui setup with Tailwind / Native controls and custom React components only\nSelected: Base UI plus CSS Modules\nNotes: \n```\n\n## Question 41\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: How should block authors scope their CSS?\nContext: The editor and preview share a document. Global resets or selectors such as button { ... } could change other blocks or the editor. Scoped CSS still lets each block have its own design.\nRecommendation: Require CSS Modules or the framework's scoped styles. Keep shared resets/theme variables in the site shell and avoid block-owned global rules.\nOptions: CSS Modules or framework-scoped styles / Author-managed block namespaces, checked during the build\nSelected: CSS Modules or framework-scoped styles\nNotes: \n```\n\n## Question 42\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: What should the main Save button commit?\nContext: An editor might change a page, site navigation, and a collection definition before saving. Related file changes can be committed together to the draft branch.\nRecommendation: Save all pending editor changes as one commit, with a clear unsaved-changes indicator. This avoids accidentally leaving part of a site change behind.\nOptions: All pending editor changes in one draft commit / Only the current page or record and its required related changes\nSelected: All pending editor changes in one draft commit\nNotes: \n```\n\n## Question 43\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: How should unsaved content survive an accidental reload?\nContext: This is recovery of text/content edits, separate from Git Save. Binary uploads are not included. Persistent recovery would leave a copy of draft content on that device after the tab closes.\nRecommendation: Restore unsaved edits within the tab session. It matches the chosen GitHub-token session model without retaining draft content indefinitely.\nOptions: Recover edits within the tab session, including reloads / Keep a local recovery copy across browser restarts / Keep edits in memory only; reloading loses unsaved work\nSelected: Recover edits within the tab session, including reloads\nNotes: \n```\n\n## Question 44\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: How should users edit the Markdown stored inside text blocks?\nContext: The storage format is already Markdown. A visual editor hides its syntax, while a textarea exposes markup but is simpler to implement and extend. Both can update the page preview live.\nRecommendation: Use a visual editor limited to headings, paragraphs, emphasis, links, and lists, saving Markdown. This suits nontechnical editors while keeping the feature set small.\nOptions: Visual formatting controls that save Markdown / Markdown textarea with a small formatting toolbar / Both visual and source modes\nSelected: Visual formatting controls that save Markdown\nNotes: \n```\n\n## Question 45\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: Can Save preserve an incomplete draft?\nContext: Switching a block version may leave new required fields empty, as you requested. Structurally invalid files still need protection; this question concerns ordinary incomplete content.\nRecommendation: Allow incomplete drafts to be saved, with clear field errors. Require valid content and resolvable references before Publish, so users can safely stop and return later.\nOptions: Save incomplete drafts; validate required content before Publish / Require all required content to be valid before Save\nSelected: Save incomplete drafts; validate required content before Publish\nNotes: \n```\n","toc":[{"id":"question-40","title":"Question 40","depth":2},{"id":"question-41","title":"Question 41","depth":2},{"id":"question-42","title":"Question 42","depth":2},{"id":"question-43","title":"Question 43","depth":2},{"id":"question-44","title":"Question 44","depth":2},{"id":"question-45","title":"Question 45","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>b9adf54c-f21e-4219-b2a3-932c862859dc\u003c/code>\u003c/p>\n\u003ch2 id=\"question-40\">Question 40\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: Which UI approach should the React editor use?\nContext: This affects dialogs, menus, field controls, and the drawer. Base UI provides unstyled React primitives; a styled kit provides more ready-made design. The native-only rule remains specific to the throwaway grill-form.\nRecommendation: Use Base UI for complex controls, native elements where sufficient, and CSS Modules for a small custom design. Import only what the editor uses.\nOptions: Base UI plus CSS Modules / A styled shadcn/ui setup with Tailwind / Native controls and custom React components only\nSelected: Base UI plus CSS Modules\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-41\">Question 41\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: How should block authors scope their CSS?\nContext: The editor and preview  work\nSelected: Recover edits within the tab session, including reloads\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-44\">Question 44\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: How should users edit the Markdown stored inside text blocks?\nContext: The storage format is already Markdown. A visual editor hides its syntax, while a textarea exposes markup but is simpler to implement and extend. Both can update the page preview live.\nRecommendation: Use a visual editor limited to headings, paragraphs, emphasis, links, and lists, saving Markdown. This suits nontechnical editors while keeping the feature set small.\nOptions: Visual formatting controls that save Markdown / Markdown textarea with a small formatting toolbar / Both visual and source modes\nSelected: Visual formatting controls that save Markdown\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-45\">Question 45\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: Can Save preserve an incomplete draft?\nContext: Switching a block version may leave new required fields empty, as you requested. Structurally invalid files still need protection; this question concerns ordinary incomplete content.\nRecommendation: Allow incomplete drafts to be saved, with clear field errors. Require valid content and resolvable references before Publish, so users can safely stop and return later.\nOptions: Save incomplete drafts; validate required content before Publish / Require all required content to be valid before Save\nSelected: Save incomplete drafts; validate required content before Publish\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-editor-saving"]},{"id":"journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `c9c27420-78c7-4c08-ac09-edd5289ddf59`\n\n## Question 15\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How long should the editor remember your GitHub token?\nContext: Private repository drafts need the token when loading, as well as saving. Browser storage makes repeat visits easier but retains a credential on that device.\nRecommendation: Keep it in memory while the editor is open; ask again after a reload. This avoids storing the token on disk through the app.\nOptions: In memory only; enter it again after reloading / Keep it for the browser tab's session, including reloads / Remember it on this device until I sign out\nSelected: Keep it for the browser tab's session, including reloads\nNotes: \n```\n\n## Question 16\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: When you say the portal saves schema changes, what should users be able to change?\nContext: A schema defines fields such as a post's title, date, and category. Editing those definitions is different from editing a post's values. New block rendering code is still installed by a developer, as agreed.\nRecommendation: Start with developer-defined schemas and let the portal edit their content. Add a visual schema editor only if users need to create their own content models.\nOptions: Developers define schemas; the portal edits content values only / Users can create collections and change their fields in the portal / Users can edit collection schemas and existing blocks' field definitions in the portal\nSelected: Users can create collections and change their fields in the portal\nNotes: 1 and 2\n```\n\n## Question 17\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How much simultaneous editing should the first release support?\nContext: Everyone's saved drafts accumulate before Publish. If another edit has changed the same content, an older save must not silently overwrite it.\nRecommendation: Use one shared draft branch with stale-save protection. Preserve local edits and ask the editor to refresh and reapply conflicting changes; add richer collaboration later.\nOptions: Shared drafts with stale-save protection; manual reapplication is acceptable / Parallel editing with an in-app interface to compare and resolve conflicts / Live collaborative editing, with other people's changes appearing immediately\nSelected: Shared drafts with stale-save protection; manual reapplication is acceptable\nNotes: keep it lean and simple to understand. we dont want conflicts, or any problems that a layman non-technical person might not understand.\n```\n\n## Question 18\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: Which media should users be able to upload in the first release?\nContext: Uploaded files will be committed to the same repository. Supporting large audio or video files substantially increases repository size and upload work.\nRecommendation: Support images and downloadable documents first, with validation and size limits.\nOptions: Images only / Images and downloadable documents / Also upload audio and video files\nSelected: Something else\nNotes: i'm planning to use cloudflare R2 for media. accept cloudflare r2 tokens in env vars. and the github-saved content just points to media hosted in the r2 bucket.\n```\n\n## Question 19\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How should site-wide styling work alongside each block's own design?\nContext: You want independently designed blocks. Shared colors, fonts, and spacing can still make a site consistent without removing block-specific controls.\nRecommendation: Provide site-wide defaults that blocks can inherit, with each block exposing its own overrides and keeping its CSS scoped.\nOptions: Shared site defaults with block-specific overrides / Every block manages its own styling independently / All blocks must follow a single site-wide theme\nSelected: Shared site defaults with block-specific overrides\nNotes: there are site-wide switches, yes, like dark/light mode and other more general styles and settings. but mostly, each block will manage its own styling independently. the site-wide switches are just global variables which the blocks may or may not listen or adhere to.\n```\n","toc":[{"id":"question-15","title":"Question 15","depth":2},{"id":"question-16","title":"Question 16","depth":2},{"id":"question-17","title":"Question 17","depth":2},{"id":"question-18","title":"Question 18","depth":2},{"id":"question-19","title":"Question 19","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>c9c27420-78c7-4c08-ac09-edd5289ddf59\u003c/code>\u003c/p>\n\u003ch2 id=\"question-15\">Question 15\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: How long should the editor remember your GitHub token?\nContext: Private repository drafts need the token when loading, as well as saving. Browser storage makes repeat visits easier but retains a credential on that device.\nRecommendation: Keep it in memory while the editor is open; ask again after a reload. This avoids storing the token on disk through the app.\nOptions: In memory only; enter it again after reloading / Keep it for the browser tab's session, including reloads / Remember it on this device until I sign out\nSelected: Keep it for the browser tab's session, including reloads\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-16\">Question 16\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\" de class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: Which media should users be able to upload in the first release?\nContext: Uploaded files will be committed to the same repository. Supporting large audio or video files substantially increases repository size and upload work.\nRecommendation: Support images and downloadable documents first, with validation and size limits.\nOptions: Images only / Images and downloadable documents / Also upload audio and video files\nSelected: Something else\nNotes: i'm planning to use cloudflare R2 for media. accept cloudflare r2 tokens in env vars. and the github-saved content just points to media hosted in the r2 bucket.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-19\">Question 19\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: How should site-wide styling work alongside each block's own design?\nContext: You want independently designed blocks. Shared colors, fonts, and spacing can still make a site consistent without removing block-specific controls.\nRecommendation: Provide site-wide defaults that blocks can inherit, with each block exposing its own overrides and keeping its CSS scoped.\nOptions: Shared site defaults with block-specific overrides / Every block manages its own styling independently / All blocks must follow a single site-wide theme\nSelected: Shared site defaults with block-specific overrides\nNotes: there are site-wide switches, yes, like dark/light mode and other more general styles and settings. but mostly, each block will manage its own styling independently. the site-wide switches are just global variables which the blocks may or may not listen or adhere to.\n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-three-decisions"]},{"id":"journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `d3cb2bf4-2763-40ad-bc3a-9213d73c86a4`\n\n## Question 46\n\n```text\nRound: Admin layout choices\nQuestion: Where should the Add block action sit so it clearly reads as an action rather than another block?\nContext:\nRecommendation: Put a compact, borderless “+ Add block” button beside the Blocks heading. It stays close to the list without looking like one of its rows.\nOptions: Beside the Blocks heading, aligned right / Below the list, separated by extra space, with a centered borderless label\nSelected: Beside the Blocks heading, aligned right\nNotes:\n```\n\n## Question 47\n\n```text\nRound: Admin layout choices\nQuestion: How should collections separate entry editing from schema editing?\nContext:\nRecommendation: A: open each collection on its entry list, with an explicit “Edit schema” action opening a separate screen. This keeps content editing straightforward and fits the existing portal.\nOptions: A. Entries first, with a separate Edit schema screen / B. Separate top-level Content and Collection schemas areas / C. Entries and Schema tabs within each collection, opening Entries by default\nSelected: B. Separate top-level Content and Collection schemas areas\nNotes:\n```\n","toc":[{"id":"question-46","title":"Question 46","depth":2},{"id":"question-47","title":"Question 47","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>d3cb2bf4-2763-40ad-bc3a-9213d73c86a4\u003c/code>\u003c/p>\n\u003ch2 id=\"question-46\">Question 46\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Admin layout choices\nQuestion: Where should the Add block action sit so it clearly reads as an action rather than another block?\nContext:\nRecommendation: Put a compact, borderless “+ Add block” button beside the Blocks heading. It stays close to the list without looking like one of its rows.\nOptions: Beside the Blocks heading, aligned right / Below the list, separated by extra space, with a centered borderless label\nSelected: Beside the Blocks heading, aligned right\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-47\">Question 47\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Admin layout choices\nQuestion: How should collections separate entry editing from schema editing?\nContext:\nRecommendation: A: open each collection on its entry list, with an explicit “Edit schema” action opening a separate screen. This keeps content editing straightforward and fits the existing portal.\nOptions: A. Entries first, with a separate Edit schema screen / B. Separate top-level Content and Collection schemas areas / C. Entries and Schema tabs within each collection, opening Entries by default\nSelected: B. Separate top-level Content and Collection schemas areas\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","discussions/admin-hierarchy-proposal","journal/2026-10-05-admin-hierarchy-decisions"]},{"id":"journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `d557fd13-2a71-44e6-9b9a-4543b858f2b0`\n\n## Question 48\n\n```text\nRound: Generic pages and collections\nQuestion: If a collection has no generic page assigned, what should happen to its entries on the public website?\nContext:\nRecommendation: Keep the entries available as data, but generate no individual entry pages. Layout assignment then has a clear purpose.\nOptions: Data only; no individual entry pages / Generate a default entry page from its fields / Require a generic page before publishing any collection entries\nSelected: Data only; no individual entry pages\nNotes: yeah make it data only. i could have a collection of links with no generic page, named \"footer links\", and then i use it in the site footer (in the future, out of scope for now).\n```\n\n## Question 49\n\n```text\nRound: Generic pages and collections\nQuestion: Can the same generic page be assigned to more than one collection schema?\nContext:\nRecommendation: Allow reuse across schemas with compatible field names and types, so a shared layout only needs editing once.\nOptions: Allow reuse across compatible schemas / Restrict each generic page to one schema\nSelected: Allow reuse across compatible schemas\nNotes:\n```\n\n## Question 50\n\n```text\nRound: Generic pages and collections\nQuestion: Where should an entry's public URL be defined? For example, a recipe entry at /recipes/apple-pie.\nContext:\nRecommendation: Use the collection's URL prefix plus the entry's slug. The generic page supplies the layout and has no separate public URL.\nOptions: Collection URL prefix + entry slug / A URL pattern configured on the generic page / A complete URL path configured separately on each entry\nSelected: Collection URL prefix + entry slug\nNotes:\n```\n\n## Question 51\n\n```text\nRound: Generic pages and collections\nQuestion: How should collection listing pages, such as an articles index, be created?\nContext:\nRecommendation: Build a static page with a collection-list block, so the listing can be composed with other normal page content.\nOptions: Static pages containing collection-list blocks / Automatically generate a standard listing for each collection / A separate generic-page type for collection listings\nSelected: Something else\nNotes: the index route should 404 if no matching page route is assigned to it. a static page can optionally be assigned to it.\n```\n\n## Question 52\n\n```text\nRound: Generic pages and collections\nQuestion: If a generic block binds to a field name that does not exist in an assigned schema, or the value type is incompatible, how should publishing behave?\nContext:\nRecommendation: Allow the incomplete draft, but prevent publishing until the binding is fixed. This catches broken connections before they become public.\nOptions: Allow draft saving; block publishing until fixed / Publish using the block field's fixed value as a fallback / Publish with the affected block field empty\nSelected: Allow draft saving; block publishing until fixed\nNotes:\n```\n\n## Question 53\n\n```text\nRound: Generic pages and collections\nQuestion: If the bound schema field exists and is optional, but an entry leaves it empty, what should the generic block field display?\nContext:\nRecommendation: Use the block field's fixed value when one is set; otherwise leave it empty. This supports a shared fallback without changing entry data.\nOptions: Use the block field's fixed value, otherwise empty / Always leave the bound field empty / Require every bound field to have an entry value before publishing\nSelected: Use the block field's fixed value, otherwise empty\nNotes:\n```\n\n## Question 54\n\n```text\nRound: Generic pages and collections\nQuestion: With entry blocks removed, how should authors write formatted article bodies or recipe instructions inside a schema field?\nContext:\nRecommendation: Add a rich-text field with visual formatting controls, stored as Markdown, reusing the current text editing experience.\nOptions: Rich-text schema field with visual formatting / Markdown schema field edited as source text / Plain multiline text only for now\nSelected: Rich-text schema field with visual formatting\nNotes: also with embedded media such as uploaded images and youtube video embeds.\n```\n\n## Question 55\n\n```text\nRound: Generic pages and collections\nQuestion: What content should the live preview show while editing a generic page under Pages?\nContext:\nRecommendation: Let the editor select a collection and entry as preview data. This shows how bindings behave with real content while keeping entry editing in Content.\nOptions: A selectable real collection entry / Sample values entered on the generic page / Placeholders showing the bound field names\nSelected: Placeholders showing the bound field names\nNotes:\n```\n","toc":[{"id":"question-48","title":"Question 48","depth":2},{"id":"question-49","title":"Question 49","depth":2},{"id":"question-50","title":"Question 50","depth":2},{"id":"question-51","title":"Question 51","depth":2},{"id":"question-52","title":"Question 52","depth":2},{"id":"question-53","title":"Question 53","depth":2},{"id":"question-54","title":"Question 54","depth":2},{"id":"question-55","title":"Question 55","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>d557fd13-2a71-44e6-9b9a-4543b858f2b0\u003c/code>\u003c/p>\n\u003ch2 id=\"question-48\">Question 48\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages and collections\nQuestion: If a collection has no generic page assigned, what should happen to its entries on the public website?\nContext:\nRecommendation: Keep the entries available as data, but generate no individual entry pages. Layout assignment then has a clear purpose.\nOptions: Data only; no individual entry pages / Generate a default entry page from its fields / Require a generic page before publishing any collection entries\nSelected: Data only; no individual entry pages\nNotes: yeah make it data only. i could have a collection of links with no generic page, named \"footer links\", and then i use it in the site footer (in the future, out of scope for now).\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-49\">Question 49\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages and collections\nQuestion: Can the same generic page be assigned to more than one collection schema?\nContext:\nRecommendation: Allow reuse across schemas with compatible field names and types, so a shared layout only needs editing once.\nOptions: Allow reuse across compatible schemas / Restrict each generic page to one schema\nSelected: Allow reuse across compatible schemas\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-50\">Question 50\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages and collections\nQuestion: Where should an entry's public URL be defined? For example, a recipe entry at /recipes/apple-pie.\nContext:\nRecommendation: Use the collection's URL prefix plus the entry's slug. The generic page supplies the layout and has no separate public URL.\nOptions: Collection URL prefix + entry slug / A URL pattern configured on the generic page / A complete URL path configured separately on each entry\nSelected: Collection URL prefix + entry slug\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-51\">Question 51\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages and collections\nQuestion: How should collection listing pages, such as an articles index, be created?\nContext:\nRecommendation: Build a static page with a collection-list block, so the listing can be composed with other normal page content.\nOptions: Static pages containing collection-list blocks / Automatically generate a standard listing for each collection / A separate generic-page type for collection listings\nSelected: Something else\nNotes: the index route should 404 if no matching page route is assigned to it. a static page can optionally be assigned to it.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-52\">Question 52\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages and collections\nQuestion: If a generic block binds to a field name that does not exist in an assigned schema, or the value type is incompatible, how should publishing behave?\nContext:\nRecommendation: Allow the incomplete draft, but prevent publishing until the binding is fixed. This catches broken connections before they become public.\nOptions: Allow draft saving; block publishing until fixed / Publish using the block field's fixed value as a fallback / Publish with the affected block field empty\nSelected: Allow draft saving; block publishing until fixed\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-53\">Question 53\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages and collections\nQuestion: If the bound schema field exists and is optional, but an entry leaves it empty, what should the generic block field display?\nContext:\nRecommendation: Use the block field's fixed value when one is set; otherwise leave it empty. This supports a shared fallback without changing entry data.\nOptions: Use the block field's fixed value, otherwise empty / Always leave the bound field empty / Require every bound field to have an entry value before publishing\nSelected: Use the block field's fixed value, otherwise empty\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-54\">Question 54\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages and collections\nQuestion: With entry blocks removed, how should authors write formatted article bodies or recipe instructions inside a schema field?\nContext:\nRecommendation: Add a rich-text field with visual formatting controls, stored as Markdown, reusing the current text editing experience.\nOptions: Rich-text schema field with visual formatting / Markdown schema field edited as source text / Plain multiline text only for now\nSelected: Rich-text schema field with visual formatting\nNotes: also with embedded media such as uploaded images and youtube video embeds.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-55\">Question 55\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages and collections\nQuestion: What content should the live preview show while editing a generic page under Pages?\nContext:\nRecommendation: Let the editor select a collection and entry as preview data. This shows how bindings behave with real content while keeping entry editing in Content.\nOptions: A selectable real collection entry / Sample values entered on the generic page / Placeholders showing the bound field names\nSelected: Placeholders showing the bound field names\nNotes:\n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-generic-pages-round-one"]},{"id":"journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `eb7e62a0-bf4d-4474-a805-bc47c92b41aa`\n\n## Question 20\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How should the editor get permission to upload media to R2?\nContext: The bucket address can come from environment variables. But if a build embeds R2 write credentials in the static site, visitors can extract them despite the login gate. Keeping environment credentials secret requires a separate service to authorize uploads.\nRecommendation: To preserve the entirely static app, let the editor supply bucket-scoped R2 credentials at runtime and retain them for the tab session, like the GitHub token.\nOptions: Supply R2 credentials in the editor; keep the app entirely static / Allow a small authenticated serverless upload helper that keeps R2 credentials in server-side environment variables / Upload media outside the editor and paste its URL; no upload credentials in the app\nSelected: Supply R2 credentials in the editor; keep the app entirely static\nNotes: \n```\n\n## Question 21\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How much should the first collection schema editor support?\nContext: You chose both developer-defined schemas and collections created through the portal. This question sets the portal's initial field-editing scope; entry bodies still use blocks.\nRecommendation: Start with basic fields and safe changes: add fields, edit labels/defaults, and avoid destructive changes to populated fields. This keeps existing content usable without a migration interface.\nOptions: Basic text, number, date, toggle, select, and media fields; safe changes only / Also support nested/repeating fields and links between collections / Also support changing populated field types and migrating existing content\nSelected: Basic text, number, date, toggle, select, and media fields; safe changes only\nNotes: \n```\n\n## Question 22\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How should a collection created in the portal appear on the public site?\nContext: For example, a new Recipes collection needs a listing and individual recipe URLs, unless it is only used as data inside other pages.\nRecommendation: Generate a standard listing and entry page layout for each collection. Entry bodies use the existing block editor; developers can later add custom templates.\nOptions: Generate standard listing and entry pages automatically / Let users design reusable listing and entry templates with blocks in the portal / Create data only; developers or existing page blocks decide where it appears\nSelected: Generate standard listing and entry pages automatically\nNotes: \n```\n\n## Question 23\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: Should the media uploader just store files, or also process them?\nContext: R2 stores files. Image resizing and video transcoding would be additional behavior, with extra processing and failure cases.\nRecommendation: Start with original-file uploads for common images, documents, audio, and video, with configurable size/type limits. Add processing separately when needed.\nOptions: Upload original files only / Also resize and compress images automatically / Also process video/audio for playback\nSelected: Also resize and compress images automatically\nNotes: uploading a large enough image would generate an image set that is optimized for web, light compression would be applied as well. somewhat like how next.js's Image component does optimization. but only do the simplest and leanest way here, don't overengineer, only apply simpler methods.\n```\n\n## Question 24\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: May uploaded media be accessible at its direct URL before Publish?\nContext: In a public R2 asset bucket, someone with an uploaded file's URL can access it even while the page referencing it is still a draft. The draft page itself does not become published.\nRecommendation: Allow public media URLs immediately for a simpler static workflow. Choose private drafts only if unpublished media must be confidential.\nOptions: Yes; media URLs may work immediately, while pages remain drafts / No; media must remain private until the content is published\nSelected: Yes; media URLs may work immediately, while pages remain drafts\nNotes: \n```\n","toc":[{"id":"question-20","title":"Question 20","depth":2},{"id":"question-21","title":"Question 21","depth":2},{"id":"question-22","title":"Question 22","depth":2},{"id":"question-23","title":"Question 23","depth":2},{"id":"question-24","title":"Question 24","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>eb7e62a0-bf4d-4474-a805-bc47c92b41aa\u003c/code>\u003c/p>\n\u003ch2 id=\"question-20\">Question 20\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: How should the editor get permission to upload media to R2?\nContext: The bucket address can come from environment variables. But if a build embeds R2 write credentials in the static site, visitors can extract them despite the login gate. Keeping environment credentials secret requires a separate service to authorize uploads.\nRecommendation: To preserve the entirely static app, let the editor supply bucket-scoped R2 credentials at runtime and retain them for the tab session, like the GitHub token.\nOptions: Supply R2 credentials in the editor; keep the app entirely static / Allow a small authenticated serverless upload helper that keeps R2 credentials in server-side environment variables / Upload media outside the editor and paste its URL; no upload credentials in the app\nSelected: Supply R2 credentials in the editor; keep the app entirely static\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-21\">Question 21\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: How much should the first collection schema editor support?\nContext: You chose both developer-defined schemas and collections created through the portal. This question sets the portal's initial field-editing scope; entry bodies still use blocks.\nRecommendation: Start with basic fields and safe changes: add fields, edit labels/defaults, and avoid destructive changes to populated fields. This keeps existing content usable without a migration interface.\nOptions: Basic text, number, date, toggle, select, and media fields; safe changes only / Also support nested/repeating fields and links between collections / Also support changing populated field types and migrating existing content\nSelected: Basic text, number, date, toggle, select, and media fields; safe changes only\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-22\">Question 22\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: How should a collection created in the portal appear on the public site?\nContext: For example, a new Recipes collection needs a listing and individual recipe URLs, unless it is only used as data inside other pages.\nRecommendation: Generate a standard listing and entry page layout for each collection. Entry bodies use the existing block editor; developers can later add custom templates.\nOptions: Generate standard listing and entry pages automatically / Let users design reusable listing and entry templates with blocks in the portal / Create data only; developers or existing page blocks decide where it appears\nSelected: Generate standard listing and entry pages automatically\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-23\">Question 23\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: Should the media uploader just store files, or also process them?\nContext: R2 stores files. Image resizing and video transcoding would be additional behavior, with extra processing and failure cases.\nRecommendation: Start with original-file uploads for common images, documents, audio, and video, with configurable size/type limits. Add processing separately when needed.\nOptions: Upload original files only / Also resize and compress images automatically / Also process video/audio for playback\nSelected: Also resize and compress images automatically\nNotes: uploading a large enough image would generate an image set that is optimized for web, light compression would be applied as well. somewhat like how next.js's Image component does optimization. but only do the simplest and leanest way here, don't overengineer, only apply simpler methods.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-24\">Question 24\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: May uploaded media be accessible at its direct URL before Publish?\nContext: In a public R2 asset bucket, someone with an uploaded file's URL can access it even while the page referencing it is still a draft. The draft page itself does not become published.\nRecommendation: Allow public media URLs immediately for a simpler static workflow. Choose private drafts only if unpublished media must be confidential.\nOptions: Yes; media URLs may work immediately, while pages remain drafts / No; media must remain private until the content is published\nSelected: Yes; media URLs may work immediately, while pages remain drafts\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-four-decisions"]},{"id":"journal/2026-10-05-implementation","title":"First application implementation","section":"Journal","order":0,"metadata":{"status":"Implemented; live integration verification outstanding"},"metadataHtml":"\u003cspan>Status: Implemented; live integration verification outstanding\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: First application implementation\nupdated: 2026-10-05\nstatus: Implemented; live integration verification outstanding\n---\n# First application implementation\n\nThe user explicitly authorized implementation after the committed product and technical interviews. Work remains in the lean-sitebuilder repository; jstack supplied the feature-map, verify-change, and wiki workflows.\n\nThe application now builds a static public website and `/admin/` portal with Astro 7.3.5, TypeScript 6.0.3, React 19.3, Svelte 5.57.1, Vue 3.5.43, Base UI, Lexical, Octokit, and the AWS S3 client. Exact versions and transitive resolution are pinned in the package/lockfile. TypeScript was aligned with the integrations' supported peer range during setup.\n\nThe first catalog has Hero v1/v2, Text, Media, Tabs, Svelte Counter, Vue Accordion, and a vanilla Quote. The editor covers pages, block ordering and manual versions, collection schemas/entries, navigation/theme, media metadata, and backup/recovery. JSON is the persisted content; Lexical state is not a second content source.\n\nThe Git adapter reads an immutable commit's tree, saves one content commit, uses non-forced branch updates, confirms uncertain save responses, and publishes only a validated saved snapshot. A build-source fingerprint prevents an outdated editor from publishing changed block/application code. Runtime R2 credentials drive direct uploads and browser variants. The portal does not claim hosting completion after a Git update.\n\nBrowser testing exposed an Astro/Vite interaction: CSS extracted for SSR was removed from the client output while lazy preview imports retained its URL. The build integration now retains the referenced assets; admin bootstraps a regular React root, and public routes are generated with only their used block imports. Subsequent intermediate-browser checks showed all four rendering styles working. Artifact checks confirm one copy of each framework runtime and no editor/provider modules in public route graphs.\n\nThe [verification run](../verification/runs/2026-10-05T0819Z-implementation.md) contains the final source fingerprint, automated results, actual browser observations, and limits. Live GitHub writes, R2 CORS/uploads, and Netlify deployment were not exercised. The native browser tool later returned `cgWindowNotFound`, leaving final browser follow-up and test-tab cleanup unverified. No deployment, push, or implementation commit was performed.\n\nUse the [feature map](../features/index.md), [setup](../verification/setup.md), and root README for the next work. The original interview records remain authoritative for product choices.\n\nFollow-up: the user reported a blank admin page. The manual React bootstrap omitted Astro's development Fast Refresh preamble. The [startup repair](../verification/runs/2026-10-05T0910Z-admin-startup.md) replaces it with a client-only React island; development editing and production startup/interactions now pass real-browser checks. The CSS retention integration remains in place and asset checks pass.\n\nFollow-up: the user replaced the original Base UI choice with Cloudflare Kumo for admin UI (DEC-048). Controls, dialogs, selects, custom field controls, and notifications now use Kumo. The live preview stays interactive; block rows use pointer sorting with keyboard access. Recovery is silent, status banners are removed, and submission validation uses toasts. Scoped Kumo styles preserve the public/block designs. See the [refinement run](../verification/runs/2026-10-05T1005Z-kumo-admin.md).\n\nFollow-up: block details now replace the parent sidebar navigation (DEC-051). All blocks restores the selected document controls. The [bounded hierarchy check](../verification/runs/2026-10-05T1014Z-block-sidebar.md) records browser and automated results.\n","toc":[],"titleAnchor":"first-application-implementation","links":["verification/runs/2026-10-05T0819Z-implementation","features/index","verification/setup","verification/runs/2026-10-05T0910Z-admin-startup","verification/runs/2026-10-05T1005Z-kumo-admin","verification/runs/2026-10-05T1014Z-block-sidebar"],"attachments":[],"html":"\u003cp>The user explicitly authorized implementation after the committed product and technical interviews. Work remains in the lean-sitebuilder repository; jstack supplied the feature-map, verify-change, and wiki workflows.\u003c/p>\n\u003cp>The application now builds a static public website and \u003ccode>/admin/\u003c/co browser follow-up and test-tab cleanup unverified. No deployment, push, or implementation commit was performed.\u003c/p>\n\u003cp>Use the \u003ca href=\"#/features/index\">feature map\u003c/a>, \u003ca href=\"#/verification/setup\">setup\u003c/a>, and root README for the next work. The original interview records remain authoritative for product choices.\u003c/p>\n\u003cp>Follow-up: the user reported a blank admin page. The manual React bootstrap omitted Astro's development Fast Refresh preamble. The \u003ca href=\"#/verification/runs/2026-10-05T0910Z-admin-startup\">startup repair\u003c/a> replaces it with a client-only React island; development editing and production startup/interactions now pass real-browser checks. The CSS retention integration remains in place and asset checks pass.\u003c/p>\n\u003cp>Follow-up: the user replaced the original Base UI choice with Cloudflare Kumo for admin UI (DEC-048). Controls, dialogs, selects, custom field controls, and notifications now use Kumo. The live preview stays interactive; block rows use pointer sorting with keyboard access. Recovery is silent, status banners are removed, and submission validation uses toasts. Scoped Kumo styles preserve the public/block designs. See the \u003ca href=\"#/verification/runs/2026-10-05T1005Z-kumo-admin\">refinement run\u003c/a>.\u003c/p>\n\u003cp>Follow-up: block details now replace the parent sidebar navigation (DEC-051). All blocks restores the selected document controls. The \u003ca href=\"#/verification/runs/2026-10-05T1014Z-block-sidebar\">bounded hierarchy check\u003c/a> records browser and automated results.\u003c/p>\n","backlinks":["index"]},{"id":"journal/2026-10-05-round-four-decisions","title":"Round four decisions","section":"Journal","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Round four decisions\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Round four decisions\n\nThe [submitted answers](2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa.md) settle Q20–Q24 as DEC-021 through DEC-025 in the [decision register](../decisions/index.md).\n\nR2 credentials are entered at runtime, resolving the conflict between secret build environment values and browser-only upload authorization. A serverless helper is not required. Uploaded media may be public immediately while pages remain drafts.\n\nThe collection editor supports basic fields and safe changes; standard listing and entry pages are generated automatically. The user selected automatic image resizing/compression and clarified that sufficiently large images should yield a small, optimized image set using simple methods. This is a functional comparison to Next.js Image, not a request for its server architecture.\n\nThe product interview has sufficient clarity to conclude. The [agreed design](../discussions/agreed-design.md) consolidates the requirements. Implementation mechanics remain to be designed and tested, rather than becoming another round of speculative preference questions. Application implementation and deployment have not started.\n","toc":[],"titleAnchor":"round-four-decisions","links":["journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","decisions/index","discussions/agreed-design"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa\">submitted answers\u003c/a> settle Q20–Q24 as DEC-021 through DEC-025 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003cp>R2 credentials are entered at runtime, resolving the conflict between secret build environment values and browser-only upload authorization. A serverless helper is not required. Uploaded media may be public immediately while pages remain drafts.\u003c/p>\n\u003cp>The collection editor supports basic fields and safe changes; standard listing and entry pages are generated automatically. The user selected automatic image resizing/compression and clarified that sufficiently large images should yield a small, optimized image set using simple methods. This is a functional comparison to Next.js Image, not a request for its server architecture.\u003c/p>\n\u003cp>The product interview has sufficient clarity to conclude. The \u003ca href=\"#/discussions/agreed-design\">agreed design\u003c/a> consolidates the requirements. Implementation mechanics remain to be designed and tested, rather than becoming another round of speculative preference questions. Application implementation and deployment have not started.\u003c/p>\n","backlinks":["index","decisions/index"]},{"id":"journal/2026-10-05-round-one-decisions","title":"Round one decisions","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Round one decisions\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Round one decisions\n\nThe [submitted answers](2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02.md) establish the initial [decision register](../decisions/index.md). The raw transcript's date follows the form session's UTC creation timestamp; this interpretation uses the user's local date.\n\nThe user's custom publishing answer supersedes the assistant's proposed Save-and-deploy behavior: Save writes an unpublished branch; Publish merges that branch into main and deploys. The user's custom authentication answer requests a configured editor credential and a separately supplied GitHub token, rather than accepting the proposed serverless helper. The security meaning of that editor credential still needs clarification.\n\nThe remaining choices accept nontechnical editors, collections alongside pages, a shared dependency contract, section-level layouts, and a completely fresh implementation. No existing blocks or sites must be migrated.\n\nNext, clarify access/privacy, token ownership, deployment, collection authoring, and the block installation/preview contract through [round-two questions](../discussions/open-questions.md). Application implementation has not started.\n","toc":[],"titleAnchor":"round-one-decisions","links":["journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","decisions/index","discussions/open-questions"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02\">submitted answers\u003c/a> establish the initial \u003ca href=\"#/decisions/index\">decision register\u003c/a>. The raw transcript's date follows the form session's UTC creation timestamp; this interpretation uses the user's local date.\u003c/p>\n\u003cp>The user's custom publishing answer supersedes the assistant's proposed Save-and-deploy behavior: Save writes an unpublished branch; Publish merges that branch into main and deploys. The user's custom authentication answer requests a configured editor credential and a separately supplied GitHub token, rather than accepting the proposed serverless helper. The security meaning of that editor credential still needs clarification.\u003c/p>\n\u003cp>The remaining choices accept nontechnical editors, collections alongside pages, a shared dependency contract, section-level layouts, and a completely fresh implementation. No existing blocks or sites must be migrated.\u003c/p>\n\u003cp>Next, clarify access/privacy, token ownership, deployment, collection authoring, and the block installation/preview contract through \u003ca href=\"#/discussions/open-questions\">round-two questions\u003c/a>. Application implementation has not started.\u003c/p>\n","backlinks":["index","decisions/index"]},{"id":"journal/2026-10-05-round-three-decisions","title":"Round three decisions","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Round three decisions\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Round three decisions\n\nThe [submitted answers](2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59.md) establish DEC-016 through DEC-020 in the [decision register](../decisions/index.md).\n\nGitHub tokens persist for the tab session, including reloads. Collection schemas can originate in developer code/configuration or be created and edited through the portal; block code and its registration still belong to developers. Shared drafts and stale-save protection are accepted, with a strong preference for understandable recovery that avoids exposing Git concepts to editors.\n\nMedia moves to R2, with references in Git. This explicitly changes the earlier proposed in-repository media storage. The requested environment credentials create an unresolved architectural issue: a build-only secret cannot authorize later arbitrary browser uploads unless authorization reaches the browser or a service acts on its behalf. Embedding a secret in publicly delivered JavaScript would expose it; the convenience login does not prevent this.\n\nCloudflare documents bucket-scoped S3 access credentials, temporary signed upload URLs, and browser CORS configuration. These support two candidate approaches: editors supply credentials at runtime, or an authenticated on-demand helper keeps credentials server-side and grants uploads. Neither alternative has been accepted. Sources: [R2 authentication](https://developers.cloudflare.com/r2/api/tokens/), [presigned URLs](https://developers.cloudflare.com/r2/api/s3/presigned-urls/), [CORS](https://developers.cloudflare.com/r2/buckets/cors/).\n\nGlobal settings such as light/dark mode are optional signals that blocks may follow; independent styling remains primary. The [remaining questions](../discussions/open-questions.md) concern R2 authorization and the initial collection/schema behavior. No implementation has started.\n","toc":[],"titleAnchor":"round-three-decisions","links":["journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","decisions/index","discussions/open-questions"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59\">submitted answers\u003c/a> establish DEC-016 through DEC-020 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003cp>GitHub tokens persist for the tab session, including reloads. Collection schemas can originate in developer code/configuration or be created and edited through the portal; block code and its registration still belong to developers. Shared drafts and stale-save protection are accepted, with a strong preference for understandable recovery that avoids exposing Git concepts to editors.\u003c/p>\n\u003cp>Media moves to R2, with references in Git. This explicitly changes the earlier proposed in-repository media storage. The requested environment credentials create an unresolved architectural issue: a build-only secret cannot authorize later arbitrary browser uploads unless authorization reaches the browser or a service acts on its behalf. Embedding a secret in publicly delivered JavaScript would expose it; the convenience login does not prevent this.\u003c/p>\n\u003cp>Cloudflare documents bucket-scoped S3 access credentials, temporary signed upload URLs, and browser CORS configuration. These support two candidate approaches: editors supply credentials at runtime, or an authenticated on-demand helper keeps credentials server-side and grants uploads. Neither alternative has been accepted. Sources: \u003ca href=\"https://developers.cloudflare.com/r2/api/tokens/\" rel=\"noreferrer\">R2 authentication\u003c/a>, \u003ca href=\"https://developers.cloudflare.com/r2/api/s3/presigned-urls/\" rel=\"noreferrer\">presigned URLs\u003c/a>, \u003ca href=\"https://developers.cloudflare.com/r2/buckets/cors/\" rel=\"noreferrer\">CORS\u003c/a>.\u003c/p>\n\u003cp>Global settings such as light/dark mode are optional signals that blocks may follow; independent styling remains primary. The \u003ca href=\"#/discussions/open-questions\">remaining questions\u003c/a> concern R2 authorization and the initial collection/schema behavior. No implementation has started.\u003c/p>\n","backlinks":["index","decisions/index"]},{"id":"journal/2026-10-05-round-two-decisions","title":"Round two decisions","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Round two decisions\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Round two decisions\n\nThe [submitted answers](2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2.md) settle Q8–Q14 as DEC-009 through DEC-015 in the [decision register](../decisions/index.md).\n\nThe editor login is explicitly a convenience gate. Editors each provide their own GitHub token, and both public and private repositories are supported. Repository authorization remains distinct from hosting: private draft reads require authorization; public repository branches remain publicly readable.\n\nThe user's Netlify integration already owns deployment after main changes. The builder only needs its GitHub SDK save/merge workflow and portable static output. This replaces the unaccepted GitHub Actions/Pages recommendation. Netlify documents automatic deployment from connected Git updates in its [deployment guide](https://docs.netlify.com/deploy/create-deploys/); no hosting configuration was inspected or changed here.\n\nPages and collection entries share block authoring. Every block supplies immediate browser preview, and new block types are developer-installed with a rebuild. These decisions remove the build-only preview and portal installer branches.\n\nThe user's phrase “content and schema changes” needs clarification: changing collection definitions visually is a larger scope than editing values using developer-defined schemas. The next round also covers token retention, simultaneous editing, media scope, and how global styling interacts with independent blocks. These are [open questions](../discussions/open-questions.md), not inferred defaults. Application implementation has not started.\n","toc":[],"titleAnchor":"round-two-decisions","links":["journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","decisions/index","discussions/open-questions"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2\">submitted answers\u003c/a> settle Q8–Q14 as DEC-009 through DEC-015 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003cp>The editor login is explicitly a convenience gate. Editors each provide their own GitHub token, and both public and private repositories are supported. Repository authorization remains distinct from hosting: private draft reads require authorization; public repository branches remain publicly readable.\u003c/p>\n\u003cp>The user's Netlify integration already owns deployment after main changes. The builder only needs its GitHub SDK save/merge workflow and portable static output. This replaces the unaccepted GitHub Actions/Pages recommendation. Netlify documents automatic deployment from connected Git updates in its \u003ca href=\"https://docs.netlify.com/deploy/create-deploys/\" rel=\"noreferrer\">deployment guide\u003c/a>; no hosting configuration was inspected or changed here.\u003c/p>\n\u003cp>Pages and collection entries share block authoring. Every block supplies immediate browser preview, and new block types are developer-installed with a rebuild. These decisions remove the build-only preview and portal installer branches.\u003c/p>\n\u003cp>The user's phrase “content and schema changes” needs clarification: changing collection definitions visually is a larger scope than editing values using developer-defined schemas. The next round also covers token retention, simultaneous editing, media scope, and how global styling interacts with independent blocks. These are \u003ca href=\"#/discussions/open-questions\">open questions\u003c/a>, not inferred defaults. Application implementation has not started.\u003c/p>\n","backlinks":["index","decisions/index"]},{"id":"journal/2026-10-05-technical-foundations","title":"Technical foundations","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Technical foundations\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Technical foundations\n\nThe [submitted answers](2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275.md) accept Astro/TypeScript, React/TypeScript for the editor, separate JSON content files, and a small field-schema vocabulary. Rendering source is shared by default, with explicit parity checks for separate renderers. Editor and preview share one document, and custom field widgets are supported. These are DEC-026 through DEC-033 in the [decision register](../decisions/index.md).\n\nThe user additionally proposes statically hosted, preferably minified registered vendor assets for libraries shared by blocks. DEC-034 captures this direction; the named library versions are examples rather than dependency pins. Build-managed, self-hosted shared chunks appear compatible with that goal, but the user has not yet chosen that mechanism over manually maintained vendor modules/import maps.\n\nThe next [contract proposals](../discussions/technical-contracts.md) cover vendor ownership, stable identities, formatted-text storage, block data evolution, preview adapter lifecycle, public activation policy, and content references. They are not accepted definitions yet. No application code has been created.\n","toc":[],"titleAnchor":"technical-foundations","links":["journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275","decisions/index","discussions/technical-contracts"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275\">submitted answers\u003c/a> accept Astro/TypeScript, React/TypeScript for the editor, separate JSON content files, and a small field-schema vocabulary. Rendering source is shared by default, with explicit parity checks for separate renderers. Editor and preview share one document, and custom field widgets are supported. These are DEC-026 through DEC-033 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003cp>The user additionally proposes statically hosted, preferably minified registered vendor assets for libraries shared by blocks. DEC-034 captures this direction; the named library versions are examples rather than dependency pins. Build-managed, self-hosted shared chunks appear compatible with that goal, but the user has not yet chosen that mechanism over manually maintained vendor modules/import maps.\u003c/p>\n\u003cp>The next \u003ca href=\"#/discussions/technical-contracts\">contract proposals\u003c/a> cover vendor ownership, stable identities, formatted-text storage, block data evolution, preview adapter lifecycle, public activation policy, and content references. They are not accepted definitions yet. No application code has been created.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions"]},{"id":"journal/2026-10-06-admin-navigation","title":"Persistent admin navigation","section":"Journal","order":0,"metadata":{"status":"Implemented locally"},"metadataHtml":"\u003cspan>Status: Implemented locally\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Persistent admin navigation\nupdated: 2026-10-06\nstatus: Implemented locally\n---\n# Persistent admin navigation\n\nThe user requested moving the five Home destinations into a sidebar. DEC-074 supersedes the Home menu: Pages, Content, Collection schemas, Media and Site now live in a persistent left navigation column with an active-area highlight.\n\nPages opens to its existing table. Individual page/block editing adds its own drawer beside the main navigation; the preview occupies the remaining width. Parent back buttons stay within each area. Content, schemas, Media and Site retain their standard admin workspace. Switching areas preserves shared edits.\n\nThe same Kumo navigation component appears in a Menu dialog below 800px. Selecting an area closes the dialog. These responsive and initial-view details are engineering choices supporting the requested sidebar.\n\nThe [verification run](../verification/runs/2026-10-05T1725Z-admin-navigation.md) records passing automated checks and desktop/narrow browser navigation. No commit or deployment was performed.\n","toc":[],"titleAnchor":"persistent-admin-navigation","links":["verification/runs/2026-10-05T1725Z-admin-navigation"],"attachments":[],"html":"\u003cp>The user requested moving the five Home destinations into a sidebar. DEC-074 supersedes the Home menu: Pages, Content, Collection schemas, Media and Site now live in a persistent left navigation column with an active-area highlight.\u003c/p>\n\u003cp>Pages opens to its existing table. Individual page/block editing adds its own drawer beside the main navigation; the preview occupies the remaining width. Parent back buttons stay within each area. Content, schemas, Media and Site retain their standard admin workspace. Switching areas preserves shared edits.\u003c/p>\n\u003cp>The same Kumo navigation component appears in a Menu dialog below 800px. Selecting an area closes the dialog. These responsive and initial-view details are engineering choices supporting the requested sidebar.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-05T1725Z-admin-navigation\">verification run\u003c/a> records passing automated checks and desktop/narrow browser navigation. No commit or deployment was performed.\u003c/p>\n","backlinks":["decisions/index"]},{"id":"journal/2026-10-06-admin-width","title":"Standard admin content width","section":"Journal","order":0,"metadata":{"status":"Implemented locally"},"metadataHtml":"\u003cspan>Status: Implemented locally\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Standard admin content width\nupdated: 2026-10-06\nstatus: Implemented locally\n---\n# Standard admin content width\n\nThe user requested one 867px width across admin screens. DEC-076 replaces the Pages overview's 960px limit and standard forms' 760px limit with one shared `--admin-content-max-width` token and layout rule. This covers all standard admin areas and their nested forms. Content stays centered and fits narrower viewports. The page-building drawer and public-site content width remain separate concerns.\n\nSee the [verification run](../verification/runs/2026-10-05T1750Z-admin-width.md). No content or provider changes are involved.\n","toc":[],"titleAnchor":"standard-admin-content-width","links":["verification/runs/2026-10-05T1750Z-admin-width"],"attachments":[],"html":"\u003cp>The user requested one 867px width across admin screens. DEC-076 replaces the Pages overview's 960px limit and standard forms' 760px limit with one shared \u003ccode>--admin-content-max-width\u003c/code> token and layout rule. This covers all standard admin areas and their nested forms. Content stays centered and fits narrower viewports. The page-building drawer and public-site content width remain separate concerns.\u003c/p>\n\u003cp>See the \u003ca href=\"#/verification/runs/2026-10-05T1750Z-admin-width\">verification run\u003c/a>. No content or provider changes are involved.\u003c/p>\n","backlinks":[]},{"id":"journal/2026-10-06-block-library-implementation","title":"Block library implementation","section":"Journal","order":0,"metadata":{"status":"Implemented; local verification recorded"},"metadataHtml":"\u003cspan>Status: Implemented; local verification recorded\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Block library implementation\nupdated: 2026-10-06\nstatus: Implemented; local verification recorded\n---\n# Block library implementation\n\nThe user authorized the [accepted scope](../discussions/block-library.md). The [feature record](../features/block-library.md) now describes the implemented behavior. No existing content fixtures, retained block versions, provider credentials or deployments were changed.\n\n## Changes\n\n- Added a searchable visual Kumo catalog with combined theme/tag filters, direct insertion and separate responsive previews. Visible-card observation bounds rendering work.\n- Added repeatable block fields, one-level schema lists, compatible generic bindings, stable row identities and typed publication checks. Existing drag/keyboard ordering is reused.\n- Added 45 base and 27 generic Tailwind UI variants. Definitions remain explicit versioned JSON and thin renderer entry points; category renderers share scoped theme helpers/styles. This replaces the legacy Payload schemas and Tailwind utility markup with the current fields/context/renderer contract.\n- Added collection-backed blog mappings, native endpoint forms, shared grouped header and site footer settings. Public output remains static for these layouts, including disclosures and forms.\n- Made generated output idempotent: unchanged files stay in place and obsolete generated files are pruned afterwards. A dev server no longer sees the whole registry deleted during regeneration.\n\n## Reference mapping\n\nEach category has current IDs `tw-\u003ccategory>-1`, `-2`, `-3` in the order below. Generic equivalents add `-generic`. These are design references; implementation and defaults were rewritten.\n\n| Category ID | Legacy layout references |\n| --- | --- |\n| hero | HeroSimpleCentered; HeroSplitImg; HeroImgTiles |\n| header | HeaderCentered; HeaderCtrBgImg; HeaderWithStats |\n| content | ContentCentered; ContentSplitImg; ContentStickyScreenshot |\n| cta | CtaSimpleCentered; CtaSplitWithImage; CtaDarkPanelWithAppScreenshot |\n| bento | BentoThreeColGrid; BentoTwoRowGrid; BentoTwoRowThreeColGrid |\n| features | FeatSimple3x2Grid; FeatWithProductScreenshot; FeatWithTestimonial |\n| faq | FaqCenteredAccordion; FaqSideBySide; FaqThreeColumns |\n| stats | StatsSimpleGrid; StatsSplitWithImage; StatsTimeline |\n| team | TeamGridRoundImgs; TeamLargeImgs; TeamFullWidthVertImgs |\n| testimonials | TestimonialsSimpleCentered; TestimonialsSideBySide; TestimonialsGrid |\n| logos | LogocloudSimple; LogocloudGrid; LogocloudSplitLogosRight |\n| blog | BlogFeaturedPost; BlogThreeColImgs; BlogSingleColImgs |\n| contact | ContactCentered; ContactSplitImg; ContactSmFourCol |\n| newsletter | NewsletterCenteredCard; NewsletterSmSbs; NewsletterSmStacked |\n| footer | Footer4ColSimple; FooterSmCentered; Footer4ColMission |\n\nGeneric counterparts cover hero, header, content, bento, features, faq, stats, team and testimonials. The contact department layout includes a working form as well as its repeated contact details. Media uses uploaded assets or local CSS artwork, rather than legacy remote stock placeholders. Forms use native navigation to the endpoint response, avoiding a false success state or a new server/CORS dependency.\n\n## Verification\n\nSee the [run report](../verification/runs/2026-10-06T1320Z-block-library.md). Browser inspection found and fixed catalog flex/grid collapse, preview stacking above a dialog and a toolbar selector affecting Kumo button content. Automated checks also caught missing schema input labels and a preview-navigation regression; both were repaired. All 89 tests, type checks, static build and artifact checks pass. The final production-browser smoke check was blocked when the native UI tool lost window access; the preceding development browser checks and production artifact checks are recorded separately.\n","toc":[{"id":"changes","title":"Changes","depth":2},{"id":"reference-mapping","title":"Reference mapping","depth":2},{"id":"verification","title":"Verification","depth":2}],"titleAnchor":"block-library-implementation","links":["discussions/block-library","features/block-library","verification/runs/2026-10-06T1320Z-block-library"],"attachments":[],"html":"\u003cp>The user authorized the \u003ca href=\"#/discussions/block-library\">accepted scope\u003c/a>. The \u003ca href=\"#/features/block-library\">feature record\u003c/a> now describes the implemented behavior. No existing content fixtures, retained block versions, provider credentials or deployments were changed.\u003c/p>\n\u003ch2 id=\"changes\">Changes\u003c/h2>\n\u003cul>\n\u003cli>Added a searchable visual Kumo catalog with combined theme/tag filters, direct insertion and separate responsive previews. Visible-card observation bounds rendering work.\u003c/li>\n\u003cli>Added repeatable block fields, one-level schema lists, compatible generic bindings, stable row identities and typed publication checks. Existing drag/keyboard ordering is reused.\u003c/li>\n\u003cli>Added 45 base and 27 generic Tailwind UI variants. Definitions remain explicit versioned JSON and thin renderer entry points; category renderers share scoped theme helpers/styles. This replaces the legacy Payload schemas and Tailwind utility markup with the current fields/context/renderer contract.\u003c/li>\n\u003cli>Added collection-backed blog mappings, native endpoint forms, shared grouped header and site footer settings. Public output remains static for these layouts, including disclosures and forms.\u003c/li>\n\u003cli>Made generated output idempotent: unchanged files stay in place and obsolete generated files are pruned afterwards. A dev server no longer sees the whole registry deleted during regeneration.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"reference-mapping\">Reference mapping\u003c/h2>\n\u003cp>Each category has current IDs \u003ccode>tw-&lt;category&gt;-1\u003c/code>, \u003ccode>-2\u003c/code>, \u003ccode>-3\u003c/code> in the order below. Generic equivalents add \u003ccode>-generic\u003c/code>. These are design references; implementation and defaults were rewritten.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Category ID\u003c/th>\n\u003cth>Legacy layout references\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>hero\u003c/td>\n\u003ctd>HeroSimpleCentered; HeroSplitImg; HeroImgTiles\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>header\u003c/td>\n\u003ctd>HeaderCentered; HeaderCtrBgImg; HeaderWithStats\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>content\u003c/td>\n\u003ctd>ContentCentered; ContentSplitImg; ContentStickyScreenshot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>cta\u003c/td>\n\u003ctd>CtaSimpleCentered; CtaSplitWithImage; CtaDarkPanelWithAppScreenshot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>bento\u003c/td>\n\u003ctd>BentoThreeColGrid; BentoTwoRowGrid; BentoTwoRowThreeColGrid\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>features\u003c/td>\n\u003ctd>FeatSimple3x2Grid; FeatWithProductScreenshot; FeatWithTestimonial\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>faq\u003c/td>\n\u003ctd>FaqCenteredAccordion; FaqSideBySide; FaqThreeColumns\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stats\u003c/td>\n\u003ctd>StatsSimpleGrid; StatsSplitWithImage; StatsTimeline\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>team\u003c/td>\n\u003ctd>TeamGridRoundImgs; TeamLargeImgs; TeamFullWidthVertImgs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>testimonials\u003c/td>\n\u003ctd>TestimonialsSimpleCentered; TestimonialsSideBySide; TestimonialsGrid\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>logos\u003c/td>\n\u003ctd>LogocloudSimple; LogocloudGrid; LogocloudSplitLogosRight\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>blog\u003c/td>\n\u003ctd>BlogFeaturedPost; BlogThreeColImgs; BlogSingleColImgs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>contact\u003c/td>\n\u003ctd>ContactCentered; ContactSplitImg; ContactSmFourCol\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>newsletter\u003c/td>\n\u003ctd>NewsletterCenteredCard; NewsletterSmSbs; NewsletterSmStacked\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>footer\u003c/td>\n\u003ctd>Footer4ColSimple; FooterSmCentered; Footer4ColMission\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Generic counterparts cover hero, header, content, bento, features, faq, stats, team and testimonials. The contact department layout includes a working form as well as its repeated contact details. Media uses uploaded assets or local CSS artwork, rather than legacy remote stock placeholders. Forms use native navigation to the endpoint response, avoiding a false success state or a new server/CORS dependency.\u003c/p>\n\u003ch2 id=\"verification\">Verification\u003c/h2>\n\u003cp>See the \u003ca href=\"#/verification/runs/2026-10-06T1320Z-block-library\">run report\u003c/a>. Browser inspection found and fixed catalog flex/grid collapse, preview stacking above a dialog and a toolbar selector affecting Kumo button content. Automated checks also caught missing schema input labels and a preview-navigation regression; both were repaired. All 89 tests, type checks, static build and artifact checks pass. The final production-browser smoke check was blocked when the native UI tool lost window access; the preceding development browser checks and production artifact checks are recorded separately.\u003c/p>\n","backlinks":["index","discussions/block-library"]},{"id":"journal/2026-10-06-block-library-plan","title":"Block library and Tailwind-inspired catalog","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"-
