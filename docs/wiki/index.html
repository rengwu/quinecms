ion-2026-10-06\">Main navigation — 2026-10-06\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-074\u003c/td>\n\u003ctd>Move Pages, Content, Collection schemas, Media and Site into a persistent main sidebar.\u003c/td>\n\u003ctd>Direct screenshot feedback replaces the Home destination menu from DEC-054. The page/block drawer remains a separate nested editor; preview scope from DEC-057 is unchanged. Defaulting to Pages, active-area highlighting and a narrow-screen Menu dialog are implementation choices. See the \u003ca href=\"#/journal/2026-10-06-admin-navigation\">implementation journal\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"shared-content-width-2026-10-06\">Shared content width — 2026-10-06\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-075\u003c/td>\n\u003ctd>Content max-width is a site-wide variable that blocks are advised to follow.\u003c/td>\n\u003ctd>Direct user instruction. Block styling remains independent; there is no forced wrapper. The 1200px default, pixel input and \u003ccode>--site-content-max-width\u003c/code> naming are implementation choices. See \u003ca href=\"#/features/static-blocks\">static blocks\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"admin-content-width-2026-10-06\">Admin content width — 2026-10-06\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-076\u003c/td>\n\u003ctd>Standardize admin main content at 867px across screens.\u003c/td>\n\u003ctd>Direct user instruction. Pages, Content, Collection schemas, Media and Site, including nested standard admin editors, share one centered maximum width and shrink on narrow viewports. See \u003ca href=\"#/features/editor\">visual editing\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"admin-action-consistency-2026-10-06\">Admin action consistency — 2026-10-06\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-077\u003c/td>\n\u003ctd>Use ← Back for every parent-navigation button and the blue primary variant for every Add action.\u003c/td>\n\u003ctd>Direct screenshot feedback. This supersedes the borderless Add block styling from DEC-052 while retaining its header placement. \u003ca href=\"#/journal/2026-10-06-table-and-back\">Implementation\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"site-typography-and-gutter-2026-10-06\">Site typography and gutter — 2026-10-06\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-078\u003c/td>\n\u003ctd>Add site-wide body font, heading font, body font size, body line height and page gutter settings.\u003c/td>\n\u003ctd>Direct user selection from the proposed globals. These supplement content max-width and apply to public rendering/live preview; block adoption remains advised. Section spacing, text width, palette and radius were not selected. \u003ca href=\"#/journal/2026-10-06-site-design\">Implementation\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"block-library-2026-10-06\">Block library — 2026-10-06\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-079\u003c/td>\n\u003ctd>Each block belongs to one theme and has multiple tags.\u003c/td>\n\u003ctd>Direct user request, with Tailwind UI / hero / header examples. Theme denotes the block library/design family; detailed metadata mechanics remain implementation work.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-080\u003c/td>\n\u003ctd>Enlarge and redesign Add a block for searching and filtering by theme, tags and block name, with controls above a block grid.\u003c/td>\n\u003ctd>Direct screenshot feedback anticipates a large catalog. Card preview/selection behavior remains open.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-081\u003c/td>\n\u003ctd>Adapt approximately 3–5 distinct blocks per category from the legacy TailwindBlocks library to the current system.\u003c/td>\n\u003ctd>User requests refitting/reimplementation and working behavior, not verbatim copying. Inventory contains 15 categories and 123 variants. \u003ca href=\"#/journal/2026-10-06-block-library-plan\">Planning record\u003c/a>; behavioral scope remains under discussion.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"block-library-round-one-2026-10-06\">Block library — round one, 2026-10-06\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-821c1394-1fd0-47f5-a950-f71d9c006099\">Q60–Q65\u003c/a>; \u003ca href=\"#/journal/2026-10-06-block-library-round-one\">interpretation and references\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-082\u003c/td>\n\u003ctd>The block card's primary action adds immediately; Preview is a separate action.\u003c/td>\n\u003ctd>Q60 rejects preview-before-add as the default click behavior.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-083\u003c/td>\n\u003ctd>Include useful generic counterparts with the static block import now.\u003c/td>\n\u003ctd>Q61; retain the distinction between fixed page content and schema-bound generic layouts.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-084\u003c/td>\n\u003ctd>Repeated block content supports adding, removing and reordering items.\u003c/td>\n\u003ctd>Q62 selects editable lists over fixed item slots. Whether collection schemas also gain list fields remains Q67.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-085\u003c/td>\n\u003ctd>Blog blocks populate cards from collection entries using field mappings.\u003c/td>\n\u003ctd>Q63 selects collection data rather than duplicate manually authored article cards.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-086\u003c/td>\n\u003ctd>Contact and newsletter forms submit to an editor-configured external endpoint.\u003c/td>\n\u003ctd>Q64; an actual destination is required for publication, with delivery handled outside the static builder.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-087\u003c/td>\n\u003ctd>Footer layouts are configured once as a shared site-wide footer.\u003c/td>\n\u003ctd>Q65 rejects ordinary per-page footers. Shared header/navigation remains Q66.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-088\u003c/td>\n\u003ctd>Use TDCX, Accenture, ASML, Couchbase, Convex and Source Network as capability/design benchmarks.\u003c/td>\n\u003ctd>Direct user clarification of the desired range of sites. This does not independently select exact reproduction, every animation, or new backend integrations.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"block-library-round-two-2026-10-06\">Block library — round two, 2026-10-06\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-06-grill-d9dd6be8-d154-41d3-a042-1d645992c592\">Q66–Q68\u003c/a>; see the \u003ca href=\"#/journal/2026-10-06-block-library-round-two\">round-two interpretation\u003c/a> and \u003ca href=\"#/discussions/block-library\">consolidated scope\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-089\u003c/td>\n\u003ctd>Add a shared configurable header with grouped navigation in this pass.\u003c/td>\n\u003ctd>Q66 selects shared header/navigation now, alongside the shared footer from DEC-087.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-090\u003c/td>\n\u003ctd>Add structured list fields to collection schemas and compatible list bindings in generic blocks.\u003c/td>\n\u003ctd>Q67 extends the earlier scalar/rich-text field contract. Initial rows use existing field types; unrestricted recursive nesting is outside this selected increment.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-091\u003c/td>\n\u003ctd>Block authoring edits content only; appearance comes from the block theme and site settings.\u003c/td>\n\u003ctd>Q68 rejects the proposed per-block Design controls. New theme blocks should not expose arbitrary color, spacing, alignment or CSS override panels. Shared site typography/width/gutter remain available.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n","backlinks":["index","discussions/agreed-design","discussions/open-questions","discussions/technical-contracts","features/block-library","features/generic-pages","journal/2026-10-05-content-block-contracts","journal/2026-10-05-round-four-decisions","journal/2026-10-05-round-one-decisions","journal/2026-10-05-round-three-decisions","journal/2026-10-05-round-two-decisions","journal/2026-10-05-technical-foundations"]},{"id":"discussions/admin-hierarchy-proposal","title":"Admin actions and collection hierarchy","section":"Discussions","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Admin actions and collection hierarchy\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Admin actions and collection hierarchy\n\nThe user requested research and alternatives after identifying an ambiguous Add block button and a Collections view that mixes schema design with content authoring. [Q46–Q47](../journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4.md) subsequently selected the header action and navigation alternative B, recorded as DEC-052–DEC-053. The user authorized implementation and then requested a separate Home menu (DEC-054). The implementation and verification limits are recorded in the [run](../verification/runs/2026-10-05T1054Z-admin-hierarchy.md). The existing Kumo choice, static architecture, safe schema changes, shared draft save, and dedicated block details remain accepted constraints.\n\n## Observed problems\n\nThe Add block button stretches to the same width as block rows and shares their rounded outline, left-aligned label and spacing. It reads as another block. Changing label alignment alone would leave this grouping problem.\n\nCollections currently opens configuration immediately: name, path, field definitions, entry-title field and deletion. Add entry sits among those schema controls. Existing entries are reached through the live collection preview or the mixed page/entry selector; adding or opening an entry switches to the Pages tab. There is no dedicated administrative entry list. This blends collection configuration, content creation and public preview navigation.\n\n## Research\n\n| Source | Observed guidance or behavior | Implication for this project |\n| --- | --- | --- |\n| [Carbon buttons](https://www.carbondesignsystem.com/building-blocks/core/components/button/guidelines) | Alignment depends on the containing component and action hierarchy; low-emphasis controls suit supporting actions. | There is no universal instruction to center every button. Choose placement and emphasis before adjusting its label. |\n| [NN/g similarity](https://www.nngroup.com/articles/gestalt-similarity/) and [proximity](https://www.nngroup.com/articles/gestalt-proximity/) | Similar appearance and nearby placement communicate grouping. | Put the list action in its header; reserve repeated row styling for actual blocks. |\n| [Sanity Structure](https://www.sanity.io/docs/studio/structure-introduction) and [schema definition](https://www.sanity.io/docs/sanity-studio-quickstart/defining-a-schema) | Structure provides nested type lists, document lists and document editors; schema types are defined and registered in source files. | Borrow the clear browsing hierarchy. Its Structure tool is a document workspace, not a visual schema editor. |\n| [Payload collection configuration](https://payloadcms.com/docs/configuration/collections), [list view](https://payloadcms.com/docs/custom-components/list-view), [edit view](https://payloadcms.com/docs/custom-components/edit-view) | Collections/fields are configured in code. Admin browsing and editing use distinct collection-list and document-edit views. | Opening a collection should lead to its entries, rather than immediately exposing field-definition controls. |\n| [Strapi Content Manager](https://docs.strapi.io/cms/features/content-manager) and [Content-type Builder](https://docs.strapi.io/cms/features/content-type-builder) | Content Manager separates entry lists and forms; Content-type Builder is a separate schema-design tool, available in development only. | Separate authoring from modeling. Our already accepted portal schema editor need not inherit Strapi's environment restriction. |\n\nThe recommendations below are design judgments based on those patterns, not usability-test results for lean-sitebuilder.\n\n## Accepted block action\n\nQ46 accepts one section header with Blocks on the left and a content-width, borderless + Add block button on the right. Use a Kumo ghost button, vertically center the heading and action, align the header with the list's outer edges, and retain normal button padding. The icon/label form one centered group within the button. Keep the existing row design and drag handles. Remove the bottom Add block row. The precise spacing is an implementation detail.\n\nThe alternative footer with a larger gap and a centered borderless action was not selected.\n\n## Collection navigation alternatives\n\n| Alternative | Navigation | Tradeoff |\n| --- | --- | --- |\n| A — Content first, separate schema screen (original recommendation; not selected) | Collections → Journal → entries → entry → block. Journal also has an explicit Edit schema action leading to a separate screen. | Fits the current portal with few new navigation concepts. Schema remains discoverable but off the normal editing path. |\n| B — Separate top-level Content and Collection schemas areas (selected) | Content lists entries by collection. Collection schemas lists models and opens their definitions. | Strongest separation, useful for many collections or distinct author/admin roles; adds navigation and collection selection in two areas. |\n| C — Entries and Schema tabs within each collection | Journal opens Entries by default; Schema replaces the entry view completely. | Smallest structural change and easy switching; gives routine authoring and occasional configuration equal navigation weight and adds another tab layer. |\n\n## Accepted separation and implementation direction\n\nQ47 selects two separate top-level destinations, now reached from the standalone Home screen under DEC-054. Content owns collection entry authoring. Collection schemas owns collection creation and field definitions. Do not implement the earlier A recommendation as the chosen navigation model.\n\nThe following flow applies that separation to the existing portal; detailed control arrangement is an engineering recommendation, not an additional questionnaire answer:\n\n- Content → collection → entry list → entry values and blocks → block details. Add entry belongs in the entry list. Entry editing retains the live preview. Back restores the preceding level and All blocks returns to the same entry.\n- Collection schemas → schema list → collection definition → field definition. Add collection belongs in the schema list. Model controls include name/path, entry-title field, labels/keys/types/required/default/options, and collection deletion. Entry values and Add entry do not appear here.\n- Preserve standalone Pages, Media and Site destinations. Keep entries within Content rather than switching to Pages. The Pages selector contains standalone pages only. All five destinations live on Home, outside the drawer and preview. Area roots show a back link to Home; nested views show only a back link to their immediate parent.\n\nBoth paths keep the current shared Save draft/Publish contract; separate screens do not imply separate Git transactions or per-entry publication states. Existing safeguards for populated field keys/types remain in force.\n\n## Acceptance criteria and verification\n\nThe scoped design choices are resolved. No further interview round is needed for these two issues.\n\nA satisfactory implementation exposes distinct top-level Content and Collection schemas destinations, lets an editor find/edit a Journal entry without encountering field-definition controls, enters schema editing deliberately, returns predictably at each level, and identifies Add block as a header action rather than a draggable item. The implementation now follows this hierarchy. The [verification run](../verification/runs/2026-10-05T1054Z-admin-hierarchy.md) records passing automated checks and the interrupted schema-screen browser review.\n","toc":[{"id":"observed-problems","title":"Observed problems","depth":2},{"id":"research","title":"Research","depth":2},{"id":"accepted-block-action","title":"Accepted block action","depth":2},{"id":"collection-navigation-alternatives","title":"Collection navigation alternatives","depth":2},{"id":"accepted-separation-and-implementation-direction","title":"Accepted separation and implementation direction","depth":2},{"id":"acceptance-criteria-and-verification","title":"Acceptance criteria and verification","depth":2}],"titleAnchor":"admin-actions-and-collection-hierarchy","links":["journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4","verification/runs/2026-10-05T1054Z-admin-hierarchy","verification/runs/2026-10-05T1054Z-admin-hierarchy"],"attachments":[],"html":"\u003cp>The user requested research and alternatives after identifying an ambiguous Add block button and a Collections view that mixes schema design with content authoring. \u003ca href=\"#/journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4\">Q46–Q47\u003c/a> subsequently selected the header action and navigation alternative B, recorded as DEC-052–DEC-053. The user authorized implementation and then requested a separate Home menu (DEC-054). The implementation and verification limits are recorded in the \u003ca href=\"#/verification/runs/2026-10-05T1054Z-admin-hierarchy\">run\u003c/a>. The existing Kumo choice, static architecture, safe schema changes, shared draft save, and dedicated block details remain accepted constraints.\u003c/p>\n\u003ch2 id=\"observed-problems\">Observed problems\u003c/h2>\n\u003cp>The Add block button stretches to the same width as block rows and shares their rounded outline, left-aligned label and spacing. It reads as another block. Changing label alignment alone would leave this grouping problem.\u003c/p>\n\u003cp>Collections currently opens configuration immediately: name, path, field definitions, entry-title field and deletion. Add entry sits among those schema controls. Existing entries are reached through the live collection preview or the mixed page/entry selector; adding or opening an entry switches to the Pages tab. There is no dedicated administrative entry list. This blends collection configuration, content creation and public preview navigation.\u003c/p>\n\u003ch2 id=\"research\">Research\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Source\u003c/th>\n\u003cth>Observed guidance or behavior\u003c/th>\n\u003cth>Implication for this project\ editing use distinct collection-list and document-edit views.\u003c/td>\n\u003ctd>Opening a collection should lead to its entries, rather than immediately exposing field-definition controls.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://docs.strapi.io/cms/features/content-manager\" rel=\"noreferrer\">Strapi Content Manager\u003c/a> and \u003ca href=\"https://docs.strapi.io/cms/features/content-type-builder\" rel=\"noreferrer\">Content-type Builder\u003c/a>\u003c/td>\n\u003ctd>Content Manager separates entry lists and forms; Content-type Builder is a separate schema-design tool, available in development only.\u003c/td>\n\u003ctd>Separate authoring from modeling. Our already accepted portal schema editor need not inherit Strapi's environment restriction.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The recommendations below are design judgments based on those patterns, not usability-test results for lean-sitebuilder.\u003c/p>\n\u003ch2 id=\"accepted-block-action\">Accepted block action\u003c/h2>\n\u003cp>Q46 accepts one section header with Blocks on the left and a content-width, borderless + Add block button on the right. Use a Kumo ghost button, vertically center the heading and action, align the header with the list's outer edges, and retain normal button padding. The icon/label form one centered group within the button. Keep the existing row design and drag handles. Remove the bottom Add block row. The precise spacing is an implementation detail.\u003c/p>\n\u003cp>The alternative footer with a larger gap and a centered borderless action was not selected.\u003c/p>\n\u003ch2 id=\"collection-navigation-alternatives\">Collection navigation alternatives\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Alternative\u003c/th>\n\u003cth>Navigation\u003c/th>\n\u003cth>Tradeoff\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A — Content first, separate schema screen (original recommendation; not selected)\u003c/td>\n\u003ctd>Collections → Journal → entries → entry → block. Journal also has an explicit Edit schema action leading to a separate screen.\u003c/td>\n\u003ctd>Fits the current portal with few new navigation concepts. Schema remains discoverable but off the normal editing path.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B — Separate top-level Content and Collection schemas areas (selected)\u003c/td>\n\u003ctd>Content lists entries by collection. Collection schemas lists models and opens their definitions.\u003c/td>\n\u003ctd>Strongest separation, useful for many collections or distinct author/admin roles; adds navigation and collection selection in two areas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C — Entries and Schema tabs within each collection\u003c/td>\n\u003ctd>Journal opens Entries by default; Schema replaces the entry view completely.\u003c/td>\n\u003ctd>Smallest structural change and easy switching; gives routine authoring and occasional configuration equal navigation weight and adds another tab layer.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"accepted-separation-and-implementation-direction\">Accepted separation and implementation direction\u003c/h2>\n\u003cp>Q47 selects two separate top-level destinations, now reached from the standalone Home screen under DEC-054. Content owns collection entry authoring. Collection schemas owns collection creation and field definitions. Do not implement the earlier A recommendation as the chosen navigation model.\u003c/p>\n\u003cp>The following flow applies that separation to the existing portal; detailed control arrangement is an engineering recommendation, not an additional questionnaire answer:\u003c/p>\n\u003cul>\n\u003cli>Content → collection → entry list → entry values and blocks → block details. Add entry belongs in the entry list. Entry editing retains the live preview. Back restores the preceding level and All blocks returns to the same entry.\u003c/li>\n\u003cli>Collection schemas → schema list → collection definition → field definition. Add collection belongs in the schema list. Model controls include name/path, entry-title field, labels/keys/types/required/default/options, and collection deletion. Entry values and Add entry do not appear here.\u003c/li>\n\u003cli>Preserve standalone Pages, Media and Site destinations. Keep entries within Content rather than switching to Pages. The Pages selector contains standalone pages only. All five destinations live on Home, outside the drawer and preview. Area roots show a back link to Home; nested views show only a back link to their immediate parent.\u003c/li>\n\u003c/ul>\n\u003cp>Both paths keep the current shared Save draft/Publish contract; separate screens do not imply separate Git transactions or per-entry publication states. Existing safeguards for populated field keys/types remain in force.\u003c/p>\n\u003ch2 id=\"acceptance-criteria-and-verification\">Acceptance criteria and verification\u003c/h2>\n\u003cp>The scoped design choices are resolved. No further interview round is needed for these two issues.\u003c/p>\n\u003cp>A satisfactory implementation exposes distinct top-level Content and Collection schemas destinations, lets an editor find/edit a Journal entry without encountering field-definition controls, enters schema editing deliberately, returns predictably at each level, and identifies Add block as a header action rather than a draggable item. The implementation now follows this hierarchy. The \u003ca href=\"#/verification/runs/2026-10-05T1054Z-admin-hierarchy\">verification run\u003c/a> records passing automated checks and the interrupted schema-screen browser review.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions","journal/2026-10-05-admin-hierarchy-decisions","journal/2026-10-05-admin-hierarchy-research"]},{"id":"discussions/agreed-design","title":"Agreed design","section":"Discussions","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Agreed design\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Agreed design\n\nProduct scope established through four interview rounds. The [decision register](../decisions/index.md) preserves each choice and its source; this page consolidates the intended behavior. Nothing here is a claim of implemented or verified software.\n\nDEC-058–DEC-073 subsequently revise entries to schema fields only and introduce generic page templates. The [round-one](../journal/2026-10-05-generic-pages-round-one.md) and [round-two](../journal/2026-10-05-generic-pages-round-two.md) interpretations record accepted changes. The user authorized implementation on 2026-10-06; the [implementation run](../verification/runs/2026-10-05T1650Z-generic-pages.md) records the resulting behavior and checks.\n\n## Repository and deployment\n\nOne site repository contains the public site, static admin editor, registered block code, schemas, and content records. Media files live in Cloudflare R2 and are referenced by URL in Git. Both public and private GitHub repositories work. The user's existing Netlify integration builds and deploys main; the builder does not manage hosting infrastructure.\n\nThe application requires no always-running CMS or custom server-side service. The admin login is a convenience gate configured at build time. Repository operations use the editor's own GitHub token, retained for the tab session including reloads. Editors supply R2 credentials at runtime; upload secrets are not embedded in the public build.\n\n## Editing and publishing\n\nNontechnical owners edit pages through a drawer alongside a live preview. Content, Collection schemas, Media and Site use standard admin views without live website rendering. Collection entries contain only schema fields; their generic page supplies the layout. Owners add, remove, customize, and reorder registered sections in pages using each block's fields and design controls. Save commits content/schema changes to a shared draft branch through a GitHub SDK client. Publish merges accumulated drafts into main, after which Netlify deploys.\n\nStale-save protection prevents silent overwrites. Recovery preserves unsaved work and uses plain language. There is no requirement for live collaborative editing or a Git merge-conflict interface.\n\n## Blocks and styling\n\nBlocks are independently authored in React, Svelte, Vue, or vanilla HTML/CSS/JavaScript under a common registration contract. Each supplies an immediate browser preview and published rendering behavior. Developers add new block types in source and rebuild; users add instances through the editor.\n\nDeclare dependencies and require compatible versions so shared libraries load once per page. Different frameworks retain their distinct runtimes; arbitrary self-bundled incompatible libraries are not promised deduplication. Blocks primarily own their styling. Optional global variables such as light/dark mode provide shared signals, with adoption left to each block.\n\n## Collections\n\nSupport developer-defined schemas and portal creation/editing of collection definitions. Fields include text, number, date, toggle, select, media and visual rich text with uploaded images and YouTube embeds. Permit safe edits such as adding fields or changing labels/defaults; avoid destructive changes to populated fields.\n\nStatic pages contain predefined content. Generic pages contain only generic blocks, whose fields can optionally bind to schema field keys. Schemas can share a compatible generic page. Assigned collections generate entry routes from their prefix and entry slugs; untied collections are data-only. Generic pages have no standalone public route. Index routes require a static page whose URL matches the collection prefix, otherwise they return 404. No separate index-page assignment control is needed. Include a basic collection-list block for static pages to display collection entries.\n\nInvalid bindings block publication but permit draft saving. Empty optional values use a block field's fixed fallback or remain empty. Generic-page previews show field-name placeholders. Initial rich-text embeds support uploaded images and YouTube; broader embed support, footer collection integration, nested models and relations remain outside the current scope. On implementation, replace the current project's demo entries with fresh schema-only content; the user does not need the existing entries preserved or converted.\n\n## Media\n\nUpload files to R2 and retain their metadata/URLs in content records. Media may be accessible by URL immediately, even before its page is published. Large enough image uploads generate a small set of resized, lightly compressed web variants using simple methods. Audio/video transcoding is not required.\n\n## Implementation direction — proposed\n\nUse browser-native image decoding, canvas resizing, and blob encoding before upload, with a small fixed set of widths and no upscaling. Record variant URLs and dimensions for responsive image markup. This avoids an image transformation service. Exact widths, encodings, limits, orientation/animation handling, and fallback behavior require implementation validation. Browser canvas supports destination resizing and export with encoding/quality settings: [drawImage](https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/drawImage), [toBlob](https://developer.mozilla.org/en-US/docs/Web/API/HTMLCanvasElement/toBlob).\n\nThe old astro-payload repository has separate renderer and Payload-schema registries in `sites/default/astro/src/blocks/blockRenderers.ts` and `blockSchemas.ts`. That registration concept is relevant reference material; the new core and starter blocks will be fresh, with no Payload dependency or migration commitment.\n\nThe user explicitly authorized implementation after both interviews. The [technical contracts](technical-contracts.md), [feature map](../features/index.md), and [initial verification run](../verification/runs/2026-10-05T0819Z-implementation.md) now record the resulting system and its remaining verification gaps.\n\n## Main navigation refinement\n\nDEC-074 replaces the Home destination menu with a main sidebar containing Pages, Content, Collection schemas, Media and Site. Page and block controls stay in their separate editing drawer. Only individual page/block editors show the live preview. See [visual editing](../features/editor.md).\n","toc":[{"id":"repository-and-deployment","title":"Repository and deployment","depth":2},{"id":"editing-and-publishing","title":"Editing and publishing","depth":2},{"id":"blocks-and-styling","title":"Blocks and styling","depth":2},{"id":"collections","title":"Collections","depth":2},{"id":"media","title":"Media","depth":2},{"id":"implementation-direction-proposed","title":"Implementation direction — proposed","depth":2},{"id":"main-navigation-refinement","title":"Main navigation refinement","depth":2}],"titleAnchor":"agreed-design","links":["decisions/index","journal/2026-10-05-generic-pages-round-one","journal/2026-10-05-generic-pages-round-two","verification/runs/2026-10-05T1650Z-generic-pages","discussions/technical-contracts","features/index","verification/runs/2026-10-05T0819Z-implementation","features/editor"],"attachments":[],"html":"\u003cp>Product scope established through four interview rounds. The \u003ca href=\"#/decisions/index\">decision register\u003c/a> preserves each choice and its source; this page consolidates the intended behavior. Nothing here is a claim of implemented or verified software.\u003c/p>\n\u003cp>DEC-058–DEC-073 subsequently revise entries to schema fields only and introduce generic page templates. The \u003ca href=\"#/journal/2026-10-05-generic-pages-round-one\">round-one\u003c/a> and \u003ca href=\"#/journal/2026-10-05-generic-pages-round-two\">round-two\u003c/a> interpretations record accepted changes. The user authorized implementation on 2026-10-06; the \u003ca href=\"#/verification/runs/2026-10-05T1650Z-generic-pages\">implementation run\u003c/a> records the resulting behavior and checks.\u003c/p>\n\u003ch2 id=\"repository-and-deployment\">Repository and deployment\u003c/h2>\n\u003cp>One site repository contains the public site, static admin editor, registered block code, schemas, and content records. Media files live in Cloudflare R2 and are referenced by URL in Git. Both public and private GitHub repositories work. The user's existing Netlify integration builds and deploys main; the builder does not manage hosting infrastructure.\u003c/p>\n\u003cp>The application requires no always-running CMS or custom server-side service. The admin login is a convenience gate configured at build time. Repository operations use the editor's own GitHub token, retained for the tab session including reloads. Editors supply R2 credentials at runtime; upload secrets are not embedded in the public build.\u003c/p>\n\u003ch2 id=\"editing-and-publishing\">Editing and publishing\u003c/h2>\n\u003cp>Nontechnical owners edit pages through a drawer alongside a live preview. Content, Collection schemas, Media and Site use standard admin views without live website rendering. Collection entries contain only schema fields; their generic page supplies the layout. Owners add, remove, customize, and reorder registered sections in pages using each block's fields and design controls. Save commits content/schema changes to a shared draft branch through a GitHub SDK client. Publish merges accumulated drafts into main, after which Netlify deploys.\u003c/p>\n\u003cp>Stale-save protection prevents silent overwrites. Recovery preserves unsaved work and uses plain language. There is no requirement for live collaborative editing or a Git merge-conflict interface.\u003c/p>\n\u003ch2 id=\"blocks-and-styling\">Blocks and styling\u003c/h2>\n\u003cp>Blocks are independently authored in React, Svelte, Vue, or vanilla HTML/CSS/JavaScript under a common registration contract. Each supplies an immediate browser preview and published rendering behavior. Developers add new block types in source and rebuild; users add instances through the editor.\u003c/p>\n\u003cp>Declare dependencies and require compatible versions so shared libraries load once per page. Different frameworks retain their distinct runtimes; arbitrary self-bundled incompatible libraries are not promised deduplication. Blocks primarily own their styling. Optional global variables such as light/dark mode provide shared signals, with adoption left to each block.\u003c/p>\n\u003ch2 id=\"collections\">Collections\u003c/h2>\n\u003cp>Support developer-defined schemas and portal creation/editing of collection definitions. Fields include text, number, date, toggle, select, media and visual rich text with uploaded images and YouTube embeds. Permit safe edits such as adding fields or changing labels/defaults; avoid destructive changes to populated fields.\u003c/p>\n\u003cp>Static pages contain predefined content. Generic pages contain only generic blocks, whose fields can optionally bind to schema field keys. Schemas can share a compatible generic page. Assigned collections generate entry routes from their prefix and entry slugs; untied collections are data-only. Generic pages have no standalone public route. Index routes require a static page whose URL matches the collection prefix, otherwise they return 404. No separate index-page assignment control is needed. Include a basic collection-list block for static pages to display collection entries.\u003c/p>\n\u003cp>Invalid bindings block publication but permit draft saving. Empty optional values use a block field's fixed fallback or remain empty. Generic-page previews show field-name placeholders. Initial rich-text embeds support uploaded images and YouTube; broader embed support, footer collection integration, nested models and relations remain outside the current scope. On implementation, replace the current project's demo entries with fresh schema-only content; the user does not need the existing entries preserved or converted.\u003c/p>\n\u003ch2 id=\"media\">Media\u003c/h2>\n\u003cp>Upload files to R2 and retain their metadata/URLs in content records. Media may be accessible by URL immediately, even before its page is published. Large enough image uploads generate a small set of resized, lightly compressed web variants using simple methods. Audio/video transcoding is not required.\u003c/p>\n\u003ch2 id=\"implementation-direction-proposed\">Implementation direction — proposed\u003c/h2>\n\u003cp>Use browser-native image decoding, canvas resizing, and blob encoding before upload, with a small fixed set of widths and no upscaling. Record variant URLs and dimensions for responsive image markup. This avoids an image transformation service. Exact widths, encodings, limits, orientation/animation handling, and fallback behavior require implementation validation. Browser canvas supports destination resizing and export with encoding/quality settings: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/drawImage\" rel=\"noreferrer\">drawImage\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLCanvasElement/toBlob\" rel=\"noreferrer\">toBlob\u003c/a>.\u003c/p>\n\u003cp>The old astro-payload repository has separate renderer and Payload-schema registries in \u003ccode>sites/default/astro/src/blocks/blockRenderers.ts\u003c/code> and \u003ccode>blockSchemas.ts\u003c/code>. That registration concept is relevant reference material; the new core and starter blocks will be fresh, with no Payload dependency or migration commitment.\u003c/p>\n\u003cp>The user explicitly authorized implementation after both interviews. The \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a>, \u003ca href=\"#/features/index\">feature map\u003c/a>, and \u003ca href=\"#/verification/runs/2026-10-05T0819Z-implementation\">initial verification run\u003c/a> now record the resulting system and its remaining verification gaps.\u003c/p>\n\u003ch2 id=\"main-navigation-refinement\">Main navigation refinement\u003c/h2>\n\u003cp>DEC-074 replaces the Home destination menu with a main sidebar containing Pages, Content, Collection schemas, Media and Site. Page and block controls stay in their separate editing drawer. Only individual page/block editors show the live preview. See \u003ca href=\"#/features/editor\">visual editing\u003c/a>.\u003c/p>\n","backlinks":["index","discussions/open-questions","features/editor","features/index","features/media","journal/2026-10-05-generic-pages-discussion","journal/2026-10-05-round-four-decisions"]},{"id":"discussions/block-library","title":"Block library implementation scope","section":"Discussions","order":0,"metadata":{"status":"Implemented; verification recorded"},"metadataHtml":"\u003cspan>Status: Implemented; verification recorded\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Block library implementation scope\nupdated: 2026-10-06\nstatus: Implemented; verification recorded\n---\n# Block library implementation scope\n\nThis consolidates DEC-079–DEC-091 from the [request and inventory](../journal/2026-10-06-block-library-plan.md), [round one](../journal/2026-10-06-block-library-round-one.md) and [round two](../journal/2026-10-06-block-library-round-two.md). Implementation is now recorded in the [feature map](../features/block-library.md) and [implementation journal](../journal/2026-10-06-block-library-implementation.md). The scope below remains the accepted basis.\n\n## Accepted behavior\n\n- Every block belongs to one theme/design family and has multiple tags. A block theme is distinct from the site's existing light/dark mode.\n- Add a block becomes a large searchable dialog: controls above a visual grid, searching/filtering by theme, tags and block name. Its primary card action inserts immediately; Preview is a separate action. Page-kind compatibility and retained-version rules continue to apply.\n- Reimplement approximately 3–5 distinct variants from each of the legacy library's 15 categories in the current block system. Adapt designs rather than copying Payload schemas/Astro components unchanged. Include useful generic counterparts now.\n- Repeated block content supports adding, removing and reordering rows. Collection schemas gain structured list fields so one entry can hold items such as ingredients, specifications or FAQs. Generic blocks can bind compatible lists as well as the existing field types. Initial list rows use existing supported types; unrestricted recursive schema nesting is outside this increment.\n- Blog layouts use collection entries and configurable display-field mappings. They link through the existing entry-route system.\n- Contact/newsletter forms submit to an editor-configured external endpoint. A destination is required before publishing a submission form. Preview interactions must not send actual submissions.\n- Configure the footer once for the site. Add a shared configurable header with grouped navigation and mobile behavior in this pass.\n- Block editors expose content fields. Appearance follows authored themes and shared site settings; per-block visual override panels were explicitly rejected. Retained records/versions must remain readable rather than silently discarding existing data.\n- The [six reference sites](../journal/2026-10-06-block-library-round-one.md#reference-sites) guide coverage and composition quality. No exact clone or reproduction of all backend services/advanced animation was requested.\n\n## Engineering approach\n\nThe following choices implement the accepted scope and do not add requirements:\n\n1. Extend definitions with stable theme/tag/catalog metadata. Keep the catalog lightweight instead of mounting every interactive block while browsing. Provide accurate visual previews and clear empty/reset states.\n2. Add shared repeatable-field editing, serialization and validation, then schema-list compatibility and generic binding resolution. Use stable row identities for editing/reordering. Validate list structure and required child fields consistently in preview, draft and publication flows.\n3. Add site-owned header/footer configuration and render it through the same source in public pages and page previews. Edit shared settings in Site; preserve the established page-only live-preview rule. Navigation must work with keyboard and on small screens.\n4. Expose collection data required for card mappings while keeping credentials out of renderer context. Handle optional images/excerpts and invalid mappings visibly through existing validation.\n5. Adapt a first set of three distinct variants per category: 45 base variants, including three shared Footer choices. Add useful generic counterparts where scalar or structured list bindings provide meaningful entry layouts. The grouped site header is separate from legacy Header sections, which are page-introduction layouts.\n6. Verify the contracts and each category's content/rendering behavior, then exercise the large catalog, shared header/footer and representative page compositions in the browser. Run pnpm verify and record outcomes through the existing wiki workflow.\n\n## Proposed initial selection\n\nThe variant names refer to the legacy reference directory. Final implementations receive current-system IDs, definitions, defaults and scoped rendering code. Selection may change when source inspection reveals unsupported or redundant behavior, while retaining category coverage.\n\n| Category | Three contrasting reference variants |\n| --- | --- |\n| Bento | BentoThreeColGrid, BentoTwoRowGrid, BentoTwoRowThreeColGrid |\n| Blog | BlogFeaturedPost, BlogThreeColImgs, BlogSingleColImgs |\n| Contact | ContactCentered, ContactSplitImg, ContactSmFourCol |\n| Content | ContentCentered, ContentSplitImg, ContentStickyScreenshot |\n| CTA | CtaSimpleCentered, CtaSplitWithImage, CtaDarkPanelWithAppScreenshot |\n| FAQ | FaqCenteredAccordion, FaqSideBySide, FaqThreeColumns |\n| Features | FeatSimple3x2Grid, FeatWithProductScreenshot, FeatWithTestimonial |\n| Footer | Footer4ColSimple, FooterSmCentered, Footer4ColMission |\n| Header | HeaderCentered, HeaderCtrBgImg, HeaderWithStats |\n| Hero | HeroSimpleCentered, HeroSplitImg, HeroImgTiles |\n| Logo cloud | LogocloudSimple, LogocloudGrid, LogocloudSplitLogosRight |\n| Newsletter | NewsletterCenteredCard, NewsletterSmSbs, NewsletterSmStacked |\n| Stats | StatsSimpleGrid, StatsSplitWithImage, StatsTimeline |\n| Team | TeamGridRoundImgs, TeamLargeImgs, TeamFullWidthVertImgs |\n| Testimonials | TestimonialsSimpleCentered, TestimonialsSideBySide, TestimonialsGrid |\n\n## Observable completion criteria\n\n- Search and combined theme/tag filters find the expected matching variants; zero results and reset work; keyboard users can browse, preview and add. Preview does not insert; Add inserts exactly once and preserves the established editor hierarchy.\n- Lists survive reorder/edit/delete, serialization and reload. Schema list editing and bindings preserve correctly typed values; invalid mappings/values fail at the appropriate validation phase. Empty and missing optional content has intentional rendering behavior.\n- Collection-backed cards reflect entry fields and valid routes. Shared header/footer changes appear across static pages, generic entry routes and page previews.\n- Form submission reaches the configured endpoint in a controlled test; no real submission is sent from editor/catalog previews. Missing endpoint and server errors are handled honestly.\n- All included variants are independently selectable and have distinct layouts. Public output and live preview agree; small screens, long text, absent optional media and multiple instances remain usable. Theme styles stay scoped away from Kumo admin controls.\n- The library follows the existing shared-runtime/static-output contract and site typography, content width and gutter defaults. Full checks and recorded browser checks pass; live-provider limits remain explicit.\n\nThe interview itself changed no application code. The subsequent authorized implementation and its limits are recorded in the [verification report](../verification/runs/2026-10-06T1320Z-block-library.md).\n","toc":[{"id":"accepted-behavior","title":"Accepted behavior","depth":2},{"id":"engineering-approach","title":"Engineering approach","depth":2},{"id":"proposed-initial-selection","title":"Proposed initial selection","depth":2},{"id":"observable-completion-criteria","title":"Observable completion criteria","depth":2}],"titleAnchor":"block-library-implementation-scope","links":["journal/2026-10-06-block-library-plan","journal/2026-10-06-block-library-round-one","journal/2026-10-06-block-library-round-two","features/block-library","journal/2026-10-06-block-library-implementation","journal/2026-10-06-block-library-round-one","verification/runs/2026-10-06T1320Z-block-library"],"attachments":[],"html":"\u003cp>This consolidates DEC-079–DEC-091 from the \u003ca href=\"#/journal/2026-10-06-block-library-plan\">request and inventory\u003c/a>, \u003ca href=\"#/journal/2026-10-06-block-library-round-one\">round one\u003c/a> and \u003ca href=\"#/journal/2026-10-06-block-library-round-two\">round two\u003c/a>. Implementation is now recorded in the \u003ca href=\"#/features/block-library\">feature map\u003c/a> and \u003ca href=\"#/journal/2026-10-06-block-library-implementation\">implementation journal\u003c/a>. The scope below remains the accepted basis.\u003c/p>\n\u003ch2 id=\"accepted-behavior\">Accepted behavior\u003c/h2>\n\u003cul>\n\u003cli>Every block belongs to one theme/design family and has multiple tags. A block theme is distinct from the site's existing light/dark mode.\u003c/li>\n\u003cli>Add a block becomes a large searchable dialog: controls above a visual grid, searching/filtering by theme, tags and block name. Its primary card action inserts immediately; Preview is a separate action. Page-kind compatibility and retained-version rules continue to apply.\u003c/li>\n\u003cli>Reimplement approximately 3–5 distinct variants from each of the legacy library's 15 categories in the current block system. Adapt designs rather than copying Payload schemas/Astro components unchanged. Include useful generic counterparts now.\u003c/li>\n\u003cli>Repeated block content supports adding, removing and reordering rows. Collection schemas gain structured list fields so one entry can hold items such as ingredients, specifications or FAQs. Generic blocks can bind compatible lists as well as the existing field types. Initial list rows use existing supported types; unrestricted recursive schema nesting is outside this increment.\u003c/li>\n\u003cli>Blog layouts use collection entries and configurable display-field mappings. They link through the existing entry-route system.\u003c/li>\n\u003cli>Contact/newsletter forms submit to an editor-configured external endpoint. A destination is required before publishing a submission form. Preview interactions must not send actual submissions.\u003c/li>\n\u003cli>Configure the footer once for the site. Add a shared configurable header with grouped navigation and mobile behavior in this pass.\u003c/li>\n\u003cli>Block editors expose content fields. Appearance follows authored themes and shared site settings; per-block visual override panels were explicitly rejected. Retained records/versions must remain readable rather than silently discarding existing data.\u003c/li>\n\u003cli>The \u003ca href=\"#/journal/2026-10-06-block-library-round-one~reference-sites\">six reference sites\u003c/a> guide coverage and composition quality. No exact clone or reproduction of all backend services/advanced animation was requested.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"engineering-approach\">Engineering approach\u003c/h2>\n\u003cp>The following choices implement the accepted scope and do not add requirements:\u003c/p>\n\u003col>\n\u003cli>Extend definitions with stable theme/tag/catalog metadata. Keep the catalog lightweight instead of mounting every interactive block while browsing. Provide accurate visual previews and clear empty/reset states.\u003c/li>\n\u003cli>Add shared repeatable-field editing, serialization and validation, then schema-list compatibility and generic binding resolution. Use stable row identities for editing/reordering. Validate list structure and required child fields consistently in preview, draft and publication flows.\u003c/li>\n\u003cli>Add site-owned header/footer configuration and render it through the same source in public pages and page previews. Edit shared settings in Site; preserve the established page-only live-preview rule. Navigation must work with keyboard and on small screens.\u003c/li>\n\u003cli>Expose collection data required for card mappings while keeping credentials out of renderer context. Handle optional images/excerpts and invalid mappings visibly through existing validation.\u003c/li>\n\u003cli>Adapt a first set of three distinct variants per category: 45 base variants, including three shared Footer choices. Add useful generic counterparts where scalar or structured list bindings provide meaningful entry layouts. The grouped site header is separate from legacy Header sections, which are page-introduction layouts.\u003c/li>\n\u003cli>Verify the contracts and each category's content/rendering behavior, then exercise the large catalog, shared header/footer and representative page compositions in the browser. Run pnpm verify and record outcomes through the existing wiki workflow.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"proposed-initial-selection\">Proposed initial selection\u003c/h2>\n\u003cp>The variant names refer to the legacy reference directory. Final implementations receive current-system IDs, definitions, defaults and scoped rendering code. Selection may change when source inspection reveals unsupported or redundant behavior, while retaining category coverage.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Category\u003c/th>\n\u003cth>Three contrasting reference variants\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bento\u003c/td>\n\u003ctd>BentoThreeColGrid, BentoTwoRowGrid, BentoTwoRowThreeColGrid\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blog\u003c/td>\n\u003ctd>BlogFeaturedPost, BlogThreeColImgs, BlogSingleColImgs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Contact\u003c/td>\n\u003ctd>ContactCentered, ContactSplitImg, ContactSmFourCol\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Content\u003c/td>\n\u003ctd>ContentCentered, ContentSplitImg, ContentStickyScreenshot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CTA\u003c/td>\n\u003ctd>CtaSimpleCentered, CtaSplitWithImage, CtaDarkPanelWithAppScreenshot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FAQ\u003c/td>\n\u003ctd>FaqCenteredAccordion, FaqSideBySide, FaqThreeColumns\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Features\u003c/td>\n\u003ctd>FeatSimple3x2Grid, FeatWithProductScreenshot, FeatWithTestimonial\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Footer\u003c/td>\n\u003ctd>Footer4ColSimple, FooterSmCentered, Footer4ColMission\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Header\u003c/td>\n\u003ctd>HeaderCentered, HeaderCtrBgImg, HeaderWithStats\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hero\u003c/td>\n\u003ctd>HeroSimpleCentered, HeroSplitImg, HeroImgTiles\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Logo cloud\u003c/td>\n\u003ctd>LogocloudSimple, LogocloudGrid, LogocloudSplitLogosRight\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Newsletter\u003c/td>\n\u003ctd>NewsletterCenteredCard, NewsletterSmSbs, NewsletterSmStacked\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stats\u003c/td>\n\u003ctd>StatsSimpleGrid, StatsSplitWithImage, StatsTimeline\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Team\u003c/td>\n\u003ctd>TeamGridRoundImgs, TeamLargeImgs, TeamFullWidthVertImgs\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Testimonials\u003c/td>\n\u003ctd>TestimonialsSimpleCentered, TestimonialsSideBySide, TestimonialsGrid\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"observable-completion-criteria\">Observable completion criteria\u003c/h2>\n\u003cul>\n\u003cli>Search and combined theme/tag filters find the expected matching variants; zero results and reset work; keyboard users can browse, preview and add. Preview does not insert; Add inserts exactly once and preserves the established editor hierarchy.\u003c/li>\n\u003cli>Lists survive reorder/edit/delete, serialization and reload. Schema list editing and bindings preserve correctly typed values; invalid mappings/values fail at the appropriate validation phase. Empty and missing optional content has intentional rendering behavior.\u003c/li>\n\u003cli>Collection-backed cards reflect entry fields and valid routes. Shared header/footer changes appear across static pages, generic entry routes and page previews.\u003c/li>\n\u003cli>Form submission reaches the configured endpoint in a controlled test; no real submission is sent from editor/catalog previews. Missing endpoint and server errors are handled honestly.\u003c/li>\n\u003cli>All included variants are independently selectable and have distinct layouts. Public output and live preview agree; small screens, long text, absent optional media and multiple instances remain usable. Theme styles stay scoped away from Kumo admin controls.\u003c/li>\n\u003cli>The library follows the existing shared-runtime/static-output contract and site typography, content width and gutter defaults. Full checks and recorded browser checks pass; live-provider limits remain explicit.\u003c/li>\n\u003c/ul>\n\u003cp>The interview itself changed no application code. The subsequent authorized implementation and its limits are recorded in the \u003ca href=\"#/verification/runs/2026-10-06T1320Z-block-library\">verification report\u003c/a>.\u003c/p>\n","backlinks":["decisions/index","discussions/open-questions","discussions/technical-contracts","features/block-library","journal/2026-10-06-block-library-implementation","journal/2026-10-06-block-library-round-one","journal/2026-10-06-block-library-round-two"]},{"id":"discussions/open-questions","title":"Open questions","section":"Discussions","order":0,"metadata":{"status":"Scoped interviews complete"},"metadataHtml":"\u003cspan>Status: Scoped interviews complete\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Open questions\nupdated: 2026-10-06\nstatus: Scoped interviews complete\n---\n# Open questions\n\n## Block library — resolved\n\nQ60–Q68 are resolved as DEC-082–DEC-091. See [round one](../journal/2026-10-06-block-library-round-one.md), [round two](../journal/2026-10-06-block-library-round-two.md) and the [consolidated implementation scope](block-library.md).\n\nThe scope includes a themed/tagged searchable catalog with direct add and separate Preview, refitted static and useful generic blocks, editable block/schema lists, generic list bindings, collection-backed Blog cards, external form submission, a shared footer and grouped-navigation header. Block appearance comes from themes and site settings; per-block visual customization was rejected. The six reference sites remain capability/design benchmarks.\n\nNo consequential product questions remain for this phase. The proposed first selection is three variants per category (45 base variants, including shared Footer choices), plus useful generic counterparts and a shared navigation header. Exact field/metadata interfaces and variant implementation details remain engineering choices. This is accepted scope; application implementation and verification are pending.\n\n## Generic pages and schema-only entries — resolved\n\nThe user requested discussion before implementation. DEC-058–DEC-061 establish field-only entries, static/generic page types, generic-only blocks with optional field-name bindings, and optional collection-to-template assignment. See the [discussion journal](../journal/2026-10-05-generic-pages-discussion.md).\n\nQ48–Q55 are resolved as DEC-062–DEC-069; see the [round-one interpretation](../journal/2026-10-05-generic-pages-round-one.md). Q56–Q59 are resolved as DEC-070–DEC-073 in [round two](../journal/2026-10-05-generic-pages-round-two.md): index pages match by URL, a basic collection-list block is included, rich-text embeds initially support uploaded images and YouTube, and the current demo entries will be replaced with fresh schema-only content. No consequential product questions remain for this scope. Concrete interfaces and rendering/validation mechanics remain engineering work. Footer integration and broader rich-text embed support are outside this version. The user authorized implementation on 2026-10-06; see the [implementation run](../verification/runs/2026-10-05T1650Z-generic-pages.md). The earlier interview-complete statements below describe the previous scope.\n\n## Admin hierarchy refinement — resolved\n\nQ46–Q47 select Add block beside the Blocks heading, aligned right, and alternative B: separate top-level Content and Collection schemas areas. These are DEC-052–DEC-053 in the [decision register](../decisions/index.md); see the [accepted design](admin-hierarchy-proposal.md) and [interpretation](../journal/2026-10-05-admin-hierarchy-decisions.md). The scoped choices are resolved. DEC-054 additionally moves all destinations to a standalone Home menu. Implementation is present; the [run](../verification/runs/2026-10-05T1054Z-admin-hierarchy.md) records completed checks and the remaining schema-screen browser review.\n\nThe four-round product interview establishes the [agreed design](agreed-design.md). The user subsequently requested a technical grill to choose the stack, content format, block contracts, and related implementation decisions. The technical interview is now complete as well. Accepted choices are recorded below; untested engineering details are identified in the technical specification.\n\n## Technical round one — resolved\n\nQ25–Q32 are accepted as DEC-026–DEC-033. The additional shared-vendor direction is DEC-034. See [technical foundations](../journal/2026-10-05-technical-foundations.md).\n\n## Technical round two — resolved\n\nQ33–Q39 are accepted as DEC-035–DEC-041. The user chose retained deprecated block implementations and manual version switching, replacing the proposed automated migration functions. See [content/block decisions](../journal/2026-10-05-content-block-contracts.md).\n\n## Technical round three — resolved\n\n| Question | Decision | Accepted outcome |\n| --- | --- | --- |\n| Q40 | Editor UI components | Originally Base UI; superseded by Cloudflare Kumo in DEC-048. |\n| Q41 | Block CSS scoping | CSS Modules/framework-scoped styles, with no unscoped global resets/selectors. |\n| Q42 | Save scope | All pending editor changes in one draft commit. |\n| Q43 | Unsaved content recovery | Per-tab session recovery, excluding binary uploads. |\n| Q44 | Markdown authoring interface | A visual editor for a limited Markdown feature set. |\n| Q45 | Incomplete draft persistence | Save structurally valid incomplete drafts; block Publish until required content is valid. |\n\nQ40–Q45 are accepted as DEC-042–DEC-047. See the [editor/saving journal](../journal/2026-10-05-editor-saving.md). Concrete definitions, engineering recommendations, and verification targets are consolidated in [technical contracts](technical-contracts.md). No further questionnaire is needed for the scoped design.\n\nBase UI supplies unstyled React primitives and documents tree-shakable imports and CSS Modules usage: [quick start](https://base-ui.com/react/overview/quick-start). This records the original interview choice. DEC-048 now selects [Cloudflare Kumo](https://github.com/cloudflare/kumo) for admin UI; grill-form remains native HTML.\n\nFor Git transactions, the proposed engineering path creates a tree and commit based on the loaded draft head, then advances the branch without force. A concurrent branch advance to a divergent commit must reject the update; preserve local work and explain recovery. Q42 selects all pending edits in one commit. See GitHub's [trees](https://docs.github.com/en/rest/git/trees#create-a-tree), [commits](https://docs.github.com/en/rest/git/commits#create-a-commit), and [reference updates](https://docs.github.com/en/rest/git/refs#update-a-reference). This is a design proposal requiring race-condition testing, not a claim that a preflight read alone provides locking.\n\nResearch: Astro supports static prerendering and multiple UI framework integrations, but `.astro` templates have no browser component runtime. A live unsaved editor requires browser-renderable implementations. See [static rendering](https://docs.astro.build/en/guides/on-demand-rendering/) and [framework components](https://docs.astro.build/en/guides/framework-components/). JSON Schema supplies a portable validation vocabulary; editor controls/layout still need UI metadata. See [JSON Schema](https://json-schema.org/overview/what-is-jsonschema). An iframe creates a separate browsing context; using it isolates document styling but does not share live framework instances with the parent. See [iframe](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/iframe). The shared-document preview boundary was selected in Q31.\n\n## Resolved in round two\n\nQ8–Q14 are resolved by DEC-009 through DEC-015 in the [decision register](../decisions/index.md): convenience login, both repository visibilities, individual tokens, Netlify-managed deployment, shared page/post block editing, browser previews, and developer-installed blocks.\n\n## Resolved in round three\n\nQ15–Q17 and Q19 are resolved by DEC-016–DEC-018 and DEC-020: tab-session tokens, developer and portal collection schemas, simple shared drafts, and optional global styling. Q18 establishes R2 storage (DEC-019) but leaves upload authorization and media type scope open.\n\n## Resolved in round four\n\nQ20–Q24 are resolved by DEC-021–DEC-025 in the [decision register](../decisions/index.md).\n\n| Question | Outcome | Scope |\n| --- | --- | --- |\n| Q20 | Runtime editor-supplied R2 credentials | Keep the application static; no secret-holding upload helper. |\n| Q21 | Basic fields and safe schema changes | No nested models, relations, or migration tooling initially. |\n| Q22 | Automatic standard listing and entry pages | Existing block editor supplies entry bodies. |\n| Q23 | Simple image resizing and light compression | Generate web image sets for sufficiently large images; no audio/video transcoding. |\n| Q24 | Media URLs may be public before Publish | Page publication remains separate. |\n\n## Engineering work for the implementation plan\n\nDefine the content/schema file formats, block authoring and preview interfaces, dependency sharing, Git save/merge concurrency handling, schema compatibility validation, and upload metadata. Propose concrete starter blocks and validation scenarios. Choose image widths/encodings/limits and browser fallbacks, and document repository permissions and R2 CORS setup. The contract definitions now specify these behaviors. Exact library pins, build integration, limits, and validation fixtures remain engineering work. No unimplemented behavior is certified by the interview or wiki checks.\n\nR2 credential retention was not separately selected; propose the same tab-session behavior as GitHub when specifying the editor session. Do not mistake that proposed default for an explicitly answered question. The optional future capabilities excluded above can be reconsidered if the user expands scope.\n\n## Research\n\nAstro documents that its Vite-provided environment values are statically replaced at build time and that public variables are available to client code. The inference for a fully static editor is that checking a configured credential in client code is a UI gate, not server-enforced authorization. [Environment variables](https://docs.astro.build/en/guides/environment-variables/).\n\nGitHub documents repository-scoped fine-grained tokens and branch merging through its API. Exact required permissions and branch protection compatibility must be validated in implementation. [Personal access tokens](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens), [branch API](https://docs.github.com/en/rest/branches/branches#merge-a-branch).\n\nGitHub Pages offers static hosting; private-repository availability depends on the account plan. This is a deployment option, not an accepted provider choice. [GitHub Pages](https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages).\n","toc":[{"id":"block-library-resolved","title":"Block library — resolved","depth":2},{"id":"generic-pages-and-schema-only-entries-resolved","title":"Generic pages and schema-only entries — resolved","depth":2},{"id":"admin-hierarchy-refinement-resolved","title":"Admin hierarchy refinement — resolved","depth":2},{"id":"technical-round-one-resolved","title":"Technical round one — resolved","depth":2},{"id":"technical-round-two-resolved","title":"Technical round two — resolved","depth":2},{"id":"technical-round-three-resolved","title":"Technical round three — resolved","depth":2},{"id":"resolved-in-round-two","title":"Resolved in round two","depth":2},{"id":"resolved-in-round-three","title":"Resolved in round three","depth":2},{"id":"resolved-in-round-four","title":"Resolved in round four","depth":2},{"id":"engineering-work-for-the-implementation-plan","title":"Engineering work for the implementation plan","depth":2},{"id":"research","title":"Research","depth":2}],"titleAnchor":"open-questions","links":["journal/2026-10-06-block-library-round-
