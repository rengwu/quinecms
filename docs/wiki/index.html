li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2\">Submitted round-two answers\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-round-three-decisions\">Round-three interpretation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59\">Submitted round-three answers\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-round-four-decisions\">Round-four interpretation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa\">Submitted round-four answers\u003c/a>\u003c/li>\n\u003c/ul>\n","backlinks":[]},{"id":"decisions/index","title":"Decisions","section":"Decisions","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Decisions\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Decisions\n\nAccepted on 2026-10-05 from the original request and [round-one answers](../journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02.md). See the [interpretation journal](../journal/2026-10-05-round-one-decisions.md) and [remaining questions](../discussions/open-questions.md). These are intended requirements, not implemented features.\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-001 | Keep the public website, static admin editor, blocks, and content records in one Git repository and deployment. Remove the always-running Payload CMS dependency. | Original request: lightweight, durable ownership with Git as the source of content. Q18 later explicitly places media files in R2; see DEC-019. |\n| DEC-002 | Support GitHub first; require a user-supplied Git token for submissions. Provide editor entry using an environment-configured credential. | Q1 custom answer. DEC-009–DEC-012 clarify access/deployment; DEC-016 sets token retention. No custom auth helper is required. |\n| DEC-003 | Design the first release for nontechnical clients and site owners. | Q2: editor usability must cover people without a developer workflow. |\n| DEC-004 | Include pages, navigation, site settings, media, and blog posts or other repeatable content collections. | Q3 selected the collections-inclusive scope. A general visual schema builder has not been requested. |\n| DEC-005 | Allow blocks from multiple frameworks subject to declared dependencies and compatible shared library versions. | Original request and Q4: deduplicate compatible shared runtimes per page; different frameworks still have distinct runtimes. |\n| DEC-006 | Reorder page sections and edit each block's defined fields and design controls, with a side drawer and live preview. | Original request and Q5. Nested layout construction and arbitrary element positioning are outside the selected initial scope. |\n| DEC-007 | Save creates commits on an unpublished draft branch. Publish merges that draft branch into main and then deploys. | Q6 custom answer: saving and going live are separate actions; publishing applies the branch's accumulated changes. |\n| DEC-008 | Build a fresh core and entirely new starter blocks. Use astro-payload as reference only. | Q7: no migration compatibility or block porting commitment. |\n\n## Round two — 2026-10-05\n\nAccepted from [round-two answers](../journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2.md); see the [interpretation](../journal/2026-10-05-round-two-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-009 | The environment-configured login is a convenience gate; GitHub authorization protects repository access. | Q8 explicitly accepts the static gate's limits. It must not be described as protection for private resources. |\n| DEC-010 | Support both private and public site repositories. | Q9. Private draft reads require GitHub authorization; public repository drafts are public. Netlify hosting does not change repository visibility. |\n| DEC-011 | Each editor supplies their own GitHub token. | Q10. DEC-016 sets token retention; no tokens belong in the deployed bundle or planning records. |\n| DEC-012 | Use a browser GitHub SDK client for repository changes. Publish merges to main; the user's existing Netlify Git integration owns deployment. | Q11 custom answer. No builder-managed deployment service or Netlify API integration is requested. Schema authoring is subsequently defined in DEC-017 and DEC-022. |\n| DEC-013 | Posts and collection entries use the same block editor as pages, alongside structured metadata. | Q12. |\n| DEC-014 | Every block must support immediate browser preview of unsaved changes. | Q13. Shared rendering logic is preferred where feasible; preview/published parity must be verified during implementation. |\n| DEC-015 | Developers install and register new block types in source, followed by a rebuild. | Q14. Adding instances of existing blocks remains an editor action. No portal block marketplace is required. |\n\n## Round three — 2026-10-05\n\nAccepted from [round-three answers](../journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59.md); see the [interpretation](../journal/2026-10-05-round-three-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-016 | Retain the editor's GitHub token for the browser tab's session, including reloads. | Q15. Session retention is intended; persistent device-wide remembering was not selected. |\n| DEC-017 | Support developer-defined schemas and allow users to create collections and edit collection fields in the portal. | Q16 selects option 2 and notes “1 and 2.” Visual editing of block field definitions was not selected; DEC-022 narrows the collection editor. |\n| DEC-018 | Use shared drafts with stale-save protection and a simple recovery flow. | Q17 accepts manual reapplication but stresses nontechnical users. Preserve unsaved work, prevent silent overwrites, and explain recovery in plain language. No Git conflict editor or live collaboration is required; freedom from all concurrent changes cannot be guaranteed. |\n| DEC-019 | Store media in Cloudflare R2; Git content references media URLs. | Q18 custom answer supersedes the earlier in-repository upload proposal. The accompanying request for environment-based upload credentials is superseded by runtime credentials in DEC-021; DEC-024 defines upload processing. |\n| DEC-020 | Blocks primarily own their styling. Expose optional global variables/settings such as dark/light mode; each block decides whether to follow them. | Q19 selected shared defaults with overrides and explicitly made adherence optional. A mandatory shared theme is not required. |\n\n## Round four — 2026-10-05\n\nAccepted from [round-four answers](../journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa.md); see the [interpretation](../journal/2026-10-05-round-four-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-021 | Supply R2 upload credentials in the editor at runtime, preserving the entirely static application. | Q20. This replaces the earlier request to provide upload secrets through build environment variables. Public bucket configuration may still use environment settings. No secret-holding upload helper is required. |\n| DEC-022 | Start with basic text, number, date, toggle, select, and media fields, with safe schema changes only. | Q21. Support additions and label/default edits; avoid destructive changes to populated fields. Nested models, relations, and migration tooling are outside the selected first-release scope. |\n| DEC-023 | Generate standard listing and entry pages automatically for collections created through the portal. | Q22. Entry bodies use the block editor. A portal template designer is not required initially. |\n| DEC-024 | Automatically produce a web-optimized image set from sufficiently large uploads, using resizing and light compression with simple methods. | Q23 selection and notes. This extends original-file media uploads with image processing; it does not request a Next.js image server or audio/video transcoding. Exact widths, encodings, quality, and limits are implementation choices. |\n| DEC-025 | Media URLs may be publicly accessible immediately after upload, before the referencing page is published. | Q24. Page publication remains governed by the Git draft/main workflow; private draft-media promotion is unnecessary. |\n","toc":[{"id":"round-two-2026-10-05","title":"Round two — 2026-10-05","depth":2},{"id":"round-three-2026-10-05","title":"Round three — 2026-10-05","depth":2},{"id":"round-four-2026-10-05","title":"Round four — 2026-10-05","depth":2}],"titleAnchor":"decisions","links":["journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","journal/2026-10-05-round-one-decisions","discussions/open-questions","journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","journal/2026-10-05-round-two-decisions","journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","journal/2026-10-05-round-three-decisions","journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","journal/2026-10-05-round-four-decisions"],"attachments":[],"html":"\u003cp>Accepted on 2026-10-05 from the original request and \u003ca href=\"#/journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02\">round-one answers\u003c/a>. See the \u003ca href=\"#/journal/2026-10-05-round-one-decisions\">interpretation journal\u003c/a> and \u003ca href=\"#/discussions/open-questions\">remaining questions\u003c/a>. These are intended requirements, not implemented features.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-001\u003c/td>\n\u003ctd>Keep the public website, static admin editor, blocks, and content records in one Git repository and deployment. Remove the always-running Payload CMS dependency.\u003c/td>\n\u003ctd>Original request: lightweight, durable ownership with Git as the source of content. Q18 later explicitly places media files in R2; see DEC-019.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-002\u003c/td>\n\u003ctd>Support GitHub first; require a user-supplied Git token for submissions. Provide editor entry using an environment-configured credential.\u003c/td>\n\u003ctd>Q1 custom answer. DEC-009–DEC-012 clarify access/deployment; DEC-016 sets token retention. No custom auth helper is required.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-003\u003c/td>\n\u003ctd>Design the first release for nontechnical clients and site owners.\u003c/td>\n\u003ctd>Q2: editor usability must cover people without a developer workflow.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-004\u003c/td>\n\u003ctd>Include pages, navigation, site settings, media, and blog posts or other repeatable content collections.\u003c/td>\n\u003ctd>Q3 selected the collections-inclusive scope. A general visual schema builder has not been requested.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-005\u003c/td>\n\u003ctd>Allow blocks from multiple frameworks subject to declared dependencies and compatible shared library versions.\u003c/td>\n\u003ctd>Original request and Q4: deduplicate compatible shared runtimes per page; different frameworks still have distinct runtimes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-006\u003c/td>\n\u003ctd>Reorder page sections and edit each block's defined fields and design controls, with a side drawer and live preview.\u003c/td>\n\u003ctd>Original request and Q5. Nested layout construction and arbitrary element positioning are outside the selected initial scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-007\u003c/td>\n\u003ctd>Save creates commits on an unpublished draft branch. Publish merges that draft branch into main and then deploys.\u003c/td>\n\u003ctd>Q6 custom answer: saving and going live are separate actions; publishing applies the branch's accumulated changes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-008\u003c/td>\n\u003ctd>Build a fresh core and entirely new starter blocks. Use astro-payload as reference only.\u003c/td>\n\u003ctd>Q7: no migration compatibility or block porting commitment.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-two-2026-10-05\">Round two — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2\">round-two answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-two-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-009\u003c/td>\n\u003ctd>The environment-configured login is a convenience gate; GitHub authorization protects repository access.\u003c/td>\n\u003ctd>Q8 explicitly accepts the static gate's limits. It must not be described as protection for private resources.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-010\u003c/td>\n\u003ctd>Support both private and public site repositories.\u003c/td>\n\u003ctd>Q9. Private draft reads require GitHub authorization; public repository drafts are public. Netlify hosting does not change repository visibility.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-011\u003c/td>\n\u003ctd>Each editor supplies their own GitHub token.\u003c/td>\n\u003ctd>Q10. DEC-016 sets token retention; no tokens belong in the deployed bundle or planning records.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-012\u003c/td>\n\u003ctd>Use a browser GitHub SDK client for repository changes. Publish merges to main; the user's existing Netlify Git integration owns deployment.\u003c/td>\n\u003ctd>Q11 custom answer. No builder-managed deployment service or Netlify API integration is requested. Schema authoring is subsequently defined in DEC-017 and DEC-022.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-013\u003c/td>\n\u003ctd>Posts and collection entries use the same block editor as pages, alongside structured metadata.\u003c/td>\n\u003ctd>Q12.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-014\u003c/td>\n\u003ctd>Every block must support immediate browser preview of unsaved changes.\u003c/td>\n\u003ctd>Q13. Shared rendering logic is preferred where feasible; preview/published parity must be verified during implementation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-015\u003c/td>\n\u003ctd>Developers install and register new block types in source, followed by a rebuild.\u003c/td>\n\u003ctd>Q14. Adding instances of existing blocks remains an editor action. No portal block marketplace is required.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-three-2026-10-05\">Round three — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59\">round-three answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-three-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-016\u003c/td>\n\u003ctd>Retain the editor's GitHub token for the browser tab's session, including reloads.\u003c/td>\n\u003ctd>Q15. Session retention is intended; persistent device-wide remembering was not selected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-017\u003c/td>\n\u003ctd>Support developer-defined schemas and allow users to create collections and edit collection fields in the portal.\u003c/td>\n\u003ctd>Q16 selects option 2 and notes “1 and 2.” Visual editing of block field definitions was not selected; DEC-022 narrows the collection editor.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-018\u003c/td>\n\u003ctd>Use shared drafts with stale-save protection and a simple recovery flow.\u003c/td>\n\u003ctd>Q17 accepts manual reapplication but stresses nontechnical users. Preserve unsaved work, prevent silent overwrites, and explain recovery in plain language. No Git conflict editor or live collaboration is required; freedom from all concurrent changes cannot be guaranteed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-019\u003c/td>\n\u003ctd>Store media in Cloudflare R2; Git content references media URLs.\u003c/td>\n\u003ctd>Q18 custom answer supersedes the earlier in-repository upload proposal. The accompanying request for environment-based upload credentials is superseded by runtime credentials in DEC-021; DEC-024 defines upload processing.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-020\u003c/td>\n\u003ctd>Blocks primarily own their styling. Expose optional global variables/settings such as dark/light mode; each block decides whether to follow them.\u003c/td>\n\u003ctd>Q19 selected shared defaults with overrides and explicitly made adherence optional. A mandatory shared theme is not required.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-four-2026-10-05\">Round four — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa\">round-four answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-four-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-021\u003c/td>\n\u003ctd>Supply R2 upload credentials in the editor at runtime, preserving the entirely static application.\u003c/td>\n\u003ctd>Q20. This replaces the earlier request to provide upload secrets through build environment variables. Public bucket configuration may still use environment settings. No secret-holding upload helper is required.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-022\u003c/td>\n\u003ctd>Start with basic text, number, date, toggle, select, and media fields, with safe schema changes only.\u003c/td>\n\u003ctd>Q21. Support additions and label/default edits; avoid destructive changes to populated fields. Nested models, relations, and migration tooling are outside the selected first-release scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-023\u003c/td>\n\u003ctd>Generate standard listing and entry pages automatically for collections created through the portal.\u003c/td>\n\u003ctd>Q22. Entry bodies use the block editor. A portal template designer is not required initially.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-024\u003c/td>\n\u003ctd>Automatically produce a web-optimized image set from sufficiently large uploads, using resizing and light compression with simple methods.\u003c/td>\n\u003ctd>Q23 selection and notes. This extends original-file media uploads with image processing; it does not request a Next.js image server or audio/video transcoding. Exact widths, encodings, quality, and limits are implementation choices.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-025\u003c/td>\n\u003ctd>Media URLs may be publicly accessible immediately after upload, before the referencing page is published.\u003c/td>\n\u003ctd>Q24. Page publication remains governed by the Git draft/main workflow; private draft-media promotion is unnecessary.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n","backlinks":["index","discussions/agreed-design","discussions/open-questions","journal/2026-10-05-round-four-decisions","journal/2026-10-05-round-one-decisions","journal/2026-10-05-round-three-decisions","journal/2026-10-05-round-two-decisions"]},{"id":"discussions/agreed-design","title":"Agreed design","section":"Discussions","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Agreed design\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Agreed design\n\nProduct scope established through four interview rounds. The [decision register](../decisions/index.md) preserves each choice and its source; this page consolidates the intended behavior. Nothing here is a claim of implemented or verified software.\n\n## Repository and deployment\n\nOne site repository contains the public site, static admin editor, registered block code, schemas, and content records. Media files live in Cloudflare R2 and are referenced by URL in Git. Both public and private GitHub repositories work. The user's existing Netlify integration builds and deploys main; the builder does not manage hosting infrastructure.\n\nThe application requires no always-running CMS or custom server-side service. The admin login is a convenience gate configured at build time. Repository operations use the editor's own GitHub token, retained for the tab session including reloads. Editors supply R2 credentials at runtime; upload secrets are not embedded in the public build.\n\n## Editing and publishing\n\nNontechnical owners edit pages and collection entries through a drawer over a live preview. They add, remove, customize, and reorder registered sections using each block's fields and design controls. Save commits content/schema changes to a shared draft branch through a GitHub SDK client. Publish merges accumulated drafts into main, after which Netlify deploys.\n\nStale-save protection prevents silent overwrites. Recovery preserves unsaved work and uses plain language. There is no requirement for live collaborative editing or a Git merge-conflict interface.\n\n## Blocks and styling\n\nBlocks are independently authored in React, Svelte, Vue, or vanilla HTML/CSS/JavaScript under a common registration contract. Each supplies an immediate browser preview and published rendering behavior. Developers add new block types in source and rebuild; users add instances through the editor.\n\nDeclare dependencies and require compatible versions so shared libraries load once per page. Different frameworks retain their distinct runtimes; arbitrary self-bundled incompatible libraries are not promised deduplication. Blocks primarily own their styling. Optional global variables such as light/dark mode provide shared signals, with adoption left to each block.\n\n## Collections\n\nSupport developer-defined schemas and portal creation/editing of collection definitions. Start with text, number, date, toggle, select, and media fields. Permit safe edits such as adding fields or changing labels/defaults; avoid destructive changes to populated fields.\n\nGenerate standard public listing and entry pages automatically. Entry bodies use the same block editor as pages. Nested schemas, relations, migration tooling, and a visual template designer are outside the selected initial scope.\n\n## Media\n\nUpload files to R2 and retain their metadata/URLs in content records. Media may be accessible by URL immediately, even before its page is published. Large enough image uploads generate a small set of resized, lightly compressed web variants using simple methods. Audio/video transcoding is not required.\n\n## Implementation direction — proposed\n\nUse browser-native image decoding, canvas resizing, and blob encoding before upload, with a small fixed set of widths and no upscaling. Record variant URLs and dimensions for responsive image markup. This avoids an image transformation service. Exact widths, encodings, limits, orientation/animation handling, and fallback behavior require implementation validation. Browser canvas supports destination resizing and export with encoding/quality settings: [drawImage](https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/drawImage), [toBlob](https://developer.mozilla.org/en-US/docs/Web/API/HTMLCanvasElement/toBlob).\n\nThe old astro-payload repository has separate renderer and Payload-schema registries in `sites/default/astro/src/blocks/blockRenderers.ts` and `blockSchemas.ts`. That registration concept is relevant reference material; the new core and starter blocks will be fresh, with no Payload dependency or migration commitment.\n\nNext, translate the accepted scope into the data model, block/preview contract, implementation plan, and observable acceptance criteria. Framework/library selection and starter-block coverage remain engineering choices to explain in that plan. Implementation has not been authorized by the interview answers alone.\n","toc":[{"id":"repository-and-deployment","title":"Repository and deployment","depth":2},{"id":"editing-and-publishing","title":"Editing and publishing","depth":2},{"id":"blocks-and-styling","title":"Blocks and styling","depth":2},{"id":"collections","title":"Collections","depth":2},{"id":"media","title":"Media","depth":2},{"id":"implementation-direction-proposed","title":"Implementation direction — proposed","depth":2}],"titleAnchor":"agreed-design","links":["decisions/index"],"attachments":[],"html":"\u003cp>Product scope established through four interview rounds. The \u003ca href=\"#/decisions/index\">decision register\u003c/a> preserves each choice and its source; this page consolidates the intended behavior. Nothing here is a claim of implemented or verified software.\u003c/p>\n\u003ch2 id=\"repository-and-deployment\">Repository and deployment\u003c/h2>\n\u003cp>One site repository contains the public site, static admin editor, registered block code, schemas, and content records. Media files live in Cloudflare R2 and are referenced by URL in Git. Both public and private GitHub repositories work. The user's existing Netlify integration builds and deploys main; the builder does not manage hosting infrastructure.\u003c/p>\n\u003cp>The application requires no always-running CMS or custom server-side service. The admin login is a convenience gate configured at build time. Repository operations use the editor's own GitHub token, retained for the tab session including reloads. Editors supply R2 credentials at runtime; upload secrets are not embedded in the public build.\u003c/p>\n\u003ch2 id=\"editing-and-publishing\">Editing and publishing\u003c/h2>\n\u003cp>Nontechnical owners edit pages and collection entries through a drawer over a live preview. They add, remove, customize, and reorder registered sections using each block's fields and design controls. Save commits content/schema changes to a shared draft branch through a GitHub SDK client. Publish merges accumulated drafts into main, after which Netlify deploys.\u003c/p>\n\u003cp>Stale-save protection prevents silent overwrites. Recovery preserves unsaved work and uses plain language. There is no requirement for live collaborative editing or a Git merge-conflict interface.\u003c/p>\n\u003ch2 id=\"blocks-and-styling\">Blocks and styling\u003c/h2>\n\u003cp>Blocks are independently authored in React, Svelte, Vue, or vanilla HTML/CSS/JavaScript under a common registration contract. Each supplies an immediate browser preview and published rendering behavior. Developers add new block types in source and rebuild; users add instances through the editor.\u003c/p>\n\u003cp>Declare dependencies and require compatible versions so shared libraries load once per page. Different frameworks retain their distinct runtimes; arbitrary self-bundled incompatible libraries are not promised deduplication. Blocks primarily own their styling. Optional global variables such as light/dark mode provide shared signals, with adoption left to each block.\u003c/p>\n\u003ch2 id=\"collections\">Collections\u003c/h2>\n\u003cp>Support developer-defined schemas and portal creation/editing of collection definitions. Start with text, number, date, toggle, select, and media fields. Permit safe edits such as adding fields or changing labels/defaults; avoid destructive changes to populated fields.\u003c/p>\n\u003cp>Generate standard public listing and entry pages automatically. Entry bodies use the same block editor as pages. Nested schemas, relations, migration tooling, and a visual template designer are outside the selected initial scope.\u003c/p>\n\u003ch2 id=\"media\">Media\u003c/h2>\n\u003cp>Upload files to R2 and retain their metadata/URLs in content records. Media may be accessible by URL immediately, even before its page is published. Large enough image uploads generate a small set of resized, lightly compressed web variants using simple methods. Audio/video transcoding is not required.\u003c/p>\n\u003ch2 id=\"implementation-direction-proposed\">Implementation direction — proposed\u003c/h2>\n\u003cp>Use browser-native image decoding, canvas resizing, and blob encoding before upload, with a small fixed set of widths and no upscaling. Record variant URLs and dimensions for responsive image markup. This avoids an image transformation service. Exact widths, encodings, limits, orientation/animation handling, and fallback behavior require implementation validation. Browser canvas supports destination resizing and export with encoding/quality settings: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/drawImage\" rel=\"noreferrer\">drawImage\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLCanvasElement/toBlob\" rel=\"noreferrer\">toBlob\u003c/a>.\u003c/p>\n\u003cp>The old astro-payload repository has separate renderer and Payload-schema registries in \u003ccode>sites/default/astro/src/blocks/blockRenderers.ts\u003c/code> and \u003ccode>blockSchemas.ts\u003c/code>. That registration concept is relevant reference material; the new core and starter blocks will be fresh, with no Payload dependency or migration commitment.\u003c/p>\n\u003cp>Next, translate the accepted scope into the data model, block/preview contract, implementation plan, and observable acceptance criteria. Framework/library selection and starter-block coverage remain engineering choices to explain in that plan. Implementation has not been authorized by the interview answers alone.\u003c/p>\n","backlinks":["index","discussions/open-questions","journal/2026-10-05-round-four-decisions"]},{"id":"discussions/open-questions","title":"Open questions","section":"Discussions","order":0,"metadata":{"status":"Product scope resolved"},"metadataHtml":"\u003cspan>Status: Product scope resolved\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Open questions\nupdated: 2026-10-05\nstatus: Product scope resolved\n---\n# Open questions\n\nThe four-round interview establishes the [agreed design](agreed-design.md). No further product-choice round is needed before preparing the implementation plan. Proposed technical details remain distinct from accepted requirements.\n\n## Resolved in round two\n\nQ8–Q14 are resolved by DEC-009 through DEC-015 in the [decision register](../decisions/index.md): convenience login, both repository visibilities, individual tokens, Netlify-managed deployment, shared page/post block editing, browser previews, and developer-installed blocks.\n\n## Resolved in round three\n\nQ15–Q17 and Q19 are resolved by DEC-016–DEC-018 and DEC-020: tab-session tokens, developer and portal collection schemas, simple shared drafts, and optional global styling. Q18 establishes R2 storage (DEC-019) but leaves upload authorization and media type scope open.\n\n## Resolved in round four\n\nQ20–Q24 are resolved by DEC-021–DEC-025 in the [decision register](../decisions/index.md).\n\n| Question | Outcome | Scope |\n| --- | --- | --- |\n| Q20 | Runtime editor-supplied R2 credentials | Keep the application static; no secret-holding upload helper. |\n| Q21 | Basic fields and safe schema changes | No nested models, relations, or migration tooling initially. |\n| Q22 | Automatic standard listing and entry pages | Existing block editor supplies entry bodies. |\n| Q23 | Simple image resizing and light compression | Generate web image sets for sufficiently large images; no audio/video transcoding. |\n| Q24 | Media URLs may be public before Publish | Page publication remains separate. |\n\n## Engineering work for the implementation plan\n\nDefine the content/schema file formats, block authoring and preview interfaces, dependency sharing, Git save/merge concurrency handling, schema compatibility validation, and upload metadata. Propose concrete starter blocks and validation scenarios. Choose image widths/encodings/limits and browser fallbacks, and document repository permissions and R2 CORS setup. These details require engineering decisions and verification, not more speculative interview questions.\n\nR2 credential retention was not separately selected; propose the same tab-session behavior as GitHub when specifying the editor session. Do not mistake that proposed default for an explicitly answered question. The optional future capabilities excluded above can be reconsidered if the user expands scope.\n\n## Research\n\nAstro documents that its Vite-provided environment values are statically replaced at build time and that public variables are available to client code. The inference for a fully static editor is that checking a configured credential in client code is a UI gate, not server-enforced authorization. [Environment variables](https://docs.astro.build/en/guides/environment-variables/).\n\nGitHub documents repository-scoped fine-grained tokens and branch merging through its API. Exact required permissions and branch protection compatibility must be validated in implementation. [Personal access tokens](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens), [branch API](https://docs.github.com/en/rest/branches/branches#merge-a-branch).\n\nGitHub Pages offers static hosting; private-repository availability depends on the account plan. This is a deployment option, not an accepted provider choice. [GitHub Pages](https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages).\n","toc":[{"id":"resolved-in-round-two","title":"Resolved in round two","depth":2},{"id":"resolved-in-round-three","title":"Resolved in round three","depth":2},{"id":"resolved-in-round-four","title":"Resolved in round four","depth":2},{"id":"engineering-work-for-the-implementation-plan","title":"Engineering work for the implementation plan","depth":2},{"id":"research","title":"Research","depth":2}],"titleAnchor":"open-questions","links":["discussions/agreed-design","decisions/index","decisions/index"],"attachments":[],"html":"\u003cp>The four-round interview establishes the \u003ca href=\"#/discussions/agreed-design\">agreed design\u003c/a>. No further product-choice round is needed before preparing the implementation plan. Proposed technical details remain distinct from accepted requirements.\u003c/p>\n\u003ch2 id=\"resolved-in-round-two\">Resolved in round two\u003c/h2>\n\u003cp>Q8–Q14 are resolved by DEC-009 through DEC-015 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>: convenience login, both repository visibilities, individual tokens, Netlify-managed deployment, shared page/post block editing, browser previews, and developer-installed blocks.\u003c/p>\n\u003ch2 id=\"resolved-in-round-three\">Resolved in round three\u003c/h2>\n\u003cp>Q15–Q17 and Q19 are resolved by DEC-016–DEC-018 and DEC-020: tab-session tokens, developer and portal collection schemas, simple shared drafts, and optional global styling. Q18 establishes R2 storage (DEC-019) but leaves upload authorization and media type scope open.\u003c/p>\n\u003ch2 id=\"resolved-in-round-four\">Resolved in round four\u003c/h2>\n\u003cp>Q20–Q24 are resolved by DEC-021–DEC-025 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Question\u003c/th>\n\u003cth>Outcome\u003c/th>\n\u003cth>Scope\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Q20\u003c/td>\n\u003ctd>Runtime editor-supplied R2 credentials\u003c/td>\n\u003ctd>Keep the application static; no secret-holding upload helper.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q21\u003c/td>\n\u003ctd>Basic fields and safe schema changes\u003c/td>\n\u003ctd>No nested models, relations, or migration tooling initially.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q22\u003c/td>\n\u003ctd>Automatic standard listing and entry pages\u003c/td>\n\u003ctd>Existing block editor supplies entry bodies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q23\u003c/td>\n\u003ctd>Simple image resizing and light compression\u003c/td>\n\u003ctd>Generate web image sets for sufficiently large images; no audio/video transcoding.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q24\u003c/td>\n\u003ctd>Media URLs may be public before Publish\u003c/td>\n\u003ctd>Page publication remains separate.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"engineering-work-for-the-implementation-plan\">Engineering work for the implementation plan\u003c/h2>\n\u003cp>Define the content/schema file formats, block authoring and preview interfaces, dependency sharing, Git save/merge concurrency handling, schema compatibility validation, and upload metadata. Propose concrete starter blocks and validation scenarios. Choose image widths/encodings/limits and browser fallbacks, and document repository permissions and R2 CORS setup. These details require engineering decisions and verification, not more speculative interview questions.\u003c/p>\n\u003cp>R2 credential retention was not separately selected; propose the same tab-session behavior as GitHub when specifying the editor session. Do not mistake that proposed default for an explicitly answered question. The optional future capabilities excluded above can be reconsidered if the user expands scope.\u003c/p>\n\u003ch2 id=\"research\">Research\u003c/h2>\n\u003cp>Astro documents that its Vite-provided environment values are statically replaced at build time and that public variables are available to client code. The inference for a fully static editor is that checking a configured credential in client code is a UI gate, not server-enforced authorization. \u003ca href=\"https://docs.astro.build/en/guides/environment-variables/\" rel=\"noreferrer\">Environment variables\u003c/a>.\u003c/p>\n\u003cp>GitHub documents repository-scoped fine-grained tokens and branch merging through its API. Exact required permissions and branch protection compatibility must be validated in implementation. \u003ca href=\"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens\" rel=\"noreferrer\">Personal access tokens\u003c/a>, \u003ca href=\"https://docs.github.com/en/rest/branches/branches#merge-a-branch\" rel=\"noreferrer\">branch API\u003c/a>.\u003c/p>\n\u003cp>GitHub Pages offers static hosting; private-repository availability depends on the account plan. This is a deployment option, not an accepted provider choice. \u003ca href=\"https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages\" rel=\"noreferrer\">GitHub Pages\u003c/a>.\u003c/p>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-one-decisions","journal/2026-10-05-round-three-decisions","journal/2026-10-05-round-two-decisions"]},{"id":"journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-04\u003c/span>","updated":"2026-10-04","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-04\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `528c4b19-f488-4209-ab5c-b9c13f420f02`\n\n## Question 1\n\n```text\nRound: lean-sitebuilder\nQuestion: What does ‘all while being a static website’ permit?\nContext: Both the public site and editor can be static. Git writes still need authorization, and redeployment needs a build runner. GitHub’s standard web OAuth token exchange requires a client secret, which cannot safely live in the static bundle.\nRecommendation: A small on-demand auth/Git helper plus build jobs avoids an always-running CMS and supports a smoother login.\nOptions: Allow a small serverless auth/Git helper plus build jobs / No custom server-side code; accept a user-supplied Git token or compatible external auth service, plus build jobs\nSelected: Something else\nNotes: allow user access to the admin portal via a environmentvariable-set credential. then when \"submitting\",  a user-supplied git token is required. just github compatibility is fine for now\n```\n\n## Question 2\n\n```text\nRound: lean-sitebuilder\nQuestion: Who must be comfortable using the editor in the first version?\nContext: This shapes login, media uploads, and publishing feedback.\nRecommendation: Design for nontechnical site owners if you intend to hand sites to clients.\nOptions: Nontechnical clients and site owners / Me and developers who are comfortable with GitHub / Both developers and nontechnical clients from day one\nSelected: Nontechnical clients and site owners\nNotes: \n```\n\n## Question 3\n\n```text\nRound: lean-sitebuilder\nQuestion: How much CMS functionality belongs in the first version?\nContext: Posts and other structured collections add a separate content-modeling problem.\nRecommendation: Start with pages, navigation, site settings, and media to keep the first release focused.\nOptions: Pages, navigation, site settings, and media / Also include blog posts or other repeatable content collections / A general collection/schema builder comparable to Payload\nSelected: Also include blog posts or other repeatable content collections\nNotes: \n```\n\n## Question 4\n\n```text\nRound: lean-sitebuilder\nQuestion: Can block authors be required to follow a shared dependency contract?\nContext: React, Svelte, Vue, and vanilla blocks can coexist. Loading one shared runtime per framework requires compatible versions and declared dependencies; arbitrary self-bundled blocks cannot guarantee deduplication.\nRecommendation: Require declared dependencies and compatible shared versions so blocks can share libraries reliably.\nOptions: Require declared dependencies and compatible shared versions / Accept arbitrary bundles, even when libraries must be duplicated / Support only one interactive framework initially\nSelected: Require declared dependencies and compatible shared versions\nNotes: \n```\n\n## Question 5\n\n```text\nRound: lean-sitebuilder\nQuestion: How much layout freedom should the editor offer initially?\nContext: All options include the side drawer and live preview. The difference is what can be rearranged and styled.\nRecommendation: Start with ordered sections, schema-defined fields, repeatable items, and block-specific design controls to keep blocks predictable.\nOptions: Reorder sections and edit each block’s defined fields and design controls / Also support nested containers, columns, and blocks within blocks / Full Elementor-style positioning and responsive styling of individual elements\nSelected: Reorder sections and edit each block’s defined fields and design controls\nNotes: \n```\n\n## Question 6\n\n```text\nRound: lean-sitebuilder\nQuestion: Should Save publish after a rebuild, or should saving and publishing be separate?\nContext: Unsaved edits appear in the live preview first. This determines when they reach Git and become public.\nRecommendation: Explicit Save → Git commit → automatic rebuild matches your original description.\nOptions: Explicit Save commits and automatically redeploys / Save creates a draft; Publish separately triggers deployment / Autosave changes to Git and continuously redeploy\nSelected: Something else\nNotes: save produces commits, which are pushed to a branch with draft \"unpublished\" content. when another \"publish\" action is clicked, whatever is in the unpublished draft is merged to main branch, and then deployed\n```\n\n## Question 7\n\n```text\nRound: lean-sitebuilder\nQuestion: What should lean-sitebuilder inherit from astro-payload?\nContext: Migrating all existing sites would substantially expand the first release.\nRecommendation: Build a fresh core and port a few representative existing blocks to prove the new block contract.\nOptions: Fresh core with a few existing blocks ported / Fresh core and entirely new starter blocks; old project is reference only / Migration compatibility for existing astro-payload sites and content\nSelected: Fresh core and entirely new starter blocks; old project is reference only\nNotes: \n```\n","toc":[{"id":"question-1","title":"Question 1","depth":2},{"id":"question-2","title":"Question 2","depth":2},{"id":"question-3","title":"Question 3","depth":2},{"id":"question-4","title":"Question 4","depth":2},{"id":"question-5","title":"Question 5","depth":2},{"id":"question-6","title":"Question 6","depth":2},{"id":"question-7","title":"Question 7","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>528c4b19-f488-4209-ab5c-b9c13f420f02\u003c/code>\u003c/p>\n\u003ch2 id=\"question-1\">Question 1\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: What does ‘all while being a static website’ permit?\nContext: Both the public site and editor can be static. Git writes still need authorization, and redeployment needs a build runner. GitHub’s standard web OAuth token exchange requires a client secret, which cannot safely live in the static bundle.\nRecommendation: A small on-demand auth/Git helper plus build jobs avoids an always-running CMS and supports a smoother login.\nOptions: Allow a small serverless auth/Git helper plus build jobs / No custom server-side code; accept a user-supplied Git token or compatible external auth service, plus build jobs\nSelected: Something else\nNotes: allow user access to the admin portal via a environmentvariable-set credential. then when \"submitting\",  a user-supplied git token is required. just github compatibility is fine for now\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-2\">Question 2\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: Who must be comfortable using the editor in the first version?\nContext: This shapes login, media uploads, and publishing feedback.\nRecommendation: Design for nontechnical site owners if you intend to hand sites to clients.\nOptions: Nontechnical clients and site owners / Me and developers who are comfortable with GitHub / Both developers and nontechnical clients from day one\nSelected: Nontechnical clients and site owners\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-3\">Question 3\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: How much CMS functionality belongs in the first version?\nContext: Posts and other structured collections add a separate content-modeling problem.\nRecommendation: Start with pages, navigation, site settings, and media to keep the first release focused.\nOptions: Pages, navigation, site settings, and media / Also include blog posts or other repeatable content collections / A general collection/schema builder comparable to Payload\nSelected: Also include blog posts or other repeatable content collections\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-4\">Question 4\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: Can block authors be required to follow a shared dependency contract?\nContext: React, Svelte, Vue, and vanilla blocks can coexist. Loading one shared runtime per framework requires compatible versions and declared dependencies; arbitrary self-bundled blocks cannot guarantee deduplication.\nRecommendation: Require declared dependencies and compatible shared versions so blocks can share libraries reliably.\nOptions: Require declared dependencies and compatible shared versions / Accept arbitrary bundles, even when libraries must be duplicated / Support only one interactive framework initially\nSelected: Require declared dependencies and compatible shared versions\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-5\">Question 5\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: How much layout freedom should the editor offer initially?\nContext: All options include the side drawer and live preview. The difference is what can be rearranged and styled.\nRecommendation: Start with ordered sections, schema-defined fields, repeatable items, and block-specific design controls to keep blocks predictable.\nOptions: Reorder sections and edit each block’s defined fields and design controls / Also support nested containers, columns, and blocks within blocks / Full Elementor-style positioning and responsive styling of individual elements\nSelected: Reorder sections and edit each block’s defined fields and design controls\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-6\">Question 6\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: Should Save publish after a rebuild, or should saving and publishing be separate?\nContext: Unsaved edits appear in the live preview first. This determines when they reach Git and become public.\nRecommendation: Explicit Save → Git commit → automatic rebuild matches your original description.\nOptions: Explicit Save commits and automatically redeploys / Save creates a draft; Publish separately triggers deployment / Autosave changes to Git and continuously redeploy\nSelected: Something else\nNotes: save produces commits, which are pushed to a branch with draft \"unpublished\" content. when another \"publish\" action is clicked, whatever is in the unpublished draft is merged to main branch, and then deployed\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-7\">Question 7\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: What should lean-sitebuilder inherit from astro-payload?\nContext: Migrating all existing sites would substantially expand the first release.\nRecommendation: Build a fresh core and port a few representative existing blocks to prove the new block contract.\nOptions: Fresh core with a few existing blocks ported / Fresh core and entirely new starter blocks; old project is reference only / Migration compatibility for existing astro-payload sites and content\nSelected: Fresh core and entirely new starter blocks; old project is reference only\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-one-decisions"]},{"id":"journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `1a1e4868-048d-45f3-a291-5f8b6c42aae2`\n\n## Question 8\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: What should the admin login protect?\nContext: A password checked entirely in a static page can be bypassed. An environment variable does not change that. GitHub can still enforce access to the repository through the supplied token.\nRecommendation: Use the configured password as a convenience gate, with GitHub enforcing repository access. This keeps the editor entirely static.\nOptions: A convenience gate is enough; GitHub controls repository access / The admin page itself must be protected by hosting-provider access control\nSelected: A convenience gate is enough; GitHub controls repository access\nNotes: \n```\n\n## Question 9\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: What repository visibility must a deployed site support?\nContext: This refers to each site's repository. Public repositories expose source and draft branches. Private repositories also need authorization to read draft content, before saving anything.\nRecommendation: Start with private site repositories so unpublished content stays private.\nOptions: Private repositories only / Public repositories only; drafts may be visible / Both private and public repositories\nSelected: Both private and public repositories\nNotes: i usually deploy to netlify, which supports deployment on private repo branch pushes. i think theres no need to worry about this.\n```\n\n## Question 10\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Who should provide the GitHub token used by an editor?\nContext: This determines whether clients need their own GitHub account and who can revoke access. Do not enter an actual token here.\nRecommendation: Each editor uses their own GitHub account and token, so access can be revoked individually. The exact token setup must support their repository role.\nOptions: Each editor provides their own GitHub token / The site owner supplies a token for editors to use / Only a technical owner uses the token to save and publish\nSelected: Each editor provides their own GitHub token\nNotes: \n```\n\n## Question 11\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Which deployment setup should we support first?\nContext: Publishing merges drafts into main; a build must then deploy the static output. GitHub Pages hosting from a private repository requires an eligible account plan.\nRecommendation: Provide GitHub Actions and GitHub Pages as the reference setup, while keeping the output portable to other static hosts.\nOptions: GitHub Actions builds and deploys to GitHub Pages / An existing Git-connected host deploys main; name it in Notes / Provide build output only; the owner configures deployment\nSelected: (notes only)\nNotes: the site builder pushes content and schema changes to github with a SDK client. publish merges to main. when main is pushed, my netlify deployment will detect that and deploy it on its own, which you dont need to worry much about\n```\n\n## Question 12\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: How should users write the body of a blog post or collection entry?\nContext: Entries will also have structured metadata such as title and date.\nRecommendation: Reuse the block editor for entry bodies to keep one consistent editing experience.\nOptions: Use the same block editor as pages / Use a rich-text editor for entry bodies / Let each collection choose blocks or rich text\nSelected: Use the same block editor as pages\nNotes: \n```\n\n## Question 13\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Can we require block authors to provide a browser-compatible preview?\nContext: The editor must render unsaved changes immediately. A block that can only render during a build cannot do this without a separate preview implementation.\nRecommendation: Require a browser preview for every block, sharing rendering logic with the published version where possible.\nOptions: Yes; every block must support immediate browser preview / Allow build-only blocks with a placeholder while editing\nSelected: Yes; every block must support immediate browser preview\nNotes: \n```\n\n## Question 14\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: How should new block types become available in the editor?\nContext: This concerns installing a new block type, not adding another instance of an already-installed block to a page.\nRecommendation: A developer adds and registers block code, then rebuilds. This lets the build compile frameworks and share compatible dependencies.\nOptions: Developer installs and registers blocks in the repo, then rebuilds / Editors must be able to install new block types through the portal\nSelected: Developer installs and registers blocks in the repo, then rebuilds\nNotes: \n```\n","toc":[{"id":"question-8","title":"Question 8","depth":2},{"id":"question-9","title":"Question 9","depth":2},{"id":"question-10","title":"Question 10","depth":2},{"id":"question-11","title":"Question 11","depth":2},{"id":"question-12","title":"Question 12","depth":2},{"id":"question-13","title":"Question 13","depth":2},{"id":"question-14","title":"Question 14","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>1a1e4868-048d-45f3-a291-5f8b6c42aae2\u003c/code>\u003c/p>\n\u003ch2 id=\"question-8\">Question 8\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: What should the admin login protect?\nContext: A password checked entirely in a static page can be bypassed. An environment variable does not change that. GitHub can still enforce access to the repository through the supplied token.\nRecommendation: Use the configured password as a convenience gate, with GitHub enforcing repository access. This keeps the editor entirely static.\nOptions: A convenience gate is enough; GitHub controls repository access / The admin page itself must be protected by hosting-provider access control\nSelected: A convenience gate is enough; GitHub controls repository access\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-9\">Question 9\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: What repository visibility must a deployed site support?\nContext: This refers to each site's repository. Public repositories expose source and draft branches. Private repositories also need authorization to read draft content, before saving anything.\nRecommendation: Start with private site repositories so unpublished content stays private.\nOptions: Private repositories only / Public repositories only; drafts may be visible / Both private and public repositories\nSelected: Both private and public repositories\nNotes: i usually deploy to netlify, which supports deployment on private repo branch pushes. i think theres no need to worry about this.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-10\">Question 10\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: Who should provide the GitHub token used by an editor?\nContext: This determines whether clients need their own GitHub account and who can revoke access. Do not enter an actual token here.\nRecommendation: Each editor uses their own GitHub account and token, so access can be revoked individually. The exact token setup must support their repository role.\nOptions: Each editor provides their own GitHub token / The site owner supplies a token for editors to use / Only a technical owner uses the token to save and publish\nSelected: Each editor provides their own GitHub token\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-11\">Question 11\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: Which deployment setup should we support first?\nContext: Publishing merges drafts into main; a build must then deploy the static output. GitHub Pages hosting from a private repository requires an eligible account plan.\nRecommendation: Provide GitHub Actions and GitHub Pages as the reference setup, while keeping the output portable to other static hosts.\nOptions: GitHub Actions builds and deploys to GitHub Pages / An existing Git-connected host deploys main; name it in Notes / Provide build output only; the owner configures deployment\nSelected: (notes only)\nNotes: the site builder pushes content and schema changes to github with a SDK client. publish merges to main. when main is pushed, my netlify deployment will detect that and deploy it on its own, which you dont need to worry much about\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-12\">Question 12\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: How should users write the body of a blog post or collection entry?\nContext: Entries will also have structured metadata such as title and date.\nRecommendation: Reuse the block editor for entry bodies to keep one consistent editing experience.\nOptions: Use the same block editor as pages / Use a rich-text editor for entry bodies / Let each collection choose blocks or rich text\nSelected: Use the same block editor as pages\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-13\">Question 13\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: Can we require block authors to provide a browser-compatible preview?\nContext: The editor must render unsaved changes immediately. A block that can only render during a build cannot do this without a separate preview implementation.\nRecommendation: Require a browser preview for every block, sharing rendering logic with the published version where possible.\nOptions: Yes; every block must support immediate browser preview / Allow build-only blocks with a placeholder while editing\nSelected: Yes; every block must support immediate browser preview\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-14\">Question 14\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: How should new block types become available in the editor?\nContext: This concerns installing a new block type, not adding another instance of an already-installed block to a page.\nRecommendation: A developer adds and registers block code, then rebuilds. This lets the build compile frameworks and share compatible dependencies.\nOptions: Developer installs and registers blocks in the repo, then rebuilds / Editors must be able to install new block types through the portal\nSelected: Developer installs and registers blocks in the repo, then rebuilds\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-two-decisions"]},{"id":"journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `c9c27420-78c7-4c08-ac09-edd5289ddf59`\n\n## Question 15\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How long should the editor remember your GitHub token?\nContext: Private repository drafts need the token when loading, as well as saving. Browser storage makes repeat visits easier but retains a credential on that device.\nRecommendation: Keep it in memory while the editor is open; ask again after a reload. This avoids storing the token on disk through the app.\nOptions: In memory only; enter it again after reloading / Keep it for the browser tab's session, including reloads / Remember it on this device until I sign out\nSelected: Keep it for the browser tab's session, including reloads\nNotes: \n```\n\n## Question 16\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: When you say the portal saves schema changes, what should users be able to change?\nContext: A schema defines fields such as a post's title, date, and category. Editing those definitions is different from editing a post's values. New block rendering code is still installed by a developer, as agreed.\nRecommendation: Start with developer-defined schemas and let the portal edit their content. Add a visual schema editor only if users need to create their own content models.\nOptions: Developers define schemas; the portal edits content values only / Users can create collections and change their fields in the portal / Users can edit collection schemas and existing blocks' field definitions in the portal\nSelected: Users can create collections and change their fields in the portal\nNotes: 1 and 2\n```\n\n## Question 17\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How much simultaneous editing should the first release support?\nContext: Everyone's saved drafts accumulate before Publish. If another edit has changed the same content, an older save must not silently overwrite it.\nRecommendation: Use one shared draft branch with stale-save protection. Preserve local edits and ask the editor to refresh and reapply conflicting changes; add richer collaboration later.\nOptions: Shared drafts with stale-save protection; manual reapplication is acceptable / Parallel editing with an in-app interface to compare and resolve conflicts / Live collaborative editing, with other people's changes appearing immediately\nSelected: Shared drafts with stale-save protection; manual reapplication is acceptable\nNotes: keep it lean and simple to understand. we dont want conflicts, or any problems that a layman non-technical person might not understand.\n```\n\n## Question 18\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: Which media should users be able to upload in the first release?\nContext: Uploaded files will be committed to the same repository. Supporting large audio or video files substantially increases repository size and upload work.\nRecommendation: Support images and downloadable documents first, with validation and size limits.\nOptions: Images only / Images and downloadable documents / Also upload audio and video files\nSelected: Something else\nNotes: i'm planning to use cloudflare R2 for media. accept cloudflare r2 tokens in env vars. and the github-saved content just points to media hosted in the r2 bucket.\n```\n\n## Question 19\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How should site-wide styling work alongside each block's own design?\nContext: You want independently designed blocks. Shared colors, fonts, and spacing can still make a site consistent without removing block-specific controls.\nRecommendation: Provide site-wide defaults that blocks can inherit, with each block exposing its own overrides and keeping its CSS scoped.\nOptions: Shared site defaults with block-specific overrides / Every block manages its own styling independently / All blocks must follow a single site-wide theme\nSelected: Shared site defaults with block-specific overrides\nNotes: there are site-wide switches, yes, like dark/light mode and other more general styles and settings. but mostly, each block will manage its own styling independently. the site-wide switches are just global variables which the blocks may or may not listen or adhere to.\n```\n","toc":[{"id":"question-15","title":"Question 15","depth":2},{"id":"question-16","title":"Question 16","depth":2},{"id":"question-17","title":"Question 17","depth":2},{"id":"question-18","title":"Question 18","depth":2},{"id":"question-19","title":"Question 19","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>c9c27420-78c7-4c08-ac09-edd5289ddf59\u003c/code>\u003c/p>\n\u003ch2 id=\"question-15\">Question 15\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: How long should the editor remember your GitHub token?\nContext: Private repository drafts need the token when loading, as well as saving. Browser storage makes repeat visits easier but retains a credential on that device.\nRecommendation: Keep it in memory while the editor is open; ask again after a reload. This avoids storing the token on disk through the app.\nOptions: In memory only; enter it again after reloading / Keep it for the browser tab's session, including reloads / Remember it on this device until I sign out\nSelected: Keep it for the browser tab's session, including reloads\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-16\">Question 16\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: When you say the portal saves schema changes, what should users be able to change?\nContext: A schema defines fields such as a post's title, date, and category. Editing those definitions is different from editing a post's values. New block rendering code is still installed by a developer, as agreed.\nRecommendation: Start with developer-defined schemas and let the portal edit their content. Add a visual schema editor only if users need to create their own content models.\nOptions: Developers define schemas; the portal edits content values only / Users can create collections and change their fields in the portal / Users can edit collection schemas and existing blocks' field definitions in the portal\nSelected: Users can create collections and change their fields in the portal\nNotes: 1 and 2\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-17\">Question 17\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: How much simultaneous editing should the first release support?\nContext: Everyone's saved drafts accumulate before Publish. If another edit has changed the same content, an older save must not silently overwrite it.\nRecommendation: Use one shared draft branch with stale-save protection. Preserve local edits and ask the editor to refresh and reapply conflicting changes; add richer collaboration later.\nOptions: Shared drafts with stale-save protection; manual reapplication is acceptable / Parallel editing with an in-app interface to compare and resolve conflicts / Live collaborative editing, with other people's changes appearing immediately\nSelected: Shared drafts with stale-save protection; manual reapplication is acceptable\nNotes: keep it lean and simple to understand. we dont want conflicts, or any problems that a layman non-technical person might not understand.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-18\">Question 18\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: Which media should users be able to upload in the first release?\nContext: Uploaded files will be committed to the same repository. Supporting large audio or video files substantially increases repository size and upload work.\nRecommendation: Support images and downloadable documents first, with validation and size limits.\nOptions: Images only / Images and downloadable documents / Also upload audio and video files\nSelected: Something else\nNotes: i'm planning to use cloudflare R2 for media. accept cloudflare r2 tokens in env vars. and the github-saved content just points to media hosted in the r2 bucket.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-19\">Question 19\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: How should site-wide styling work alongside each block's own design?\nContext: You want independently designed blocks. Shared colors, fonts, and spacing can still make a site consistent without removing block-specific controls.\nRecommendation: Provide site-wide defaults that blocks can inherit, with each block exposing its own overrides and keeping its CSS scoped.\nOptions: Shared site defaults with block-specific overrides / Every block manages its own styling independently / All blocks must follow a single site-wide theme\nSelected: Shared site defaults with block-specific overrides\nNotes: there are site-wide switches, yes, like dark/light mode and other more general styles and settings. but mostly, each block will manage its own styling independently. the site-wide switches are just global variables which the blocks may or may not listen or adhere to.\n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-three-decisions"]},{"id":"journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `eb7e62a0-bf4d-4474-a805-bc47c92b41aa`\n\n## Question 20\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How should the editor get permission to upload media to R2?\nContext: The bucket address can come from environment variables. But if a build embeds R2 write credentials in the static site, visitors can extract them despite the login gate. Keeping environment credentials secret requires a separate service to authorize uploads.\nRecommendation: To preserve the entirely static app, let the editor supply bucket-scoped R2 credentials at runtime and retain them for the tab session, like the GitHub token.\nOptions: Supply R2 credentials in the editor; keep the app entirely static / Allow a small authenticated serverless upload helper that keeps R2 credentials in server-side environment variables / Upload media outside the editor and paste its URL; no upload credentials in the app\nSelected: Supply R2 credentials in the editor; keep the app entirely static\nNotes: \n```\n\n## Question 21\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How much should the first collection schema editor support?\nContext: You chose both developer-defined schemas and collections created through the portal. This question sets the portal's initial field-editing scope; entry bodies still use blocks.\nRecommendation: Start with basic fields and safe changes: add fields, edit labels/defaults, and avoid destructive changes to populated fields. This keeps existing content usable without a migration interface.\nOptions: Basic text, number, date, toggle, select, and media fields; safe changes only / Also support nested/repeating fields and links between collections / Also support changing populated field types and migrating existing content\nSelected: Basic text, number, date, toggle, select, and media fields; safe changes only\nNotes: \n```\n\n## Question 22\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How should a collection created in the portal appear on the public site?\nContext: For example, a new Recipes collection needs a listing and individual recipe URLs, unless it is only used as data inside other pages.\nRecommendation: Generate a standard listing and entry page layout for each collection. Entry bodies use the existing block editor; developers can later add custom templates.\nOptions: Generate standard listing and entry pages automatically / Let users design reusable listing and entry templates with blocks in the portal / Create data only; developers or existing page blocks decide where it appears\nSelected: Generate standard listing and entry pages automatically\nNotes: \n```\n\n## Question 23\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: Should the media uploader just store files, or also process them?\nContext: R2 stores files. Image resizing and video transcoding would be additional behavior, with extra processing and failure cases.\nRecommendation: Start with original-file uploads for common images, documents, audio, and video, with configurable size/type limits. Add processing separately when needed.\nOptions: Upload original files only / Also resize and compress images automatically / Also process video/audio for playback\nSelected: Also resize and compress images automatically\nNotes: uploading a large enough image would generate an image set that is optimized for web, light compression would be applied as well. somewhat like how next.js's Image component does optimization. but only do the simplest and leanest way here, don't overengineer, only apply simpler methods.\n```\n\n## Question 24\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: May uploaded media be accessible at its direct URL before Publish?\nContext: In a public R2 asset bucket, someone with an uploaded file's URL can access it even while the page referencing it is still a draft. The draft page itself does not become published.\nRecommendation: Allow public media URLs immediately for a simpler static workflow. Choose private drafts only if unpublished media must be confidential.\nOptions: Yes; media URLs may work immediately, while pages remain drafts / No; media must remain private until the content is published\nSelected: Yes; media URLs may work immediately, while pages remain drafts\nNotes: \n```\n","toc":[{"id":"question-20","title":"Question 20","depth":2},{"id":"question-21","title":"Question 21","depth":2},{"id":"question-22","title":"Question 22","depth":2},{"id":"question-23","title":"Question 23","depth":2},{"id":"question-24","title":"Question 24","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>eb7e62a0-bf4d-4474-a805-bc47c92b41aa\u003c/code>\u003c/p>\n\u003ch2 id=\"question-20\">Question 20\u003c/h2>\n\u003cpre>\u003ccode c
