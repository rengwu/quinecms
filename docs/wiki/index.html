/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fd9c855ec4038e9077857a1976984390ad4b794e6d5db7cff4aac059a5fe65a6\">Final checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema/field browser layout\u003c/td>\n\u003ctd>Dedicated screens fit the drawer and show only relevant controls\u003c/td>\n\u003ctd>Browser review interrupted by active user interaction; automated behavior passed but final visual inspection was not completed\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1054Z-admin-hierarchy/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a9b7da5d771eb5647e229dcd7f2054895b7475786191a8d41cbb474a095e9b05\">Interruption and cleanup\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Required verification\u003c/td>\n\u003ctd>Types, tests, static build and asset checks pass\u003c/td>\n\u003ctd>Zero diagnostics; 61 tests in 12 files passed; five static routes and runtime sharing checks passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1054Z-admin-hierarchy/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: fd9c855ec4038e9077857a1976984390ad4b794e6d5db7cff4aac059a5fe65a6\">Final checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>Overall Untested reflects the incomplete schema-screen browser inspection, not an observed application failure. Production output was built and artifact-checked without a separate production browser run. Live GitHub/R2/Netlify operations and unrelated editor flows were outside scope.\u003c/p>\n\u003cp>No server was started or stopped. The owned browser tab became actively used; its content was preserved and the tab was left open, including the local verification title edit. No repository content files or remote providers were changed by UI testing. A follow-up browser inspection should use a fresh isolated window when it can be operated without interfering with the user.\u003c/p>\n","backlinks":["index","decisions/index","discussions/admin-hierarchy-proposal","discussions/open-questions","features/editor","journal/2026-10-05-admin-hierarchy-implementation"]},{"id":"verification/runs/2026-10-05T1108Z-editor-layout","title":"Editor layout consistency","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Editor layout consistency\nupdated: 2026-10-05\nresult: Passed\n---\n# Editor layout consistency\n\n## Scope\n\n[FEAT-editor](../../features/editor.md), DEC-055: shared spacing and action hierarchy for sidebar forms, custom widgets, media, site navigation, schema fields and dialogs. The [layout contract and research](../../journal/2026-10-05-editor-layout.md) define the expected arrangement.\n\n## Build and environment\n\nDirty implementation on `f6993528410bebeae1dafd70d52f57c1cc3e34d4`; [source manifest](../../evidence/2026-10-05T1108Z-editor-layout/source-manifest.json). macOS, Node 22.19.0, pnpm 10.34.1. Native Safari in a fresh window against the existing development server at `http://127.0.0.1:4321/admin/`. No independent verifier.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Block Design | Labels above aligned controls; actions separated below fields | Accent and Spacing occupied the same full-width column as other fields; Cancel/Remove followed a divider. Cancel restored the original block and disabled Save draft | Passed | [Browser observations](../../evidence/2026-10-05T1108Z-editor-layout/browser-observations.txt) |\n| Media | Clear primary upload action; settings and help spaced separately | Storage settings appeared beside the heading; primary Upload file and helper below did not collide | Passed | [Browser observations](../../evidence/2026-10-05T1108Z-editor-layout/browser-observations.txt) |\n| Navigation and utility sections | Related link fields grouped; adding distinct from rows; backups/session separated | Three bordered link groups showed labels and destination controls with removal at the right. Add link appeared in the header. Backups and Session had their own headings and separated action rows | Passed | [Browser observations](../../evidence/2026-10-05T1108Z-editor-layout/browser-observations.txt) |\n| Connection dialog | Consistent field widths/gaps; close/connect grouped at bottom right | Aligned labeled fields, supporting actions above, and Close/Connect together at bottom right; no credentials entered | Passed | [Browser observations](../../evidence/2026-10-05T1108Z-editor-layout/browser-observations.txt) |\n| Schema field screen | Immediate-parent back link; readable form and separated removal | Home → Collection schemas → Journal → Title showed only field controls, a Journal schema back link and a separated disabled Remove field action. No global menu or entry controls remained in the drawer | Passed | [Browser observations](../../evidence/2026-10-05T1108Z-editor-layout/browser-observations.txt) |\n| Required verification | Types, regression tests, static output and asset checks pass | Zero diagnostics; all 61 tests in 12 files passed; five static routes built; shared runtime and public-style isolation checks passed | Passed | [Verification log](../../evidence/2026-10-05T1108Z-editor-layout/verify.log) |\n\n## Limits and cleanup\n\nPassed applies to the listed checks. The browser run used development output at desktop width; production output was built and artifact-checked without a separate production-browser run. Storage and confirmation dialogs share the checked layout but were not separately inspected in this run. Live GitHub/R2/Netlify operations, password entry and a full responsive/accessibility audit were outside scope.\n\nThe temporary Design edit was cancelled. Save draft was disabled before closing the owned test window. The pre-existing user window and development server were preserved; no content files or remote providers were modified by browser testing. The schema-field visual observation closes the prior run's outstanding visual check without rewriting that historical report.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-cleanup","title":"Limits and cleanup","depth":2}],"titleAnchor":"editor-layout-consistency","links":["features/editor","journal/2026-10-05-editor-layout"],"attachments":[{"path":"evidence/2026-10-05T1108Z-editor-layout/source-manifest.json","sha256":"ba9af40a830bad2c9066f22210d4d190e083d00ddb2f1f355f386edc444a1703"},{"path":"evidence/2026-10-05T1108Z-editor-layout/browser-observations.txt","sha256":"64564195cb8501c880dc1574f0c3a4daf605522cf4ceed5e79e85a4695cc0149"},{"path":"evidence/2026-10-05T1108Z-editor-layout/verify.log","sha256":"8705eb97f820146209462e83378a5fc29b9f882ad53814eb23c0dc6b6a90fec7"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a>, DEC-055: shared spacing and action hierarchy for sidebar forms, custom widgets, media, site navigation, schema fields and dialogs. The \u003ca href=\"#/journal/2026-10-05-editor-layout\">layout contract and research\u003c/a> define the expected arrangement.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Dirty implementation on \u003ccode>f6993528410bebeae1dafd70d52f57c1cc3e34d4\u003c/code>; \u003ca href=\"evidence/2026-10-05T1108Z-editor-layout/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ba9af40a830bad2c9066f22210d4d190e083d00ddb2f1f355f386edc444a1703\">source manifest\u003c/a>. macOS, Node 22.19.0, pnpm 10.34.1. Native Safari in a fresh window against the existing development get=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 64564195cb8501c880dc1574f0c3a4daf605522cf4ceed5e79e85a4695cc0149\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Connection dialog\u003c/td>\n\u003ctd>Consistent field widths/gaps; close/connect grouped at bottom right\u003c/td>\n\u003ctd>Aligned labeled fields, supporting actions above, and Close/Connect together at bottom right; no credentials entered\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1108Z-editor-layout/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 64564195cb8501c880dc1574f0c3a4daf605522cf4ceed5e79e85a4695cc0149\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema field screen\u003c/td>\n\u003ctd>Immediate-parent back link; readable form and separated removal\u003c/td>\n\u003ctd>Home → Collection schemas → Journal → Title showed only field controls, a Journal schema back link and a separated disabled Remove field action. No global menu or entry controls remained in the drawer\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1108Z-editor-layout/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 64564195cb8501c880dc1574f0c3a4daf605522cf4ceed5e79e85a4695cc0149\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Required verification\u003c/td>\n\u003ctd>Types, regression tests, static output and asset checks pass\u003c/td>\n\u003ctd>Zero diagnostics; all 61 tests in 12 files passed; five static routes built; shared runtime and public-style isolation checks passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1108Z-editor-layout/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 8705eb97f820146209462e83378a5fc29b9f882ad53814eb23c0dc6b6a90fec7\">Verification log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-cleanup\">Limits and cleanup\u003c/h2>\n\u003cp>Passed applies to the listed checks. The browser run used development output at desktop width; production output was built and artifact-checked without a separate production-browser run. Storage and confirmation dialogs share the checked layout but were not separately inspected in this run. Live GitHub/R2/Netlify operations, password entry and a full responsive/accessibility audit were outside scope.\u003c/p>\n\u003cp>The temporary Design edit was cancelled. Save draft was disabled before closing the owned test window. The pre-existing user window and development server were preserved; no content files or remote providers were modified by browser testing. The schema-field visual observation closes the prior run's outstanding visual check without rewriting that historical report.\u003c/p>\n","backlinks":["index","features/editor","journal/2026-10-05-editor-layout"]},{"id":"verification/runs/2026-10-05T1124Z-page-list","title":"Pages table hierarchy","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Pages table hierarchy\nupdated: 2026-10-05\nresult: Passed\n---\n# Pages table hierarchy\n\n## Scope\n\n[FEAT-editor](../../features/editor.md), DEC-056: Home → Pages table → Page editor → Block editor. Check overview isolation, title/path display, opening and switching pages, returning through each parent, preservation of edits, and adding/deleting pages including the empty state.\n\n## Build and environment\n\nDirty implementation on `f6993528410bebeae1dafd70d52f57c1cc3e34d4`; [source manifest](../../evidence/2026-10-05T1124Z-page-list/source-manifest.json). macOS, Node 22.19.0, pnpm 10.34.1. Native Safari in an owned fresh window on the existing development server at `http://127.0.0.1:4321/admin/`. Automated navigation checks use actual Kumo components in jsdom, mocking preview islands. No independent verifier.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Pages overview | Table with every page's title/path, Add page and Home; no editor sidebar/preview | Browser showed Home `/` and Block examples `/blocks` in a separate table screen; no preview-width control or drawer | Passed | [Browser observations](../../evidence/2026-10-05T1124Z-page-list/browser-observations.txt) |\n| Page and block hierarchy | A page opens its own drawer and preview; back links restore immediate parents | Browser opened Home, Hero, All blocks, Pages, Block examples, Pages, Home. Page dropdown/Add page were absent from the page editor; parent controls disappeared in Hero | Passed | [Browser observations](../../evidence/2026-10-05T1124Z-page-list/browser-observations.txt) |\n| Editing and switching | Title/path edits remain after block/table/page round trips | Automated test edited both values, returned through block details and the table, opened a second page, reopened the first and checked inputs and tab recovery | Passed | [Final checks](../../evidence/2026-10-05T1124Z-page-list/verify.log) |\n| Creation/deletion/empty state | Add opens a new page; Cancel preserves it; confirmed deletion returns to the table | Automated test started with zero pages, added and renamed a page, saw it in the table, cancelled deletion, then confirmed deletion and checked the empty table and recovery content | Passed | [Final checks](../../evidence/2026-10-05T1124Z-page-list/verify.log) |\n| Existing navigation | Content/schema workflows and shared saving remain intact | All six navigation tests and the existing submission tests passed | Passed | [Final checks](../../evidence/2026-10-05T1124Z-page-list/verify.log) |\n| Required verification | Types, tests, build and assets pass | Zero diagnostics; 63 tests in 12 files passed; five routes built and runtime/public-style checks passed | Passed | [Final checks](../../evidence/2026-10-05T1124Z-page-list/verify.log) |\n\n## Attempts, limits and cleanup\n\nThe [initial type check](../../evidence/2026-10-05T1124Z-page-list/verify-initial.log) rejected `scope` on Kumo's Table.Head type. Removed the unsupported prop; the simple table retains native column-header semantics. The full subsequent check passed.\n\nAn initial browser attempt showed module-import errors in Text and Quote. The shared Markdown dependency's optimized URL returned HTTP 504 and its cached file was missing. Triggering the existing server's config watcher refreshed its module graph without a source-content change or a new server process. Final browser navigation rendered Text/Quote and both pages successfully. See the browser evidence for details.\n\nBrowser checks were read-only, at desktop width in development. Persistence and creation/deletion paths were exercised through the automated UI harness, not remote providers. Production output was built and artifact-checked without a separate production-browser run. No full keyboard/screen-reader audit or live GitHub/R2/Netlify checks were selected.\n\nThe owned clean test window was closed after confirming Save draft was disabled. The user's original window and development server remain open. No content files or remote data were changed during verification.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"attempts-limits-and-cleanup","title":"Attempts, limits and cleanup","depth":2}],"titleAnchor":"pages-table-hierarchy","links":["features/editor"],"attachments":[{"path":"evidence/2026-10-05T1124Z-page-list/source-manifest.json","sha256":"0d4ad032e8dbbc1534c2ebf6b8fa170ecbded9e260d7c2a3a523163cc52c9b54"},{"path":"evidence/2026-10-05T1124Z-page-list/browser-observations.txt","sha256":"6da5ef6a3fa297c3c6649685c03868af56093e6af3d3fae79b0b1ab77e9fb759"},{"path":"evidence/2026-10-05 \"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6da5ef6a3fa297c3c6649685c03868af56093e6af3d3fae79b0b1ab77e9fb759\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Page and block hierarchy\u003c/td>\n\u003ctd>A page opens its own drawer and preview; back links restore immediate parents\u003c/td>\n\u003ctd>Browser opened Home, Hero, All blocks, Pages, Block examples, Pages, Home. Page dropdown/Add page were absent from the page editor; parent controls disappeared in Hero\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1124Z-page-list/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6da5ef6a3fa297c3c6649685c03868af56093e6af3d3fae79b0b1ab77e9fb759\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Editing and switching\u003c/td>\n\u003ctd>Title/path edits remain after block/table/page round trips\u003c/td>\n\u003ctd>Automated test edited both values, returned through block details and the table, opened a second page, reopened the first and checked inputs and tab recovery\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1124Z-page-list/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72581a52225f7ab48adf54babed7b60cd3a409eded258c0710b8f7e78e9ee635\">Final checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Creation/deletion/empty state\u003c/td>\n\u003ctd>Add opens a new page; Cancel preserves it; confirmed deletion returns to the table\u003c/td>\n\u003ctd>Automated test started with zero pages, added and renamed a page, saw it in the table, cancelled deletion, then confirmed deletion and checked the empty table and recovery content\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1124Z-page-list/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72581a52225f7ab48adf54babed7b60cd3a409eded258c0710b8f7e78e9ee635\">Final checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Existing navigation\u003c/td>\n\u003ctd>Content/schema workflows and shared saving remain intact\u003c/td>\n\u003ctd>All six navigation tests and the existing submission tests passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1124Z-page-list/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72581a52225f7ab48adf54babed7b60cd3a409eded258c0710b8f7e78e9ee635\">Final checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Required verification\u003c/td>\n\u003ctd>Types, tests, build and assets pass\u003c/td>\n\u003ctd>Zero diagnostics; 63 tests in 12 files passed; five routes built and runtime/public-style checks passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T1124Z-page-list/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72581a52225f7ab48adf54babed7b60cd3a409eded258c0710b8f7e78e9ee635\">Final checks\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"attempts-limits-and-cleanup\">Attempts, limits and cleanup\u003c/h2>\n\u003cp>The \u003ca href=\"evidence/2026-10-05T1124Z-page-list/verify-initial.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 8d8c74ab2f158295d01a82ea029075d36f562058350b028b566b32c67889bf74\">initial type check\u003c/a> rejected \u003ccode>scope\u003c/code> on Kumo's Table.Head type. Removed the unsupported prop; the simple table retains native column-header semantics. The full subsequent check passed.\u003c/p>\n\u003cp>An initial browser attempt showed module-import errors in Text and Quote. The shared Markdown dependency's optimized URL returned HTTP 504 and its cached file was missing. Triggering the existing server's config watcher refreshed its module graph without a source-content change or a new server process. Final browser navigation rendered Text/Quote and both pages successfully. See the browser evidence for details.\u003c/p>\n\u003cp>Browser checks were read-only, at desktop width in development. Persistence and creation/deletion paths were exercised through the automated UI harness, not remote providers. Production output was built and artifact-checked without a separate production-browser run. No full keyboard/screen-reader audit or live GitHub/R2/Netlify checks were selected.\u003c/p>\n\u003cp>The owned clean test window was closed after confirming Save draft was disabled. The user's original window and development server remain open. No content files or remote data were changed during verification.\u003c/p>\n","backlinks":["index","features/editor"]},{"id":"verification/runs/2026-10-05T1303Z-admin-views","title":"Page-only preview and standard admin views","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Page-only preview and standard admin views\nupdated: 2026-10-05\nresult: Passed\n---\n# Page-only preview and standard admin views\n\n## Scope\n\n[FEAT-editor](../../features/editor.md), DEC-057. Only individual pages and their block details retain the editor drawer and live preview. Content, Collection schemas, Media and Site use a centered admin workspace, including all nested forms. Check view boundaries, navigation, preview unmounting, and preservation of existing editing behavior.\n\n## Build and environment\n\nDirty implementation on `f6993528410bebeae1dafd70d52f57c1cc3e34d4`; [source manifest](../../evidence/2026-10-05T1303Z-admin-views/source-manifest.json). macOS, Node 22.19.0, pnpm 10.34.1. Native Safari in a fresh owned window against the existing development server at `http://127.0.0.1:4321/admin/`. Automated navigation checks use real Kumo controls in jsdom with a minimal preview-island stub. No independent verifier.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Admin area roots | Content, Collection schemas, Media and Site have no drawer, live rendering or preview toggle | Browser visited all four areas; Media and entry screenshots showed centered wide content. Automated assertions confirm a main admin region and no aside, preview or width toggle | Passed | [Browser observations](../../evidence/2026-10-05T1303Z-admin-views/browser-observations.txt), [checks](../../evidence/2026-10-05T1303Z-admin-views/verify.log) |\n| Nested Content and schema screens | Entry/block and model/field screens retain standard admin layout and immediate-parent navigation | Browser traversed collection → entry → Text block and schema → field, then returned through parents. Rich-text controls loaded after development cache recovery. Automated tests check edit/default persistence, populated-field protection and deletion | Passed | [Browser observations](../../evidence/2026-10-05T1303Z-admin-views/browser-observations.txt), [checks](../../evidence/2026-10-05T1303Z-admin-views/verify.log) |\n| Page editing | Page and page-block screens retain the live website and width toggle | Browser opened Pages → Home → Hero, saw rendered blocks and the width control, and returned to page settings | Passed | [Browser observations](../../evidence/2026-10-05T1303Z-admin-views/browser-observations.txt) |\n| Leaving page editing | Preview unmounts outside page editing; entry navigation opens standard Content editor | Browser returned through Pages/Home to Media with no preview or width control. Automated checks assert island stub removal and follow a page-preview entry link into the admin workspace | Passed | [Browser observations](../../evidence/2026-10-05T1303Z-admin-views/browser-observations.txt), [checks](../../evidence/2026-10-05T1303Z-admin-views/verify.log) |\n| Required verification | Types, tests, build and asset checks pass | Zero diagnostics; all 63 tests in 12 files passed; five static routes built; shared-runtime and public-style checks passed | Passed | [Verification log](../../evidence/2026-10-05T1303Z-admin-views/verify.log) |\n\n## Limits and cleanup\n\nAn initial attempt to load the entry's rich-text widget blanked the development UI. Safari's console identified HTTP 504 `Outdated Optimize Dep` for Lexical modules. A browser reload alone reproduced it. Touching the unchanged Astro configuration refreshed the existing development module graph; reloading and repeating the journey then loaded the rich-text toolbar and body successfully. This was a development-cache recovery; no widget or provider code changed.\n\nBrowser checks used desktop development output and made no content edits. Production was built and artifact-checked without a separate production-browser run. Live providers, media uploads, a full responsive/accessibility audit and rich-text formatting changes were outside scope.\n\nThe owned test window and its inspector were closed; Save draft was disabled before closing. The original user window and existing server were preserved. No new server, provider operations or content-file mutations were introduced by verification.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-cleanup","title":"Limits and cleanup","depth":2}],"titleAnchor":"page-only-preview-and-standard-admin-views","links":["features/editor"],"attachments":[{"path":"evidence/2026-10-05T1303Z-admin-views/source-manifest.json","sha256":"c7dd7ae96c974ddf986678f3ee613a205923e8428e9ad57432f818e3fccad477"},{"path":"evidence/2026-10-05T1303Z-admin-views/browser-observations.txt","sha256":"f005db21461be377e9243ec7888388b440210ec549d0a1a66a0901de038fcd5a"},{"path":"evidence/2026-10-05T1303Z-admin-views/verify.log","sha256":"20e621373b2f399482c1304b48b0f0cd20003db7a88777524e6f3d735a2cdbb1"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a>, DEC-057. Only individual  and existing server were preserved. No new server, provider operations or content-file mutations were introduced by verification.\u003c/p>\n","backlinks":["index","features/editor"]},{"id":"verification/runs/2026-10-05T1650Z-generic-pages","title":"Generic pages and schema-only entries","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Generic pages and schema-only entries\nupdated: 2026-10-06\nresult: Passed\n---\n# Generic pages and schema-only entries\n\n## Scope\n\n[FEAT-generic-pages](../../features/generic-pages.md), [FEAT-editor](../../features/editor.md), and [FEAT-static-blocks](../../features/static-blocks.md): implement DEC-058–DEC-073 after the user's 2026-10-06 authorization. Selected checks cover content contracts, route ownership, template bindings, admin hierarchy/catalogs, rich-text embeds, recovery and the emitted static website. Live providers are excluded from this local run.\n\n## Build and environment\n\nmacOS, Node 22.19.0, pnpm 10.34.1; dirty workspace based on `f6993528410bebeae1dafd70d52f57c1cc3e34d4`. The [SHA-256 source manifest](../../evidence/2026-10-05T1650Z-generic-pages/source-manifest.json) identifies source, content, tests and configuration. No dependencies were added. Native Safari used an isolated window against owned production preview on 4331, then the existing development server on 4321. Local browser edits never wrote repository content.\n\n## Results\n\n| Scenario | Expected | Observed | Result |\n| --- | --- | --- | --- |\n| Contracts and routes | Explicit static indexes; optional entry templates; no generic standalone URLs | Unit tests cover route plans, data-only behavior, collisions and missing assignments; six static routes built | Passed |\n| Binding resolution | Compatible shared schemas, draft-safe failures, publication guards, correct empty/zero/false handling | Unit tests cover each case; browser shows missing-key toast and successful cancellation | Passed |\n| Admin hierarchy/catalogs | Entries have fields only; page kind filters available blocks; schemas assign only generic pages | Mounted navigation tests and browser observations match; data-only selector label fixed and rechecked | Passed |\n| Rich-text media | Uploaded-image references and YouTube survive visual editing; unsafe/missing references do not render executable content | Image insertion/removal, read-only state and Markdown round-trip tests pass; browser YouTube insertion survives reload | Passed |\n| Public rendering | Real entry values replace placeholders; optional blank image renders empty | Browser entry/index checks and HTTP/artifact assertions match | Passed |\n| Compilation and regression | No diagnostics and all selected tests pass | `pnpm verify`: zero errors/warnings/hints; 75 tests in 13 files pass | Passed |\n| Assets and static output | One runtime copy per framework; no editor/provider imports on public routes | Build graph checks pass; Journal index and both entries have zero JavaScript modules | Passed |\n| Development startup | Regenerated routes and lazy editor load without blank/error screen | Home and schema editing mount after Astro config refresh; entry Body loads formatting, Image and YouTube controls | Passed |\n\nEvidence: [verification log](../../evidence/2026-10-05T1650Z-generic-pages/verify.log), [browser observations](../../evidence/2026-10-05T1650Z-generic-pages/browser-observations.txt), [HTTP checks](../../evidence/2026-10-05T1650Z-generic-pages/http-checks.txt).\n\n## Limits and follow-up\n\nLive GitHub writes, R2 upload/CORS, Netlify deployment and actual external YouTube playback were not selected and remain unverified. Image editing used existing media metadata in a mounted UI test; uploads still use the existing Media workflow. No generic third-party content migration is provided. Existing demo entries were intentionally replaced; old recovery storage is preserved separately.\n\nAn initial build failed because an empty generic media component returned null; it now emits an invisible empty node so Astro can identify its renderer. The final verification log contains the successful rerun. The initial blank data-only selector was fixed and rechecked in development and unit tests. Earlier browser checks predate these small fixes; final compilation/tests/build include them.\n\nTest edits were reverted. Owned preview PID 88199 is stopped and the isolated Safari window is closed; the user's development server remains available on 4321. No commit, push or deployment was performed.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"generic-pages-and-schema-only-entries","links":["features/generic-pages","features/editor","features/static-blocks"],"attachments":[{"path":"evidence/2026-10-05T1650Z-generic-pages/source-manifest.json","sha256":"e21f4ca2ff94682f57c41051a0f13fd9a50ca2bd94d6ea126901626b4e5e49c3"},{"path":"evidence/2026-10-05T1650Z-generic-pages/verify.log","sha256":"66aa6411dfd31d43e77e5d9ce6a9ba38f58d91d9cfdacb139188456942c2ff47"},{"path":"evidence/2026-10-05T1650Z-generic-pages/browser-observations.txt","sha256":"44d1b5ae3b1f08917dbd9d5223e533d1fd46b03517edba194d76d45401add3f7"},{"path":"evidence/2026-10-05T1650Z-generic-pages/http-checks.txt","sha256":"51ad2844a842e424400518639568579bc66a80d0c9dfd4eca24cb7a7aa6e6edb"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/generic-pages\">FEAT-generic-pages\u003c/a>, \u003ca href=\"#/features/editor\">FEAT-editor\u003c/a>, and \u003ca href=\"#/features/static-blocks\">FEAT-static-blocks\u003c/a>: implement DEC-058–DEC-073 after the user's 2026-10-06 authorization. Selected checks :"","source":"---\ntitle: Persistent admin sidebar\nupdated: 2026-10-06\nresult: Passed\n---\n# Persistent admin sidebar\n\n## Scope and environment\n\n[FEAT-editor](../../features/editor.md), DEC-074: replace Home destination cards with persistent main navigation, retaining nested page/block controls and page-only preview. Local macOS, Node 22.19.0, pnpm 10.34.1; dirty workspace based on `f6993528410bebeae1dafd70d52f57c1cc3e34d4`. The [source manifest](../../evidence/2026-10-05T1725Z-admin-navigation/source-manifest.json) identifies the verified application, tests, fixtures and configuration.\n\n## Results\n\n| Scenario | Expected | Observed | Result |\n| --- | --- | --- | --- |\n| Main navigation | Five destinations persist separately from workspace; Pages opens by default | Mounted tests and Safari show Pages table with separate main navigation; active Pages highlight visually confirmed | Passed |\n| Nested editing | Page and block controls stay separate; live preview has its own space | Safari Home → Hero shows main navigation, block drawer and preview in three non-overlapping columns; hierarchy tests pass | Passed |\n| Area switching | Content uses standard admin; shared edits survive switches | Browser opens Content without preview; mounted tests preserve edits and verify active-area state across destinations | Passed |\n| Narrow navigation | Menu exposes destinations and closes after selection | Safari responsive viewport at 390×844 opens Menu and navigates to Media; dialog closes, standard admin layout fits viewport | Passed |\n| Regression/build | Tests and static output checks pass | `pnpm verify`: zero errors/warnings/hints, 75 tests in 13 files, static build and shared-runtime checks pass | Passed |\n\nEvidence: [verification log](../../evidence/2026-10-05T1725Z-admin-navigation/verify.log), [browser observations](../../evidence/2026-10-05T1725Z-admin-navigation/browser-observations.txt).\n\n## Limits and cleanup\n\nBrowser checks used the existing development server on 4321 in an isolated Safari window. Production output was built and checked automatically; production browser behavior and live provider actions were not selected for this layout-only change. The narrow-screen check covers navigation and Media; it is not a complete mobile page-builder audit.\n\nNo content edits, saves, publications or uploads were performed in the browser. The isolated test window is closed; the user's existing window and development server remain running. No commit or deployment was performed.\n","toc":[{"id":"scope-and-environment","title":"Scope and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-cleanup","title":"Limits and cleanup","depth":2}],"titleAnchor":"persistent-admin-sidebar","links":["features/editor"],"attachments":[{"path":"evidence/2026-10-05T1725Z-admin-navigation/source-manifest.json","sha256":"7ae26da538b3882f2c1030bbc950bd297f39bc557f53f5ca9f0f0812d53beaa1"},{"path":"evidence/2026-10-05T1725Z-admin-navigation/verify.log","sha256":"89fabbbb9b55276fdca356d760a71d77cae463f0d9462e212878dcc81365b746"},{"path":"evidence/2026-10-05T1725Z-admin-navigation/browser-observations.txt","sha256":"d85381be3ee4ea98527d8cb4df8dbbdb72bfa2f83319075b128f9a80dd64eb11"}],"html":"\u003ch2 id=\"scope-and-environment\">Scope and environment\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a>, DEC-074: replace Home destination cards with persistent main navigation, retaining nested page/block controls and page-only preview. Local macOS, Node 22.19.0, pnpm 10.34.1; dirty workspace based on \u003ccode>f6993528410bebeae1dafd70d52f57c1cc3e34d4\u003c/code>. The \u003ca href=\"evidence/2026-10-05T1725Z-admin-navigation/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7ae26da538b3882f2c1030bbc950bd297f39bc557f53f5ca9f0f0812d53beaa1\">source manifest\u003c/a> identifies the verified application, tests, fixtures and configuration.\u003c/p>\n\u003ch2 id=\"resu sed the development server. The earlier width-only verification log precedes the additional development-reload change; the linked final log includes both.\n","toc":[{"id":"scope-and-environment","title":"Scope and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-cleanup","title":"Limits and cleanup","depth":2}],"titleAnchor":"shared-content-width-and-development-reloads","links":["features/static-blocks","features/editor"],"attachments":[{"path":"evidence/2026-10-05T1735Z-content-width/source-manifest.json","sha256":"4fd823e05939353d42e39eaa0a268753d9f00e5c16145630af28783356ead246"},{"path":"evidence/2026-10-05T1735Z-content-width/verify.log","sha256":"e1a4f8323a0d433633f48b260d0094b9e50e4500bbada1342869c035435d1e7b"},{"path":"evidence/2026-10-05T1735Z-content-width/public-output.txt","sha256":"0f3cfda88d4d8386b4c5187c1209b78fee48a3d1387522877977f91baa0ad196"},{"path":"evidence/2026-10-05T1735Z-content-width/browser-observations.txt","sha256":"a50b9cf7d80f10a5f90f272b214b92985260aeb4b2598fca89059f6c7f9658ec"}],"html":"\u003ch2 id=\"scope-and-environment\">Scope and environment\u003c/h2>\n\u003cp>\u003ca href=\"#/features/static-blocks\">FEAT-static-blocks\u003c/a> and \u003ca href=\"#/features/editor\">FEAT-editor\u003c/a>: shared site width, optional author adoption, consistent public/preview propagation and prompt-free development reloads. macOS, Node 22.19.0, pnpm 10.34.1; dirty tree based on \u003ccode>f6993528410bebeae1dafd70d52f57c1cc3e34d4\u003c/code>. \u003ca href=\"evidence/2026-10-05T1735Z-content-width/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 4fd823e05939353d42e39eaa0a268753d9f00e5c16145630af28783356ead246\">Source manifest\u003c/a>.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr 750Z-admin-width/source-manifest.json).\n\n## Results\n\n| Scenario | Expected | Observed | Result |\n| --- | --- | --- | --- |\n| Shared container width | Pages and standard admin forms use one 867px maximum | Source inspection confirms one shared CSS rule/token for both containers; Safari Pages and Site settings screenshots show centered content of matching width | Passed |\n| Regression/build | Existing checks remain valid | `pnpm verify` passes: zero diagnostics, 77 tests in 13 files, static build and asset-sharing checks | Passed |\n\nEvidence: [verification log](../../evidence/2026-10-05T1750Z-admin-width/verify.log), [browser observations](../../evidence/2026-10-05T1750Z-admin-width/browser-observations.txt).\n\n## Limits and cleanup\n\nBrowser checks sampled the two container types on the existing development server at 4321. Narrow-screen behavior and every nested screen were not individually rechecked; they use the same responsive block layout. Public-site width, page drawer, dialogs and login form were outside this change. No new tests were added for this CSS-only adjustment. The isolated window is closed, no content was edited and the user's window/server remain available.\n","toc":[{"id":"scope-and-environment","title":"Scope and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-cleanup","title":"Limits and cleanup","depth":2}],"titleAnchor":"standard-admin-content-width","links":["features/editor"],"attachments":[{"path":"evidence/2026-10-05T1750Z-admin-width/source-manifest.json","sha256":"c17298e9aef7432b250cc309937e10235eaecd19cdc3f382c184b44a84c0d1c2"},{"path":"evidence/2026-10-05T1750Z-admin-width/verify.log","sha256":"586b9fb4cca07d601ab2a0df76499721d49776f2ee1ffbb9c3c60e2eb168255c"},{"path":"evidence/2026-10-05T1750Z-admin-width/browser-observations.txt","sha256":"52080e200991973911deb81528f3640dc09f6ef5c3e0b535fc7bf8e86eb92593"}],"html":"\u003ch2 id=\"scope-and-environment\">Scope and environment\u003c/h2>\n\ It was restarted on the same port after verification; the final browser check and user window show no error overlay. No generator code was changed.\u003c/p>\n","backlinks":["index","features/editor","journal/2026-10-06-table-and-back"]},{"id":"verification/runs/2026-10-05T1810Z-site-design","title":"Site typography and page gutter","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Site typography and page gutter\nupdated: 2026-10-06\nresult: Passed\n---\n# Site typography and page gutter\n\n## Scope\n\n[FEAT-editor](../../features/editor.md) and [static blocks](../../features/static-blocks.md): add the five selected global controls, apply them to public rendering and live preview, preserve admin styling, recover edits, validate content and support older records. DEC-078 defines the accepted scope.\n\n## Build and environment\n\nmacOS, Node 22.19.0, pnpm 10.34.1; dirty tree based on `f6993528410bebeae1dafd70d52f57c1cc3e34d4`. [Source fingerprint](../../evidence/2026-10-05T1810Z-site-design/source-manifest.json). Native Safari used an isolated window against the existing source development server at `127.0.0.1:4321`; automated checks also built and inspected production output.\n\n## Results\n\n| Scenario | Expected | Observed | Result |\n| --- | --- | --- | --- |\n| Kumo controls and labels | Separate body/heading fonts, size, line height and gutter, consistent spacing | Real browser inputs accepted Arial/Georgia/18/1.8/40. Section layout inspected. Initial automated run caught raw font IDs after remount; explicit option labels fixed it. | Passed |\n| Persistence and default clearing | Settings survive navigation, tab reload and JSON round trip; clearing restores defaults | Mounted tests verify remount/recovery and numeric clearing; actual Safari reload retained all five values. | Passed |\n| Content validation | Explicit malformed settings fail; omitted/null values work; zero gutter allowed | Contract tests cover unsupported font IDs/types, nonfinite/negative/wrong numeric types, zero size/line-height, valid zero gutter, missing and cleared values, and safe rendering fallbacks. | Passed |\n| Static/generic preview and admin isolation | Starter text/layout adopt globals; admin retains its own styles | Home, Block examples and Journal entry visibly use selected fonts/gutter; mounted tests verify exact preview tokens and scope. Admin screenshot remains unchanged. | Passed |\n| Narrow preview | Fonts and gutter work within the mobile surface | Header initially squeezed its title; shared wrapping corrected it. Final 390px generic preview shows intact site title with navigation below. | Passed |\n| Public output | Globals present before hydration on each public route | Parsed all five built public HTML files: each emits typography/gutter tokens and the site-surface boundary. No new font assets/dependencies. | Passed |\n| Required checks | Types, tests, static build, shared assets pass | Final pnpm verify: zero diagnostics, 79 tests in 13 files pass; build and asset checks pass. | Passed |\n\nEvidence: [final checks](../../evidence/2026-10-05T1810Z-site-design/verify.log), [browser observations](../../evidence/2026-10-05T1810Z-site-design/browser-observations.txt), [public shells](../../evidence/2026-10-05T1810Z-site-design/public-shell.json). The [initial failed label test](../../evidence/2026-10-05T1810Z-site-design/initial-verify.log) is preserved. The [intermediate pass](../../evidence/2026-10-05T1810Z-site-design/before-header-verify.log) precedes the responsive header adjustment; the final run includes it.\n\n## Limits and cleanup\n\nBrowser verification used development output; production was checked through the real build and emitted HTML, not a second browser server. GitHub/R2/Netlify operations are outside this change and were not exercised. Font availability depends on the visitor's system with defined fallbacks; this version offers built-in stacks, not uploaded/web fonts. Blocks may override shared defaults by design. Screenshots were visually inspected, not stored as image evidence. The owned test window was closed; the user's existing window and development process remain running. No provider state or fixture content was changed by browser checks.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-cleanup","title":"Limits and cleanup","depth":2}],"titleAnchor":"site-typography-and-page-gutter","links":["features/editor","features/static-blocks"],"attachments":[{"path":"evidence/2026-10-05T1810Z-site-design/source-manifest.json","sha256":"6e7bc3d094d4c962e0af0245177b404a95d4c70c1a777446f181947a49a27fc3"},{"path":"evidence/2026-10-05T1810Z-site-design/verify.log","sha256":"c397c060bdad6af6e8f5bc806df1283fa9f32f84d731398fe4c1d5ddaf740708"},{"path":"evidence/2026-10-05T1810Z-site-design/browser-observations.txt","sha256":"7ae4327853317250614c600ea211507f55957635b67dfd216fd6dfaef1ecd5d3"},{"path":"evidence/2026-10-05T1810Z-site-design/public-shell.json","sha256":"6f39cd0074ee026282631f35fb1cb817b13ec7061420cded2259378a897d733e"},{"path":"evidence/2026-10-05T1810Z-site-design/initial-verify.log","sha256":"9c6fe0da0d247efc5957968f46bde6a1d365e69b1e1b70d88412e940465369be"},{"path":"evidence/2026-10-05T1810Z-site-design/before-header-verify.log","sha256":"b77c8166b1c0d80c54b1f98a19bada9e16791c9215e4c0bee0fa5e7972305b12"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a> and \u003ca href=\"#/features/static-blocks\">static blocks\u003c/a>: add the five selected global controls, apply them to public rendering and live preview, preserve admin styling, recover edits, validate content and support older records. DEC-078 defines ngle-line horizontally scrolling tags, an always-present Reset control that disables without filters, a top-right ×, and cards approximately 60% of their previous maximum width. The same catalog serves page blocks and shared footers. Preview colors were also separated from the admin's inherited text color.\n\nSelected checks cover the existing filtering/preview/insertion behavior and automated application regressions, plus visual layout/scrolling and close behavior. The aggregate is **Untested** because browser access was blocked; this is not a claim of a product failure.\n\n## Build and environment\n\nDirty tree based on `02194ecefe35a72455ba807fcdd4c86566db0f8f`, macOS, Node 22.19.0 and pnpm 10.34.1. Existing block-library implementation changes were preserved. The [source manifest](../../evidence/2026-10-06T0619Z-catalog-polish/source-manifest.json) records 377 source, generated, test, content and configuration files. Manifest SHA-256: `59d89053451b001f44ff8a43a2a4ad7e1e8c072ffa3c5347ef0c54581cc5e11b`.\n\n`pnpm verify` ran against this tree. Computer-use inventory found running browsers but no connected tabs. Selecting Helium was denied by a restriction on the current browser URL. Computer use stopped at that boundary; no browser sessions, content or server processes were created or modified for this run.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Types, regression tests and production artifacts | Clean diagnostics, tests and static build | Zero errors/warnings/hints; 89 tests across 16 files passed; six routes built and runtime/asset checks passed | Passed | [Verify log](../../evidence/2026-10-06T0619Z-catalog-polish/verify.log) |\n| Reset and catalog interactions | Reset initially visible/disabled, enables with filtering, clears query/tag state and disables again; preview does not insert | Updated mounted React test observes these states, separate preview/mobile toggle and a single direct insertion | Passed | Verify log; `tests/block-library-editor.test.ts` |\n| Dialog layout and scrolling | No visible heading/footer action, × at top right, filters and grid scroll together, tags scroll horizontally on one line, cards max 270px | Source changes inspected; rendered geometry and overflow could not be observed because browser selection was denied | Untested | [Browser status](../../evidence/2026-10-06T0619Z-catalog-polish/browser-status.txt) |\n| Close and preview scroll transitions in browser | × dismisses without insertion; preview and return start at the top with accessible controls | Existing Kumo Close behavior retained with an accessible name; scroll reset added on preview changes, but browser behavior not exercised | Untested | Browser status |\n\n## Limits and follow-up\n\nVisually check the catalog at desktop and narrow window sizes when browser access is available, including horizontal tags, vertical movement of the filters, close/reopen and preview from a lower grid row. Automated mounted tests mock block renderers and do not establish layout or color correctness. Physical devices and live providers were outside this bounded UI change.\n\nNo temporary browser/server resources need cleanup. The verification log and source manifest are retained; the scratch log was removed after copying. Verification was performed by the implementing agent; no independent review is claimed.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"catalog-dialog-polish-verification","links":["features/block-library"],"attachments":[{"path":"evidence/2026-10-06T0619Z-catalog-polish/source-manifest.json","sha256":"59d89053451b001f44ff8a43a2a4ad7e1e8c072ffa3c5347ef0c54581cc5e11b"},{"path":"evidence/2026-10-06T0619Z-catalog-polish/verify.log","sha256":"e2273a09c298ec8e8f129e6e2cf d>Close and preview scroll transitions in browser\u003c/td>\n\u003ctd>× dismisses without insertion; preview and return start at the top with accessible controls\u003c/td>\n\u003ctd>Existing Kumo Close behavior retained with an accessible name; scroll reset added on preview changes, but browser behavior not exercised\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>Browser status\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>Visually check the catalog at desktop and narrow window sizes when browser access is available, including horizontal tags, vertical movement of the filters, close/reopen and preview from a lower grid row. Automated mounted tests mock block renderers and do not establish layout or color correctness. Physical devices and live providers were outside this bounded UI change.\u003c/p>\n\u003cp>No temporary browser/server resources need cleanup. The verification log and source manifest are retained; the scratch log was removed after copying. Verification was performed by the implementing agent; no independent review is claimed.\u003c/p>\n","backlinks":["index","features/block-library","verification/runs/2026-10-06T0628Z-catalog-controls","verification/runs/2026-10-06T0632Z-gutter-drop","verification/runs/2026-10-06T0845Z-sortable-flip"]},{"id":"verification/runs/2026-10-06T0628Z-catalog-controls","title":"Catalog control refinement verification","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Catalog control refinement verification\nupdated: 2026-10-06\nresult: Untested\n---\n# Catalog control refinement verification\n\n## Scope\n\n[FEAT-block-library](../../features/block-library.md). Correct the left-shifted close icon using Kumo's square button shape, hide the tag scrollbar without disabling native scrolling, and add small left/right scrolling buttons. Each click moves up to 240px; buttons disable at the corresponding edge and update on scroll/resize. Reduced-motion users receive immediate scrolling. The existing close-button placement is retained.\n\n## Build and environment\n\nDirty tree based on `02194ecefe35a72455ba807fcdd4c86566db0f8f`, macOS, Node 22.19.0, pnpm 10.34.1. [Source manifest](../../evidence/2026-10-06T0628Z-catalog-controls/source-manifest.json): 377 files, SHA-256 `8ae2b14c58e288612649ad9698634552f3aadba8892d50abe82429881168494d`. Earlier uncommitted implementation work was preserved.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Automated regression checks | Clean types, tests, production build and asset checks | `pnpm verify` passed: zero diagnostics, 89 tests across 16 files, six routes and runtime/asset checks | Passed | [Verify log](../../evidence/2026-10-06T0628Z-catalog-controls/verify.log) |\n| Close icon and horizontal tag controls | Centered ×, hidden scrollbar, small directional movement, disabled controls at edges, keyboard/trackpad scrolling retained | Component/CSS reviewed against installed Kumo implementation; rendered alignment and scrolling not observed | Untested | [Existing browser-access restriction](2026-10-06T0619Z-catalog-polish.md) |\n\n## Limits and follow-up\n\nComputer use remained unavailable after the current-URL restriction in the preceding run; no attempt was made to bypass it. Check icon centering, scroll-button behavior at both edges, resize and reduced motion when browser access is available. Existing mounted tests cover catalog filtering/preview/insertion, not browser geometry or scrolling. No new browser tabs, servers, provider actions or content edits were created. Evidence is retained and the scratch log removed. Verification was by the implementing agent.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environme
