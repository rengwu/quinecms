t/collections/`, and `content/media/`, using `\u003cid>.json`. `content/site.json` stores the site record. Connection configuration is separate from content, and no credential is serialized into these files.\n\nPaths must be unique across pages, collection listings, and entry routes. Normalize paths and reject traversal, reserved admin/assets routes, and collisions. Internal references resolve through IDs. External links use allowed URL schemes; scripts are never a link target. Media URLs are derived from configured R2/public origins and recorded per uploaded object. The registry is used during build/preview, not fetched by every public block.\n\n## Field and custom-widget definitions\n\n```ts\ninterface FieldBase {\n  key: string; label: string; required?: boolean;\n  default?: JsonValue;\n}\ntype FieldSpec = FieldBase & (\n  | { type: \"text\"; multiline?: boolean }\n  | { type: \"number\"; min?: number; max?: number }\n  | { type: \"date\" }                 // YYYY-MM-DD\n  | { type: \"toggle\" }               // boolean, false is a value\n  | { type: \"select\"; options: { value: string; label: string }[] }\n  | { type: \"media\" }                // MediaRef\n);\ntype BlockField = (FieldSpec & { widget?: string }) | (FieldBase & {\n  type: \"custom\"; widget: string;    // block-owned JSON validation required\n});\ninterface WidgetProps\u003cValue extends JsonValue> {\n  value: Value | undefined;\n  onChange(value: Value): void;\n  field: BlockField;\n  errors: readonly string[];\n  readOnly: boolean;\n}\ninterface ValidationIssue {\n  path: string;                     // document/block/field address\n  code: string;\n  message: string;                  // plain-language UI text\n  phase: \"structure\" | \"publish\";\n}\n```\n\nCollection definitions permit only `FieldSpec`; custom block controls do not expand the collection schema-builder scope. A Markdown control stores a string, while a compound block-specific control can use `custom` with the block's shared pure validator. The browser/build run identical value validation. Widget registration maps stable IDs to trusted React components; JSON never supplies component source code.\n\nField keys and select option values are stable machine identifiers; labels are editable. Empty draft values are omitted or null; empty required text is a publication error, while zero and false are valid values. Nonempty values of the wrong type are structural errors. Do not coerce existing numbers, strings, or selections to make a new version appear compatible.\n\nDevelopers and the portal edit the same serialized collection definition. New fields are optional by default unless existing entries can satisfy required validation. Block schema definitions remain developer-owned. Collection keys/types with existing data cannot be destructively renamed/changed through the initial portal. Adding an entry initializes declared defaults; switching an existing block version follows the manual blank-field rule above instead.\n\n## Block source contract and styles\n\nA source definition includes `type`, integer `version`, `label`, optional `deprecated`, `fields`, `defaults`, `framework`, `activation`, and declared dependency ranges. Separate renderer registrations reference compiled source modules: a static renderer, a browser mount entry, and optional React widget loaders. Framework adapters generate common lifecycle behavior from a shared component when possible. Explicit alternate renderers need parity fixtures.\n\nDo not import every block or framework into every public page. Generate statically analyzable registry entries and lazy browser loaders as part of the build. Keep browser-safe metadata separate from build-only rendering code; do not send server modules or credentials to the browser. Preview code must load only installed registered versions and clean up after itself.\n\nBlocks use CSS Modules or framework-scoped styles. CSS resets and document-wide theme variables belong to the shell. Namespaced keyframes/fonts and popup portal containers need equivalent ownership. Portals used by editor components mount inside a styled editor-owned container; block popups must retain block-scoped classes. Optional globals such as theme are passed as values/CSS variables, with no mandatory stylistic adherence.\n\nCSS scoping is a contract and validation target, not a sandbox for arbitrary untrusted JavaScript. Public HTML, the admin document, and every retained block version must be checked for cross-component style leakage and duplicate runtime execution.\n\n## Save, recovery, and Publish\n\nAccepted behavior: Save includes all pending editor changes in one draft commit; incomplete content may be saved. Publish requires valid required values and resolvable references. Tab-session recovery preserves unsaved content through reloads, without persisting uploaded binary buffers.\n\nEngineering transaction design:\n\n1. Load a coherent content snapshot from an immutable draft commit. Hold its SHA as the editing base.\n2. Validate structural integrity of all staged records and file paths. Serialize the full pending change set into a tree and a single commit parented by that base.\n3. Advance the draft reference without force. If another writer has advanced it incompatibly, reject the stale save; preserve edits and explain recovery. Do not overwrite a file-at-a-time or silently replay the user's values onto newer content.\n4. On uncertain network results, compare the remote reference/commit before retrying. Only clear recovery state after the intended saved commit is confirmed. Associate recovery with repository, branch, base commit, and editor compatibility version.\n5. Publish operates on a saved, immutable draft snapshot, not unsaved local state. Validate that entire snapshot, including installed block versions, schema compatibility, paths, references, and required fields. Revalidate during the production build as well.\n6. Initial implementation direction: publish through a fast-forward merge of the validated snapshot into main, using a non-forced reference update. Main must be an ancestor; diverged source/content changes require synchronization and renewed validation. This preserves the snapshot under concurrent updates without claiming a preflight read is a lock. Fast-forwarding satisfies the selected draft-to-main merge behavior without requiring a special merge commit.\n7. After publishing, retain newer unpublished draft commits if present; never reset the draft branch or force main. Report “published to Git; deployment pending” until deployment completion is actually known. Netlify owns the deployment pipeline.\n\nGitHub exposes the required [tree](https://docs.github.com/en/rest/git/trees#create-a-tree), [commit](https://docs.github.com/en/rest/git/commits#create-a-commit), and [reference](https://docs.github.com/en/rest/git/refs#update-a-reference) operations. Its [merge endpoint](https://docs.github.com/en/rest/branches/branches#merge-a-branch) also accepts an immutable commit SHA, but can merge against a changing base; that alone does not guarantee a previously validated full output tree. The initial fast-forward constraint is an engineering recommendation that needs race testing.\n\nSession recovery includes the base SHA and incomplete values. If the server draft changed, restore local work as recoverable edits rather than silently treating it as current. If browser storage is unavailable/full, show that recovery is unavailable and keep live edits intact. Keep credentials out of content backups, logs, and Git. R2 credential retention can follow the GitHub tab-session default; this is an engineering default, not a separately answered preference.\n\n## Initial proof and validation targets\n\nImplementation remains unstarted. Validate these before widening the block catalog:\n\n- Render repeated React blocks, another framework block, and a vanilla block in public output and a single-document preview. Verify compatible vendors execute once per document, styles stay scoped, and pages load only their required dependencies.\n- Edit/reorder/remove blocks; ensure updates appear immediately and destruction releases handlers. Compare published and preview content/layout on fixed fixtures.\n- Render a retained deprecated version; switch versions, carry only compatible fields, leave unmatched values blank, cancel safely, and Save incomplete data without automatic migrations.\n- Round-trip the limited Markdown feature set through visual editing and shared rendering, including pasted content and unsupported markup preservation.\n- Verify all-or-nothing multi-record saves, stale saves, lost responses, reload recovery, invalid Publish rejection, concurrent saves during Publish, and divergent main handling.\n- Upload image variants to a test R2 bucket, verify IDs/metadata and responsive URLs, and preserve original files when a format cannot safely be resized. Verify credentials never appear in generated assets.\n\nExact image widths/quality, upload limits, package pins, drag-and-drop implementation, and route reservations are bounded engineering details to validate during implementation, not unresolved product preferences. No application behavior is claimed tested by the wiki build.\n","toc":[{"id":"shared-dependencies-q33","title":"Shared dependencies — Q33","depth":2},{"id":"documents-and-identity-q34","title":"Documents and identity — Q34","depth":2},{"id":"text-inside-blocks-q35","title":"Text inside blocks — Q35","depth":2},{"id":"versioning-q36","title":"Versioning — Q36","depth":2},{"id":"block-manifest-and-rendering-q37","title":"Block manifest and rendering — Q37","depth":2},{"id":"activation-q38","title":"Activation — Q38","depth":2},{"id":"references-q39","title":"References — Q39","depth":2},{"id":"supporting-stack-choices","title":"Supporting stack choices","depth":2},{"id":"concrete-record-definitions","title":"Concrete record definitions","depth":2},{"id":"field-and-custom-widget-definitions","title":"Field and custom-widget definitions","depth":2},{"id":"block-source-contract-and-styles","title":"Block source contract and styles","depth":2},{"id":"save-recovery-and-publish","title":"Save, recovery, and Publish","depth":2},{"id":"initial-proof-and-validation-targets","title":"Initial proof and validation targets","depth":2}],"titleAnchor":"technical-contracts","links":["decisions/index"],"attachments":[],"html":"\u003cp>The accepted foundation and contract choices are DEC-026–DEC-047 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>. The technical interview is complete. Concrete definitions below are engineering specifications derived from those decisions, not implemented or verified APIs. Supporting library choices and exact adapter integration remain subject to implementation validation.\u003c/p>\n\u003ch2 id=\"shared-dependencies-q33\">Shared dependencies — Q33\u003c/h2>\n\u003cp>Accepted: build-generated self-hosted vendor modules. Proposed mechanics: a site-owned dependency registry and lockfile. Block manifests declare compatible ranges; imports resolve to the site's selected versions. Incompatible requirements fail validation rather than silently installing another framework runtime or rewriting compatibility declarations. Emit minified, hashed ESM vendor/shared chunks in the site's static output. Block entry points import the same module URLs; load only the graph required by the current page or preview. Retained deprecated block implementations must follow the same compatibility rule.\u003c/p>\n\u003cp>Use the build's module graph instead of requiring every package to be a single manually maintained script. Packages may have multiple entry points and transitive dependencies. Sharing must include the React editor, block adapters, and block widgets. Build output inspection and browser checks must verify the result; a configuration flag alone is not proof.\u003c/p>\n\u003cp>Vite documents resolving duplicated dependencies to a root copy, along with limitations for certain SSR ESM outputs: \u003ca href=\"https://vite.dev/config/shared-options#resolve-dedupe\" rel=\"noreferrer\">resolve.dedupe\u003c/a>. Its \u003ca href=\"https://vite.dev/guide/build\" rel=\"noreferrer\">production build\u003c/a> manages emitted assets. Browser \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script/type/importmap\" rel=\"noreferrer\">import maps\u003c/a> can map names to module URLs, but do not make incompatible package APIs compatible. Exact implementation must match the Vite version bundled with the chosen Astro release; versions have not been pinned.\u003c/p>\n\u003ch2 id=\"documents-and-identity-q34\">Documents and identity — Q34\u003c/h2>\n\u003cp>Accepted: immutable record IDs and ID-based filenames, with editable paths/slugs stored inside. Draft concrete page shape:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \"formatVersion\": 1,\n  \"id\": \"page_about\",\n  \"path\": \"/about\",\n  \"title\": \"About\",\n  \"blocks\": [\n    {\n      \"id\": \"block_intro\",\n      \"type\": \"core/hero\",\n      \"version\": 1,\n      \"props\": { \"heading\": \"About us\" }\n    }\n  ]\n}\n\u003c/code>\u003c/pre>\n\u003cp>Proposed path: \u003ccode>content/pages/&lt;id&gt;.json\u003c/code>. Entries use \u003ccode>content/entries/&lt;collectionId&gt;/&lt;id&gt;.json\u003c/code> with \u003ccode>collectionId\u003c/code>, \u003ccode>slug\u003c/code>, custom \u003ccode>values\u003c/code>, and ordered \u003ccode>blocks\u003c/code>. Definitions live in \u003ccode>content/collections/&lt;id&gt;.json\u003c/code>; settings and media metadata have separate records. Example IDs above are readable placeholders; the concrete definitions below specify ID generation. Reserved route validation is required before publishing. Draft/main branches determine publication; no second per-record publication flag is implied.\u003c/p>\n\u003ch2 id=\"text-inside-blocks-q35\">Text inside blocks — Q35\u003c/h2>\n\u003cp>Accepted: JSON remains the outer format, with Markdown strings for formatted prose inside text blocks. Use a shared renderer and a restricted safe feature set. This does not add arbitrary executable Markdown/MDX or change the accepted collection field scope. Users edit through visual formatting controls for headings, paragraphs, emphasis, links, and lists. Unsupported externally edited Markdown must be preserved or explicitly rejected for visual editing, never silently discarded on a round-trip.\u003c/p>\n\u003ch2 id=\"versioning-q36\">Versioning — Q36\u003c/h2>\n\u003cp>Accepted: retain old implementations, mark them deprecated, and let users explicitly choose the block version. A block instance's \u003ccode>type\u003c/code> plus \u003ccode>version\u003c/code> selects its renderer and field definition. Deprecated means still renderable and selectable, not automatically upgraded. No automated migration functions.\u003c/p>\n\u003cp>On an explicit version switch, carry over fields only when keys and value types remain compatible with the target definition. New, renamed, incompatible, or otherwise unmatched target fields begin empty for manual entry; do not guess mappings or silently fill new fields with defaults. Preserve the original instance during the unsaved edit so cancellation can restore it. Save is the boundary for persisting the new version. Required empty values may be saved in drafts but block Publish.\u003c/p>\n\u003cp>Proposed source layout: \u003ccode>src/blocks/&lt;name&gt;/v1/\u003c/code>, \u003ccode>v2/\u003c/code>, each with its own definition and renderer. The registry maps \u003ccode>(type, version)\u003c/code> to an installed implementation. Newly added instances default to the latest nondeprecated version; the version selector still exposes retained versions. Keep an independent \u003ccode>formatVersion\u003c/code> on file envelopes. If an implementation is genuinely missing, preserve its raw data and show a repairable error rather than dropping the instance. These guardrails preserve the user's manual model without inventing a migration subsystem.\u003c/p>\n\u003ch2 id=\"block-manifest-and-rendering-q37\">Block manifest and rendering — Q37\u003c/h2>\n\u003cp>Illustrative source organization: \u003ccode>src/blocks/&lt;name&gt;/definition.ts\u003c/code>, a shared rendering component/template, optional styles, and optional custom widgets. An explicit registry imports installed blocks. A definition declares a stable type, data version, fields/defaults, framework, renderer entries, dependency requirements, and activation policy. Content JSON only names the block type and supplies JSON values; it contains no import paths or executable callbacks.\u003c/p>\n\u003cp>Accepted: framework adapters around ordinary React/Svelte/Vue components; vanilla/custom blocks implement the same lifecycle directly. Draft signature:\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">interface PreviewHandle&lt;Props&gt; {\n  update(props: Props, context: BlockContext): void;\n  destroy(): void;\n}\ntype Mount&lt;Props&gt; = (\n  host: HTMLElement,\n  props: Props,\n  context: BlockContext\n) =&gt; PreviewHandle&lt;Props&gt;;\n\u003c/code>\u003c/pre>\n\u003cp>The host is a stable block root. Updates receive the complete structurally valid props object, which may contain blank or missing draft values; preview renderers must tolerate these and show placeholders. Public renderers receive publish-valid values. Removal cleans up listeners, subscriptions, and the framework root. Reordering preserves instance IDs and avoids remounting unnecessarily. The build renderer consumes the same validated props/context through Astro's static rendering path. Astro integration details must be validated before treating this as a final interface.\u003c/p>\n\u003cp>Proposed context contains stable instance identity, optional global theme/settings, and media/reference resolution. GitHub/R2 clients and credentials are not passed as block props. This is an API separation, not a security sandbox: developer-installed code in the same document is trusted code.\u003c/p>\n\u003cp>Custom field widgets are React components that receive a JSON value, change callback, field configuration, and validation/read-only state. Their saved values still pass the field schema. Exact signatures depend on the answers and must remain small.\u003c/p>\n\u003ch2 id=\"activation-q38\">Activation — Q38\u003c/h2>\n\u003cp>Accepted: a block declaration of \u003ccode>never\u003c/code>, \u003ccode>visible\u003c/code>, \u003ccode>idle\u003c/code>, or \u003ccode>load\u003c/code> for public-page browser activation, with complete static HTML where appropriate. Preview always mounts the necessary renderer so edits appear immediately; this differs from public hydration policy. Framework runtime/dependency loading is shared, regardless of when block instances activate. Astro provides these public hydration modes; see \u003ca href=\"https://docs.astro.build/en/reference/directives-reference/#client-directives\" rel=\"noreferrer\">client directives\u003c/a>. Custom adapters must honor equivalent behavior where Astro directives do not apply directly.\u003c/p>\n\u003ch2 id=\"references-q39\">References — Q39\u003c/h2>\n\u003cp>Accepted: stable IDs for internal page/entry/media references, with explicit URLs for external links. Proposed record detail: media records contain R2 object URLs, image variants, dimensions, MIME type, and size. Blocks reference media IDs plus presentation data such as alt text. The build resolves IDs to URLs; published pages need not fetch the source metadata registry. This avoids duplicating a variant set into every block but adds a reference-resolution step.\u003c/p>\n\u003ch2 id=\"supporting-stack-choices\">Supporting stack choices\u003c/h2>\n\u003cp>The selected core is Astro/TypeScript, React, Base UI, and CSS Modules, with Astro's compatible Vite toolchain. Use native controls where sufficient. Blocks use React/Svelte/Vue integrations or the vanilla adapter. Exact package versions must be pinned together during scaffolding; illustrative versions mentioned in answers are not pins.\u003c/p>\n\u003cp>Engineering recommendations for remaining supporting tools:\u003c/p>\n\u003cul>\n\u003cli>Octokit for the requested browser GitHub SDK, importing only required client/API features. Its \u003ca href=\"https://github.com/octokit/octokit.js\" rel=\"noreferrer\">official repository\u003c/a> documents browser support.\u003c/li>\n\u003cli>AWS SDK v3 S3 client for R2, loaded with the media editor. Cloudflare supplies an \u003ca href=\"https://developers.cloudflare.com/r2/examples/aws/aws-sdk-js-v3/\" rel=\"noreferrer\">R2 example\u003c/a>.\u003c/li>\n\u003cli>Lexical's React integration with a restricted Markdown transformer set as the visual-editor candidate. Its \u003ca href=\"https://lexical.dev/docs/packages/lexical-markdown\" rel=\"noreferrer\">Markdown package\u003c/a> supports import/export and selectable transformers. Verify fidelity and bundle cost before adoption; do not persist Lexical's internal document format as the content source.\u003c/li>\n\u003cli>pnpm with one lockfile and a Node version supported by the selected Astro release. No separate independently bundled copy of the admin's React runtime.\u003c/li>\n\u003c/ul>\n\u003cp>These recommendations identify an implementation direction, not user-approved package pins or measured integration results.\u003c/p>\n\u003ch2 id=\"concrete-record-definitions\">Concrete record definitions\u003c/h2>\n\u003cp>These are the initial engineering definitions. Use JSON with two-space indentation and a final newline. Sort object keys consistently where meaningful; preserve array order for blocks, navigation, fields, and select options. Generate IDs once using UUIDs with entity prefixes; the shorter readable IDs in examples are illustrative. Renaming a route does not rename its ID file.\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">type JsonValue = null | boolean | number | string | JsonValue[] | JsonObject;\ninterface JsonObject { [key: string]: JsonValue }\ninterface Envelope { formatVersion: 1; id: string }\ninterface BlockInstance {\n  id: string;\n  type: string;          // e.g. core/hero\n  version: number;      // installed implementation version\n  props: JsonObject;\n}\ninterface PageRecord extends Envelope {\n  path: string;         // absolute public route\n  title: string;\n  blocks: BlockInstance[];\n}\ninterface EntryRecord extends Envelope {\n  collectionId: string;\n  slug: string;         // route segment under the collection\n  values: JsonObject;\n  blocks: BlockInstance[];\n}\ninterface CollectionRecord extends Envelope {\n  name: string;\n  path: string;\n  fields: FieldSpec[];\n  titleField: string;   // key of a text field in values\n  template: \"standard\";\n}\ntype LinkRef =\n  | { kind: \"page\" | \"entry\"; id: string; fragment?: string }\n  | { kind: \"external\"; url: string };\ninterface MediaRef { mediaId: string; alt?: string }\ninterface MediaFile {\n  key: string; url: string; mime: string; bytes: number;\n  width?: number; height?: number;\n}\ninterface MediaRecord extends Envelope {\n  name: string;\n  original: MediaFile;\n  variants: MediaFile[];\n}\ninterface SiteRecord extends Envelope {\n  title: string;\n  globals: JsonObject;\n  navigation: { id: string; label: string; to: LinkRef }[];\n}\n\u003c/code>\u003c/pre>\n\u003cp>Files live under \u003ccode>content/pages/\u003c/code>, \u003ccode>content/entries/&lt;collectionId&gt;/\u003c/code>, \u003ccode>content/collections/\u003c/code>, and \u003ccode>content/media/\u003c/code>, using \u003ccode>&lt;id&gt;.json\u003c/code>. \u003ccode>content/site.json\u003c/code> stores the site record. Connection configuration is separate from content, and no credential is serialized into these files.\u003c/p>\n\u003cp>Paths must be unique across pages, collection listings, and entry routes. Normalize paths and reject traversal, reserved admin/assets routes, and collisions. Internal references resolve through IDs. External links use allowed URL schemes; scripts are never a link target. Media URLs are derived from configured R2/public origins and recorded per uploaded object. The registry is used during build/preview, not fetched by every public block.\u003c/p>\n\u003ch2 id=\"field-and-custom-widget-definitions\">Field and custom-widget definitions\u003c/h2>\n\u003cpre>\u003ccode class=\"language-ts\">interface FieldBase {\n  key: string; label: string; required?: boolean;\n  default?: JsonValue;\n}\ntype FieldSpec = FieldBase &amp; (\n  | { type: \"text\"; multiline?: boolean }\n  | { type: \"number\"; min?: number; max?: number }\n  | { type: \"date\" }                 // YYYY-MM-DD\n  | { type: \"toggle\" }               // boolean, false is a value\n  | { type: \"select\"; options: { value: string; label: string }[] }\n  | { type: \"media\" }                // MediaRef\n);\ntype BlockField = (FieldSpec &amp; { widget?: string }) | (FieldBase &amp; {\n  type: \"custom\"; widget: string;    // block-owned JSON validation required\n});\ninterface WidgetProps&lt;Value extends JsonValue&gt; {\n  value: Value | undefined;\n  onChange(value: Value): void;\n  field: BlockField;\n  errors: readonly string[];\n  readOnly: boolean;\n}\ninterface ValidationIssue {\n  path: string;                     // document/block/field address\n  code: string;\n  message: string;                  // plain-language UI text\n  phase: \"structure\" | \"publish\";\n}\n\u003c/code>\u003c/pre>\n\u003cp>Collection definitions permit only \u003ccode>FieldSpec\u003c/code>; custom block controls do not expand the collection schema-builder scope. A Markdown control stores a string, while a compound block-specific control can use \u003ccode>custom\u003c/code> with the block's shared pure validator. The browser/build run identical value validation. Widget registration maps stable IDs to trusted React components; JSON never supplies component source code.\u003c/p>\n\u003cp>Field keys and select option values are stable machine identifiers; labels are editable. Empty draft values are omitted or null; empty required text is a publication error, while zero and false are valid values. Nonempty values of the wrong type are structural errors. Do not coerce existing numbers, strings, or selections to make a new version appear compatible.\u003c/p>\n\u003cp>Developers and the portal edit the same serialized collection definition. New fields are optional by default unless existing entries can satisfy required validation. Block schema definitions remain developer-owned. Collection keys/types with existing data cannot be destructively renamed/changed through the initial portal. Adding an entry initializes declared defaults; switching an existing block version follows the manual blank-field rule above instead.\u003c/p>\n\u003ch2 id=\"block-source-contract-and-styles\">Block source contract and styles\u003c/h2>\n\u003cp>A source definition includes \u003ccode>type\u003c/code>, integer \u003ccode>version\u003c/code>, \u003ccode>label\u003c/code>, optional \u003ccode>deprecated\u003c/code>, \u003ccode>fields\u003c/code>, \u003ccode>defaults\u003c/code>, \u003ccode>framework\u003c/code>, \u003ccode>activation\u003c/code>, and declared dependency ranges. Separate renderer registrations reference compiled source modules: a static renderer, a browser mount entry, and optional React widget loaders. Framework adapters generate common lifecycle behavior from a shared component when possible. Explicit alternate renderers need parity fixtures.\u003c/p>\n\u003cp>Do not import every block or framework into every public page. Generate statically analyzable registry entries and lazy browser loaders as part of the build. Keep browser-safe metadata separate from build-only rendering code; do not send server modules or credentials to the browser. Preview code must load only installed registered versions and clean up after itself.\u003c/p>\n\u003cp>Blocks use CSS Modules or framework-scoped styles. CSS resets and document-wide theme variables belong to the shell. Namespaced keyframes/fonts and popup portal containers need equivalent ownership. Portals used by editor components mount inside a styled editor-owned container; block popups must retain block-scoped classes. Optional globals such as theme are passed as values/CSS variables, with no mandatory stylistic adherence.\u003c/p>\n\u003cp>CSS scoping is a contract and validation target, not a sandbox for arbitrary untrusted JavaScript. Public HTML, the admin document, and every retained block version must be checked for cross-component style leakage and duplicate runtime execution.\u003c/p>\n\u003ch2 id=\"save-recovery-and-publish\">Save, recovery, and Publish\u003c/h2>\n\u003cp>Accepted behavior: Save includes all pending editor changes in one draft commit; incomplete content may be saved. Publish requires valid required values and resolvable references. Tab-session recovery preserves unsaved content through reloads, without persisting uploaded binary buffers.\u003c/p>\n\u003cp>Engineering transaction design:\u003c/p>\n\u003col>\n\u003cli>Load a coherent content snapshot from an immutable draft commit. Hold its SHA as the editing base.\u003c/li>\n\u003cli>Validate structural integrity of all staged records and file paths. Serialize the full pending change set into a tree and a single commit parented by that base.\u003c/li>\n\u003cli>Advance the draft reference without force. If another writer has advanced it incompatibly, reject the stale save; preserve edits and explain recovery. Do not overwrite a file-at-a-time or silently replay the user's values onto newer content.\u003c/li>\n\u003cli>On uncertain network results, compare the remote reference/commit before retrying. Only clear recovery state after the intended saved commit is confirmed. Associate recovery with repository, branch, base commit, and editor compatibility version.\u003c/li>\n\u003cli>Publish operates on a saved, immutable draft snapshot, not unsaved local state. Validate that entire snapshot, including installed block versions, schema compatibility, paths, references, and required fields. Revalidate during the production build as well.\u003c/li>\n\u003cli>Initial implementation direction: publish through a fast-forward merge of the validated snapshot into main, using a non-forced reference update. Main must be an ancestor; diverged source/content changes require synchronization and renewed validation. This preserves the snapshot under concurrent updates without claiming a preflight read is a lock. Fast-forwarding satisfies the selected draft-to-main merge behavior without requiring a special merge commit.\u003c/li>\n\u003cli>After publishing, retain newer unpublished draft commits if present; never reset the draft branch or force main. Report “published to Git; deployment pending” until deployment completion is actually known. Netlify owns the deployment pipeline.\u003c/li>\n\u003c/ol>\n\u003cp>GitHub exposes the required \u003ca href=\"https://docs.github.com/en/rest/git/trees#create-a-tree\" rel=\"noreferrer\">tree\u003c/a>, \u003ca href=\"https://docs.github.com/en/rest/git/commits#create-a-commit\" rel=\"noreferrer\">commit\u003c/a>, and \u003ca href=\"https://docs.github.com/en/rest/git/refs#update-a-reference\" rel=\"noreferrer\">reference\u003c/a> operations. Its \u003ca href=\"https://docs.github.com/en/rest/branches/branches#merge-a-branch\" rel=\"noreferrer\">merge endpoint\u003c/a> also accepts an immutable commit SHA, but can merge against a changing base; that alone does not guarantee a previously validated full output tree. The initial fast-forward constraint is an engineering recommendation that needs race testing.\u003c/p>\n\u003cp>Session recovery includes the base SHA and incomplete values. If the server draft changed, restore local work as recoverable edits rather than silently treating it as current. If browser storage is unavailable/full, show that recovery is unavailable and keep live edits intact. Keep credentials out of content backups, logs, and Git. R2 credential retention can follow the GitHub tab-session default; this is an engineering default, not a separately answered preference.\u003c/p>\n\u003ch2 id=\"initial-proof-and-validation-targets\">Initial proof and validation targets\u003c/h2>\n\u003cp>Implementation remains unstarted. Validate these before widening the block catalog:\u003c/p>\n\u003cul>\n\u003cli>Render repeated React blocks, another framework block, and a vanilla block in public output and a single-document preview. Verify compatible vendors execute once per document, styles stay scoped, and pages load only their required dependencies.\u003c/li>\n\u003cli>Edit/reorder/remove blocks; ensure updates appear immediately and destruction releases handlers. Compare published and preview content/layout on fixed fixtures.\u003c/li>\n\u003cli>Render a retained deprecated version; switch versions, carry only compatible fields, leave unmatched values blank, cancel safely, and Save incomplete data without automatic migrations.\u003c/li>\n\u003cli>Round-trip the limited Markdown feature set through visual editing and shared rendering, including pasted content and unsupported markup preservation.\u003c/li>\n\u003cli>Verify all-or-nothing multi-record saves, stale saves, lost responses, reload recovery, invalid Publish rejection, concurrent saves during Publish, and divergent main handling.\u003c/li>\n\u003cli>Upload image variants to a test R2 bucket, verify IDs/metadata and responsive URLs, and preserve original files when a format cannot safely be resized. Verify credentials never appear in generated assets.\u003c/li>\n\u003c/ul>\n\u003cp>Exact image widths/quality, upload limits, package pins, drag-and-drop implementation, and route reservations are bounded engineering details to validate during implementation, not unresolved product preferences. No application behavior is claimed tested by the wiki build.\u003c/p>\n","backlinks":["index","discussions/open-questions","journal/2026-10-05-content-block-contracts","journal/2026-10-05-editor-saving","journal/2026-10-05-technical-foundations"]},{"id":"journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-04\u003c/span>","updated":"2026-10-04","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-04\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `528c4b19-f488-4209-ab5c-b9c13f420f02`\n\n## Question 1\n\n```text\nRound: lean-sitebuilder\nQuestion: What does ‘all while being a static website’ permit?\nContext: Both the public site and editor can be static. Git writes still need authorization, and redeployment needs a build runner. GitHub’s standard web OAuth token exchange requires a client secret, which cannot safely live in the static bundle.\nRecommendation: A small on-demand auth/Git helper plus build jobs avoids an always-running CMS and supports a smoother login.\nOptions: Allow a small serverless auth/Git helper plus build jobs / No custom server-side code; accept a user-supplied Git token or compatible external auth service, plus build jobs\nSelected: Something else\nNotes: allow user access to the admin portal via a environmentvariable-set credential. then when \"submitting\",  a user-supplied git token is required. just github compatibility is fine for now\n```\n\n## Question 2\n\n```text\nRound: lean-sitebuilder\nQuestion: Who must be comfortable using the editor in the first version?\nContext: This shapes login, media uploads, and publishing feedback.\nRecommendation: Design for nontechnical site owners if you intend to hand sites to clients.\nOptions: Nontechnical clients and site owners / Me and developers who are comfortable with GitHub / Both developers and nontechnical clients from day one\nSelected: Nontechnical clients and site owners\nNotes: \n```\n\n## Question 3\n\n```text\nRound: lean-sitebuilder\nQuestion: How much CMS functionality belongs in the first version?\nContext: Posts and other structured collections add a separate content-modeling problem.\nRecommendation: Start with pages, navigation, site settings, and media to keep the first release focused.\nOptions: Pages, navigation, site settings, and media / Also include blog posts or other repeatable content collections / A general collection/schema builder comparable to Payload\nSelected: Also include blog posts or other repeatable content collections\nNotes: \n```\n\n## Question 4\n\n```text\nRound: lean-sitebuilder\nQuestion: Can block authors be required to follow a shared dependency contract?\nContext: React, Svelte, Vue, and vanilla blocks can coexist. Loading one shared runtime per framework requires compatible versions and declared dependencies; arbitrary self-bundled blocks cannot guarantee deduplication.\nRecommendation: Require declared dependencies and compatible shared versions so blocks can share libraries reliably.\nOptions: Require declared dependencies and compatible shared versions / Accept arbitrary bundles, even when libraries must be duplicated / Support only one interactive framework initially\nSelected: Require declared dependencies and compatible shared versions\nNotes: \n```\n\n## Question 5\n\n```text\nRound: lean-sitebuilder\nQuestion: How much layout freedom should the editor offer initially?\nContext: All options include the side drawer and live preview. The difference is what can be rearranged and styled.\nRecommendation: Start with ordered sections, schema-defined fields, repeatable items, and block-specific design controls to keep blocks predictable.\nOptions: Reorder sections and edit each block’s defined fields and design controls / Also support nested containers, columns, and blocks within blocks / Full Elementor-style positioning and responsive styling of individual elements\nSelected: Reorder sections and edit each block’s defined fields and design controls\nNotes: \n```\n\n## Question 6\n\n```text\nRound: lean-sitebuilder\nQuestion: Should Save publish after a rebuild, or should saving and publishing be separate?\nContext: Unsaved edits appear in the live preview first. This determines when they reach Git and become public.\nRecommendation: Explicit Save → Git commit → automatic rebuild matches your original description.\nOptions: Explicit Save commits and automatically redeploys / Save creates a draft; Publish separately triggers deployment / Autosave changes to Git and continuously redeploy\nSelected: Something else\nNotes: save produces commits, which are pushed to a branch with draft \"unpublished\" content. when another \"publish\" action is clicked, whatever is in the unpublished draft is merged to main branch, and then deployed\n```\n\n## Question 7\n\n```text\nRound: lean-sitebuilder\nQuestion: What should lean-sitebuilder inherit from astro-payload?\nContext: Migrating all existing sites would substantially expand the first release.\nRecommendation: Build a fresh core and port a few representative existing blocks to prove the new block contract.\nOptions: Fresh core with a few existing blocks ported / Fresh core and entirely new starter blocks; old project is reference only / Migration compatibility for existing astro-payload sites and content\nSelected: Fresh core and entirely new starter blocks; old project is reference only\nNotes: \n```\n","toc":[{"id":"question-1","title":"Question 1","depth":2},{"id":"question-2","title":"Question 2","depth":2},{"id":"question-3","title":"Question 3","depth":2},{"id":"question-4","title":"Question 4","depth":2},{"id":"question-5","title":"Question 5","depth":2},{"id":"question-6","title":"Question 6","depth":2},{"id":"question-7","title":"Question 7","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>528c4b19-f488-4209-ab5c-b9c13f420f02\u003c/code>\u003c/p>\n\u003ch2 id=\"question-1\">Question 1\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: What does ‘all while being a static website’ permit?\nContext: Both the public site and editor can be static. Git writes still need authorization, and redeployment needs a build runner. GitHub’s standard web OAuth token exchange requires a client secret, which cannot safely live in the static bundle.\nRecommendation: A small on-demand auth/Git helper plus build jobs avoids an always-running CMS and supports a smoother login.\nOptions: Allow a small serverless auth/Git helper plus build jobs / No custom server-side code; accept a user-supplied Git token or compatible external auth service, plus build jobs\nSelected: Something else\nNotes: allow user access to the admin portal via a environmentvariable-set credential. then when \"submitting\",  a user-supplied git token is required. just github compatibility is fine for now\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-2\">Question 2\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: Who must be comfortable using the editor in the first version?\nContext: This shapes login, media uploads, and publishing feedback.\nRecommendation: Design for nontechnical site owners if you intend to hand sites to clients.\nOptions: Nontechnical clients and site owners / Me and developers who are comfortable with GitHub / Both developers and nontechnical clients from day one\nSelected: Nontechnical clients and site owners\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-3\">Question 3\u003c/h2>\n\u003cpre>\u0 ested containers, columns, and blocks within blocks / Full Elementor-style positioning and responsive styling of individual elements\nSelected: Reorder sections and edit each block’s defined fields and design controls\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-6\">Question 6\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: Should Save publish after a rebuild, or should saving and publishing be separate?\nContext: Unsaved edits appear in the live preview first. This determines when they reach Git and become public.\nRecommendation: Explicit Save → Git commit → automatic rebuild matches your original description.\nOptions: Explicit Save commits and automatically redeploys / Save creates a draft; Publish separately triggers deployment / Autosave changes to Git and continuously redeploy\nSelected: Something else\nNotes: save produces commits, which are pushed to a branch with draft \"unpublished\" content. when another \"publish\" action is clicked, whatever is in the unpublished draft is merged to main branch, and then deployed\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-7\">Question 7\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: What should lean-sitebuilder inherit from astro-payload?\nContext: Migrating all existing sites would substantially expand the first release.\nRecommendation: Build a fresh core and port a few representative existing blocks to prove the new block contract.\nOptions: Fresh core with a few existing blocks ported / Fresh core and entirely new starter blocks; old project is reference only / Migration compatibility for existing astro-payload sites and content\nSelected: Fresh core and entirely new starter blocks; old project is reference only\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-one-decisions"]},{"id":"journal/2026-10-05-content-block-contracts","title":"Content and block contracts","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Content and block contracts\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Content and block contracts\n\nThe [submitted answers](2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134.md) establish DEC-035 through DEC-041 in the [decision register](../decisions/index.md): generated self-hosted vendor modules, permanent document IDs, Markdown strings inside JSON blocks, framework preview adapters, author-declared activation, and stable internal references.\n\nThe user rejects the proposed automated migration approach. Old block implementations remain installed and are marked deprecated. A version selector changes the selected implementation; compatible values carry over, while unrecognized, renamed, or incompatible fields start empty for the user to fill. No inferred rename conversion or developer migration-function framework is required. The [technical contracts](../discussions/technical-contracts.md) now reflect this model.\n\nRetained block versions still fall under the previously accepted compatible shared-dependency rule. Keeping an old block implementation does not implicitly authorize multiple React runtimes or incompatible library versions. Any integration conflict must be explained and fixed in block code/dependency requirements rather than silently bypassing that rule.\n\nThe remaining round covers editor components/styles, save scope, unsaved recovery, Markdown authoring, and incomplete draft validation. Those choices affect observable behavior and dependency selection. Application implementation has not started.\n","toc":[],"titleAnchor":"content-and-block-contracts","links":["journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134","decisions/index","discussions/technical-contracts"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134\">submitted answers\u003c/a> establish DEC-035 through DEC-041 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>: generated self-hosted vendor modules, permanent document IDs, Markdown strings inside JSON blocks, framework preview adapters, author-declared activation, and stable internal references.\u003c/p>\n\u003cp>The user rejects the proposed automated migration approach. Old block implementations remain installed and are marked deprecated. A version selector changes the selected implementation; compatible values carry over, while unrecognized, renamed, or incompatible fields start empty for the user to fill. No inferred rename conversion or developer migration-function framework is required. The \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a> now reflect this model.\u003c/p>\n\u003cp>Retained block versions still fall under the previously accepted compatible shared-dependency rule. Keeping an old block implementation does not implicitly authorize multiple React runtimes or incompatible library versions. Any integration conflict must be explained and fixed in block code/dependency requirements rather than silently bypassing that rule.\u003c/p>\n\u003cp>The remaining round covers editor components/styles, save scope, unsaved recovery, Markdown authoring, and incomplete draft validation. Those choices affect observable behavior and dependency selection. Application implementation has not started.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions"]},{"id":"journal/2026-10-05-editor-saving","title":"Editor and saving","section":"Journal","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Editor and saving\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Editor and saving\n\nThe [submitted answers](2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc.md) establish DEC-042 through DEC-047: Base UI/CSS Modules, scoped block styling, one commit for all pending edits, tab-session recovery, visual Markdown authoring, and incomplete draft saves with publication validation.\n\nThese answers complete the technical interview's consequential choices. The [technical contracts](../discussions/technical-contracts.md) consolidate explicit decisions and concrete engineering definitions. Supporting library candidates, exact package pins, bundle behavior, framework adapter integration, Markdown round-tripping, and Git race handling still need implementation validation. They are not reasons for another preference questionnaire.\n\nNo application source or dependency installation has been created. The next implementation step is an end-to-end proof of shared rendering and runtime deduplication, followed by the content editor and safe Git workflow. The product scope and retained deprecated-block model remain unchanged.\n","toc":[],"titleAnchor":"editor-and-saving","links":["journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc","discussions/technical-contracts"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc\">submitted answers\u003c/a> establish DEC-042 through DEC-047: Base UI/CSS Modules, scoped block styling, one commit for all pending edits, tab-session recovery, visual Markdown authoring, and incomplete draft saves with publication validation.\u003c/p>\n\u003cp>These answers complete the technical interview's consequential choices. The \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a> consolidate explicit decisions and concrete engineering definitions. Supporting library candidates, exact package pins, bundle behavior, framework adapter integration, Markdown round-tripping, and Git race handling still need implementation validation. They are not reasons for another preference questionnaire.\u003c/p>\n\u003cp>No application source or dependency installation has been created. The next implementation step is an end-to-end proof of shared rendering and runtime deduplication, followed by the content editor and safe Git workflow. The product scope and retained deprecated-block model remain unchanged.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions"]},{"id":"journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `103bfb33-1e8a-4133-9528-3baf8aa57275`\n\n## Question 25\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: Which foundation should build the public site?\nContext: Both choices produce static HTML and keep the admin app static. Astro already integrates multiple UI frameworks. A custom Vite-based generator would make us own routing, prerendering, and framework integration ourselves.\nRecommendation: Astro with TypeScript: use its static build and framework integrations, while keeping our content format and block definitions independent where practical.\nOptions: Astro with TypeScript / Vite with TypeScript and a custom static generator\nSelected: Astro with TypeScript\nNotes: \n```\n\n## Question 26\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: Which framework should implement the admin drawer and CMS screens?\nContext: This choice applies to the editor UI only. Registered blocks can still use React, Svelte, Vue, or vanilla code. The earlier removal of React from grill-form does not require removing it from this application.\nRecommendation: React with TypeScript for the editor's interacting forms and controls; keep block mounting behind framework-neutral adapters.\nOptions: React with TypeScript / Svelte with TypeScript / Vue with TypeScript\nSelected: React with TypeScript\nNotes: \n```\n\n## Question 27\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: What should the source content files use?\nContext: These files hold page metadata, ordered block instances, field values, and collection definitions. The format must survive browser editing and remain understandable in Git.\nRecommendation: Formatted JSON. It directly represents the editor's structured data and needs no extra parser or executable content.\nOptions: JSON for structured content and definitions / YAML for structured content and definitions / Markdown with frontmatter and an embedded block representation\nSelected: JSON for structured content and definitions\nNotes: \n```\n\n## Question 28\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: How should content be divided into files?\nContext: Many small files make individual changes easier to review and reduce unrelated edits touching the same file. Large aggregate files are easier to fetch but combine more changes.\nRecommendation: One file per page or entry, one per collection definition, and separate site settings/media records. Save related file changes together in one commit.\nOptions: Separate files per page, entry, and definition / One aggregate file per collection, plus pages/settings files / One file containing the whole site's content and definitions\nSelected: Separate files per page, entry, and definition\nNotes: \n```\n\n## Question 29\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: What should a field schema look like?\nContext: The portal must save schemas as data. A small model could look like { key: 'title', type: 'text', required: true }. JSON Schema is a broader standard for validating data; form widgets and layout still need extra metadata.\nRecommendation: Use a small declarative field model covering the agreed field types, interpreted by the editor and build. Keep it serializable and versioned.\nOptions: A small purpose-built field model / A supported subset of JSON Schema plus editor UI metadata\nSelected: A small purpose-built field model\nNotes: \n```\n\n## Question 30\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: What rendering contract should a block author follow for published pages and live preview?\nContext: Both paths must show the same content and design. A reusable React/Svelte/Vue component can often serve both, but a build-only template cannot itself rerender unsaved changes in the browser.\nRecommendation: Share rendering source by default. Allow separate build/preview implementations when necessary, with checks that they stay equivalent.\nOptions: Shared rendering source by default; separate implementations require parity checks / Require one reusable rendering source for every block / Treat build and preview as separate implementations for every block\nSelected: Shared rendering source by default; separate implementations require parity checks\nNotes: my suggestion: all libraries used by authored blocks (that are possibly shared) (e.g. react@18, svelte@5, react-hook-form@7.8, @base-ui/react@1.8, etc.) should have their (minified, if possible) registered vendor files located in a statically hosted  location, and loaded from there. this way, we don't have to load more than 1 different versions of react, or more than 1 different versions of svelte, if possible. keeping the asset loading lean\n```\n\n## Question 31\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: Should the preview share the editor's document or live in an iframe?\nContext: A shared document can reuse the editor's live framework runtime, but requires scoped styles. An iframe isolates the preview's CSS and viewport; its runtime is separate even if downloads are cached, relaxing runtime deduplication inside the admin view. Public pages can still deduplicate normally.\nRecommendation: Use one document with scoped editor/block CSS to preserve runtime sharing. Treat CSS isolation as part of the block contract.\nOptions: One document; scope styles and share runtimes / A preview iframe; accept separate runtime instances in the admin view\nSelected: One document; scope styles and share runtimes\nNotes: \n```\n\n## Question 32\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: Can block authors add custom field controls to the editor?\nContext: Built-in controls cover ordinary text, choices, images, and similar values. A custom widget could provide a special color palette, chart-data editor, or other block-specific control.\nRecommendation: Provide built-in controls plus a small optional custom-widget interface. Custom widgets use the editor's selected framework; the block's renderer remains framework-independent.\nOptions: Built-in controls plus optional custom widgets / Built-in controls only for the first version\nSelected: Built-in controls plus optional custom widgets\nNotes: \n```\n","toc":[{"id":"question-25","title":"Question 25","depth":2},{"id":"question-26","title":"Question 26","depth":2},{"id":"question-27","title":"Question 27","depth":2},{"id":"question-28","title":"Question 28","depth":2},{"id":"question-29","title":"Question 29","depth":2},{"id":"question-30","title":"Question 30","depth":2},{"id":"question-31","title":"Question 31","depth":2},{"id":"question-32","title":"Question 32","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>103bfb33-1e8a-4133-9528-3baf8aa57275\u003c/code>\u003c/p>\n\u003ch2 id=\"question-25\">Question 25\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: Which foundation should build the public site?\nContext: Both choices produce static HTML and keep the admin app static. Astro already integrates multiple UI frameworks. A custom Vite-based generator would make us own routing, prerendering, and framework integration ourselves.\nRecommendation: Astro with TypeScript: use its static build and framework integrations, while keeping our content format and block definitions independent where practical.\nOptions: Astro with TypeScript / Vite with TypeScript and a custom static generator\nSelected: Astro with TypeScript\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-26\">Question 26\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: Which framework should implement the admin drawer and CMS screens?\nContext: This choice applies to the editor UI only. Registered blocks can still use React, Svelte, Vue, or vanilla code. The earlier removal of React from grill-form does not require removing it from this application.\nRecommendation: React with TypeScript for the editor's interacting forms and controls; keep block mounting behind framework-neutral adapters.\nOptions: React with TypeScript / Svelte with TypeScript / Vue with TypeScript\nSelected: React with TypeScript\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-27\">Question 27\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: What should the source content files use?\nContext: These files hold page metadata, ordered block instances, field values, and collection definitions. The format must survive browser editing and remain understandable in Git.\nRecommendation: Formatted JSON. It directly represents the editor's structured data and needs no extra parser or executable content.\nOptions: JSON for structured content and definitions / YAML for structured content and definitions / Markdown with frontmatter and an embedded block representation\nSelected: JSON for structured content and definitions\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-28\">Question 28\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: How should content be divided into files?\nContext: Many small files make individual changes easier to review and reduce unrelated edits touching the same file. Large aggregate files are easier to fetch but combine more changes.\nRecommendation: One file per page or entry, one per collection definition, and separate site settings/media records. Save related file changes together in one commit.\nOptions: Separate files per page, entry, and definition / One aggregate file per collection, plus pages/settings files / One file containing the whole site's content and definitions\nSelected: Separate files per page, entry, and definition\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-29\">Question 29\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: What should a field schema look like?\nContext: The portal must save schemas as data. A small model could look like { key: 'title', type: 'text', required: true }. JSON Schema is a broader standard for validating data; form widgets and layout still need extra metadata.\nRecommendation: Use a small declarative field model covering the agreed field types, interpreted by the editor and build. Keep it serializable and versioned.\nOptions: A small purpose-built field model / A supported subset of JSON Schema plus editor UI metadata\nSelected: A small purpose-built field model\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-30\">Question 30\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: What rendering contract should a block author follow for published pages and live preview?\nContext: Both paths must show the same content and design. A reusable React/Svelte/Vue component can often serve both, but a build-only template cannot itself rerender unsaved changes in the browser.\nRecommendation: Share rendering source by default. Allow separate build/preview implementations when necessary, with checks that they stay equivalent.\nOptions: Shared rendering source by default; separate implementations require parity checks / Require one reusable rendering source for every block / Treat build and preview as separate implementations for every block\nSelected: Shared rendering source by default; separate implementations require parity checks\nNotes: my suggestion: all libraries used by authored blocks (that are possibly shared) (e.g. react@18, svelte@5, react-hook-form@7.8, @base-ui/react@1.8, etc.) should have their (minified, if possible) registered vendor files located in a statically hosted  location, and loaded from there. this way, we don't have to load more than 1 different versions of react, or more than 1 different versions of svelte, if possible. keeping the asset loading lean\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-31\">Question 31\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: Should the preview share the editor's document or live in an iframe?\nContext: A shared document can reuse the editor's live framework runtime, but requires scoped styles. An iframe isolates the preview's CSS and viewport; its runtime is separate even if downloads are cached, relaxing runtime deduplication inside the admin view. Public pages can still deduplicate normally.\nRecommendation: Use one document with scoped editor/block CSS to preserve runtime sharing. Treat CSS isolation as part of the block contract.\nOptions: One document; scope styles and share runtimes / A preview iframe; accept separate runtime instances in the admin view\nSelected: One document; scope styles and share runtimes\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-32\">Question 32\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: Can block authors add custom field controls to the editor?\nContext: Built-in controls cover ordinary text, choices, images, and similar values. A custom widget could provide a special color palette, chart-data editor, or other block-specific control.\nRecommendation: Provide built-in controls plus a small optional custom-widget interface. Custom widgets use the editor's selected framework; the block's renderer remains framework-independent.\nOptions: Built-in controls plus optional custom widgets / Built-in controls only for the first version\nSelected: Built-in controls plus optional custom widgets\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-technical-foundations"]},{"id":"journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `1a1e4868-048d-45f3-a291-5f8b6c42aae2`\n\n## Question 8\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: What should the admin login protect?\nContext: A password checked entirely in a static page can be bypassed. An environment variable does not change that. GitHub can still enforce access to the repository through the supplied token.\nRecommendation: Use the configured password as a convenience gate, with GitHub enforcing repository access. This keeps the editor entirely static.\nOptions: A convenience gate is enough; GitHub controls repository access / The admin page itself must be protected by hosting-provider access control\nSelected: A convenience gate is enough; GitHub controls repository access\nNotes: \n```\n\n## Question 9\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: What repository visibility must a deployed site support?\nContext: This refers to each site's repository. Public repositories expose source and draft branches. Private repositories also need authorization to read draft content, before saving anything.\nRecommendation: Start with private site repositories so unpublished content stays private.\nOptions: Private repositories only / Public repositories only; drafts may be visible / Both private and public repositories\nSelected: Both private and public repositories\nNotes: i usually deploy to netlify, which supports deployment on private repo branch pushes. i think theres no need to worry about this.\n```\n\n## Question 10\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Who should provide the GitHub token used by an editor?\nContext: This determines whether clients need their own GitHub account and who can revoke access. Do not enter an actual token here.\nRecommendation: Each editor uses their own GitHub account and token, so access can be revoked individually. The exact token setup must support their repository role.\nOptions: Each editor provides their own GitHub token / The site owner supplies a token for editors to use / Only a technical owner uses the token to save and publish\nSelected: Each editor provides their own GitHub token\nNotes: \n```\n\n## Question 11\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Which deployment setup should we support first?\nContext: Publishing merges drafts into main; a build must then deploy the static output. GitHub Pages hosting from a private repository requires an eligible account plan.\nRecommendation: Provide GitHub Actions and GitHub Pages as the reference setup, while keeping the output portable to other static hosts.\nOptions: GitHub Actions builds and deploys to GitHub Pages / An existing Git-connected host deploys main; name it in Notes / Provide build output only; the owner configures deployment\nSelected: (notes only)\nNotes: the site builder pushes content and schema changes to github with a SDK client. publish merges to main. when main is pushed, my netlify deployment will detect that and deploy it on its own, which you dont need to worry much about\n```\n\n## Question 12\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: How should users write the body of a blog post or collection entry?\nContext: Entries will also have structured metadata such as title and date.\nRecommendation: Reuse the block editor for entry bodies to keep one consistent editing experience.\nOptions: Use the same block editor as pages / Use a rich-text editor for entry bodies / Let each collection choose blocks or rich text\nSelected: Use the same block editor as pages\nNotes: \n```\n\n## Question 13\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Can we require block authors to provide a browser-compatible preview?\nContext: The editor must render unsaved changes immediately. A block that can only render during a build cannot do this without a separate preview implementation.\nRecommendation: Require a browser preview for every block, sharing rendering logic with the published version where possible.\nOptions: Yes; every block must support immediate browser preview / Allow build-only blocks with a placeholder while editing\nSelected: Yes; every block must support immediate browser preview\nNotes: \n```\n\n## Question 14\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: How should new block types become available in the editor?\nContext: This concerns installing a new block type, not adding another instance of an already-installed block to a page.\nRecommendation: A developer adds and registers block code, then rebuilds. This lets the build compile frameworks and share compatible dependencies.\nOptions: Developer installs and registers blocks in the repo, then rebuilds / Editors must be able to install new block types through the portal\nSelected: Developer installs and registers blocks in the repo, then rebuilds\nNotes: \n```\n","toc":[{"id":"question-8","title":"Question 8","depth":2},{"id":"question-9","title":"Question 9","depth":2},{"id":"question-10","title":"Question 10","depth":2},{"id":"question-11","title":"Question 11","depth":2},{"id":"question-12","title":"Question 12","depth":2},{"id":"question-13","title":"Question 13","depth":2},{"id":"question-14","title":"Question 14","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>1a1e4868-048d-45f3-a291-5f8b6c42aae2\u003c/code>\u003c/p>\n\u003ch2 id=\"question-8\">Question 8\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: What should the admin login protect?\nContext: A password checked entirely in a static page can be bypassed. An environment variable does not change that. GitHub can still enforce access to the repository through the supplied token.\nRecommendation: Use the configured password as a convenience gate, with GitHub enforcing repository access. This keeps the editor entirely static.\nOptions: A convenience gate is enough; GitHub controls repository access / The admin page itself must be protected by hosting-provider access control\nSelected: A convenience gate is enough; GitHub controls repository access\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-9\">Question 9\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: What repository visibility must a deployed site support?
