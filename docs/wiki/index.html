ref=\"https://kumo-ui.com/components/dialog/\" rel=\"noreferrer\">Kumo Dialog\u003c/a> demonstrates composed headings, content and action rows. Its base styling uses 24px padding and 16px gaps. Apply those dimensions to our drawer and forms, with closing/submitting actions together at the dialog's lower right.\u003c/li>\n\u003cli>\u003ca href=\"https://kumo-ui.com/components/button/\" rel=\"noreferrer\">Kumo Button\u003c/a> provides primary, secondary, ghost and destructive variants. Use primary for a screen's main operation, ghost for header additions/settings, and secondary-destructive for removal. These assignments are our application convention.\u003c/li>\n\u003cli>\u003ca href=\"https://developer.wordpress.org/block-editor/explanations/user-interface/block-design/\" rel=\"noreferrer\">WordPress block design\u003c/a> recommends sections and headers when inspector options grow. \u003ca href=\"https://help.webflow.com/hc/en-us/articles/33961362040723-Style-panel-overview\" rel=\"noreferrer\">Webflow's Style panel\u003c/a> separates controls into meaningful sections. Group by task and selected object; do not add collapsible panels where a short visible group is sufficient.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"layout-contract\">Layout contract\u003c/h2>\n\u003cp>Kumo owns controls, visual states and semantic colors. \u003ccode>src/editor/editor.module.css\u003c/code> owns layout; \u003ccode>PanelSection\u003c/code> supplies a heading, optional header action and content stack.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Relationship\u003c/th>\n\u003cth>Rule\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Label to control\u003c/td>\n\u003ctd>8px; label above a full-width control, except checkboxes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Adjacent fields\u003c/td>\n\u003ctd>16px, owned by the parent stack rather than each field's margins\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Drawer/dialog edges\u003c/td>\n\u003ctd>24px padding\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Separate sections\u003c/td>\n\u003ctd>Divider with 24px space on either side\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Related action buttons\u003c/td>\n\u003ctd>8px; wrap naturally when needed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>List rows\u003c/td>\n\u003ctd>8px; additions belong beside the heading, outside the list\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Compound widget\u003c/td>\n\u003ctd>Named fieldset and legend; internal controls follow the same stack\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Destructive document/block actions\u003c/td>\n\u003ctd>Separate footer after the fields\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Use \u003ccode>panelBody\u003c/code>/\u003ccode>formStack\u003c/code> for forms, \u003ccode>field\u003c/code> for a label/control pair, \u003ccode>PanelSection\u003c/code> for distinct tasks, and \u003ccode>actionFooter\u003c/code>/\u003ccode>dialogActions\u003c/code> for terminal controls. Avoid per-control spacing overrides. All layout remains scoped to the admin surfaces.\u003c/p>\n\u003ch2 id=\"result\">Result\u003c/h2>\n\u003cp>Hero Design fields now stack and align with the other block controls. Media gives Upload file priority and places Storage settings beside the heading. Navigation links each have a bounded group containing Label, Destination, optional URL and a right-aligned removal action. Site settings, Navigation, Backups and Session are separate sections. Pages, schemas, blocks, dialogs, media cards and the login form use the same layout primitives.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-05T1108Z-editor-layout\">verification run\u003c/a> records 61 passing tests, a successful static build, and browser inspection of the affected layouts. Browser schema/field inspection also completes the visual check left open by the previous hierarchy run.\u003c/p>\n","backlinks":["index","decisions/index","features/editor","verification/runs/2026-10-05T1108Z-editor-layout"]},{"id":"journal/2026-10-05-editor-saving","title":"Editor and saving","section":"Journal","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Editor and saving\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Editor and saving\n\nThe [submitted answers](2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc.md) establish DEC-042 through DEC-047: Base UI/CSS Modules, scoped block styling, one commit for all pending edits, tab-session recovery, visual Markdown authoring, and incomplete draft saves with publication validation.\n\nThese answers complete the technical interview's consequential choices. The [technical contracts](../discussions/technical-contracts.md) consolidate explicit decisions and concrete engineering definitions. Supporting library candidates, exact package pins, bundle behavior, framework adapter integration, Markdown round-tripping, and Git race handling still need implementation validation. They are not reasons for another preference questionnaire.\n\nNo application source or dependency installation has been created. The next implementation step is an end-to-end proof of shared rendering and runtime deduplication, followed by the content editor and safe Git workflow. The product scope and retained deprecated-block model remain unchanged.\n","toc":[],"titleAnchor":"editor-and-saving","links":["journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc","discussions/technical-contracts"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc\">submitted answers\u003c/a> establish DEC-042 through DEC-047: Base UI/CSS Modules, scoped block styling, one commit for all pending edits, tab-session recovery, visual Markdown authoring, and incomplete draft saves with publication validation.\u003c/p>\n\u003cp>These answers complete the technical interview's consequential choices. The \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a> consolidate explicit decisions and concrete engineering definitions. Supporting library candidates, exact package pins, bundle behavior, framework adapter integration, Markdown round-tripping, and Git race handling still need implementation validation. They are not reasons for another preference questionnaire.\u003c/p>\n\u003cp>No application source or dependency installation has been created. The next implementation step is an end-to-end proof of shared rendering and runtime deduplication, followed by the content editor and safe Git workflow. The product scope and retained deprecated-block model remain unchanged.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions"]},{"id":"journal/2026-10-05-generic-pages-discussion","title":"Generic pages and schema-only entries","section":"Journal","order":0,"metadata":{"status":"Accepted; subsequently implemented"},"metadataHtml":"\u003cspan>Status: Accepted; subsequently implemented\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Generic pages and schema-only entries\nupdated: 2026-10-05\nstatus: Accepted; subsequently implemented\n---\n# Generic pages and schema-only entries\n\nThe user corrected the collection/page model and explicitly requested discussion before implementation, followed by a grill-form interview. The following requirements come directly from that instruction; implementation has not started.\n\n- Collection entries contain only their schema-defined fields, not an independent block list.\n- Pages have two types: static pages with predefined content, and generic pages used as templates for collection entries.\n- Generic pages permit only a special set of generic blocks; normal blocks cannot be added there.\n- Each generic-block field can optionally bind to a parameter-name string. A matching collection field key supplies that entry's value.\n- A collection schema can optionally select a generic page.\n\nDEC-058–DEC-061 preserve these requirements. This supersedes the entry-block part of the previous design, while retaining the Pages-only live-preview boundary and the standard Content/schema admin views.\n\n## Round-one outcome\n\nThe [round-one answers and interpretation](2026-10-05-generic-pages-round-one.md) settle Q48–Q55 as DEC-062–DEC-069. Templates are reusable; untied collections are data-only; entry URLs belong to collections; indexes require static pages. Invalid bindings block publication, empty optional values use a fixed fallback, rich-text fields include images/YouTube, and previews use placeholders rather than real entries.\n\n## Round-two outcome\n\nThe [round-two answers and interpretation](2026-10-05-generic-pages-round-two.md) settle Q56–Q59 as DEC-070–DEC-073. Static index pages match collection prefixes by URL. Include a basic collection-list block; initial rich-text embeds are uploaded images and YouTube. The user wants completely new entries and does not need the existing demo entries, so implementation may replace those fixtures instead of migrating their blocks.\n\nThe scoped interview is complete. Concrete format and rendering changes are the next engineering work; the accepted behavior is consolidated in the [agreed design](../discussions/agreed-design.md).\n\nOnly discussion records and the prepared questionnaire are authorized in this phase. Do not treat questionnaire completion as authorization to implement the redesign.\n\n## Subsequent implementation\n\nThe user authorized implementation on 2026-10-06. See the [implementation journal](2026-10-06-generic-pages-implementation.md) and its verification run. The discussion-only restriction above records the earlier phase.\n","toc":[{"id":"round-one-outcome","title":"Round-one outcome","depth":2},{"id":"round-two-outcome","title":"Round-two outcome","depth":2},{"id":"subsequent-implementation","title":"Subsequent implementation","depth":2}],"titleAnchor":"generic-pages-and-schema-only-entries","links":["journal/2026-10-05-generic-pages-round-one","journal/2026-10-05-generic-pages-round-two","discussions/agreed-design","journal/2026-10-06-generic-pages-implementation"],"attachments":[],"html":"\u003cp>The user corrected the collection/page model and explicitly requested discussion before implementation, followed by a grill-form interview. The following requirements come directly from that instruction; implementation has not started.\u003c/p>\n\u003cul>\n\u003cli>Collection entries contain only their schema-defined fields, not an independent block list.\u003c/li>\n\u003cli>Pages have two types: static pages with predefined content, and generic pages used as templates for collection entries.\u003c/li>\n\u003cli>Generic pages permit only a special set of generic blocks; normal blocks cannot be added there.\u003c/li>\n\u003cli>Each generic-block field can optionally bind to a parameter-name string. A matching collection field key supplies that entry's value.\u003c/li>\n\u003cli>A collection schema can optionally select a generic page.\u003c/li>\n\u003c/ul>\n\u003cp>DEC-058–DEC-061 preserve these requirements. This supersedes the entry-block part of the previous design, while retaining the Pages-only live-preview boundary and the standard Content/schema admin views.\u003c/p>\n\u003ch2 id=\"round-one-outcome\">Round-one outcome\u003c/h2>\n\u003cp>The \u003ca href=\"#/journal/2026-10-05-generic-pages-round-one\">round-one answers and interpretation\u003c/a> settle Q48–Q55 as DEC-062–DEC-069. Templates are reusable; untied collections are data-only; entry URLs belong to collections; indexes require static pages. Invalid bindings block publication, empty optional values use a fixed fallback, rich-text fields include images/YouTube, and previews use placeholders rather than real entries.\u003c/p>\n\u003ch2 id=\"round-two-outcome\">Round-two outcome\u003c/h2>\n\u003cp>The \u003ca href=\"#/journal/2026-10-05-generic-pages-round-two\">round-two answers and interpretation\u003c/a> settle Q56–Q59 as DEC-070–DEC-073. Static index pages match collection prefixes by URL. Include a basic collection-list block; initial rich-text embeds are uploaded images and YouTube. The user wants completely new entries and does not need the existing demo entries, so implementation may replace those fixtures instead of migrating their blocks.\u003c/p>\n\u003cp>The scoped interview is complete. Concrete format and rendering changes are the next engineering work; the accepted behavior is consolidated in the \u003ca href=\"#/discussions/agreed-design\">agreed design\u003c/a>.\u003c/p>\n\u003cp>Only discussion records and the prepared questionnaire are authorized in this phase. Do not treat questionnaire completion as authorization to implement the redesign.\u003c/p>\n\u003ch2 id=\"subsequent-implementation\">Subsequent implementation\u003c/h2>\n\u003cp>The user authorized implementation on 2026-10-06. See the \u003ca href=\"#/journal/2026-10-06-generic-pages-implementation\">implementation journal\u003c/a> and its verification run. The discussion-only restriction above records the earlier phase.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions","journal/2026-10-05-generic-pages-round-two","journal/2026-10-06-generic-pages-implementation"]},{"id":"journal/2026-10-05-generic-pages-round-one","title":"Generic-page decisions, round one","section":"Journal","order":0,"metadata":{"status":"Accepted; follow-up resolved"},"metadataHtml":"\u003cspan>Status: Accepted; follow-up resolved\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Generic-page decisions, round one\nupdated: 2026-10-05\nstatus: Accepted; follow-up resolved\n---\n# Generic-page decisions, round one\n\nInterprets [Q48–Q55](2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0.md). These are planned behaviors, not implementation results.\n\nThe questions left open in this historical round are now resolved in [round two](2026-10-05-generic-pages-round-two.md).\n\n- A collection without a generic page remains data-only and generates no individual entry pages. A future footer-links collection illustrates the purpose; footer integration is explicitly out of scope.\n- Generic pages can be shared across schemas with compatible field names and types.\n- Public entry paths combine the collection prefix and entry slug. The generic page has no independent public route.\n- Collection index routes are not automatically generated. A static page may occupy the index route; otherwise it returns 404. The exact assignment mechanism remains open.\n- A missing field name or incompatible binding may be saved as a draft but blocks publication.\n- An empty optional bound value uses the block field's fixed fallback, or remains empty when no fallback exists. This does not excuse a missing or incompatible binding.\n- Schemas gain a visual rich-text field, including uploaded images and YouTube embeds. The existing Markdown storage direction remains the baseline; media round-tripping needs an extension. Broader embed support has not been selected.\n- Generic-page previews show bound field-name placeholders. The proposed real-entry preview selector was not selected.\n\nQ56–Q59 settle index assignment, whether a collection-list block is in scope now, initial embedded-media scope, and preservation of existing entry-block content. No application implementation is authorized during this discussion phase.\n","toc":[],"titleAnchor":"generic-page-decisions-round-one","links":["journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0","journal/2026-10-05-generic-pages-round-two"],"attachments":[],"html":"\u003cp>Interprets \u003ca href=\"#/journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0\">Q48–Q55\u003c/a>. These are planned behaviors, not implementation results.\u003c/p>\n\u003cp>The questions left open in this historical round are now resolved in \u003ca href=\"#/journal/2026-10-05-generic-pages-round-two\">round two\u003c/a>.\u003c/p>\n\u003cul>\n\u003cli>A collection without a generic page remains data-only and generates no individual entry pages. A future footer-links collection illustrates the purpose; footer integration is explicitly out of scope.\u003c/li>\n\u003cli>Generic pages can be shared across schemas with compatible field names and types.\u003c/li>\n\u003cli>Public entry paths combine the collection prefix and entry slug. The generic page has no independent public route.\u003c/li>\n\u003cli>Collection index routes are not automatically generated. A static page may occupy the index route; otherwise it returns 404. The exact assignment mechanism remains open.\u003c/li>\n\u003cli>A missing field name or incompatible binding may be saved as a draft but blocks publication.\u003c/li>\n\u003cli>An empty optional bound value uses the block field's fixed fallback, or remains empty when no fallback exists. This does not excuse a missing or incompatible binding.\u003c/li>\n\u003cli>Schemas gain a visual rich-text field, including uploaded images and YouTube embeds. The existing Markdown storage direction remains the baseline; media round-tripping needs an extension. Broader embed support has not been selected.\u003c/li>\n\u003cli>Generic-page previews show bound field-name placeholders. The proposed real-entry preview selector was not selected.\u003c/li>\n\u003c/ul>\n\u003cp>Q56–Q59 settle index assignment, whether a collection-list block is in scope now, initial embedded-media scope, and preservation of existing entry-block content. No application implementation is authorized during this discussion phase.\u003c/p>\n","backlinks":["index","decisions/index","discussions/agreed-design","discussions/open-questions","journal/2026-10-05-generic-pages-discussion"]},{"id":"journal/2026-10-05-generic-pages-round-two","title":"Generic-page decisions, round two","section":"Journal","order":0,"metadata":{"status":"Accepted; interview complete"},"metadataHtml":"\u003cspan>Status: Accepted; interview complete\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Generic-page decisions, round two\nupdated: 2026-10-05\nstatus: Accepted; interview complete\n---\n# Generic-page decisions, round two\n\nInterprets [Q56–Q59](2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b.md), completing the [generic-page discussion](2026-10-05-generic-pages-discussion.md). These are planned behaviors; no application code or content was changed during the interview.\n\n- Q56: A static page becomes the collection index by matching its URL to the collection prefix. No additional index-page assignment control is needed. Without that page, the prefix route returns 404.\n- Q57: Include a basic collection-list block for static pages in this version. It lets an explicitly created index page display collection entries. This does not restore automatic index generation or add the deferred footer integration.\n- Q58: Initial rich-text embeds support uploaded images and YouTube videos. Uploaded audio/video embeds and other external embed providers are outside this initial rich-text scope; this does not narrow the existing media library's upload support.\n- Q59: The user supplied a custom answer: “come up with completely new entries. we don't need the existing ones”. Replace the current project's demo entries with fresh schema-only examples when implementing. Conversion or preservation of these existing entry blocks is unnecessary. This choice does not establish automatic deletion/migration behavior for imported or third-party repositories.\n\nDEC-070–DEC-073 record these outcomes. Together with DEC-058–DEC-069, they settle the scoped redesign. No further questionnaire is needed. Concrete JSON interfaces, binding resolution, list-block controls and rich-text serialization remain engineering work governed by the accepted behavior, not additional product decisions.\n\nThe next useful step is implementation: update the content contracts and fixtures, then validation/rendering and the admin flows. The user's discussion-first instruction still applies; questionnaire completion is not authorization to begin that work.\n","toc":[],"titleAnchor":"generic-page-decisions-round-two","links":["journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b","journal/2026-10-05-generic-pages-discussion"],"attachments":[],"html":"\u003cp>Interprets \u003ca href=\"#/journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b\">Q56–Q59\u003c/a>, completing the \u003ca href=\"#/journal/2026-10-05-generic-pages-discussion\">generic-page discussion\u003c/a>. These are planned behaviors; no application code or content was changed during the interview.\u003c/p>\n\u003cul>\n\u003cli>Q56: A static page becomes the collection index by matching its URL to the collection prefix. No additional index-page assignment control is needed. Without that page, the prefix route returns 404.\u003c/li>\n\u003cli>Q57: Include a basic collection-list block for static pages in this version. It lets an explicitly created index page display collection entries. This does not restore automatic index generation or add the deferred footer integration.\u003c/li>\n\u003cli>Q58: Initial rich-text embeds support uploaded images and YouTube videos. Uploaded audio/video embeds and other external embed providers are outside this initial rich-text scope; this does not narrow the existing media library's upload support.\u003c/li>\n\u003cli>Q59: The user supplied a custom answer: “come up with completely new entries. we don't need the existing ones”. Replace the current project's demo entries with fresh schema-only examples when implementing. Conversion or preservation of these existing entry blocks is unnecessary. This choice does not establish automatic deletion/migration behavior for imported or third-party repositories.\u003c/li>\n\u003c/ul>\n\u003cp>DEC-070–DEC-073 record these outcomes. Together with DEC-058–DEC-069, they settle the scoped redesign. No further questionnaire is needed. Concrete JSON interfaces, binding resolution, list-block controls and rich-text serialization remain engineering work governed by the accepted behavior, not additional product decisions.\u003c/p>\n\u003cp>The next useful step is implementation: update the content contracts and fixtures, then validation/rendering and the admin flows. The user's discussion-first instruction still applies; questionnaire completion is not authorization to begin that work.\u003c/p>\n","backlinks":["index","decisions/index","discussions/agreed-design","discussions/open-questions","journal/2026-10-05-generic-pages-discussion","journal/2026-10-05-generic-pages-round-one"]},{"id":"journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `103bfb33-1e8a-4133-9528-3baf8aa57275`\n\n## Question 25\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: Which foundation should build the public site?\nContext: Both choices produce static HTML and keep the admin app static. Astro already integrates multiple UI frameworks. A custom Vite-based generator would make us own routing, prerendering, and framework integration ourselves.\nRecommendation: Astro with TypeScript: use its static build and framework integrations, while keeping our content format and block definitions independent where practical.\nOptions: Astro with TypeScript / Vite with TypeScript and a custom static generator\nSelected: Astro with TypeScript\nNotes: \n```\n\n## Question 26\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: Which framework should implement the admin drawer and CMS screens?\nContext: This choice applies to the editor UI only. Registered blocks can still use React, Svelte, Vue, or vanilla code. The earlier removal of React from grill-form does not require removing it from this application.\nRecommendation: React with TypeScript for the editor's interacting forms and controls; keep block mounting behind framework-neutral adapters.\nOptions: React with TypeScript / Svelte with TypeScript / Vue with TypeScript\nSelected: React with TypeScript\nNotes: \n```\n\n## Question 27\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: What should the source content files use?\nContext: These files hold page metadata, ordered block instances, field values, and collection definitions. The format must survive browser editing and remain understandable in Git.\nRecommendation: Formatted JSON. It directly represents the editor's structured data and needs no extra parser or executable content.\nOptions: JSON for structured content and definitions / YAML for structured content and definitions / Markdown with frontmatter and an embedded block representation\nSelected: JSON for structured content and definitions\nNotes: \n```\n\n## Question 28\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: How should content be divided into files?\nContext: Many small files make individual changes easier to review and reduce unrelated edits touching the same file. Large aggregate files are easier to fetch but combine more changes.\nRecommendation: One file per page or entry, one per collection definition, and separate site settings/media records. Save related file changes together in one commit.\nOptions: Separate files per page, entry, and definition / One aggregate file per collection, plus pages/settings files / One file containing the whole site's content and definitions\nSelected: Separate files per page, entry, and definition\nNotes: \n```\n\n## Question 29\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: What should a field schema look like?\nContext: The portal must save schemas as data. A small model could look like { key: 'title', type: 'text', required: true }. JSON Schema is a broader standard for validating data; form widgets and layout still need extra metadata.\nRecommendation: Use a small declarative field model covering the agreed field types, interpreted by the editor and build. Keep it serializable and versioned.\nOptions: A small purpose-built field model / A supported subset of JSON Schema plus editor UI metadata\nSelected: A small purpose-built field model\nNotes: \n```\n\n## Question 30\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: What rendering contract should a block author follow for published pages and live preview?\nContext: Both paths must show the same content and design. A reusable React/Svelte/Vue component can often serve both, but a build-only template cannot itself rerender unsaved changes in the browser.\nRecommendation: Share rendering source by default. Allow separate build/preview implementations when necessary, with checks that they stay equivalent.\nOptions: Shared rendering source by default; separate implementations require parity checks / Require one reusable rendering source for every block / Treat build and preview as separate implementations for every block\nSelected: Shared rendering source by default; separate implementations require parity checks\nNotes: my suggestion: all libraries used by authored blocks (that are possibly shared) (e.g. react@18, svelte@5, react-hook-form@7.8, @base-ui/react@1.8, etc.) should have their (minified, if possible) registered vendor files located in a statically hosted  location, and loaded from there. this way, we don't have to load more than 1 different versions of react, or more than 1 different versions of svelte, if possible. keeping the asset loading lean\n```\n\n## Question 31\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: Should the preview share the editor's document or live in an iframe?\nContext: A shared document can reuse the editor's live framework runtime, but requires scoped styles. An iframe isolates the preview's CSS and viewport; its runtime is separate even if downloads are cached, relaxing runtime deduplication inside the admin view. Public pages can still deduplicate normally.\nRecommendation: Use one document with scoped editor/block CSS to preserve runtime sharing. Treat CSS isolation as part of the block contract.\nOptions: One document; scope styles and share runtimes / A preview iframe; accept separate runtime instances in the admin view\nSelected: One document; scope styles and share runtimes\nNotes: \n```\n\n## Question 32\n\n```text\nRound: lean-sitebuilder — technical foundations\nQuestion: Can block authors add custom field controls to the editor?\nContext: Built-in controls cover ordinary text, choices, images, and similar values. A custom widget could provide a special color palette, chart-data editor, or other block-specific control.\nRecommendation: Provide built-in controls plus a small optional custom-widget interface. Custom widgets use the editor's selected framework; the block's renderer remains framework-independent.\nOptions: Built-in controls plus optional custom widgets / Built-in controls only for the first version\nSelected: Built-in controls plus optional custom widgets\nNotes: \n```\n","toc":[{"id":"question-25","title":"Question 25","depth":2},{"id":"question-26","title":"Question 26","depth":2},{"id":"question-27","title":"Question 27","depth":2},{"id":"question-28","title":"Question 28","depth":2},{"id":"question-29","title":"Question 29","depth":2},{"id":"question-30","title":"Question 30","depth":2},{"id":"question-31","title":"Question 31","depth":2},{"id":"question-32","title":"Question 32","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>103bfb33-1e8a-4133-9528-3baf8aa57275\u003c/code>\u003c/p>\n\u003ch2 id=\"question-25\">Question 25\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: Which foundation should build the public site?\nContext: Both choices produce static HTML and keep the admin app static. Astro already integrates multiple UI frameworks. A custom Vite-based generator would make us own routing, prerendering, and framework integration ourselves.\nRecommendation: Astro with TypeScript: use its static build and framework integrations, while keeping our content format and block definitions independent where practical.\nOptions: Astro with TypeScript / Vite with TypeScript and a custom static generator\nSelected: Astro with TypeScript\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-26\">Question 26\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: Which framework should implement the admin drawer and CMS screens?\nContext: This choice applies to the editor UI only. Registered blocks can still use React, Svelte, Vue, or vanilla code. The earlier removal of React from grill-form does not require removing it from this application.\nRecommendation: React with TypeScript for the editor's interacting forms and controls; keep block mounting behind framework-neutral adapters.\nOptions: React with TypeScript / Svelte with TypeScript / Vue with TypeScript\nSelected: React with TypeScript\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-27\">Question 27\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: What should the source content files use?\nContext: These files hold page metadata, ordered block instances, field values, and collection definitions. The format must survive browser editing and remain understandable in Git.\nRecommendation: Formatted JSON. It directly represents the editor's structured data and needs no extra parser or executable content.\nOptions: JSON for structured content and definitions / YAML for structured content and definitions / Markdown with frontmatter and an embedded block representation\nSelected: JSON for structured content and definitions\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-28\">Question 28\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: How should content be divided into files?\nContext: Many small files make individual changes easier to review and reduce unrelated edits touching the same file. Large aggregate files are easier to fetch but combine more changes.\nRecommendation: One file per page or entry, one per collection definition, and separate site settings/media records. Save related file changes together in one commit.\nOptions: Separate files per page, entry, and definition / One aggregate file per collection, plus pages/settings files / One file containing the whole site's content and definitions\nSelected: Separate files per page, entry, and definition\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-29\">Question 29\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: What should a field schema look like?\nContext: The portal must save schemas as data. A small model could look like { key: 'title', type: 'text', required: true }. JSON Schema is a broader standard for validating data; form widgets and layout still need extra metadata.\nRecommendation: Use a small declarative field model covering the agreed field types, interpreted by the editor and build. Keep it serializable and versioned.\nOptions: A small purpose-built field model / A supported subset of JSON Schema plus editor UI metadata\nSelected: A small purpose-built field model\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-30\">Question 30\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: What rendering contract should a block author follow for published pages and live preview?\nContext: Both paths must show the same content and design. A reusable React/Svelte/Vue component can often serve both, but a build-only template cannot itself rerender unsaved changes in the browser.\nRecommendation: Share rendering source by default. Allow separate build/preview implementations when necessary, with checks that they stay equivalent.\nOptions: Shared rendering source by default; separate implementations require parity checks / Require one reusable rendering source for every block / Treat build and preview as separate implementations for every block\nSelected: Shared rendering source by default; separate implementations require parity checks\nNotes: my suggestion: all libraries used by authored blocks (that are possibly shared) (e.g. react@18, svelte@5, react-hook-form@7.8, @base-ui/react@1.8, etc.) should have their (minified, if possible) registered vendor files located in a statically hosted  location, and loaded from there. this way, we don't have to load more than 1 different versions of react, or more than 1 different versions of svelte, if possible. keeping the asset loading lean\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-31\">Question 31\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: Should the preview share the editor's document or live in an iframe?\nContext: A shared document can reuse the editor's live framework runtime, but requires scoped styles. An iframe isolates the preview's CSS and viewport; its runtime is separate even if downloads are cached, relaxing runtime deduplication inside the admin view. Public pages can still deduplicate normally.\nRecommendation: Use one document with scoped editor/block CSS to preserve runtime sharing. Treat CSS isolation as part of the block contract.\nOptions: One document; scope styles and share runtimes / A preview iframe; accept separate runtime instances in the admin view\nSelected: One document; scope styles and share runtimes\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-32\">Question 32\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — technical foundations\nQuestion: Can block authors add custom field controls to the editor?\nContext: Built-in controls cover ordinary text, choices, images, and similar values. A custom widget could provide a special color palette, chart-data editor, or other block-specific control.\nRecommendation: Provide built-in controls plus a small optional custom-widget interface. Custom widgets use the editor's selected framework; the block's renderer remains framework-independent.\nOptions: Built-in controls plus optional custom widgets / Built-in controls only for the first version\nSelected: Built-in controls plus optional custom widgets\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-technical-foundations"]},{"id":"journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `192c91a8-c5db-4b3b-9e4f-84772508186b`\n\n## Question 56\n\n```text\nRound: Generic pages: remaining choices\nQuestion: How should a static page become the collection index at a route such as /articles?\nContext:\nRecommendation: Match by URL: set the static page's path to /articles. This keeps one owner for page routing and needs no extra index-page assignment control.\nOptions: Match the static page's URL to the collection prefix / Select an index page in the collection schema; its URL becomes the collection prefix\nSelected: Match the static page's URL to the collection prefix\nNotes:\n```\n\n## Question 57\n\n```text\nRound: Generic pages: remaining choices\nQuestion: Should this version include a normal collection-list block for static pages, so a page can display cards or links for a collection's entries?\nContext:\nRecommendation: Include a basic collection-list block, so an optional static index can actually show its entries. This does not include the future footer integration.\nOptions: Include a basic collection-list block now / Defer listing blocks; implement templates and fields first\nSelected: Include a basic collection-list block now\nNotes:\n```\n\n## Question 58\n\n```text\nRound: Generic pages: remaining choices\nQuestion: Which embedded media should the new rich-text field support in the first version?\nContext:\nRecommendation: Start with uploaded images and YouTube videos, covering your examples with a small set of editing controls.\nOptions: Uploaded images and YouTube videos / Also uploaded video and audio files / Also other external embed providers\nSelected: Uploaded images and YouTube videos\nNotes:\n```\n\n## Question 59\n\n```text\nRound: Generic pages: remaining choices\nQuestion: How should existing entries that already contain blocks be moved to the new fields-only model? The current Journal demo stores its body in a Text block.\nContext:\nRecommendation: Move supported text into rich-text schema fields and preserve any unmapped block content for review. This keeps the current prose without silently losing other content.\nOptions: Convert supported text; preserve unmapped content for review / Require manual mapping of all existing block content before conversion / Replace only the bundled demo entries with fresh field-only fixtures; defer migration of other existing content\nSelected: (notes only)\nNotes: come up with completely new entries. we don't need the existing ones\n```\n","toc":[{"id":"question-56","title":"Question 56","depth":2},{"id":"question-57","title":"Question 57","depth":2},{"id":"question-58","title":"Question 58","depth":2},{"id":"question-59","title":"Question 59","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>192c91a8-c5db-4b3b-9e4f-84772508186b\u003c/code>\u003c/p>\n\u003ch2 id=\"question-56\">Question 56\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages: remaining choices\nQuestion: How should a static page become the collection index at a route such as /articles?\nContext:\nRecommendation: Match by URL: set the static page's path to /articles. This keeps one owner for page routing and needs no extra index-page assignment control.\nOptions: Match the static page's URL to the collection prefix / Select an index page in the collection schema; its URL becomes the collection prefix\nSelected: Match the static page's URL to the collection prefix\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-57\">Question 57\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages: remaining choices\nQuestion: Should this version include a normal collection-list block for static pages, so a page can display cards or links for a collection's entries?\nContext:\nRecommendation: Include a basic collection-list block, so an optional static index can actually show its entries. This does not include the future footer integration.\nOptions: Include a basic collection-list block now / Defer listing blocks; implement templates and fields first\nSelected: Include a basic collection-list block now\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-58\">Question 58\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages: remaining choices\nQuestion: Which embedded media should the new rich-text field support in the first version?\nContext:\nRecommendation: Start with uploaded images and YouTube videos, covering your examples with a small set of editing controls.\nOptions: Uploaded images and YouTube videos / Also uploaded video and audio files / Also other external embed providers\nSelected: Uploaded images and YouTube videos\nNotes:\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-59\">Question 59\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Generic pages: remaining choices\nQuestion: How should existing entries that already contain blocks be moved to the new fields-only model? The current Journal demo stores its body in a Text block.\nContext:\nRecommendation: Move supported text into rich-text schema fields and preserve any unmapped block content for review. This keeps the current prose without silently losing other content.\nOptions: Convert supported text; preserve unmapped content for review / Require manual mapping of all existing block content before conversion / Replace only the bundled demo entries with fresh field-only fixtures; defer migration of other existing content\nSelected: (notes only)\nNotes: come up with completely new entries. we don't need the existing ones\n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-generic-pages-round-two"]},{"id":"journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `1a1e4868-048d-45f3-a291-5f8b6c42aae2`\n\n## Question 8\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: What should the admin login protect?\nContext: A password checked entirely in a static page can be bypassed. An environment variable does not change that. GitHub can still enforce access to the repository through the supplied token.\nRecommendation: Use the configured password as a convenience gate, with GitHub enforcing repository access. This keeps the editor entirely static.\nOptions: A convenience gate is enough; GitHub controls repository access / The admin page itself must be protected by hosting-provider access control\nSelected: A convenience gate is enough; GitHub controls repository access\nNotes: \n```\n\n## Question 9\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: What repository visibility must a deployed site support?\nContext: This refers to each site's repository. Public repositories expose source and draft branches. Private repositories also need authorization to read draft content, before saving anything.\nRecommendation: Start with private site repositories so unpublished content stays private.\nOptions: Private repositories only / Public repositories only; drafts may be visible / Both private and public repositories\nSelected: Both private and public repositories\nNotes: i usually deploy to netlify, which supports deployment on private repo branch pushes. i think theres no need to worry about this.\n```\n\n## Question 10\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Who should provide the GitHub token used by an editor?\nContext: This determines whether clients need their own GitHub account and who can revoke access. Do not enter an actual token here.\nRecommendation: Each editor uses their own GitHub account and token, so access can be revoked individually. The exact token setup must support their repository role.\nOptions: Each editor provides their own GitHub token / The site owner supplies a token for editors to use / Only a technical owner uses the token to save and publish\nSelected: Each editor provides their own GitHub token\nNotes: \n```\n\n## Question 11\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Which deployment setup should we support first?\nContext: Publishing merges drafts into main; a build must then deploy the static output. GitHub Pages hosting from a private repository requires an eligible account plan.\nRecommendation: Provide GitHub Actions and GitHub Pages as the reference setup, while keeping the output portable to other static hosts.\nOptions: GitHub Actions builds and deploys to GitHub Pages / An existing Git-connected host deploys main; name it in Notes / Provide build output only; the owner configures deployment\nSelected: (notes only)\nNotes: the site builder pushes content and schema changes to github with a SDK client. publish merges to main. when main is pushed, my netlify deployment will detect that and deploy it on its own, which you dont need to worry much about\n```\n\n## Question 12\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: How should users write the body of a blog post or collection entry?\nContext: Entries will also have structured metadata such as title and date.\nRecommendation: Reuse the block editor for entry bodies to keep one consistent editing experience.\nOptions: Use the same block editor as pages / Use a rich-text editor for entry bodies / Let each collection choose blocks or rich text\nSelected: Use the same block editor as pages\nNotes: \n```\n\n## Question 13\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: Can we require block authors to provide a browser-compatible preview?\nContext: The editor must render unsaved changes immediately. A block that can only render during a build cannot do this without a separate preview implementation.\nRecommendation: Require a browser preview for every block, sharing rendering logic with the published version where possible.\nOptions: Yes; every block must support immediate browser preview / Allow build-only blocks with a placeholder while editing\nSelected: Yes; every block must support immediate browser preview\nNotes: \n```\n\n## Question 14\n\n```text\nRound: lean-sitebuilder — round two\nQuestion: How should new block types become available in the editor?\nContext: This concerns installing a new block type, not adding another instance of an already-installed block to a page.\nRecommendation: A developer adds and registers block code, then rebuilds. This lets the build compile frameworks and share compatible dependencies.\nOptions: Developer installs and registers blocks in the repo, then rebuilds / Editors must be able to install new block types through the portal\nSelected: Developer installs and registers blocks in the repo, then rebuilds\nNotes: \n```\n","toc":[{"id":"question-8","title":"Question 8","depth":2},{"id":"question-9","title":"Question 9","depth":2},{"id":"question-10","title":"Question 10","depth":2},{"id":"question-11","title":"Question 11","depth":2},{"id":"question-12","title":"Question 12","depth":2},{"id":"question-13","title":"Question 13","depth":2},{"id":"question-14","title":"Question 14","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>1a1e4868-048d-45f3-a291-5f8b6c42aae2\u003c/code>\u003c/p>\n\u003ch2 id=\"question-8\">Question 8\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: What should the admin login protect?\nContext: A password checked entirely in a static page can be bypassed. An environment variable does not change that. GitHub can still enforce access to the repository through the supplied token.\nRecommendation: Use the configured password as a convenience gate, with GitHub enforcing repository access. This keeps the editor entirely static.\nOptions: A convenience gate is enough; GitHub controls repository access / The admin page itself must be protected by hosting-provider access control\nSelected: A convenience gate is enough; GitHub controls repository access\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-9\">Question 9\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: What repository visibility must a deployed site support?\nContext: This refers to each site's repository. Public repositories expose source and draft branches. Private repositories also need authorization to read draft content, before saving anything.\nRecommendation: Start with private site repositories so unpublished content stays private.\nOptions: Private repositories only / Public repositories only; drafts may be visible / Both private and public repositories\nSelected: Both private and public repositories\nNotes: i usually deploy to netlify, which supports deployment on private repo branch pushes. i think theres no need to worry about this.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-10\">Question 10\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: Who should provide the GitHub token used by an editor?\nContext: This determines whether clients need their own GitHub account and who can revoke access. Do not enter an actual token here.\nRecommendation: Each editor uses their own GitHub account and token, so access can be revoked individually. The exact token setup must support their repository role.\nOptions: Each editor provides their own GitHub token / The site owner supplies a token for editors to use / Only a technical owner uses the token to save and publish\nSelected: Each editor provides their own GitHub token\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-11\">Question 11\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: Which deployment setup should we support first?\nContext: Publishing merges drafts into main; a build must then deploy the static output. GitHub Pages hosting from a private repository requires an eligible account plan.\nRecommendation: Provide GitHub Actions and GitHub Pages as the reference setup, while keeping the output portable to other static hosts.\nOptions: GitHub Actions builds and deploys to GitHub Pages / An existing Git-connected host deploys main; name it in Notes / Provide build output only; the owner configures deployment\nSelected: (notes only)\nNotes: the site builder pushes content and schema changes to github with a SDK client. publish merges to main. when main is pushed, my netlify deployment will detect that and deploy it on its own, which you dont need to worry much about\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-12\">Question 12\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: How should users write the body of a blog post or collection entry?\nContext: Entries will also have structured metadata such as title and date.\nRecommendation: Reuse the block editor for entry bodies to keep one consistent editing experience.\nOptions: Use the same block editor as pages / Use a rich-text editor for entry bodies / Let each collection choose blocks or rich text\nSelected: Use the same block editor as pages\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-13\">Question 13\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: Can we require block authors to provide a browser-compatible preview?\nContext: The editor must render unsaved changes immediately. A block that can only render during a build cannot do this without a separate preview implementation.\nRecommendation: Require a browser preview for every block, sharing rendering logic with the published version where possible.\nOptions: Yes; every block must support immediate browser preview / Allow build-only blocks with a placeholder while editing\nSelected: Yes; every block must support immediate browser preview\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-14\">Question 14\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: How should new block types become available in the editor?\nContext: This concerns installing a new block type, not adding another instance of an already-installed block to a page.\nRecommendation: A developer adds and registers block code, then rebuilds. This lets the build compile frameworks and share compatible dependencies.\nOptions: Developer installs and registers blocks in the repo, then rebuilds / Editors must be able to install new block types through the portal\nSelected: Developer installs and registers blocks in the repo, then rebuilds\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-two-decisions"]},{"id":"journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `534ae93e-c689-4899-b4a0-b2c01b8f8134`\n\n## Question 33\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: Who should produce and maintain the shared vendor files?\nContext: Your registered, statically hosted vendor idea can be implemented by the build: one compatible dependency set produces minified shared modules on the site's own host. Blocks import the same URLs. A manually maintained vendor folder/import map offers direct control but also needs dependency and browser-module compatibility maintenance. Your example version numbers will not be treated as pins.\nRecommendation: Let the build generate self-hosted vendor/shared modules from the registry and lockfile. Validate compatible versions and inspect the output for duplication; load only dependencies needed by the current page.\nOptions: Build-generated, self-hosted vendor modules / Explicitly maintained vendor files and import maps\nSelected: Build-generated, self-hosted vendor modules\nNotes: \n```\n\n## Question 34\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: Should a document's filename follow its permanent ID or its public URL?\nContext: For example: content/pages/page_abc.json could store { id: 'page_abc', path: '/about', blocks: [...] }. Renaming /about would not rename the file. A slug-based filename is easier to browse manually but changes when the URL does.\nRecommendation: Use permanent IDs for filenames and store editable paths/slugs inside. This separates content identity from public URLs.\nOptions: Permanent ID filenames; editable URL in the document / Readable slug/path filenames, with a permanent ID inside\nSelected: Permanent ID filenames; editable URL in the document\nNotes: \n```\n\n## Question 35\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: How should formatted prose inside a text block be stored?\nContext: The outer content file stays JSON. This choice concerns paragraphs, links, emphasis, and lists inside a block, and does not require the user to edit source markup directly.\nRecommendation: Store Markdown strings and render them consistently in preview and build. Keep the supported syntax small, with no executable MDX or arbitrary embedded scripts.\nOptions: Markdown strings inside block props / Sanitized HTML strings inside block props / Structured rich-text JSON nodes inside block props\nSelected: Markdown strings inside block props\nNotes: \n```\n\n## Question 36\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: How should saved block data survive a block author changing its fields?\nContext: A block instance could store { id: 'block_abc', type: 'core/hero', version: 1, props: {...} }. A later version might rename or reorganize those props. This is developer-owned compatibility, separate from the simple collection schema editor.\nRecommendation: Version each block's saved data and let authors supply explicit migration functions. Preserve unsupported data and stop unsafe editing/publishing rather than silently dropping fields.\nOptions: Versioned data with explicit developer migration functions / Authors must keep old saved props compatible without migration functions / Keep old block implementations installed alongside new versions\nSelected: Keep old block implementations installed alongside new versions\nNotes: keep it simple here. old block implementations simply gets \"deprecated\" but still available. blocks would have a \"version\" selection field. users would need to manually migrate to the shape of the latest block by selecting the newer version of the block, in which newer unrecognized/renamed/irreconcilable fields would be empty, then manually fill them back in.\n```\n\n## Question 37\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: What should the browser-facing block interface use?\nContext: With framework adapters, most authors write a normal React/Svelte/Vue component. The adapter provides mount(host, props, context), update(props, context), and destroy(). Vanilla/custom blocks implement that lifecycle directly. The static build uses the shared rendering source where possible.\nRecommendation: Use framework adapters with this small common lifecycle. This gives the editor a consistent way to update, reorder, and remove blocks without imposing its React framework on them.\nOptions: Framework adapters with mount/update/destroy / Require every block to expose a Web Component wrapper instead\nSelected: Framework adapters with mount/update/destroy\nNotes: \n```\n\n## Question 38\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: When should a published block load its interactive JavaScript?\nContext: Public pages can contain built HTML before interactivity starts. An author can declare never for static blocks, visible for offscreen widgets, idle for low-priority behavior, or load for immediate interaction. The editor still mounts blocks immediately for live preview.\nRecommendation: Let block authors declare the activation policy; static blocks need no client runtime, and interactive blocks load when appropriate.\nOptions: Author-declared never/visible/idle/load policy / Activate every interactive block as soon as the page loads\nSelected: Author-declared never/visible/idle/load policy\nNotes: \n```\n\n## Question 39\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: How should content refer to internal pages and uploaded media?\nContext: A block can store a media ID whose record contains R2 URLs and image variants, or copy those URLs directly into its props. Navigation can similarly reference a page ID or its current path. The build resolves IDs to ordinary URLs in published HTML.\nRecommendation: Use stable IDs for internal content/media and explicit URLs for external links. This keeps page renames and media metadata changes from requiring edits in every referring block.\nOptions: Stable IDs for internal references; URLs for external resources / Store paths and media URLs directly wherever they are used\nSelected: Stable IDs for internal references; URLs for external resources\nNotes: \n```\n","toc":[{"id":"question-33","title":"Question 33","depth":2},{"id":"question-34","title":"Question 34","depth":2},{"id":"question-35","title":"Question 35","depth":2},{"id":"question-36","title":"Question 36","depth":2},{"id":"question-37","title":"Question 37","depth":2},{"id":"question-38","title":"Question 38","depth":2},{"id":"question-39","title":"Question 39","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>534ae93e-c689-4899-b4a0-b2c01b8f8134\u003c/code>\u003c/p>\n\u003ch2 id=\"question-33\">Question 33\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: Who should produce and maintain the shared vendor files?\nContext: Your registered, statically hosted vendor idea can be implemented by the build: one compatible dependency set produces minified shared modules on the site's own host. Blocks import the same URLs. A manually maintained vendor folder/import map offers direct control but also needs dependency and browser-module compatibility maintenance. Your example version numbers will not be treated as pins.\nRecommendation: Let the build generate self-hosted vendor/shared modules from the registry and lockfile. Validate compatible versions and inspect the output for duplication; load only dependencies needed by the current page.\nOptions: Build-generated, self-hosted vendor modules / Explicitly maintained vendor files and import maps\nSelected: Build-generated, self-hosted vendor modules\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-34\">Question 34\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: Should a document's filename follow its permanent ID or its public URL?\nContext: For example: content/pages/page_abc.json could store { id: 'page_abc', path: '/about', blocks: [...] }. Renaming /about would not rename the file. A slug-based filename is easier to browse manually but changes when the URL does.\nRecommendation: Use permanent IDs for filenames and store editable paths/slugs inside. This separates content identity from public URLs.\nOptions: Permanent ID filenames; editable URL in the document / Readable slug/path filenames, with a permanent ID inside\nSelected: Permanent ID filenames; editable URL in the document\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-35\">Question 35\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: How should formatted prose inside a text block be stored?\nContext: The outer content file stays JSON. This choice concerns paragraphs, links, emphasis, and lists inside a block, and does not require the user to edit source markup directly.\nRecommendation: Store Markdown strings and render them consistently in preview and build. Keep the supported syntax small, with no executable MDX or arbitrary embedded scripts.\nOptions: Markdown strings inside block props / Sanitized HTML strings inside block props / Structured rich-text JSON nodes inside block props\nSelected: Markdown strings inside block props\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-36\">Question 36\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: How should saved block data survive a block author changing its fields?\nContext: A block instance could store { id: 'block_abc', type: 'core/hero', version: 1, props: {...} }. A later version might rename or reorganize those props. This is developer-owned compatibility, separate from the simple collection schema editor.\nRecommendation: Version each block's saved data and let authors supply explicit migration functions. Preserve unsupported data and stop unsafe editing/publishing rather than silently dropping fields.\nOptions: Versioned data with explicit developer migration functions / Authors must keep old saved props compatible without migration functions / Keep old block implementations installed alongside new versions\nSelected: Keep old block implementations installed alongside new versions\nNotes: keep it simple here. old block implementations simply gets \"deprecated\" but still available. blocks would have a \"version\" selection field. users would need to manually migrate to the shape of the latest block by selecting the newer version of the block, in which newer unrecognized/renamed/irreconcilable fields would be empty, then manually fill them back in.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-37\">Question 37\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: What should the browser-facing block interface use?\nContext: With framework adapters, most authors write a normal React/Svelte/Vue component. The adapter provides mount(host, props, context), update(props, context), and destroy(). Vanilla/custom blocks implement that lifecycle directly. The static build uses the shared rendering source where possible.\nRecommendation: Use framework adapters with this small common lifecycle. This gives the editor a consistent way to update, reorder, and remove blocks without imposing its React framework on them.\nOptions: Framework adapters with mount/update/destroy / Require every block to expose a Web Component wrapper instead\nSelected: Framework adapters with mount/update/destroy\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-38\">Question 38\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: When should a published block load its interactive JavaScript?\nContext: Public pages can contain built HTML before interactivity starts. An author can declare never for static blocks, visible for offscreen widgets, idle for low-priority behavior, or load for immediate interaction. The editor still mounts blocks immediately for live preview.\nRecommendation: Let block authors declare the activation policy; static blocks need no client runtime, and interactive blocks load when appropriate.\nOptions: Author-declared never/visible/idle/load policy / Activate every interactive block as soon as the page loads\nSelected: Author-declared never/visible/idle/load policy\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-39\">Question 39\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: How should content refer to internal pages and uploaded media?\nContext: A block can store a media ID whose record contains R2 URLs and image variants, or copy those URLs directly into its props. Navigation can similarly reference a page ID or its current path. The build resolves IDs to ordinary URLs in published HTML.\nRecommendation: Use stable IDs for internal content/media and explicit URLs for external links. This keeps page renames and media metadata changes from requiring edits in every referring block.\nOptions: Stable IDs for internal references; URLs for external resources / Store paths and media URLs directly wherever they are used\nSelected: Stable IDs for internal references; URLs for external resources\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-content-block-contracts"]},{"id":"journal/2026-10-05-grill-821c1394-1fd0-47f5-a950-f71d9c006099","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `821c1394-1fd0-47f5-a950-f71d9c006099`\n\n## Question 60\n\n```text\nRound: Block library\nQuestion: What should happen when you select a block card?\nDescription (Markdown source):\nThe new dialog will have search, theme and tag filters above a visual grid. With many similar layouts, a larger preview can help distinguish them before adding one.\nRecommendation: Show lightweight thumbnails in the grid. Selecting a card opens a larger preview with an explicit Add block button, so browsing does not change the page.\nOptions: Open a larger preview, then Add block / Add immediately; offer a separate Preview action\nSelected: Add immediately; offer a separate Preview action\nNotes: \n```\n\n## Question 61\n\n```text\nRound: Block library\nQuestion: Should this import also create blocks for generic pages?\nDescription (Markdown source):\nThe reference has 123 variants in 15 categories. I propose starting with three distinct variants per category: 45 blocks. Our current system separates static-page blocks from generic blocks with schema-field bindings.\nRecommendation: Start with the 45 static-page blocks. Keep the existing generic blocks available and adapt additional generic layouts in a separate pass once their data needs are clear.\nOptions: Static-page blocks first / Static blocks plus useful generic counterparts now\nSelected: Static blocks plus useful generic counterparts now\nNotes: \n```\n\n## Question 62\n\n```text\nRound: Block library\nQuestion: How should editors manage repeated items inside a block?\nDescription (Markdown source):\nFeatures, team members, testimonials, logo lists, FAQ items and footer links need groups of editable fields. The old system uses variable-length lists; our current editor does not yet have a standard list field.\nRecommendation: Add a reusable list editor with Add, Remove and drag-to-reorder, so these blocks can have the number of items the content needs.\nOptions: Editable lists: add, remove and reorder items / Fixed item slots for each layout\nSelected: Editable lists: add, remove and reorder items\nNotes: \n```\n\n## Question 63\n\n```text\nRound: Block library\nQuestion: Where should Blog blocks get their article cards?\nDescription (Markdown source):\nThe old Blog blocks store their own title, image, excerpt, date and link for each card. Our current CMS already has schema-based collections and entry routes, but collection-list blocks only expose titles and links.\nRecommendation: Select a collection and map its fields to the card's title, image, excerpt and date. Use the existing entry routes for article links, avoiding duplicate article content.\nOptions: Use collection entries with field mapping / Manually author the cards inside each block / Support both collection entries and manual cards\nSelected: Use collection entries with field mapping\nNotes: \n```\n\n## Question 64\n\n```text\nRound: Block library\nQuestion: How should Contact and Newsletter forms submit?\nDescription (Markdown source):\nThe site is static. Several old form layouts have no submission destination, so copying their appearance would leave a nonfunctional form.\nRecommendation: Allow an editor-configured external form endpoint. Require it before publishing a form; the service handles delivery and its response. No new backend is needed in the builder.\nOptions: Submit to a configured external form endpoint / Use a button linking to an external contact or signup page / Defer blocks that contain submission forms\nSelected: Submit to a configured external form endpoint\nNotes: \n```\n\n## Question 65\n\n```text\nRound: Block library\nQuestion: Where should the imported Footer layouts be used?\nDescription (Markdown source):\nPublic pages already have a built-in footer. Adding another footer as an ordinary block would otherwise display both.\nRecommendation: Treat Footer layouts as page blocks for this import and omit the built-in footer on pages using one. A shared footer editor can be a separate feature.\nOptions: Page blocks that replace that page's built-in footer / A shared site-wide footer configured once / Defer Footer blocks for now\nSelected: A shared site-wide footer configured once\nNotes: \n```\n","toc":[{"id":"question-60","title":"Question 60","depth":2},{"id":"question-61","title":"Question 61","depth":2},{"id":"question-62","title":"Question 62","depth":2},{"id":"question-63","title":"Question 63","depth":2},{"id":"question-64","title":"Question 64","depth":2},{"id":"question-65","title":"Question 65","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>821c1394-1fd0-47f5-a950-f71d9c006099\u003c/code>\u003c/p>\n\u003ch2 id=\"question-60\">Question 60\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library\nQuestion: What should happen when you select a block card?\nDescription (Markdown source):\nThe new dialog will have search, theme and tag filters above a visual grid. With many similar layouts, a larger preview can help distinguish them before adding one.\nRecommendation: Show lightweight thumbnails in the grid. Selecting a card opens a larger preview with an explicit Add block button, so browsing does not change the page.\nOptions: Open a larger preview, then Add block / Add immediately; offer a separate Preview action\nSelected: Add immediately; offer a separate Preview action\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-61\">Question 61\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library\nQuestion: Should this import also create blocks for generic pages?\nDescription (Markdown source):\nThe reference has 123 variants in 15 categories. I propose starting with three distinct variants per category: 45 blocks. Our current system separates static-page blocks from generic blocks with schema-field bindings.\nRecommendation: Start with the 45 static-page blocks. Keep the existing generic blocks available and adapt additional generic layouts in a separate pass once their data needs are clear.\nOptions: Static-page blocks first / Static blocks plus useful generic counterparts now\nSelected: Static blocks plus useful generic counterparts now\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-62\">Question 62\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library\nQuestion: How should editors manage repeated items inside a block?\nDescription (Markdown source):\nFeatures, team members, testimonials, logo lists, FAQ items and footer links need groups of editable fields. The old system uses variable-length lists; our current editor does not yet have a standard list field.\nRecommendation: Add a reusable list editor with Add, Remove and drag-to-reorder, so these blocks can have the number of items the content needs.\nOptions: Editable lists: add, remove and reorder items / Fixed item slots for each layout\nSelected: Editable lists: add, remove and reorder items\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-63\">Question 63\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library\nQuestion: Where should Blog blocks get their article cards?\nDescription (Markdown source):\nThe old Blog blocks store their own title, image, excerpt, date and link for each card. Our current CMS already has schema-based collections and entry routes, but collection-list blocks only expose titles and links.\nRecommendation: Select a collection and map its fields to the card's title, image, excerpt and date. Use the existing entry routes for article links, avoiding duplicate article content.\nOptions: Use collection entries with field mapping / Manually author the cards inside each block / Support both collection entries and manual cards\nSelected: Use collection entries with field mapping\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-64\">Question 64\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library\nQuestion: How should Contact and Newsletter forms submit?\nDescription (Markdown source):\nThe site is static. Several old form layouts have no submission destination, so copying their appearance would leave a nonfunctional form.\nRecommendation: Allow an editor-configured external form endpoint. Require it before publishing a form; the service handles delivery and its response. No new backend is needed in the builder.\nOptions: Submit to a configured external form endpoint / Use a button linking to an external contact or signup page / Defer blocks that contain submission forms\nSelected: Submit to a configured external form endpoint\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-65\">Question 65\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library\nQuestion: Where should the imported Footer layouts be used?\nDescription (Markdown source):\nPublic pages already have a built-in footer. Adding another footer as an ordinary block would otherwise display both.\nRecommendation: Treat Footer layouts as page blocks for this import and omit the built-in footer on pages using one. A shared footer editor can be a separate feature.\nOptions: Page blocks that replace that page's built-in footer / A shared site-wide footer configured once / Defer Footer blocks for now\nSelected: A shared site-wide footer configured once\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["decisions/index","journal/2026-10-06-block-library-round-one"]},{"id":"journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Int
