2 storage (DEC-019) but leaves upload authorization and media type scope open.\u003c/p>\n\u003ch2 id=\"resolved-in-round-four\">Resolved in round four\u003c/h2>\n\u003cp>Q20–Q24 are resolved by DEC-021–DEC-025 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Question\u003c/th>\n\u003cth>Outcome\u003c/th>\n\u003cth>Scope\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Q20\u003c/td>\n\u003ctd>Runtime editor-supplied R2 credentials\u003c/td>\n\u003ctd>Keep the application static; no secret-holding upload helper.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q21\u003c/td>\n\u003ctd>Basic fields and safe schema changes\u003c/td>\n\u003ctd>No nested models, relations, or migration tooling initially.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q22\u003c/td>\n\u003ctd>Automatic standard listing and entry pages\u003c/td>\n\u003ctd>Existing block editor supplies entry bodies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q23\u003c/td>\n\u003ctd>Simple image resizing and light compression\u003c/td>\n\u003ctd>Generate web image sets for sufficiently large images; no audio/video transcoding.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q24\u003c/td>\n\u003ctd>Media URLs may be public before Publish\u003c/td>\n\u003ctd>Page publication remains separate.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"engineering-work-for-the-implementation-plan\">Engineering work for the implementation plan\u003c/h2>\n\u003cp>Define the content/schema file formats, block authoring and preview interfaces, dependency sharing, Git save/merge concurrency handling, schema compatibility validation, and upload metadata. Propose concrete starter blocks and validation scenarios. Choose image widths/encodings/limits and browser fallbacks, and document repository permissions and R2 CORS setup. The contract definitions now specify these behaviors. Exact library pins, build integration, limits, and validation fixtures remain engineering work. No unimplemented behavior is certified by the interview or wiki checks.\u003c/p>\n\u003cp>R2 credential retention was not separately selected; propose the same tab-session behavior as GitHub when specifying the editor session. Do not mistake that proposed default for an explicitly answered question. The optional future capabilities excluded above can be reconsidered if the user expands scope.\u003c/p>\n\u003ch2 id=\"research\">Research\u003c/h2>\n\u003cp>Astro documents that its Vite-provided environment values are statically replaced at build time and that public variables are available to client code. The inference for a fully static editor is that checking a configured credential in client code is a UI gate, not server-enforced authorization. \u003ca href=\"https://docs.astro.build/en/guides/environment-variables/\" rel=\"noreferrer\">Environment variables\u003c/a>.\u003c/p>\n\u003cp>GitHub documents repository-scoped fine-grained tokens and branch merging through its API. Exact required permissions and branch protection compatibility must be validated in implementation. \u003ca href=\"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens\" rel=\"noreferrer\">Personal access tokens\u003c/a>, \u003ca href=\"https://docs.github.com/en/rest/branches/branches#merge-a-branch\" rel=\"noreferrer\">branch API\u003c/a>.\u003c/p>\n\u003cp>GitHub Pages offers static hosting; private-repository availability depends on the account plan. This is a deployment option, not an accepted provider choice. \u003ca href=\"https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages\" rel=\"noreferrer\">GitHub Pages\u003c/a>.\u003c/p>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-one-decisions","journal/2026-10-05-round-three-decisions","journal/2026-10-05-round-two-decisions"]},{"id":"discussions/technical-contracts","title":"Technical contracts","section":"Discussions","order":0,"metadata":{"status":"Implemented foundation; live providers unverified"},"metadataHtml":"\u003cspan>Status: Implemented foundation; live providers unverified\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Technical contracts\nupdated: 2026-10-05\nstatus: Implemented foundation; live providers unverified\n---\n# Technical contracts\n\nPlanned extension: the [accepted block-library scope](block-library.md) adds theme/tag catalog metadata, schema lists and bindings, collection card mappings, shared header/footer and external forms. Those contracts are pending implementation; the current code described below has not yet gained them.\n\nThe generic-page redesign (DEC-058–DEC-073) is implemented following authorization on 2026-10-06. The current page, entry, collection, binding and rich-text contracts below replace the earlier entry-block model. See [implementation and verification](../verification/runs/2026-10-05T1650Z-generic-pages.md). Live providers remain unverified.\n\nThe accepted foundation and contract choices are DEC-026–DEC-050 in the [decision register](../decisions/index.md). The technical interview is complete. Concrete definitions below are engineering specifications derived from those decisions. The [feature map](../features/index.md) links the implemented API, recipes, and build-specific evidence. Supporting library choices and exact adapter integration remain subject to implementation validation.\n\n## Shared dependencies — Q33\n\nAccepted: build-generated self-hosted vendor modules. Proposed mechanics: a site-owned dependency registry and lockfile. Block manifests declare compatible ranges; imports resolve to the site's selected versions. Incompatible requirements fail validation rather than silently installing another framework runtime or rewriting compatibility declarations. Emit minified, hashed ESM vendor/shared chunks in the site's static output. Block entry points import the same module URLs; load only the graph required by the current page or preview. Retained deprecated block implementations must follow the same compatibility rule.\n\nUse the build's module graph instead of requiring every package to be a single manually maintained script. Packages may have multiple entry points and transitive dependencies. Sharing must include the React editor, block adapters, and block widgets. Build output inspection and browser checks must verify the result; a configuration flag alone is not proof.\n\nVite documents resolving duplicated dependencies to a root copy, along with limitations for certain SSR ESM outputs: [resolve.dedupe](https://vite.dev/config/shared-options#resolve-dedupe). Its [production build](https://vite.dev/guide/build) manages emitted assets. Browser [import maps](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script/type/importmap) can map names to module URLs, but do not make incompatible package APIs compatible. Exact implementation must match the Vite version bundled with the chosen Astro release; compatible versions are now pinned in the application package and lockfile.\n\n## Documents and identity — Q34\n\nAccepted: immutable record IDs and ID-based filenames, with editable paths/slugs stored inside. Draft concrete page shape:\n\n```json\n{\n  \"formatVersion\": 1,\n  \"id\": \"page_about\",\n  \"kind\": \"static\",\n  \"path\": \"/about\",\n  \"title\": \"About\",\n  \"blocks\": [\n    {\n      \"id\": \"block_intro\",\n      \"type\": \"core/hero\",\n      \"version\": 1,\n      \"props\": { \"heading\": \"About us\" }\n    }\n  ]\n}\n```\n\nProposed path: `content/pages/\u003cid>.json`. Entries use `content/entries/\u003ccollectionId>/\u003cid>.json` with `collectionId`, `slug`, and schema `values` only. Page records carry `kind: \"static\" | \"generic\"`; only static pages have a `path`. Definitions live in `content/collections/\u003cid>.json`; settings and media metadata have separate records. Example IDs above are readable placeholders; the concrete definitions below specify ID generation. Reserved route validation is required before publishing. Draft/main branches determine publication; no second per-record publication flag is implied.\n\n## Text inside blocks — Q35\n\nAccepted: JSON remains the outer format, with Markdown strings for formatted prose inside text blocks. Use a shared renderer and a restricted safe feature set. This does not add arbitrary executable Markdown/MDX. DEC-068/DEC-072 extend the schema field set with rich text and uploaded-image/YouTube embeds. Users edit through visual formatting controls for headings, paragraphs, emphasis, links, and lists. Unsupported externally edited Markdown must be preserved or explicitly rejected for visual editing, never silently discarded on a round-trip.\n\n## Versioning — Q36\n\nAccepted: retain old implementations, mark them deprecated, and let users explicitly choose the block version. A block instance's `type` plus `version` selects its renderer and field definition. Deprecated means still renderable and selectable, not automatically upgraded. No automated migration functions.\n\nOn an explicit version switch, carry over fields only when keys and value types remain compatible with the target definition. New, renamed, incompatible, or otherwise unmatched target fields begin empty for manual entry; do not guess mappings or silently fill new fields with defaults. Preserve the original instance during the unsaved edit so cancellation can restore it. Save is the boundary for persisting the new version. Required empty values may be saved in drafts but block Publish.\n\nProposed source layout: `src/blocks/\u003cname>/v1/`, `v2/`, each with its own definition and renderer. The registry maps `(type, version)` to an installed implementation. Newly added instances default to the latest nondeprecated version; the version selector still exposes retained versions. Keep an independent `formatVersion` on file envelopes. If an implementation is genuinely missing, preserve its raw data and show a repairable error rather than dropping the instance. These guardrails preserve the user's manual model without inventing a migration subsystem.\n\n## Block manifest and rendering — Q37\n\nIllustrative source organization: `src/blocks/\u003cname>/definition.ts`, a shared rendering component/template, optional styles, and optional custom widgets. An explicit registry imports installed blocks. A definition declares a stable type, data version, fields/defaults, framework, renderer entries, dependency requirements, and activation policy. Content JSON only names the block type and supplies JSON values; it contains no import paths or executable callbacks.\n\nAccepted: framework adapters around ordinary React/Svelte/Vue components; vanilla/custom blocks implement the same lifecycle directly. Draft signature:\n\n```ts\ninterface PreviewHandle\u003cProps> {\n  update(props: Props, context: BlockContext): void;\n  destroy(): void;\n}\ntype Mount\u003cProps> = (\n  host: HTMLElement,\n  props: Props,\n  context: BlockContext\n) => PreviewHandle\u003cProps>;\n```\n\nThe host is a stable block root. Updates receive the complete structurally valid props object, which may contain blank or missing draft values; preview renderers must tolerate these and show placeholders. Public renderers receive publish-valid values. Removal cleans up listeners, subscriptions, and the framework root. Reordering preserves instance IDs and avoids remounting unnecessarily. The build renderer consumes the same validated props/context through Astro's static rendering path. Astro integration details must be validated before treating this as a final interface.\n\nProposed context contains stable instance identity, optional global theme/settings, and media/reference resolution. GitHub/R2 clients and credentials are not passed as block props. This is an API separation, not a security sandbox: developer-installed code in the same document is trusted code.\n\nCustom field widgets are React components that receive a JSON value, change callback, field configuration, and validation/read-only state. Their saved values still pass the field schema. Exact signatures depend on the answers and must remain small.\n\n## Activation — Q38\n\nAccepted: a block declaration of `never`, `visible`, `idle`, or `load` for public-page browser activation, with complete static HTML where appropriate. Preview always mounts the necessary renderer so edits appear immediately; this differs from public hydration policy. Framework runtime/dependency loading is shared, regardless of when block instances activate. Astro provides these public hydration modes; see [client directives](https://docs.astro.build/en/reference/directives-reference/#client-directives). Custom adapters must honor equivalent behavior where Astro directives do not apply directly.\n\n## References — Q39\n\nAccepted: stable IDs for internal page/entry/media references, with explicit URLs for external links. Proposed record detail: media records contain R2 object URLs, image variants, dimensions, MIME type, and size. Blocks reference media IDs plus presentation data such as alt text. The build resolves IDs to URLs; published pages need not fetch the source metadata registry. This avoids duplicating a variant set into every block but adds a reference-resolution step.\n\n\n\n## Supporting stack choices\n\nThe selected core is Astro/TypeScript, React, Cloudflare Kumo, and CSS Modules, with Astro's compatible Vite toolchain. DEC-048 supersedes the earlier Base UI choice: Kumo supplies admin controls, dialogs, and toasts; CSS Modules own layout. Scope Kumo's standalone styles to admin surfaces and portals, outside the live preview. Blocks use React/Svelte/Vue integrations or the vanilla adapter. Exact package versions must be pinned together during scaffolding; illustrative versions mentioned in answers are not pins.\n\nEngineering recommendations for remaining supporting tools:\n\n- Octokit for the requested browser GitHub SDK, importing only required client/API features. Its [official repository](https://github.com/octokit/octokit.js) documents browser support.\n- AWS SDK v3 S3 client for R2, loaded with the media editor. Cloudflare supplies an [R2 example](https://developers.cloudflare.com/r2/examples/aws/aws-sdk-js-v3/).\n- Lexical's React integration with a restricted Markdown transformer set as the visual-editor candidate. Its [Markdown package](https://lexical.dev/docs/packages/lexical-markdown) supports import/export and selectable transformers. Verify fidelity and bundle cost before adoption; do not persist Lexical's internal document format as the content source.\n- pnpm with one lockfile and a Node version supported by the selected Astro release. No separate independently bundled copy of the admin's React runtime.\n\nThese recommendations identify an implementation direction, not user-approved package pins or measured integration results.\n\n## Concrete record definitions\n\nThese are the initial engineering definitions. Use JSON with two-space indentation and a final newline. Sort object keys consistently where meaningful; preserve array order for blocks, navigation, fields, and select options. Generate IDs once using UUIDs with entity prefixes; the shorter readable IDs in examples are illustrative. Renaming a route does not rename its ID file.\n\n```ts\ntype JsonValue = null | boolean | number | string | JsonValue[] | JsonObject;\ninterface JsonObject { [key: string]: JsonValue }\ninterface Envelope { formatVersion: 1; id: string }\ninterface BlockInstance {\n  id: string;\n  type: string;          // e.g. core/hero\n  version: number;      // installed implementation version\n  props: JsonObject;\n  bindings?: Record\u003cstring, string>;\n}\ninterface PageRecord extends Envelope {\n  kind: \"static\" | \"generic\";\n  path?: string; // required public route for static; forbidden for generic\n  title: string;\n  blocks: BlockInstance[];\n}\ninterface EntryRecord extends Envelope {\n  collectionId: string;\n  slug: string;         // route segment under the collection\n  values: JsonObject;\n}\ninterface CollectionRecord extends Envelope {\n  name: string;\n  path: string;\n  fields: FieldSpec[];\n  titleField: string;   // key of a text field in values\n  genericPageId?: string;\n}\ntype LinkRef =\n  | { kind: \"page\" | \"entry\"; id: string; fragment?: string }\n  | { kind: \"external\"; url: string };\ninterface MediaRef { mediaId: string; alt?: string }\ninterface MediaFile {\n  key: string; url: string; mime: string; bytes: number;\n  width?: number; height?: number;\n}\ninterface MediaRecord extends Envelope {\n  name: string;\n  original: MediaFile;\n  variants: MediaFile[];\n}\ninterface SiteRecord extends Envelope {\n  title: string;\n  globals: JsonObject;\n  navigation: { id: string; label: string; to: LinkRef }[];\n}\n```\n\nFiles live under `content/pages/`, `content/entries/\u003ccollectionId>/`, `content/collections/`, and `content/media/`, using `\u003cid>.json`. `content/site.json` stores the site record. Connection configuration is separate from content, and no credential is serialized into these files.\n\nPublic paths must be unique across static pages and assigned entry routes. A collection prefix does not reserve or generate an index route; a static page may occupy it. Generic pages have no independent URL. Normalize paths and reject traversal, reserved admin/assets routes, and collisions. Internal references resolve through IDs. External links use allowed URL schemes; scripts are never a link target. Media URLs are derived from configured R2/public origins and recorded per uploaded object. The registry is used during build/preview, not fetched by every public block.\n\n## Field and custom-widget definitions\n\n```ts\ninterface FieldBase {\n  key: string; label: string; required?: boolean;\n  default?: JsonValue;\n}\ntype FieldSpec = FieldBase & (\n  | { type: \"text\"; multiline?: boolean }\n  | { type: \"richtext\" }\n  | { type: \"number\"; min?: number; max?: number }\n  | { type: \"date\" }                 // YYYY-MM-DD\n  | { type: \"toggle\" }               // boolean, false is a value\n  | { type: \"select\"; options: { value: string; label: string }[] }\n  | { type: \"media\" }                // MediaRef\n);\ntype BlockField = (FieldSpec & { widget?: string }) | (FieldBase & {\n  type: \"custom\"; widget: string;    // block-owned JSON validation required\n});\ninterface WidgetProps\u003cValue extends JsonValue> {\n  value: Value | undefined;\n  onChange(value: Value): void;\n  field: BlockField;\n  errors: readonly string[];\n  readOnly: boolean;\n}\ninterface ValidationIssue {\n  path: string;                     // document/block/field address\n  code: string;\n  message: string;                  // plain-language UI text\n  phase: \"structure\" | \"publish\";\n}\n```\n\nCollection definitions permit only `FieldSpec`; custom block controls do not expand the collection schema-builder scope. A Markdown control stores a string, while a compound block-specific control can use `custom` with the block's shared pure validator. The browser/build run identical value validation. Widget registration maps stable IDs to trusted React components; JSON never supplies component source code.\n\nField keys and select option values are stable machine identifiers; labels are editable. Empty draft values are omitted or null; empty required text is a publication error, while zero and false are valid values. Nonempty values of the wrong type are structural errors. Do not coerce existing numbers, strings, or selections to make a new version appear compatible.\n\nDevelopers and the portal edit the same serialized collection definition. New fields are optional by default unless existing entries can satisfy required validation. Block schema definitions remain developer-owned. Collection keys/types with existing data cannot be destructively renamed/changed through the initial portal. Adding an entry initializes declared defaults; switching an existing block version follows the manual blank-field rule above instead.\n\n## Block source contract and styles\n\nA source definition includes `type`, integer `version`, `label`, optional `deprecated`, `fields`, `defaults`, `framework`, `activation`, and declared dependency ranges. Separate renderer registrations reference compiled source modules: a static renderer, a browser mount entry, and optional React widget loaders. Framework adapters generate common lifecycle behavior from a shared component when possible. Explicit alternate renderers need parity fixtures.\n\nDo not import every block or framework into every public page. Generate statically analyzable registry entries and lazy browser loaders as part of the build. Keep browser-safe metadata separate from build-only rendering code; do not send server modules or credentials to the browser. Preview code must load only installed registered versions and clean up after itself.\n\nBlocks use CSS Modules or framework-scoped styles. CSS resets and document-wide theme variables belong to the shell. Namespaced keyframes/fonts and popup portal containers need equivalent ownership. Portals used by editor components mount inside a styled editor-owned container; block popups must retain block-scoped classes. Optional globals such as theme are passed as values/CSS variables, with no mandatory stylistic adherence.\n\nDEC-075 adds optional `site.globals.contentMaxWidth`, a positive finite number in pixels (omitted/null uses 1200). The public shell and live preview set `--site-content-max-width` using the same resolver. Blocks are advised to cap their content containers with it; full-width backgrounds and narrower text measures are allowed. This is a maximum border-box container width including padding, not a forced block width. The variable is scoped away from admin controls. Invalid explicit values fail content validation; preview safely falls back while editing.\n\nDEC-078 adds optional `bodyFont`, `headingFont`, `bodyFontSize`, `bodyLineHeight` and `pageGutter` globals. Font IDs select local fallback stacks (`system`, `arial`, `georgia`, `times`, `mono`); missing/null uses system sans. Body size defaults to 16px, unitless line height to 1.6 and horizontal page gutter to 24px. Size and line height accept finite positive numbers; gutter accepts finite nonnegative numbers. Explicit invalid values fail structural validation. The shared resolver emits corresponding `--site-*` tokens on the public shell/live preview only, safely defaulting during draft editing. Starter blocks follow these tokens; custom block adherence remains advisory. Heading line height and vertical spacing remain block-specific. These defaults and the initial font list are implementation choices within the accepted controls.\n\n\nCSS scoping is a contract and validation target, not a sandbox for arbitrary untrusted JavaScript. Public HTML, the admin document, and every retained block version must be checked for cross-component style leakage and duplicate runtime execution.\n\n## Save, recovery, and Publish\n\nAccepted behavior: Save includes all pending editor changes in one draft commit; incomplete content may be saved. Publish requires valid required values and resolvable references. Tab-session recovery preserves unsaved content through reloads, without persisting uploaded binary buffers.\n\nEngineering transaction design:\n\n1. Load a coherent content snapshot from an immutable draft commit. Hold its SHA as the editing base.\n2. Validate structural integrity of all staged records and file paths. Serialize the full pending change set into a tree and a single commit parented by that base.\n3. Advance the draft reference without force. If another writer has advanced it incompatibly, reject the stale save; preserve edits and explain recovery. Do not overwrite a file-at-a-time or silently replay the user's values onto newer content.\n4. On uncertain network results, compare the remote reference/commit before retrying. Only clear recovery state after the intended saved commit is confirmed. Associate recovery with repository, branch, base commit, and editor compatibility version.\n5. Publish operates on a saved, immutable draft snapshot, not unsaved local state. Validate that entire snapshot, including installed block versions, schema compatibility, paths, references, and required fields. Revalidate during the production build as well.\n6. Initial implementation direction: publish through a fast-forward merge of the validated snapshot into main, using a non-forced reference update. Main must be an ancestor; diverged source/content changes require synchronization and renewed validation. This preserves the snapshot under concurrent updates without claiming a preflight read is a lock. Fast-forwarding satisfies the selected draft-to-main merge behavior without requiring a special merge commit.\n7. After publishing, retain newer unpublished draft commits if present; never reset the draft branch or force main. Report “published to Git; deployment pending” until deployment completion is actually known. Netlify owns the deployment pipeline.\n\nGitHub exposes the required [tree](https://docs.github.com/en/rest/git/trees#create-a-tree), [commit](https://docs.github.com/en/rest/git/commits#create-a-commit), and [reference](https://docs.github.com/en/rest/git/refs#update-a-reference) operations. Its [merge endpoint](https://docs.github.com/en/rest/branches/branches#merge-a-branch) also accepts an immutable commit SHA, but can merge against a changing base; that alone does not guarantee a previously validated full output tree. The initial fast-forward constraint is an engineering recommendation that needs race testing.\n\nSession recovery includes the base SHA and incomplete values. If the server draft changed, restore local work as recoverable edits rather than silently treating it as current. If browser storage is unavailable/full, show that recovery is unavailable and keep live edits intact. Keep credentials out of content backups, logs, and Git. R2 credential retention can follow the GitHub tab-session default; this is an engineering default, not a separately answered preference.\n\n## Initial proof and validation targets\n\nImplementation began after explicit user authorization. The [initial verification run](../verification/runs/2026-10-05T0819Z-implementation.md) records coverage and gaps for these targets:\n\n- Render repeated React blocks, another framework block, and a vanilla block in public output and a single-document preview. Verify compatible vendors execute once per document, styles stay scoped, and pages load only their required dependencies.\n- Edit/reorder/remove blocks; ensure updates appear immediately and destruction releases handlers. Compare published and preview content/layout on fixed fixtures.\n- Render a retained deprecated version; switch versions, carry only compatible fields, leave unmatched values blank, cancel safely, and Save incomplete data without automatic migrations.\n- Round-trip the limited Markdown feature set through visual editing and shared rendering, including pasted content and unsupported markup preservation.\n- Verify all-or-nothing multi-record saves, stale saves, lost responses, reload recovery, invalid Publish rejection, concurrent saves during Publish, and divergent main handling.\n- Upload image variants to a test R2 bucket, verify IDs/metadata and responsive URLs, and preserve original files when a format cannot safely be resized. Verify credentials never appear in generated assets.\n\nExact image widths/quality, upload limits, package pins, drag-and-drop implementation, and route reservations are bounded engineering details to validate during implementation, not unresolved product preferences. No application behavior is claimed tested by the wiki build.\n\n## Admin interaction refinement\n\nDEC-049–DEC-050 keep preview islands interactive without a mode toggle. Block rows sort with pointer dragging; Alt+Up/Down provides keyboard access without extra visible controls. Session recovery remains automatic and silent. Submission runs the existing Save/Publish checks and reports errors through Kumo toasts; there is no proactive issue panel or saved/unsaved status banner.\n\nDEC-057 limits mounting preview islands and displaying the preview-width control to page editing, including page-block details. Content entries, collection schemas, Media and Site use a normal admin main region. Leaving page editing unmounts the preview rather than hiding an active rendering. All areas still share content state, recovery and Save draft/Publish.\n\n## Generic pages and field bindings — DEC-058–DEC-073\n\n`Definition.kind` is `static` (the default for existing blocks) or `generic`. The Add block catalog and publication validation enforce the page kind. Generic starter blocks are Entry heading, Entry rich text and Entry media. A normal Collection list block selects a collection on static pages; entries without a generic page display plain titles rather than broken links.\n\n`Block.bindings` maps each target block-field key to a schema field-key string. `props` retain literal values, used directly for unbound fields and as fallbacks for bound fields. Source and target field types must match; custom/collection selector fields are not bindable schema types. Validate every schema assigned to a template even when it has no entries. Unknown keys, missing assignments and type mismatches are publication issues; structurally valid drafts remain saveable. Resolved values also satisfy the block field's range/options/media constraints before publishing.\n\nA blank optional source value (missing, null or whitespace-only text) uses the literal fallback or null. Zero and false remain real values. Schema required fields still govern entry completeness; a bound block field does not make an optional schema field required. Broken bindings never silently use fallback to bypass validation. Version switching retains only bindings whose target fields remain compatible.\n\nDuring preview, generic renderers receive literal props and `context.bindingPlaceholders`, mapping bound target keys to strings such as `{{title}}`. Block authors display that placeholder at the field's rendered position, including media slots. Publication receives resolved typed props and no placeholder map. Context also exposes collection title/link summaries for listing blocks; provider credentials remain outside context.\n\nRich-text values are Markdown strings. Uploaded images use `![alt](media:media_id)` and YouTube uses `![title](youtube:VIDEO_ID)`; `src/core/embeds.ts` validates identifiers and accepted YouTube URLs. The shared Markdown renderer resolves image IDs through media metadata and emits only canonical youtube-nocookie iframe URLs. Raw HTML is escaped. Visual Lexical nodes preserve these destinations through editing, undo and reload. Unsupported Markdown remains in source mode; missing media and unsupported embed destinations block publication. Choose an already uploaded image through the rich-text Image control; upload new files through Media first.\n\nThe existing demo entries were replaced under DEC-073. There is no automatic legacy-entry migration: imported entry block arrays and old collection `template` values are structural errors. Tab recovery now uses `lean-sitebuilder:recovery:v2`; older recovery storage remains untouched. JSON file envelopes retain `formatVersion: 1`, with the explicit page discriminator and structural checks distinguishing the revised shape.\n\n## Persistent admin navigation — DEC-074\n\nThe main navigation is independent of the selected area's content. Pages opens to its table; page and block details add their own drawer beside the navigation, followed by the live preview. Other areas retain the standard admin main region. At widths up to 800px, a Menu button opens the same navigation in a Kumo dialog; choosing an area closes it. Area switching preserves the shared content state and removes any active page preview.\n","toc":[{"id":"shared-dependencies-q33","title":"Shared dependencies — Q33","depth":2},{"id":"documents-and-identity-q34","title":"Documents and identity — Q34","depth":2},{"id":"text-inside-blocks-q35","title":"Text inside blocks — Q35","depth":2},{"id":"versioning-q36","title":"Versioning — Q36","depth":2},{"id":"block-manifest-and-rendering-q37","title":"Block manifest and rendering — Q37","depth":2},{"id":"activation-q38","title":"Activation — Q38","depth":2},{"id":"references-q39","title":"References — Q39","depth":2},{"id":"supporting-stack-choices","title":"Supporting stack choices","depth":2},{"id":"concrete-record-definitions","title":"Concrete record definitions","depth":2},{"id":"field-and-custom-widget-definitions","title":"Field and custom-widget definitions","depth":2},{"id":"block-source-contract-and-styles","title":"Block source contract and styles","depth":2},{"id":"save-recovery-and-publish","title":"Save, recovery, and Publish","depth":2},{"id":"initial-proof-and-validation-targets","title":"Initial proof and validation targets","depth":2},{"id":"admin-interaction-refinement","title":"Admin interaction refinement","depth":2},{"id":"generic-pages-and-field-bindings-dec-058-dec-073","title":"Generic pages and field bindings — DEC-058–DEC-073","depth":2},{"id":"persistent-admin-navigation-dec-074","title":"Persistent admin navigation — DEC-074","depth":2}],"titleAnchor":"technical-contracts","links":["discussions/block-library","verification/runs/2026-10-05T1650Z-generic-pages","decisions/index","features/index","verification/runs/2026-10-05T0819Z-implementation"],"attachments":[],"html":"\u003cp>Planned extension: the \u003ca href=\"#/discussions/block-library\">accepted block-library scope\u003c/a> adds theme/tag catalog metadata, schema lists and bindings, collection card mappings, shared header/footer and external forms. Those contracts are pending implementation; the current code described below has not yet gained them.\u003c/p>\n\u003cp>The generic-page redesign (DEC-058–DEC-073) is implemented following authorization on 2026-10-06. The current page, entry, collection, binding and rich-text contracts below replace the earlier entry-block model. See \u003ca href=\"#/verification/runs/2026-10-05T1650Z-generic-pages\">implementation and verification\u003c/a>. Live providers remain unverified.\u003c/p>\n\u003cp>The accepted foundation and contract choices are DEC-026–DEC-050 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>. The technical interview is complete. Concrete definitions below are engineering specifications derived from those decisions. The \u003ca href=\"#/features/index\">feature map\u003c/a> links the implemented API, recipes, and build-specific evidence. Supporting library choices and exact adapter integration remain subject to implementation validation.\u003c/p>\n\u003ch2 id=\"shared-dependencies-q33\">Shared dependencies — Q33\u003c/h2>\n\u003cp>Accepted: build-generated self-hosted vendor modules. Proposed mechanics: a site-owned dependency registry and lockfile. Block manifests declare compatible ranges; imports resolve to the site's selected versions. Incompatible requirements fail validation rather than silently installing another framework runtime or rewriting compatibility declarations. Emit minified, hashed ESM vendor/shared chunks in the site's static output. Block entry points import the same module URLs; load only the graph required by the current page or preview. Retained deprecated block implementations must follow the same compatibility rule.\u003c/p>\n\u003cp>Use the build's module graph instead of requiring every package to be a single manually maintained script. Packages may have multiple entry points and transitive dependencies. Sharing must include the React editor, block adapters, and block widgets. Build output inspection and browser checks must verify the result; a configuration flag alone is not proof.\u003c/p>\n\u003cp>Vite documents resolving duplicated dependencies to a root copy, along with limitations for certain SSR ESM outputs: \u003ca href=\"https://vite.dev/config/shared-options#resolve-dedupe\" rel=\"noreferrer\">resolve.dedupe\u003c/a>. Its \u003ca href=\"https://vite.dev/guide/build\" rel=\"noreferrer\">production build\u003c/a> manages emitted assets. Browser \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script/type/importmap\" rel=\"noreferrer\">import maps\u003c/a> can map names to module URLs, but do not make incompatible package APIs compatible. Exact implementation must match the Vite version bundled with the chosen Astro release; compatible versions are now pinned in the application package and lockfile.\u003c/p>\n\u003ch2 id=\"documents-and-identity-q34\">Documents and identity — Q34\u003c/h2>\n\u003cp>Accepted: immutable record IDs and ID-based filenames, with editable paths/slugs stored inside. Draft concrete page shape:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \"formatVersion\": 1,\n  \"id\": \"page_about\",\n  \"kind\": \"static\",\n  \"path\": \"/about\",\n  \"title\": \"About\",\n  \"blocks\": [\n    {\n      \"id\": \"block_intro\",\n      \"type\": \"core/hero\",\n      \"version\": 1,\n      \"props\": { \"heading\": \"About us\" }\n    }\n  ]\n}\n\u003c/code>\u003c/pre>\n\u003cp>Proposed path: \u003ccode>content/pages/&lt;id&gt;.json\u003c/code>. Entries use \u003ccode>content/entries/&lt;collectionId&gt;/&lt;id&gt;.json\u003c/code> with \u003ccode>collectionId\u003c/code>, \u003ccode>slug\u003c/code>, and schema \u003ccode>values\u003c/code> only. Page records carry \u003ccode>kind: \"static\" | \"generic\"\u003c/code>; only static pages have a \u003ccode>path\u003c/code>. Definitions live in \u003ccode>content/collections/&lt;id&gt;.json\u003c/code>; settings and media metadata have separate records. Example IDs above are readable placeholders; the concrete definitions below specify ID generation. Reserved route validation is required before publishing. Draft/main branches determine publication; no second per-record publication flag is implied.\u003c/p>\n\u003ch2 id=\"text-inside-blocks-q35\">Text inside blocks — Q35\u003c/h2>\n\u003cp>Accepted: JSON remains the outer format, with Markdown strings for formatted prose inside text blocks. Use a shared renderer and a restricted safe feature set. This does not add arbitrary executable Markdown/MDX. DEC-068/DEC-072 extend the schema field set with rich text and uploaded-image/YouTube embeds. Users edit through visual formatting controls for headings, paragraphs, emphasis, links, and lists. Unsupported externally edited Markdown must be preserved or explicitly rejected for visual editing, never silently discarded on a round-trip.\u003c/p>\n\u003ch2 id=\"versioning-q36\">Versioning — Q36\u003c/h2>\n\u003cp>Accepted: retain old implementations, mark them deprecated, and let users explicitly choose the block version. A block instance's \u003ccode>type\u003c/code> plus \u003ccode>version\u003c/code> selects its renderer and field definition. Deprecated means still renderable and selectable, not automatically upgraded. No automated migration functions.\u003c/p>\n\u003cp>On an explicit version switch, carry over fields only when keys and value types remain compatible with the target definition. New, renamed, incompatible, or otherwise unmatched target fields begin empty for manual entry; do not guess mappings or silently fill new fields with defaults. Preserve the original instance during the unsaved edit so cancellation can restore it. Save is the boundary for persisting the new version. Required empty values may be saved in drafts but block Publish.\u003c/p>\n\u003cp>Proposed source layout: \u003ccode>src/blocks/&lt;name&gt;/v1/\u003c/code>, \u003ccode>v2/\u003c/code>, each with its own definition and renderer. The registry maps \u003ccode>(type, version)\u003c/code> to an installed implementation. Newly added instances default to the latest nondeprecated version; the version selector still exposes retained versions. Keep an independent \u003ccode>formatVersion\u003c/code> on file envelopes. If an implementation is genuinely missing, preserve its raw data and show a repairable error rather than dropping the instance. These guardrails preserve the user's manual model without inventing a migration subsystem.\u003c/p>\n\u003ch2 id=\"block-manifest-and-rendering-q37\">Block manifest and rendering — Q37\u003c/h2>\n\u003cp>Illustrative source organization: \u003ccode>src/blocks/&lt;name&gt;/definition.ts\u003c/code>, a shared rendering component/template, optional styles, and optional custom widgets. An explicit registry imports installed blocks. A definition declares a stable type, data version, fields/defaults, framework, renderer entries, dependency requirements, and activation policy. Content JSON only names the block type and supplies JSON values; it contains no import paths or executable callbacks.\u003c/p>\n\u003cp>Accepted: framework adapters around ordinary React/Svelte/Vue components; vanilla/custom blocks implement the same lifecycle directly. Draft signature:\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">interface PreviewHandle&lt;Props&gt; {\n  update(props: Props, context: BlockContext): void;\n  destroy(): void;\n}\ntype Mount&lt;Props&gt; = (\n  host: HTMLElement,\n  props: Props,\n  context: BlockContext\n) =&gt; PreviewHandle&lt;Props&gt;;\n\u003c/code>\u003c/pre>\n\u003cp>The host is a stable block root. Updates receive the complete structurally valid props object, which may contain blank or missing draft values; preview renderers must tolerate these and show placeholders. Public renderers receive publish-valid values. Removal cleans up listeners, subscriptions, and the framework root. Reordering preserves instance IDs and avoids remounting unnecessarily. The build renderer consumes the same validated props/context through Astro's static rendering path. Astro integration details must be validated before treating this as a final interface.\u003c/p>\n\u003cp>Proposed context contains stable instance identity, optional global theme/settings, and media/reference resolution. GitHub/R2 clients and credentials are not passed as block props. This is an API separation, not a security sandbox: developer-installed code in the same document is trusted code.\u003c/p>\n\u003cp>Custom field widgets are React components that receive a JSON value, change callback, field configuration, and validation/read-only state. Their saved values still pass the field schema. Exact signatures depend on the answers and must remain small.\u003c/p>\n\u003ch2 id=\"activation-q38\">Activation — Q38\u003c/h2>\n\u003cp>Accepted: a block declaration of \u003ccode>never\u003c/code>, \u003ccode>visible\u003c/code>, \u003ccode>idle\u003c/code>, or \u003ccode>load\u003c/code> for public-page browser activation, with complete static HTML where appropriate. Preview always mounts the necessary renderer so edits appear immediately; this differs from public hydration policy. Framework runtime/dependency loading is shared, regardless of when block instances activate. Astro provides these public hydration modes; see \u003ca href=\"https://docs.astro.build/en/reference/directives-reference/#client-directives\" rel=\"noreferrer\">client directives\u003c/a>. Custom adapters must honor equivalent behavior where Astro directives do not apply directly.\u003c/p>\n\u003ch2 id=\"references-q39\">References — Q39\u003c/h2>\n\u003cp>Accepted: stable IDs for internal page/entry/media references, with explicit URLs for external links. Proposed record detail: media records contain R2 object URLs, image variants, dimensions, MIME type, and size. Blocks reference media IDs plus presentation data such as alt text. The build resolves IDs to URLs; published pages need not fetch the source metadata registry. This avoids duplicating a variant set into every block but adds a reference-resolution step.\u003c/p>\n\u003ch2 id=\"supporting-stack-choices\">Supporting stack choices\u003c/h2>\n\u003cp>The selected core is Astro/TypeScript, React, Cloudflare Kumo, and CSS Modules, with Astro's compatible Vite toolchain. DEC-048 supersedes the earlier Base UI choice: Kumo supplies admin controls, dialogs, and toasts; CSS Modules own layout. Scope Kumo's standalone styles to admin surfaces and portals, outside the live preview. Blocks use React/Svelte/Vue integrations or the vanilla adapter. Exact package versions must be pinned together during scaffolding; illustrative versions mentioned in answers are not pins.\u003c/p>\n\u003cp>Engineering recommendations for remaining supporting tools:\u003c/p>\n\u003cul>\n\u003cli>Octokit for the requested browser GitHub SDK, importing only required client/API features. Its \u003ca href=\"https://github.com/octokit/octokit.js\" rel=\"noreferrer\">official repository\u003c/a> documents browser support.\u003c/li>\n\u003cli>AWS SDK v3 S3 client for R2, loaded with the media editor. Cloudflare supplies an \u003ca href=\"https://developers.cloudflare.com/r2/examples/aws/aws-sdk-js-v3/\" rel=\"noreferrer\">R2 example\u003c/a>.\u003c/li>\n\u003cli>Lexical's React integration with a restricted Markdown transformer set as the visual-editor candidate. Its \u003ca href=\"https://lexical.dev/docs/packages/lexical-markdown\" rel=\"noreferrer\">Markdown package\u003c/a> supports import/export and selectable transformers. Verify fidelity and bundle cost before adoption; do not persist Lexical's internal document format as the content source.\u003c/li>\n\u003cli>pnpm with one lockfile and a Node version supported by the selected Astro release. No separate independently bundled copy of the admin's React runtime.\u003c/li>\n\u003c/ul>\n\u003cp>These recommendations identify an implementation direction, not user-approved package pins or measured integration results.\u003c/p>\n\u003ch2 id=\"concrete-record-definitions\">Concrete record definitions\u003c/h2>\n\u003cp>These are the initial engineering definitions. Use JSON with two-space indentation and a final newline. Sort object keys consistently where meaningful; preserve array order for blocks, navigation, fields, and select options. Generate IDs once using UUIDs with entity prefixes; the shorter readable IDs in examples are illustrative. Renaming a route does not rename its ID file.\u003c/p>\n\u003cpre>\u003ccode class=\"language-ts\">type JsonValue = null | boolean | number | string | JsonValue[] | JsonObject;\ninterface JsonObject { [key: string]: JsonValue }\ninterface Envelope { formatVersion: 1; id: string }\ninterface BlockInstance {\n  id: string;\n  type: string;          // e.g. core/hero\n  version: number;      // installed implementation version\n  props: JsonObject;\n  bindings?: Record&lt;string, string&gt;;\n}\ninterface PageRecord extends Envelope {\n  kind: \"static\" | \"generic\";\n  path?: string; // required public route for static; forbidden for generic\n  title: string;\n  blocks: BlockInstance[];\n}\ninterface EntryRecord extends Envelope {\n  collectionId: string;\n  slug: string;         // route segment under the collection\n  values: JsonObject;\n}\ninterface CollectionRecord extends Envelope {\n  name: string;\n  path: string;\n  fields: FieldSpec[];\n  titleField: string;   // key of a text field in values\n  genericPageId?: string;\n}\ntype LinkRef =\n  | { kind: \"page\" | \"entry\"; id: string; fragment?: string }\n  | { kind: \"external\"; url: string };\ninterface MediaRef { mediaId: string; alt?: string }\ninterface MediaFile {\n  key: string; url: string; mime: string; bytes: number;\n  width?: number; height?: number;\n}\ninterface MediaRecord extends Envelope {\n  name: string;\n  original: MediaFile;\n  variants: MediaFile[];\n}\ninterface SiteRecord extends Envelope {\n  title: string;\n  globals: JsonObject;\n  navigation: { id: string; label: string; to: LinkRef }[];\n}\n\u003c/code>\u003c/pre>\n\u003cp>Files live under \u003ccode>content/pages/\u003c/code>, \u003ccode>content/entries/&lt;collectionId&gt;/\u003c/code>, \u003ccode>content/collections/\u003c/code>, and \u003ccode>content/media/\u003c/code>, using \u003ccode>&lt;id&gt;.json\u003c/code>. \u003ccode>content/site.json\u003c/code> stores the site record. Connection configuration is separate from content, and no credential is serialized into these files.\u003c/p>\n\u003cp>Public paths must be unique across static pages and assigned entry routes. A collection prefix does not reserve or generate an index route; a static page may occupy it. Generic pages have no independent URL. Normalize paths and reject traversal, reserved admin/assets routes, and collisions. Internal references resolve through IDs. External links use allowed URL schemes; scripts are never a link target. Media URLs are derived from configured R2/public origins and recorded per uploaded object. The registry is used during build/preview, not fetched by every public block.\u003c/p>\n\u003ch2 id=\"field-and-custom-widget-definitions\">Field and custom-widget definitions\u003c/h2>\n\u003cpre>\u003ccode class=\"language-ts\">interface FieldBase {\n  key: string; label: string; required?: boolean;\n  default?: JsonValue;\n}\ntype FieldSpec = FieldBase &amp; (\n  | { type: \"text\"; multiline?: boolean }\n  | { type: \"richtext\" }\n  | { type: \"number\"; min?: number; max?: number }\n  | { type: \"date\" }                 // YYYY-MM-DD\n  | { type: \"toggle\" }               // boolean, false is a value\n  | { type: \"select\"; options: { value: string; label: string }[] }\n  | { type: \"media\" }                // MediaRef\n);\ntype BlockField = (FieldSpec &amp; { widget?: string }) | (FieldBase &amp; {\n  type: \"custom\"; widget: string;    // block-owned JSON validation required\n});\ninterface WidgetProps&lt;Value extends JsonValue&gt; {\n  value: Value | undefined;\n  onChange(value: Value): void;\n  field: BlockField;\n  errors: readonly string[];\n  readOnly: boolean;\n}\ninterface ValidationIssue {\n  path: string;                     // document/block/field address\n  code: string;\n  message: string;                  // plain-language UI text\n  phase: \"structure\" | \"publish\";\n}\n\u003c/code>\u003c/pre>\n\u003cp>Collection definitions permit only \u003ccode>FieldSpec\u003c/code>; custom block controls do not expand the collection schema-builder scope. A Markdown control stores a string, while a compound block-specific control can use \u003ccode>custom\u003c/code> with the block's shared pure validator. The browser/build run identical value validation. Widget registration maps stable IDs to trusted React components; JSON never supplies component source code.\u003c/p>\n\u003cp>Field keys and select option values are stable machine identifiers; labels are editable. Empty draft values are omitted or null; empty required text is a publication error, while zero and false are valid values. Nonempty values of the wrong type are structural errors. Do not coerce existing numbers, strings, or selections to make a new version appear compatible.\u003c/p>\n\u003cp>Developers and the portal edit the same serialized collection definition. New fields are optional by default unless existing entries can satisfy required validation. Block schema definitions remain developer-owned. Collection keys/types with existing data cannot be destructively renamed/changed through the initial portal. Adding an entry initializes declared defaults; switching an existing block version follows the manual blank-field rule above instead.\u003c/p>\n\u003ch2 id=\"block-source-contract-and-styles\">Block source contract and styles\u003c/h2>\n\u003cp>A source definition includes \u003ccode>type\u003c/code>, integer \u003ccode>version\u003c/code>, \u003ccode>label\u003c/code>, optional \u003ccode>deprecated\u003c/code>, \u003ccode>fields\u003c/code>, \u003ccode>defaults\u003c/code>, \u003ccode>framework\u003c/code>, \u003ccode>activation\u003c/code>, and declared dependency ranges. Separate renderer registrations reference compiled source modules: a static renderer, a browser mount entry, and optional React widget loaders. Framework adapters generate common lifecycle behavior from a shared component when possible. Explicit alternate renderers need parity fixtures.\u003c/p>\n\u003cp>Do not import every block or framework into every public page. Generate statically analyzable registry entries and lazy browser loaders as part of the build. Keep browser-safe metadata separate from build-only rendering code; do not send server modules or credentials to the browser. Preview code must load only installed registered versions and clean up after itself.\u003c/p>\n\u003cp>Blocks use CSS Modules or framework-scoped styles. CSS resets and document-wide theme variables belong to the shell. Namespaced keyframes/fonts and popup portal containers need equivalent ownership. Portals used by editor components mount inside a styled editor-owned container; block popups must retain block-scoped classes. Optional globals such as theme are passed as values/CSS variables, with no mandatory stylistic adherence.\u003c/p>\n\u003cp>DEC-075 adds optional \u003ccode>site.globals.contentMaxWidth\u003c/code>, a positive finite number in pixels (omitted/null uses 1200). The public shell and live preview set \u003ccode>--site-content-max-width\u003c/code> using the same resolver. Blocks are advised to cap their content containers with it; full-width backgrounds and narrower text measures are allowed. This is a maximum border-box container width including padding, not a forced block width. The variable is scoped away from admin controls. Invalid explicit values fail content validation; preview safely falls back while editing.\u003c/p>\n\u003cp>DEC-078 adds optional \u003ccode>bodyFont\u003c/code>, \u003ccode>headingFont\u003c/code>, \u003ccode>bodyFontSize\u003c/code>, \u003ccode>bodyLineHeight\u003c/code> and \u003ccode>pageGutter\u003c/code> globals. Font IDs select local fallback stacks (\u003ccode>system\u003c/code>, \u003ccode>arial\u003c/code>, \u003ccode>georgia\u003c/code>, \u003ccode>times\u003c/code>, \u003ccode>mono\u003c/code>); missing/null uses system sans. Body size defaults to 16px, unitless line height to 1.6 and horizontal page gutter to 24px. Size and line height accept finite positive numbers; gutter accepts finite nonnegative numbers. Explicit invalid values fail structural validation. The shared resolver emits corresponding \u003ccode>--site-*\u003c/code> tokens on the public shell/live preview only, safely defaulting during draft editing. Starter blocks follow these tokens; custom block adherence remains advisory. Heading line height and vertical spacing remain block-specific. These defaults and the initial font list are implementation choices within the accepted controls.\u003c/p>\n\u003cp>CSS scoping is a contract and validation target, not a sandbox for arbitrary untrusted JavaScript. Public HTML, the admin document, and every retained block version must be checked for cross-component style leakage and duplicate runtime execution.\u003c/p>\n\u003ch2 id=\"save-recovery-and-publish\">Save, recovery, and Publish\u003c/h2>\n\u003cp>Accepted behavior: Save includes all pending editor changes in one draft commit; incomplete content may be saved. Publish requires valid required values and resolvable references. Tab-session recovery preserves unsaved content through reloads, without persisting uploaded binary buffers.\u003c/p>\n\u003cp>Engineering transaction design:\u003c/p>\n\u003col>\n\u003cli>Load a coherent content snapshot from an immutable draft commit. Hold its SHA as the editing base.\u003c/li>\n\u003cli>Validate structural integrity of all staged records and file paths. Serialize the full pending change set into a tree and a single commit parented by that base.\u003c/li>\n\u003cli>Advance the draft reference without force. If another writer has advanced it incompatibly, reject the stale save; preserve edits and explain recovery. Do not overwrite a file-at-a-time or silently replay the user's values onto newer content.\u003c/li>\n\u003cli>On uncertain network results, compare the remote reference/commit before retrying. Only clear recovery state after the intended saved commit is confirmed. Associate recovery with repository, branch, base commit, and editor compatibility version.\u003c/li>\n\u003cli>Publish operates on a saved, immutable draft snapshot, not unsaved local state. Validate that entire snapshot, including installed block versions, schema compatibility, paths, references, and required fields. Revalidate during the production build as well.\u003c/li>\n\u003cli>Initial implementation direction: publish through a fast-forward merge of the validated snapshot into main, using a non-forced reference update. Main must be an ancestor; diverged source/content changes require synchronization and renewed validation. This preserves the snapshot under concurrent updates without claiming a preflight read is a lock. Fast-forwarding satisfies the selected draft-to-main merge behavior without requiring a special merge commit.\u003c/li>\n\u003cli>After publishing, retain newer unpublished draft commits if present; never reset the draft branch or force main. Report “published to Git; deployment pending” until deployment completion is actually known. Netlify owns the deployment pipeline.\u003c/li>\n\u003c/ol>\n\u003cp>GitHub exposes the required \u003ca href=\"https://docs.github.com/en/rest/git/trees#create-a-tree\" rel=\"noreferrer\">tree\u003c/a>, \u003ca href=\"https://docs.github.com/en/rest/git/commits#create-a-commit\" rel=\"noreferrer\">commit\u003c/a>, and \u003ca href=\"https://docs.github.com/en/rest/git/refs#update-a-reference\" rel=\"noreferrer\">reference\u003c/a> operations. Its \u003ca href=\"https://docs.github.com/en/rest/branches/branches#merge-a-branch\" rel=\"noreferrer\">merge endpoint\u003c/a> also accepts an immutable commit SHA, but can merge against a changing base; that alone does not guarantee a previously validated full output tree. The initial fast-forward constraint is an engineering recommendation that needs race testing.\u003c/p>\n\u003cp>Session recovery includes the base SHA and incomplete values. If the server draft changed, restore local work as recoverable edits rather than silently treating it as current. If browser storage is unavailable/full, show that recovery is unavailable and keep live edits intact. Keep credentials out of content backups, logs, and Git. R2 credential retention can follow the GitHub tab-session default; this is an engineering default, not a separately answered preference.\u003c/p>\n\u003ch2 id=\"initial-proof-and-validation-targets\">Initial proof and validation targets\u003c/h2>\n\u003cp>Implementation began after explicit user authorization. The \u003ca href=\"#/verification/runs/2026-10-05T0819Z-implementation\">initial verification run\u003c/a> records coverage and gaps for these targets:\u003c/p>\n\u003cul>\n\u003cli>Render repeated React blocks, another framework block, and a vanilla block in public output and a single-document preview. Verify compatible vendors execute once per document, styles stay scoped, and pages load only their required dependencies.\u003c/li>\n\u003cli>Edit/reorder/remove blocks; ensure updates appear immediately and destruction releases handlers. Compare published and preview content/layout on fixed fixtures.\u003c/li>\n\u003cli>Render a retained deprecated version; switch versions, carry only compatible fields, leave unmatched values blank, cancel safely, and Save incomplete data without automatic migrations.\u003c/li>\n\u003cli>Round-trip the limited Markdown feature set through visual editing and shared rendering, including pasted content and unsupported markup preservation.\u003c/li>\n\u003cli>Verify all-or-nothing multi-record saves, stale saves, lost responses, reload recovery, invalid Publish rejection, concurrent saves during Publish, and divergent main handling.\u003c/li>\n\u003cli>Upload image variants to a test R2 bucket, verify IDs/metadata and responsive URLs, and preserve original files when a format cannot safely be resized. Verify credentials never appear in generated assets.\u003c/li>\n\u003c/ul>\n\u003cp>Exact image widths/quality, upload limits, package pins, drag-and-drop implementation, and route reservations are bounded engineering details to validate during implementation, not unresolved product preferences. No application behavior is claimed tested by the wiki build.\u003c/p>\n\u003ch2 id=\"admin-interaction-refinement\">Admin interaction refinement\u003c/h2>\n\u003cp>DEC-049–DEC-050 keep preview islands interactive without a mode toggle. Block rows sort with pointer dragging; Alt+Up/Down provides keyboard access without extra visible controls. Session recovery remains automatic and silent. Submission runs the existing Save/Publish checks and reports errors through Kumo toasts; there is no proactive issue panel or saved/unsaved status banner.\u003c/p>\n\u003cp>DEC-057 limits mounting preview islands and displaying the preview-width control to page editing, including page-block details. Content entries, collection schemas, Media and Site use a normal admin main region. Leaving page editing unmounts the preview rather than hiding an active rendering. All areas still share content state, recovery and Save draft/Publish.\u003c/p>\n\u003ch2 id=\"generic-pages-and-field-bindings-dec-058-dec-073\">Generic pages and field bindings — DEC-058–DEC-073\u003c/h2>\n\u003cp>\u003ccode>Definition.kind\u003c/code> is \u003ccode>static\u003c/code> (the default for existing blocks) or \u003ccode>generic\u003c/code>. The Add block catalog and publication validation enforce the page kind. Generic starter blocks are Entry heading, Entry rich text and Entry media. A normal Collection list block selects a collection on static pages; entries without a generic page display plain titles rather than broken links.\u003c/p>\n\u003cp>\u003ccode>Block.bindings\u003c/code> maps each target block-field key to a schema field-key string. \u003ccode>props\u003c/code> retain literal values, used directly for unbound fields and as fallbacks for bound fields. Source and target field types must match; custom/collection selector fields are not bindable schema types. Validate every schema assigned to a template even when it has no entries. Unknown keys, missing assignments and type mismatches are publication issues; structurally valid drafts remain saveable. Resolved values also satisfy the block field's range/options/media constraints before publishing.\u003c/p>\n\u003cp>A blank optional source value (missing, null or whitespace-only text) uses the literal fallback or null. Zero and false remain real values. Schema required fields still govern entry completeness; a bound block field does not make an optional schema field required. Broken bindings never silently use fallback to bypass validation. Version switching retains only bindings whose target fields remain compatible.\u003c/p>\n\u003cp>During preview, generic renderers receive literal props and \u003ccode>context.bindingPlaceholders\u003c/code>, mapping bound target keys to strings such as \u003ccode>{{title}}\u003c/code>. Block authors display that placeholder at the field's rendered position, including media slots. Publication receives resolved typed props and no placeholder map. Context also exposes collection title/link summaries for listing blocks; provider credentials remain outside context.\u003c/p>\n\u003cp>Rich-text values are Markdown strings. Uploaded images use \u003ccode>![alt](media:media_id)\u003c/code> and YouTube uses \u003ccode>![title](youtube:VIDEO_ID)\u003c/code>; \u003ccode>src/core/embeds.ts\u003c/code> validates identifiers and accepted YouTube URLs. The shared Markdown renderer resolves image IDs through media metadata and emits only canonical youtube-nocookie iframe URLs. Raw HTML is escaped. Visual Lexical nodes preserve these destinations through editing, undo and reload. Unsupported Markdown remains in source mode; missing media and unsupported embed destinations block publication. Choose an already uploaded image through the rich-text Image control; upload new files through Media first.\u003c/p>\n\u003cp>The existing demo entries were replaced under DEC-073. There is no automatic legacy-entry migration: imported entry block arrays and old collection \u003ccode>template\u003c/code> values are structural errors. Tab recovery now uses \u003ccode>lean-sitebuilder:recovery:v2\u003c/code>; older recovery storage remains untouched. JSON file envelopes retain \u003ccode>formatVersion: 1\u003c/code>, with the explicit page discriminator and structural checks distinguishing the revised shape.\u003c/p>\n\u003ch2 id=\"persistent-admin-navigation-dec-074\">Persistent admin navigation — DEC-074\u003c/h2>\n\u003cp>The main navigation is independent of the selected area's content. Pages opens to its table; page and block details add their own drawer beside the navigation, followed by the live preview. Other areas retain the standard admin main region. At widths up to 800px, a Menu button opens the same navigation in a Kumo dialog; choosing an area closes it. Area switching preserves the shared content state and removes any active page preview.\u003c/p>\n","backlinks":["index","discussions/agreed-design","discussions/open-questions","features/editor","features/generic-pages","features/index","features/publishing","features/static-blocks","journal/2026-10-05-content-block-contracts","journal/2026-10-05-editor-saving","journal/2026-10-05-technical-foundations"]},{"id":"features/block-library","title":"Searchable block library","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Searchable block library\nupdated: 2026-10-06\n---\n# Searchable block library\n\n**ID:** FEAT-block-library\n\n## Intent and basis\n\n[DEC-079–DEC-091](../decisions/index.md) and the [accepted scope](../discussions/block-library.md) expand the legacy TailwindBlocks reference into current-system content blocks. The six reference websites guide coverage, not exact copies.\n\n## Entry points and prerequisites\n\nPages → open a static or generic page → Add block. Site → Header and Footer configure shared chrome. Collection schemas → a field → list defines structured entry data; Content edits its values. These are local editor operations until Save/Publish is used.\n\n## Expected outcomes\n\n- A large Kumo dialog searches names, themes and tags. Theme and multiple tag filters combine; Reset restores all compatible choices. Clicking a card inserts immediately. Preview is separate and supports desktop/mobile widths. Thumbnails render the actual defaults and mount only near the visible grid.\n- The catalog has no visible title or bottom Close action; an accessible top-right × is centered using Kumo's square icon-button shape. Filters, tags, count and cards share one vertical scroll area. Tags stay on one horizontally scrollable line with the scrollbar hidden; small left/right buttons at its ends scroll by up to 240px, disable at the corresponding edge and honor reduced motion. Reset filters stays visible, sizes to its text and disables when no filter is set. Cards cap at 270px wide. Preview uses the same scroll area and starts at the top when opened or exited. These refinements follow direct screenshot feedback on 2026-10-06.\n- There are 45 Tailwind UI base variants: three each for Hero, Header introductions, Content, CTA, Bento, Features, FAQ, Stats, Team, Testimonials, Logos, Blog, Contact, Newsletter and Footer. Another 27 generic variants cover Hero, Header, Content, Bento, Features, FAQ, Stats, Team and Testimonials. Older versions remain installed. Starter is the fallback theme for older definitions.\n- Only compatible page kinds and latest nondeprecated versions appear in the picker. The three footer layouts are selected in Site, not inserted as page blocks. Existing records keep their stored version.\n- Repeated content uses stable row identities, nested item editing, add/remove, mouse dragging and Alt+Arrow keyboard ordering. The [shared sortable control](editor.md) gives page blocks and repeated items the same optimistic FLIP behavior: direct vertical carrying from the grab point, locked X position, 150ms neighbor/settle animations, edge scrolling, and commit on release even outside the list. Gaps remain valid positions. Only the list previews the new order while held; committed content and the website preview update once on release. Schema lists have one structured row level, using supported scalar/rich-text/media types. Block-owned structures can nest for footer columns and grouped navigation.\n- Generic list bindings match row field keys and types. Required child fields must be available. Empty optional lists use the fixed fallback, consistently with optional scalar bindings. The generic editor names the required item shape; bound previews show the field-name placeholder.\n- Blog blocks select a collection and optional title/summary/image/date mappings. Blank title mapping uses the collection title field. Only mapped entry values are added to that block's context; unrelated blocks do not receive them. Entry URLs follow the existing generic-page assignment rules.\n- Header settings support brand/logo, navigation items, grouped dropdown links and an optional action. Native disclosure controls support mobile and keyboard navigation without a public client runtime. Until customized, the header uses existing navigation; customized header/footer URLs are explicit URL fields.\n- Shared footer layout and content persist in `site.footer`. Removing it restores the site-title footer. The generator imports only the selected footer implementation into public layouts. Header/footer sources are shared with the page preview.\n- Forms use native POST to an explicitly configured HTTP(S) endpoint; a destination is required for publication. Contact sends name/email/message; Newsletter sends email. Browser validation enforces required inputs. The endpoint supplies its success/error page. Editor/catalog previews cannot submit. No provider-specific form backend is included.\n- Content controls have no new design panels. Layouts follow site fonts, body size/line height, gutter, content width and light/dark mode. Theme CSS is scoped; built-in abstract artwork appears until media is selected. No legacy Payload dependencies, remote placeholder images or new dependencies are introduced.\n\n## Verification recipe\n\n1. Run `pnpm verify`. The library tests cover every new renderer with default, empty and long escaped content, typed lists/bindings, mapped collection context, form contracts, shared chrome and retained versions. Generation tests verify footer selection, stale-file cleanup and unchanged-file preservation.\n2. In a fresh admin tab open Home → Add block. Confirm the title/footer actions are absent, the centered × closes without insertion, Reset starts disabled, tags stay on one horizontal row, and vertically scrolling moves the filters with the grid. Check the tag arrows move a short distance in either direction, disable at each edge, update after resizing, and leave native horizontal scrolling usable with no visible scrollbar. Cards should remain at most 270px wide across window sizes. Search hero; combine theme and tags; try a nonexistent query and Reset. Reset clears the filters and disables again. Preview a result, toggle Mobile and go Back: no insertion, with the toolbar visible at the top. Click the card: one block appears and its content editor opens.\n3. Add Split accordion. Edit a repeated question, reorder with its handle, reload and confirm value/order recovery. Drag up and down, releasing on either edge and the middle of the gap between two rows; the live row positions and final order should agree. Move sideways outside the list and release: the row stays in its original X lane, follows cursor Y and commits the shown order. Add/remove another item and try Alt+Arrow. Cancel block changes restores the captured block.\n4. In a generic page add a FAQ block and bind Items to a compatible schema list with `question` (text) and `answer` (richtext). Populate an entry; published rendering uses those rows. Missing keys/types or required child values fail publication. Schema editing remains separate from entry editing.\n5. Site → Choose footer offers three layouts. Edit nested links; Pages previews show the same shared footer. Header → Navigation permits grouped links. Test menu disclosures with Enter/Tab at a narrow containing width.\n6. For native submission verification, use a disposable loopback endpoint and test-only values. Check the received POST and both success/error responses. Verify previews remain disabled. Remove the test page and stop its endpoint afterwards.\n\n## Coverage and limitations\n\nAll 72 new variants have automated rendering coverage. Browser checks sampled catalog, repeatable editing, shared chrome and public layouts; they are not a complete visual audit of every variant on every device. The theme is an adapted starting library, not finished brand-specific designs. External form service behavior, live GitHub/R2/Netlify operations and physical mobile devices are outside the local checks.\n\n## Verification history\n\n- [Optimistic FLIP sorting and Chartr reference behavior](../verification/runs/2026-10-06T0845Z-sortable-flip.md).\n- [Gutter drop regression repair](../verification/runs/2026-10-06T0632Z-gutter-drop.md).\n- [Close-icon alignment and tag scrollbar refinement](../verification/runs/2026-10-06T0628Z-catalog-controls.md).\n- [Catalog polish and automated checks](../verification/runs/2026-10-06T0619Z-catalog-polish.md); visual verification was blocked by the computer-use URL restriction.\n- [Block-library implementation and checks](../verification/runs/2026-10-06T1320Z-block-library.md).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"searchable-block-library","links":["decisions/index","discussions/block-library","features/editor","verification/runs/2026-10-06T0845Z-sortable-flip","verification/runs/2026-10-06T0632Z-gutter-drop","verification/runs/2026-10-06T0628Z-catalog-controls","verification/runs/2026-10-06T0619Z-catalog-polish","verification/runs/2026-10-06T1320Z-block-library"],"attachments":[],"html":"\u003cp>\u003cstrong>ID:\u003c/strong> FEAT-block-library\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>\u003ca href=\"#/decisions/index\">DEC-079–DEC-091\u003c/a> and the \u003ca href=\"#/discussions/block-library\">accepted scope\u003c/a> expand the legacy TailwindBlocks reference into current-system content blocks. The six reference websites guide coverage, not exact copies.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>Pages → open a static or generic page → Add block. Site → Header and Footer configure shared chrome. Collection schemas → a field → list defines structured entry data; Content edits its values. These are local editor operations until Save/Publish is used.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expec
