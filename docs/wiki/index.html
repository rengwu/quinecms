--\ntitle: Block library and Tailwind-inspired catalog\nupdated: 2026-10-06\nstatus: Exploring\n---\n# Block library and Tailwind-inspired catalog\n\nThe user requested a larger Add a block dialog with search/filter controls above a block grid. Each block belongs to one theme and has multiple tags; theme, tags and block name must be searchable/filterable. Tailwind UI is the example theme, with hero/header as example tags.\n\nThe user also requested adapting approximately 3–5 blocks from every category in the previous astro-payload TailwindBlocks library. They must be refitted to the current system rather than copied verbatim. The current turn invites questions before implementation.\n\n## Inspected source\n\nReference directory: `/Users/rengwu/Desktop/Projects/astro-payload/sites/default/astro/src/blocks/components/TailwindBlocks`.\n\nCounting variant directories with schema.ts gives 123 blocks in 15 categories:\n\n| Category | Variants |\n| --- | ---: |\n| Bento | 3 |\n| Blog | 7 |\n| Contact | 7 |\n| Content | 7 |\n| Cta | 11 |\n| Faq | 7 |\n| Feat | 15 |\n| Footer | 7 |\n| Header | 8 |\n| Hero | 12 |\n| LogoCloud | 6 |\n| Newsletter | 6 |\n| Stats | 8 |\n| Team | 9 |\n| Testimonials | 10 |\n\nRepresentative reads: HeroSimpleCentered, FeatSimple, BlogThreeColImgs, NewsletterSmSbs and Footer4ColSimple. The old code uses Payload array/group/upload fields, Astro renderers and Tailwind styles. Several newsletter forms have no submission action. Footer variants contain nested navigation lists. These are reference designs, not compatible current-system block modules.\n\nThe current block Definition has no theme/tags/thumbnail metadata. Its catalog filters by page kind and latest nondeprecated version and immediately inserts on click. Current block fields support primitive fields and custom widgets, but no standard repeatable groups. Collection-list context currently exposes entry titles/links only. The public shell has its own header/footer. These facts make list authoring, blog data, form behavior, generic variants and footer ownership consequential choices.\n\n## Proposed approach, awaiting answers\n\nStart with three distinct variants per category (45 blocks), within the requested range. Use a larger Kumo dialog, name/theme/tag search, a theme selector, tag filters and a preview grid. Give each adapted block current metadata/defaults, scoped styles, shared public/preview rendering, and support for site typography/width/gutter. Keep old retained block versions available. Q60–Q65 have since been resolved; see [round-one decisions and reference sites](2026-10-06-block-library-round-one.md). The original recommendations below do not override those answers.\n\nNo application code or reference-repository files were changed in this planning turn. User requirements are DEC-079–DEC-081; recommendations are not accepted answers.\n","toc":[{"id":"inspected-source","title":"Inspected source","depth":2},{"id":"proposed-approach-awaiting-answers","title":"Proposed approach, awaiting answers","depth":2}],"titleAnchor":"block-library-and-tailwind-inspired-catalog","links":["journal/2026-10-06-block-library-round-one"],"attachments":[],"html":"\u003cp>The user requested a larger Add a block dialog with search/filter controls above a block grid. Each block belongs to one theme and has multiple tags; theme, tags and block name must be searchable/filterable. Tailwind UI is the example theme, with hero/header as example tags.\u003c/p>\n\u003cp>The user also requested adapting approximately 3–5 blocks from every category in the previous astro-payload TailwindBlocks library. They must be refitted to the current system rather than copied verbatim. The current turn invites questions before implementation.\u003c/p>\n\u003ch2 id=\"inspected-source\">Inspected source\u003c/h2>\n\u003cp>Reference directory: \u003ccode>/Users/rengwu/Desktop/Projects/astro-payload/sites/default/astro/src/blocks/components/TailwindBlocks\u003c/code>.\u003c/p>\n\u003cp>Counting variant directories with schema.ts gives 123 blocks in 15 categories:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Category\u003c/th>\n\u003cth>Variants\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bento\u003c/td>\n\u003ctd>3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blog\u003c/td>\n\u003ctd>7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Contact\u003c/td>\n\u003ctd>7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Content\u003c/td>\n\u003ctd>7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cta\u003c/td>\n\u003ctd>11\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Faq\u003c/td>\n\u003ctd>7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Feat\u003c/td>\n\u003ctd>15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Footer\u003c/td>\n\u003ctd>7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Header\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hero\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LogoCloud\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Newsletter\u003c/td>\n\u003ctd>6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Stats\u003c/td>\n\u003ctd>8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Team\u003c/td>\n\u003ctd>9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Testimonials\u003c/td>\n\u003ctd>10\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Representative reads: HeroSimpleCentered, FeatSimple, BlogThreeColImgs, NewsletterSmSbs and Footer4ColSimple. The old code uses Payload array/group/upload fields, Astro renderers and Tailwind styles. Several newsletter forms have no submission action. Footer variants contain nested navigation lists. These are reference designs, not compatible current-system block modules.\u003c/p>\n\u003cp>The current block Definition has no theme/tags/thumbnail metadata. Its catalog filters by page kind and latest nondeprecated version and immediately inserts on click. Current block fields support primitive fields and custom widgets, but no standard repeatable groups. Collection-list context currently exposes entry titles/links only. The public shell has its own header/footer. These facts make list authoring, blog data, form behavior, generic variants and footer ownership consequential choices.\u003c/p>\n\u003ch2 id=\"proposed-approach-awaiting-answers\">Proposed approach, awaiting answers\u003c/h2>\n\u003cp>Start with three distinct variants per category (45 blocks), within the requested range. Use a larger Kumo dialog, name/theme/tag search, a theme selector, tag filters and a preview grid. Give each adapted block current metadata/defaults, scoped styles, shared public/preview rendering, and support for site typography/width/gutter. Keep old retained block versions available. Q60–Q65 have since been resolved; see \u003ca href=\"#/journal/2026-10-06-block-library-round-one\">round-one decisions and reference sites\u003c/a>. The original recommendations below do not override those answers.\u003c/p>\n\u003cp>No application code or reference-repository files were changed in this planning turn. User requirements are DEC-079–DEC-081; recommendations are not accepted answers.\u003c/p>\n","backlinks":["decisions/index","discussions/block-library"]},{"id":"journal/2026-10-06-block-library-round-one","title":"Block library decisions and reference sites","section":"Journal","order":0,"metadata":{"status":"Round one resolved"},"metadataHtml":"\u003cspan>Status: Round one resolved\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Block library decisions and reference sites\nupdated: 2026-10-06\nstatus: Round one resolved\n---\n# Block library decisions and reference sites\n\n[Submitted answers Q60–Q65](2026-10-05-grill-821c1394-1fd0-47f5-a950-f71d9c006099.md) establish the following behavior. The static form and downloaded response were collected and cleaned up with the prepared grill-form scripts.\n\n| Question | Accepted answer | Implication |\n| --- | --- | --- |\n| Q60 | Add immediately; separate Preview action | Clicking the main card inserts the block. Preview has a distinct control and does not mutate content. |\n| Q61 | Static blocks plus useful generic counterparts now | The import includes meaningful schema-bindable variants in this phase, with page-kind filtering retained. |\n| Q62 | Editable lists | Block lists support adding, removing and reordering items; fixed numbered slots are insufficient. |\n| Q63 | Collection entries with field mapping | Blog cards select a collection, map display fields, and use entry routes. |\n| Q64 | Configured external form endpoint | Contact/newsletter forms require a destination before publication. The external service owns delivery/response; previews must not submit real data. |\n| Q65 | Shared site-wide footer configured once | Footer variants become shared site configuration instead of separate per-page content. |\n\n## Reference sites\n\nThe user added six capability/design benchmarks. They want the builder to be capable of recreating sites like these. This is a directional requirement; no exact-clone deliverable, asset copying, or requirement to reproduce every backend service was stated.\n\nReviewed the current homepage content/navigation with the web reader on 2026-10-06 local time. This was a structural review, not a completed visual/motion audit. Observed patterns and inferred implications are separate below.\n\n| Reference | Observed homepage patterns | Inferred block/editor needs |\n| --- | --- | --- |\n| [TDCX](https://www.tdcx.com/) | Service/industry/insight navigation, image-led service sections, case-study links, awards and CTAs | Varied split sections, service cards, proof/logo sections and collection-driven case studies |\n| [Accenture](https://www.accenture.com/en) | Grouped multi-level navigation, editorial research cards with expansion controls, carousel control, video spotlights, awards and news | Shared navigation, editorial grids/carousels, media sections and reusable content feeds |\n| [ASML](https://www.asml.com/en) | Nested navigation, product/technology sections, locations, careers and investor links | Structured navigation, media/content splits, location/card lists and multiple collection types |\n| [Couchbase](https://www.couchbase.com/) | Product/solution/resource navigation groups, feature sections, customer proof combining quotes and metrics, partner links and resource cards | Feature layouts, quote/stat combinations, logo sections, mapped collection cards and shared navigation/footer |\n| [Convex](https://www.convex.dev/) | Product hero, copyable setup content, feature/component descriptions, quotes, team and grouped footer links | Developer-focused content/code blocks, feature cards, testimonials and team layouts |\n| [Source Network](https://source.network/) | Section-led product narrative, expandable technical explanations, product imagery and developer links | Flexible editorial sections, expandable content and support for specialized authored blocks |\n\nThe block selection should cover these composition patterns, rather than merely choosing three near-identical variants in each legacy category. Site fonts, content width and page gutter remain shared defaults. Distinctive art direction or advanced animations may require additional developer-authored blocks; those are not established by this structural review.\n\n## Remaining consequential questions\n\n- Q66: Whether the current import should add a shared configurable header/grouped navigation, alongside the accepted shared footer.\n- Q67: Whether generic blocks may bind repeated content to structured list fields within an entry. This would extend the currently primitive/rich-text schema field set.\n- Q68: How much control editors get over the visual appearance of each themed block.\n\nThese decisions affect the shared contract and should precede adapting dozens of blocks. No application implementation was performed in this discussion turn.\n\nQ66–Q68 were subsequently resolved in [round two](2026-10-06-block-library-round-two.md). See the [consolidated scope](../discussions/block-library.md).\n","toc":[{"id":"reference-sites","title":"Reference sites","depth":2},{"id":"remaining-consequential-questions","title":"Remaining consequential questions","depth":2}],"titleAnchor":"block-library-decisions-and-reference-sites","links":["journal/2026-10-05-grill-821c1394-1fd0-47f5-a950-f71d9c006099","journal/2026-10-06-block-library-round-two","discussions/block-library"],"attachments":[],"html":"\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-821c1394-1fd0-47f5-a950-f71d9c006099\">Submitted answers Q60–Q65\u003c/a> establish the following behavior. The static form and downloaded response were collected and cleaned up with the prepared grill-form scripts.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Question\u003c/th>\n\u003cth>Accepted answer\u003c/th>\n\u003cth>Implication\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Q60\u003c/td>\n\u003ctd>Add immediately; separate Preview action\u003c/td>\n\u003ctd>Clicking the main card inserts the block. Preview has a distinct control and does not mutate content.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q61\u003c/td>\n\u003ctd>Static blocks plus useful generic counterparts now\u003c/td>\n\u003ctd>The import includes meaningful schema-bindable variants in this phase, with page-kind filtering retained.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q62\u003c/td>\n\u003ctd>Editable lists\u003c/td>\n\u003ctd>Block lists support adding, removing and reordering items; fixed numbered slots are insufficient.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q63\u003c/td>\n\u003ctd>Collection entries with field mapping\u003c/td>\n\u003ctd>Blog cards select a collection, map display fields, and use entry routes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q64\u003c/td>\n\u003ctd>Configured external form endpoint\u003c/td>\n\u003ctd>Contact/newsletter forms require a destination before publication. The external service owns delivery/response; previews must not submit real data.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q65\u003c/td>\n\u003ctd>Shared site-wide footer configured once\u003c/td>\n\u003ctd>Footer variants become shared site configuration instead of separate per-page content.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"reference-sites\">Reference sites\u003c/h2>\n\u003cp>The user added six capability/design benchmarks. They want the builder to be capable of recreating sites like these. This is a directional requirement; no exact-clone deliverable, asset copying, or requirement to reproduce every backend service was stated.\u003c/p>\n\u003cp>Reviewed the current homepage content/navigation with the web reader on 2026-10-06 local time. This was a structural review, not a completed visual/motion audit. Observed patterns and inferred implications are separate below.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Reference\u003c/th>\n\u003cth>Observed homepage patterns\u003c/th>\n\u003cth>Inferred block/editor needs\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"https://www.tdcx.com/\" rel=\"noreferrer\">TDCX\u003c/a>\u003c/td>\n\u003ctd>Service/industry/insight navigation, image-led service sections, case-study links, awards and CTAs\u003c/td>\n\u003ctd>Varied split sections, service cards, proof/logo sections and collection-driven case studies\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.accenture.com/en\" rel=\"noreferrer\">Accenture\u003c/a>\u003c/td>\n\u003ctd>Grouped multi-level navigation, editorial research cards with expansion controls, carousel control, video spotlights, awards and news\u003c/td>\n\u003ctd>Shared navigation, editorial grids/carousels, media sections and reusable content feeds\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.asml.com/en\" rel=\"noreferrer\">ASML\u003c/a>\u003c/td>\n\u003ctd>Nested navigation, product/technology sections, locations, careers and investor links\u003c/td>\n\u003ctd>Structured navigation, media/content splits, location/card lists and multiple collection types\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.couchbase.com/\" rel=\"noreferrer\">Couchbase\u003c/a>\u003c/td>\n\u003ctd>Product/solution/resource navigation groups, feature sections, customer proof combining quotes and metrics, partner links and resource cards\u003c/td>\n\u003ctd>Feature layouts, quote/stat combinations, logo sections, mapped collection cards and shared navigation/footer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://www.convex.dev/\" rel=\"noreferrer\">Convex\u003c/a>\u003c/td>\n\u003ctd>Product hero, copyable setup content, feature/component descriptions, quotes, team and grouped footer links\u003c/td>\n\u003ctd>Developer-focused content/code blocks, feature cards, testimonials and team layouts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://source.network/\" rel=\"noreferrer\">Source Network\u003c/a>\u003c/td>\n\u003ctd>Section-led product narrative, expandable technical explanations, product imagery and developer links\u003c/td>\n\u003ctd>Flexible editorial sections, expandable content and support for specialized authored blocks\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The block selection should cover these composition patterns, rather than merely choosing three near-identical variants in each legacy category. Site fonts, content width and page gutter remain shared defaults. Distinctive art direction or advanced animations may require additional developer-authored blocks; those are not established by this structural review.\u003c/p>\n\u003ch2 id=\"remaining-consequential-questions\">Remaining consequential questions\u003c/h2>\n\u003cul>\n\u003cli>Q66: Whether the current import should add a shared configurable header/grouped navigation, alongside the accepted shared footer.\u003c/li>\n\u003cli>Q67: Whether generic blocks may bind repeated content to structured list fields within an entry. This would extend the currently primitive/rich-text schema field set.\u003c/li>\n\u003cli>Q68: How much control editors get over the visual appearance of each themed block.\u003c/li>\n\u003c/ul>\n\u003cp>These decisions affect the shared contract and should precede adapting dozens of blocks. No application implementation was performed in this discussion turn.\u003c/p>\n\u003cp>Q66–Q68 were subsequently resolved in \u003ca href=\"#/journal/2026-10-06-block-library-round-two\">round two\u003c/a>. See the \u003ca href=\"#/discussions/block-library\">consolidated scope\u003c/a>.\u003c/p>\n","backlinks":["decisions/index","discussions/block-library","discussions/open-questions","journal/2026-10-06-block-library-plan","journal/2026-10-06-block-library-round-two"]},{"id":"journal/2026-10-06-block-library-round-two","title":"Block library scope settled","section":"Journal","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Block library scope settled\nupdated: 2026-10-06\nstatus: Accepted\n---\n# Block library scope settled\n\n[Submitted answers Q66–Q68](2026-10-06-grill-d9dd6be8-d154-41d3-a042-1d645992c592.md) resolve the remaining contract choices. The form response was saved and its temporary session/download cleaned up through the prepared scripts.\n\n- Q66 / DEC-089: add a shared configurable header with grouped navigation now.\n- Q67 / DEC-090: add structured list fields to collection schemas and compatible bindings for generic block lists now.\n- Q68 / DEC-091: editors change content only; themes and site settings control appearance. The proposed per-block Design panels were not selected.\n\nTogether with [round one](2026-10-06-block-library-round-one.md), the scoped interview is complete. No further product question is needed before implementing this phase. Metadata shape, compatible list matching, renderer reuse, list editing mechanics and exact adapted variants are engineering choices within the accepted behavior.\n\nThe [consolidated scope](../discussions/block-library.md) separates requirements from proposed implementation choices. It retains the six reference sites as capability/design benchmarks and starts with three distinct variants per legacy category, plus useful generic counterparts and a shared navigation header. Footer variants belong to site configuration. New blocks need working content controls, preview/public parity and real behavior rather than static visual placeholders.\n\nNo application code changed during the interview. Existing runtime behavior and earlier verification reports do not prove the planned features. The next work is implementing the shared field/binding and site-header/footer contracts, the catalog, and the refitted library, followed by focused and full verification.\n","toc":[],"titleAnchor":"block-library-scope-settled","links":["journal/2026-10-06-grill-d9dd6be8-d154-41d3-a042-1d645992c592","journal/2026-10-06-block-library-round-one","discussions/block-library"],"attachments":[],"html":"\u003cp>\u003ca href=\"#/journal/2026-10-06-grill-d9dd6be8-d154-41d3-a042-1d645992c592\">Submitted answers Q66–Q68\u003c/a> resolve the remaining contract choices. The form response was saved and its temporary session/download cleaned up through the prepared scripts.\u003c/p>\n\u003cul>\n\u003cli>Q66 / DEC-089: add a shared configurable header with grouped navigation now.\u003c/li>\n\u003cli>Q67 / DEC-090: add structured list fields to collection schemas and compatible bindings for generic block lists now.\u003c/li>\n\u003cli>Q68 / DEC-091: editors change content only; themes and site settings control appearance. The proposed per-block Design panels were not selected.\u003c/li>\n\u003c/ul>\n\u003cp>Together with \u003ca href=\"#/journal/2026-10-06-block-library-round-one\">round one\u003c/a>, the scoped interview is complete. No further product question is needed before implementing this phase. Metadata shape, compatible list matching, renderer reuse, list editing mechanics and exact adapted variants are engineering choices within the accepted behavior.\u003c/p>\n\u003cp>The \u003ca href=\"#/discussions/block-library\">consolidated scope\u003c/a> separates requirements from proposed implementation choices. It retains the six reference sites as capability/design benchmarks and starts with three distinct variants per legacy category, plus useful generic counterparts and a shared navigation header. Footer variants belong to site configuration. New blocks need working content controls, preview/public parity and real behavior rather than static visual placeholders.\u003c/p>\n\u003cp>No application code changed during the interview. Existing runtime behavior and earlier verification reports do not prove the planned features. The next work is implementing the shared field/binding and site-header/footer contracts, the catalog, and the refitted library, followed by focused and full verification.\u003c/p>\n","backlinks":["decisions/index","discussions/block-library","discussions/open-questions","journal/2026-10-06-block-library-round-one"]},{"id":"journal/2026-10-06-content-width","title":"Shared content width and development reloads","section":"Journal","order":0,"metadata":{"status":"Implemented locally"},"metadataHtml":"\u003cspan>Status: Implemented locally\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Shared content width and development reloads\nupdated: 2026-10-06\nstatus: Implemented locally\n---\n# Shared content width and development reloads\n\nDEC-075 follows the user's request for one site-wide content max-width that blocks are advised to follow. Site settings now stores the optional pixel value in globals. The public layout and preview use a shared resolver and CSS variable. Starter containers, header/footer and responsive media sizing follow it; Hero retains a full-width background and its narrower text measures. Documentation tells authors that adoption is optional.\n\nThe user also requested removing the reload confirmation during development. The unsaved-edit handler is now skipped in development; tab recovery still runs. Production keeps its existing unsaved-edit warning.\n\nThe [verification run](../verification/runs/2026-10-05T1735Z-content-width.md) records 77 passing tests, the static build and an actual dirty-session reload without confirmation. The existing dev process held a stale route for a removed demo entry; restarting it on 4321 cleared that error. The isolated verification window was closed, and the user's session remains available.\n","toc":[],"titleAnchor":"shared-content-width-and-development-reloads","links":["verification/runs/2026-10-05T1735Z-content-width"],"attachments":[],"html":"\u003cp>DEC-075 follows the user's request for one site-wide content max-width that blocks are advised to follow. Site settings now stores the optional pixel value in globals. The public layout and preview use a shared resolver and CSS variable. Starter containers, header/footer and responsive media sizing follow it; Hero retains a full-width background and its narrower text measures. Documentation tells authors that adoption is optional.\u003c/p>\n\u003cp>The user also requested removing the reload confirmation during development. The unsaved-edit handler is now skipped in development; tab recovery still runs. Production keeps its existing unsaved-edit warning.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-05T1735Z-content-width\">verification run\u003c/a> records 77 passing tests, the static build and an actual dirty-session reload without confirmation. The existing dev process held a stale route for a removed demo entry; restarting it on 4321 cleared that error. The isolated verification window was closed, and the user's session remains available.\u003c/p>\n","backlinks":[]},{"id":"journal/2026-10-06-generic-pages-implementation","title":"Generic-page implementation","section":"Journal","order":0,"metadata":{"status":"Implemented locally"},"metadataHtml":"\u003cspan>Status: Implemented locally\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Generic-page implementation\nupdated: 2026-10-06\nstatus: Implemented locally\n---\n# Generic-page implementation\n\nThe user authorized implementation after the completed [design interview](2026-10-05-generic-pages-discussion.md). DEC-058–DEC-073 now have application code and fresh demo content.\n\nPage records distinguish static/generic kinds. Entries have schema values only, and collections optionally reference a generic page. A shared route function drives static generation; collections no longer automatically create indexes. Three registered generic blocks supply heading, media and rich-text slots; the normal collection-list block supports explicitly created static indexes.\n\nBindings remain separate from literal props. Shared validation checks every assigned schema and resolved entry, preserving draft/publish distinctions and empty-value fallbacks. Preview uses placeholders. Rich-text Markdown stores stable media references and YouTube IDs; Lexical custom nodes and the public renderer share those references. The implementation uses Lexical's documented [custom nodes](https://lexical.dev/docs/concepts/nodes) and [Markdown transformers](https://lexical.dev/docs/packages/lexical-markdown).\n\nHome → Pages now chooses a page kind, and each kind has its own block catalog. Entries have no block controls. Schemas gain template assignment and rich-text fields. Old tab recovery stays untouched in the previous namespace, and legacy imported entry-block records fail validation rather than losing content.\n\nVerification caught and fixed Astro's inability to identify a renderer that returned only null for an empty media slot, and Kumo's need for an explicit placeholder when the template selector is empty. A read-only regression also checks embedded-media removal is unavailable while editing is disabled. The [run](../verification/runs/2026-10-05T1650Z-generic-pages.md) records 75 passing tests, the static build, asset-sharing checks and browser observations. No commit or provider deployment was performed.\n","toc":[],"titleAnchor":"generic-page-implementation","links":["journal/2026-10-05-generic-pages-discussion","verification/runs/2026-10-05T1650Z-generic-pages"],"attachments":[],"html":"\u003cp>The user authorized implementation after the completed \u003ca href=\"#/journal/2026-10-05-generic-pages-discussion\">design interview\u003c/a>. DEC-058–DEC-073 now have application code and fresh demo content.\u003c/p>\n\u003cp>Page records distinguish static/generic kinds. Entries have schema values only, and collections optionally reference a generic page. A shared route function drives static generation; collections no longer automatically create indexes. Three registered generic blocks supply heading, media and rich-text slots; the normal collection-list block supports explicitly created static indexes.\u003c/p>\n\u003cp>Bindings remain separate from literal props. Shared validation checks every assigned schema and resolved entry, preserving draft/publish distinctions and empty-value fallbacks. Preview uses placeholders. Rich-text Markdown stores stable media references and YouTube IDs; Lexical custom nodes and the public renderer share those references. The implementation uses Lexical's documented \u003ca href=\"https://lexical.dev/docs/concepts/nodes\" rel=\"noreferrer\">custom nodes\u003c/a> and \u003ca href=\"https://lexical.dev/docs/packages/lexical-markdown\" rel=\"noreferrer\">Markdown transformers\u003c/a>.\u003c/p>\n\u003cp>Home → Pages now chooses a page kind, and each kind has its own block catalog. Entries have no block controls. Schemas gain template assignment and rich-text fields. Old tab recovery stays untouched in the previous namespace, and legacy imported entry-block records fail validation rather than losing content.\u003c/p>\n\u003cp>Verification caught and fixed Astro's inability to identify a renderer that returned only null for an empty media slot, and Kumo's need for an explicit placeholder when the template selector is empty. A read-only regression also checks embedded-media removal is unavailable while editing is disabled. The \u003ca href=\"#/verification/runs/2026-10-05T1650Z-generic-pages\">run\u003c/a> records 75 passing tests, the static build, asset-sharing checks and browser observations. No commit or provider deployment was performed.\u003c/p>\n","backlinks":["index","decisions/index","journal/2026-10-05-generic-pages-discussion"]},{"id":"journal/2026-10-06-grill-d9dd6be8-d154-41d3-a042-1d645992c592","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-06\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `d9dd6be8-d154-41d3-a042-1d645992c592`\n\n## Question 66\n\n```text\nRound: Block library: shared capabilities\nQuestion: Should this pass add a shared configurable header and grouped navigation?\nDescription (Markdown source):\nYou selected a shared footer. The current header only supports a title and a flat row of links. Accenture, ASML and Couchbase use navigation groups for services, products, industries and resources.\nRecommendation: Add a shared header with logo, navigation groups, action links and a mobile menu, configured once under Site alongside the footer.\nOptions: Add a shared configurable header with grouped navigation now / Keep the simple header for this pass; add grouped navigation later\nSelected: Add a shared configurable header with grouped navigation now\nNotes: \n```\n\n## Question 67\n\n```text\nRound: Block library: shared capabilities\nQuestion: Should generic blocks be able to bind a list stored inside a collection entry?\nDescription (Markdown source):\nYou selected editable block lists and generic counterparts. An entry currently cannot store a structured list such as recipe ingredients, product specifications or a set of FAQs. Blog cards select multiple entries; this question is about repeated data inside one entry.\nRecommendation: Add structured list fields to collection schemas and support binding compatible lists to generic blocks. Start with rows of the existing field types, without unrestricted recursive nesting.\nOptions: Add schema list fields and generic list bindings now / Keep lists fixed in the template; bind only existing field types for now\nSelected: Add schema list fields and generic list bindings now\nNotes: \n```\n\n## Question 68\n\n```text\nRound: Block library: shared capabilities\nQuestion: How much visual customization should editors have within a block theme?\nDescription (Markdown source):\nThe reference sites have varied art direction. Existing site-wide fonts, body size, line height, width and gutter remain defaults. A theme identifies the block's design family, such as Tailwind UI.\nRecommendation: Offer a curated Design section for each block: relevant colors, background image or surface, alignment and section spacing. Keep the layout structure authored and responsive, and inherit site defaults until overridden.\nOptions: Curated visual controls within each block's layout / Content editing only; appearance comes from the theme and site settings\nSelected: Content editing only; appearance comes from the theme and site settings\nNotes: \n```\n","toc":[{"id":"question-66","title":"Question 66","depth":2},{"id":"question-67","title":"Question 67","depth":2},{"id":"question-68","title":"Question 68","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>d9dd6be8-d154-41d3-a042-1d645992c592\u003c/code>\u003c/p>\n\u003ch2 id=\"question-66\">Question 66\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library: shared capabilities\nQuestion: Should this pass add a shared configurable header and grouped navigation?\nDescription (Markdown source):\nYou selected a shared footer. The current header only supports a title and a flat row of links. Accenture, ASML and Couchbase use navigation groups for services, products, industries and resources.\nRecommendation: Add a shared header with logo, navigation groups, action links and a mobile menu, configured once under Site alongside the footer.\nOptions: Add a shared configurable header with grouped navigation now / Keep the simple header for this pass; add grouped navigation later\nSelected: Add a shared configurable header with grouped navigation now\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-67\">Question 67\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library: shared capabilities\nQuestion: Should generic blocks be able to bind a list stored inside a collection entry?\nDescription (Markdown source):\nYou selected editable block lists and generic counterparts. An entry currently cannot store a structured list such as recipe ingredients, product specifications or a set of FAQs. Blog cards select multiple entries; this question is about repeated data inside one entry.\nRecommendation: Add structured list fields to collection schemas and support binding compatible lists to generic blocks. Start with rows of the existing field types, without unrestricted recursive nesting.\nOptions: Add schema list fields and generic list bindings now / Keep lists fixed in the template; bind only existing field types for now\nSelected: Add schema list fields and generic list bindings now\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-68\">Question 68\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: Block library: shared capabilities\nQuestion: How much visual customization should editors have within a block theme?\nDescription (Markdown source):\nThe reference sites have varied art direction. Existing site-wide fonts, body size, line height, width and gutter remain defaults. A theme identifies the block's design family, such as Tailwind UI.\nRecommendation: Offer a curated Design section for each block: relevant colors, background image or surface, alignment and section spacing. Keep the layout structure authored and responsive, and inherit site defaults until overridden.\nOptions: Curated visual controls within each block's layout / Content editing only; appearance comes from the theme and site settings\nSelected: Content editing only; appearance comes from the theme and site settings\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["decisions/index","journal/2026-10-06-block-library-round-two"]},{"id":"journal/2026-10-06-site-design","title":"Site typography and page gutter","section":"Journal","order":0,"metadata":{"status":"Implemented"},"metadataHtml":"\u003cspan>Status: Implemented\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Site typography and page gutter\nupdated: 2026-10-06\nstatus: Implemented\n---\n# Site typography and page gutter\n\nThe user selected body/heading fonts, body font size/line height and page gutter from the suggested site globals (DEC-078). Other suggested controls were not selected.\n\nSite settings now groups these under Typography and Layout. One shared resolver supplies defaults and safe CSS tokens for public pages and the live preview. The starter block containers use the gutter, text inherits body line height, relative font sizes scale from the site's body size, and headings follow the heading font. Admin typography and 867px workspace width are independent.\n\nImplementation choices: built-in font stacks (System sans, Arial, Georgia, Times New Roman, Monospace), 16px body size, unitless 1.6 line height and 24px horizontal gutter. No font downloads/dependencies were added. Cleared or omitted values fall back; explicit invalid settings prevent saving/publishing through existing validation. Zero gutter is valid. Retained block versions remain available, with their shared style defaults updated.\n\nSee [verification](../verification/runs/2026-10-05T1810Z-site-design.md) and [block behavior](../features/static-blocks.md).\n","toc":[],"titleAnchor":"site-typography-and-page-gutter","links":["verification/runs/2026-10-05T1810Z-site-design","features/static-blocks"],"attachments":[],"html":"\u003cp>The user selected body/heading fonts, body font size/line height and page gutter from the suggested site globals (DEC-078). Other suggested controls were not selected.\u003c/p>\n\u003cp>Site settings now groups these under Typography and Layout. One shared resolver supplies defaults and safe CSS tokens for public pages and the live preview. The starter block containers use the gutter, text inherits body line height, relative font sizes scale from the site's body size, and headings follow the heading font. Admin typography and 867px workspace width are independent.\u003c/p>\n\u003cp>Implementation choices: built-in font stacks (System sans, Arial, Georgia, Times New Roman, Monospace), 16px body size, unitless 1.6 line height and 24px horizontal gutter. No font downloads/dependencies were added. Cleared or omitted values fall back; explicit invalid settings prevent saving/publishing through existing validation. Zero gutter is valid. Retained block versions remain available, with their shared style defaults updated.\u003c/p>\n\u003cp>See \u003ca href=\"#/verification/runs/2026-10-05T1810Z-site-design\">verification\u003c/a> and \u003ca href=\"#/features/static-blocks\">block behavior\u003c/a>.\u003c/p>\n","backlinks":["decisions/index"]},{"id":"journal/2026-10-06-table-and-back","title":"Table rows and consistent Back labels","section":"Journal","order":0,"metadata":{"status":"Implemented locally"},"metadataHtml":"\u003cspan>Status: Implemented locally\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Table rows and consistent Back labels\nupdated: 2026-10-06\nstatus: Implemented locally\n---\n# Table rows and consistent Back labels\n\nThe user identified the Pages title's rounded hover pill as incorrect styling. The title still uses Kumo's accessible button but now has transparent background, no offset/padding and inherited table typography. Hover and focus highlight the whole row; keyboard focus remains visible.\n\nFollow-up instructions require every parent-navigation control to read **← Back**. Page, block, entry, collection list, schema and schema-field screens now use that label, preserving their existing parent destinations. Navigation tests were updated to verify those transitions and continue checking that parent page controls disappear inside block editing.\n\nThe [verification run](../verification/runs/2026-10-05T1752Z-page-row.md) records the browser check and passing regression/build checks.\n\nA further instruction standardizes every Add action to the blue variant. Add page, block, entry, collection, field and link now use Kumo primary at the same base size with a plus icon. Final verification includes this change; Add entry was visually checked in the browser.\n","toc":[],"titleAnchor":"table-rows-and-consistent-back-labels","links":["verification/runs/2026-10-05T1752Z-page-row"],"attachments":[],"html":"\u003cp>The user identified the Pages title's rounded hover pill as incorrect styling. The title still uses Kumo's accessible button but now has transparent background, no offset/padding and inherited table typography. Hover and focus highlight the whole row; keyboard focus remains visible.\u003c/p>\n\u003cp>Follow-up instructions require every parent-navigation control to read \u003cstrong>← Back\u003c/strong>. Page, block, entry, collection list, schema and schema-field screens now use that label, preserving their existing parent destinations. Navigation tests were updated to verify those transitions and continue checking that parent page controls disappear inside block editing.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-05T1752Z-page-row\">verification run\u003c/a> records the browser check and passing regression/build checks.\u003c/p>\n\u003cp>A further instruction standardizes every Add action to the blue variant. Add page, block, entry, collection, field and link now use Kumo primary at the same base size with a plus icon. Final verification includes this change; Add entry was visually checked in the browser.\u003c/p>\n","backlinks":["decisions/index"]},{"id":"verification/runs/2026-10-05T0819Z-implementation","title":"Initial implementation verification","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Initial implementation verification\nupdated: 2026-10-05\nresult: Untested\n---\n# Initial implementation verification\n\n## Scope\n\nThe first implementation of [static blocks](../../features/static-blocks.md), [visual editing](../../features/editor.md), [draft publishing](../../features/publishing.md), and [media](../../features/media.md). Selected scenarios cover the accepted foundation: multi-framework rendering, shared assets, versioning, content safety, recovery, atomic Git writes, and upload behavior.\n\n## Build and environment\n\nBase revision: `f6993528410bebeae1dafd70d52f57c1cc3e34d4`, with uncommitted application implementation. The [source manifest](../../evidence/2026-10-05T0819Z-implementation/source-manifest.json) contains SHA-256 hashes and an aggregate fingerprint for the final tested application, fixtures, tests, and configuration. Documentation is excluded from that application fingerprint.\n\nmacOS; Node 22.19.0; pnpm 10.34.1. Five static routes were built to `dist/`. Browser observations used Helium at `http://127.0.0.1:4321/admin/` on intermediate dirty builds. No real GitHub/R2 credentials or hosting integration were used. No independent verifier was involved.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Type checking and production build | Clean diagnostics; static output | Zero errors/warnings/hints; five pages generated | Passed | [Log](../../evidence/2026-10-05T0819Z-implementation/verification.log) |\n| Content/version contracts | Stable files, compatible carryover, blank unmatched fields, validation and safe text | Unit assertions pass | Passed | [Log](../../evidence/2026-10-05T0819Z-implementation/verification.log) |\n| Recovery, Markdown, lifecycle | Preserve incomplete edits/meaning; controlled editor mounting and teardown | Tests pass for recovery, visual/source text, read-only state, React/Vue lifecycle and activation | Passed | [Log](../../evidence/2026-10-05T0819Z-implementation/verification.log) |\n| Atomic Git and concurrency | One commit; no stale overwrite; exact publish snapshot | Fake transport tests pass, including lost response, concurrent newer draft and divergent main | Passed | [Log](../../evidence/2026-10-05T0819Z-implementation/verification.log) |\n| Upload pipeline | Original/variants/metadata; failed-batch cleanup; decode fallback | Mock SDK/canvas assertions pass | Passed | [Log](../../evidence/2026-10-05T0819Z-implementation/verification.log) |\n| Shared modules and referenced assets | One runtime implementation; no broken CSS/JS references or editor code on public pages | Build graph passes; both journal pages have zero JS modules | Passed | [Asset report](../../evidence/2026-10-05T0819Z-implementation/assets.json) |\n| Intermediate native editor interactions | Live edits, order, manual version switching/cancel, reload recovery, collection entry, Svelte update | Observed as described; earlier missing CSS failure was repaired | Passed | [Browser observations](../../evidence/2026-10-05T0819Z-implementation/browser-observations.txt) |\n| Final browser smoke test and public repeated React interaction | Final code behaves correctly in a real browser; style parity; no duplicate requests | Native browser tool lost window access before final follow-up | Untested | [Browser observations](../../evidence/2026-10-05T0819Z-implementation/browser-observations.txt) |\n| Real GitHub Save/Publish and Netlify rebuild | Actual permissions, branch behavior, deployment completion | No disposable remote/account configuration supplied | Untested | [Setup](../setup.md) |\n| Real R2 upload/CORS and browser image encoding | Correct live objects, variants, responsive URLs and cleanup | No test bucket/credentials; canvas and SDK were mocked | Untested | [Setup](../setup.md) |\n\nThe final automated suite contains 44 passing tests across eight files. The aggregate is **Untested** because selected real-browser and live-provider scenarios remain unavailable, despite passing automated checks.\n\n## Limits and follow-up\n\nThe artifact report measures gzip sizes of statically reachable JavaScript modules; it excludes later lazy editor tools, dynamic imports triggered at runtime, inline HTML/scripts, CSS, and media. One emitted implementation is evidence for shared module URLs, not a recorded browser network trace.\n\nFinal changes after the native observations include scoped editor styles, Lexical's extension composer, richer recovery-shape validation, responsive media, and the repeated React fixture. Automated checks cover their code; earlier browser observations do not certify the final layout or interaction paths. Drag-and-drop itself, password/Lock, backup import/export through the browser, final public interaction, actual image encoders/animation variants, and live provider failure handling need a follow-up run.\n\nThe verification preview process was stopped after evidence capture. Browser-only test edits may remain in the test tab's session storage because the native tool could not access its window for cleanup. They do not affect repository content. No provider resources were created, no credentials were collected, and no Git push/deployment was attempted.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"initial-implementation-verification","links":["features/static-blocks","features/editor","features/publishing","features/media","verification/setup","verification/setup"],"attachments":[{"path":"evidence/2026-10-05T0819Z-implementation/source-manifest.json","sha256":"152e41fe1c72d3d6ef95c51bd2ef44e65ba8a940e1b8c6317a0f26a27f7a0d38"},{"path":"evidence/2026-10-05T0819Z-implementation/verification.log","sha256":"6f7cf18dfcd88a26f6639671d825fc1dd8c0ddb5bf61e630e94b127a6ab05698"},{"path":"evidence/2026-10-05T0819Z-implementation/assets.json","sha256":"a76bbd5f1518ecd53ab4198f3356e104f710a85c89b34a3fa111765f3a1fd7dc"},{"path":"evidence/2026-10-05T0819Z-implementation/browser-observations.txt","sha256":"98d7bf6a8e3017f6072ee620d9a5c735a59b1d2bacf5f2652db135497f342bb9"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>The first implementation of \u003ca href=\"#/features/static-blocks\">static blocks\u003c/a>, \u003ca href=\"#/features/editor\">visual editing\u003c/a>, \u003ca href=\"#/features/publishing\">draft publishing\u003c/a>, and \u003ca href=\"#/features/media\">media\u003c/a>. Selected scenarios cover the accepted foundation: multi-framework rendering, shared assets, versioning, content safety, recovery, atomic Git writes, and upload behavior.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Base revision: \u003ccode>f6993528410bebeae1dafd70d52f57c1cc3e34d4\u003c/code>, with uncommitted application implementation. The \u003ca href=\"evidence/2026-10-05T0819Z-implementation/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 152e41fe1c72d3d6ef95c51bd2ef44e65ba8a940e1b8c6317a0f26a27f7a0d38\">source manifest\u003c/a> contains SHA-256 hashes and an aggregate fingerprint for the final tested application, fixtures, tests, and configuration. Documentation is excluded from that application fingerprint.\u003c/p>\n\u003cp>macOS; Node 22.19.0; pnpm 10.34.1. Five static routes were built to \u003ccode>dist/\u003c/code>. Browser observations used Helium at \u003ccode>http://127.0.0.1:4321/admin/\u003c/code> on intermediate dirty builds. No real GitHub/R2 credentials or hosting integration were used. No independent verifier was involved.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Type checking and production build\u003c/td>\n\u003ctd>Clean diagnostics; static output\u003c/td>\n\u003ctd>Zero errors/warnings/hints; five pages generated\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0819Z-implementation/verification.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6f7cf18dfcd88a26f6639671d825fc1dd8c0ddb5bf61e630e94b127a6ab05698\">Log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Content/version contracts\u003c/td>\n\u003ctd>Stable files, compatible carryover, blank unmatched fields, validation and safe text\u003c/td>\n\u003ctd>Unit assertions pass\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0819Z-implementation/verification.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6f7cf18dfcd88a26f6639671d825fc1dd8c0ddb5bf61e630e94b127a6ab05698\">Log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recovery, Markdown, lifecycle\u003c/td>\n\u003ctd>Preserve incomplete edits/meaning; controlled editor mounting and teardown\u003c/td>\n\u003ctd>Tests pass for recovery, visual/source text, read-only state, React/Vue lifecycle and activation\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0819Z-implementation/verification.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6f7cf18dfcd88a26f6639671d825fc1dd8c0ddb5bf61e630e94b127a6ab05698\">Log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Atomic Git and concurrency\u003c/td>\n\u003ctd>One commit; no stale overwrite; exact publish snapshot\u003c/td>\n\u003ctd>Fake transport tests pass, including lost response, concurrent newer draft and divergent main\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0819Z-implementation/verification.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6f7cf18dfcd88a26f6639671d825fc1dd8c0ddb5bf61e630e94b127a6ab05698\">Log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Upload pipeline\u003c/td>\n\u003ctd>Original/variants/metadata; failed-batch cleanup; decode fallback\u003c/td>\n\u003ctd>Mock SDK/canvas assertions pass\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0819Z-implementation/verification.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6f7cf18dfcd88a26f6639671d825fc1dd8c0ddb5bf61e630e94b127a6ab05698\">Log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shared modules and referenced assets\u003c/td>\n\u003ctd>One runtime implementation; no broken CSS/JS references or editor code on public pages\u003c/td>\n\u003ctd>Build graph passes; both journal pages have zero JS modules\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0819Z-implementation/assets.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: a76bbd5f1518ecd53ab4198f3356e104f710a85c89b34a3fa111765f3a1fd7dc\">Asset report\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Intermediate native editor interactions\u003c/td>\n\u003ctd>Live edits, order, manual version switching/cancel, reload recovery, collection entry, Svelte update\u003c/td>\n\u003ctd>Observed as described; earlier missing CSS failure was repaired\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0819Z-implementation/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 98d7bf6a8e3017f6072ee620d9a5c735a59b1d2bacf5f2652db135497f342bb9\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Final browser smoke test and public repeated React interaction\u003c/td>\n\u003ctd>Final code behaves correctly in a real browser; style parity; no duplicate requests\u003c/td>\n\u003ctd>Native browser tool lost window access before final follow-up\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0819Z-implementation/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 98d7bf6a8e3017f6072ee620d9a5c735a59b1d2bacf5f2652db135497f342bb9\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Real GitHub Save/Publish and Netlify rebuild\u003c/td>\n\u003ctd>Actual permissions, branch behavior, deployment completion\u003c/td>\n\u003ctd>No disposable remote/account configuration supplied\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/setup\">Setup\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Real R2 upload/CORS and browser image encoding\u003c/td>\n\u003ctd>Correct live objects, variants, responsive URLs and cleanup\u003c/td>\n\u003ctd>No test bucket/credentials; canvas and SDK were mocked\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/setup\">Setup\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The final automated suite contains 44 passing tests across eight files. The aggregate is \u003cstrong>Untested\u003c/strong> because selected real-browser and live-provider scenarios remain unavailable, despite passing automated checks.\u003c/p>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>The artifact report measures gzip sizes of statically reachable JavaScript modules; it excludes later lazy editor tools, dynamic imports triggered at runtime, inline HTML/scripts, CSS, and media. One emitted implementation is evidence for shared module URLs, not a recorded browser network trace.\u003c/p>\n\u003cp>Final changes after the native observations include scoped editor styles, Lexical's extension composer, richer recovery-shape validation, responsive media, and the repeated React fixture. Automated checks cover their code; earlier browser observations do not certify the final layout or interaction paths. Drag-and-drop itself, password/Lock, backup import/export through the browser, final public interaction, actual image encoders/animation variants, and live provider failure handling need a follow-up run.\u003c/p>\n\u003cp>The verification preview process was stopped after evidence capture. Browser-only test edits may remain in the test tab's session storage because the native tool could not access its window for cleanup. They do not affect repository content. No provider resources were created, no credentials were collected, and no Git push/deployment was attempted.\u003c/p>\n","backlinks":["index","discussions/agreed-design","discussions/technical-contracts","features/editor","features/index","features/media","features/publishing","features/static-blocks","journal/2026-10-05-implementation"]},{"id":"verification/runs/2026-10-05T0910Z-admin-startup","title":"Admin startup repair","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Admin startup repair\nupdated: 2026-10-05\nresult: Passed\n---\n# Admin startup repair\n\n## Scope\n\n[FEAT-editor](../../features/editor.md): reproduce the blank `/admin/`, restore development startup, and check production startup and preview interactions. This is a bounded repair, not a new full integration run.\n\n## Build and environment\n\nBase commit `f6993528410bebeae1dafd70d52f57c1cc3e34d4`, with dirty implementation. The [source manifest](../../evidence/2026-10-05T0910Z-admin-startup/source-manifest.json) identifies the tested code. macOS, Node 22.19.0, pnpm 10.34.1. Native browser controls reproduced the blank page in Helium and inspected the error and fix in Safari. The existing development server used port 4321; an owned production preview used port 4322. No independent verifier.\n\n## Results\n\nThe baseline failed: the manual React root bypassed Astro's before-hydration initialization, and React Fast Refresh threw “can't detect preamble” before mounting. The repair replaces that bootstrap with Astro's `client:only=\"react\"` island and normal props. The following results apply to the repaired build.\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Development startup | Editor and preview render without startup exception | Drawer, fields and home blocks visible after reload; preamble exception gone | Passed | [Browser observations](../../evidence/2026-10-05T0910Z-admin-startup/browser-observations.txt) |\n| Live editing and cancel | Heading updates immediately; Cancel restores baseline | Both observed; content returned to Saved content | Passed | [Browser observations](../../evidence/2026-10-05T0910Z-admin-startup/browser-observations.txt) |\n| Production startup and islands | Static output mounts editor, styles and interactive blocks | Svelte counter incremented; Vue accordion expanded; no JS/CSS startup error | Passed | [Browser observations](../../evidence/2026-10-05T0910Z-admin-startup/browser-observations.txt) |\n| Required automated checks | Types, tests, build and asset graph pass | 44 tests passed; zero type diagnostics; five static routes; shared runtimes and asset references valid | Passed | [Verification log](../../evidence/2026-10-05T0910Z-admin-startup/verification.log) |\n\n## Limits and follow-up\n\nAll selected repair scenarios passed. Live GitHub/R2/Netlify, full layout parity, password/Lock and other previously untested interactions remain outside this run. A missing favicon still produces an unrelated HTTP 404. No provider writes, commits or deployment were performed. The Safari test tab was closed, test content changes were cancelled, and the owned preview was stopped; the user's development server remains running.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"admin-startup-repair","links":["features/editor"],"attachments":[{"path":"evidence/2026-10-05T0910Z-admin-startup/source-manifest.json","sha256":"6d60a41439e058aaf7c4206e340301f4b10ea79e6598223309bf8ff3cecf7135"},{"path":"evidence/2026-10-05T0910Z-admin-startup/browser-observations.txt","sha256":"e0f412fe2954ab688311a3af868375d1749b6972211703c7a310af4650afbe2b"},{"path":"evidence/2026-10-05T0910Z-admin-startup/verification.log","sha256":"7039a245a143123e0564b88ed0094f585a62a56dadd2eede647b7c914c58fa47"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a>: reproduce the blank \u003ccode>/admin/\u003c/code>, restore development startup, and check production startup and preview interactions. This is a bounded repair, not a new full integration run.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Base commit \u003ccode>f6993528410bebeae1dafd70d52f57c1cc3e34d4\u003c/code>, with dirty implementation. The \u003ca href=\"evidence/2026-10-05T0910Z-admin-startup/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6d60a41439e058aaf7c4206e340301f4b10ea79e6598223309bf8ff3cecf7135\">source manifest\u003c/a> identifies the tested code. macOS, Node 22.19.0, pnpm 10.34.1. Native browser controls reproduced the blank page in Helium and inspected the error and fix in Safari. The existing development server used port 4321; an owned production preview used port 4322. No independent verifier.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003cp>The baseline failed: the manual React root bypassed Astro's before-hydration initialization, and React Fast Refresh threw “can't detect preamble” before mounting. The repair replaces that bootstrap with Astro's \u003ccode>client:only=\"react\"\u003c/code> island and normal props. The following results apply to the repaired build.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Development startup\u003c/td>\n\u003ctd>Editor and preview render without startup exception\u003c/td>\n\u003ctd>Drawer, fields and home blocks visible after reload; preamble exception gone\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0910Z-admin-startup/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e0f412fe2954ab688311a3af868375d1749b6972211703c7a310af4650afbe2b\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Live editing and cancel\u003c/td>\n\u003ctd>Heading updates immediately; Cancel restores baseline\u003c/td>\n\u003ctd>Both observed; content returned to Saved content\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0910Z-admin-startup/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e0f412fe2954ab688311a3af868375d1749b6972211703c7a310af4650afbe2b\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Production startup and islands\u003c/td>\n\u003ctd>Static output mounts editor, styles and interactive blocks\u003c/td>\n\u003ctd>Svelte counter incremented; Vue accordion expanded; no JS/CSS startup error\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0910Z-admin-startup/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e0f412fe2954ab688311a3af868375d1749b6972211703c7a310af4650afbe2b\">Browser observations\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Required automated checks\u003c/td>\n\u003ctd>Types, tests, build and asset graph pass\u003c/td>\n\u003ctd>44 tests passed; zero type diagnostics; five static routes; shared runtimes and asset references valid\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-05T0910Z-admin-startup/verification.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7039a245a143123e0564b88ed0094f585a62a56dadd2eede647b7c914c58fa47\">Verification log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>All selected repair scenarios passed. Live GitHub/R2/Netlify, full layout parity, password/Lock and other previously untested interactions remain outside this run. A missing favicon still produces an unrelated HTTP 404. No provider writes, commits or deployment were performed. The Safari test tab was closed, test content changes were cancelled, and the owned preview was stopped; the user's development server remains running.\u003c/p>\n","backlinks":["index","features/editor","journal/2026-10-05-implementation","verification/setup"]},{"id":"verification/runs/2026-10-05T1005Z-kumo-admin","title":"Kumo admin refinement","section":"Verification","order":0,"metadata":{"result":"Passed"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Kumo admin refinement\nupdated: 2026-10-05\nresult: Passed\n---\n# Kumo admin refinement\n\n## Scope\n\n[FEAT-editor](../../features/editor.md) and the submission UI of [FEAT-publishing](../../features/publishing.md): replace admin controls with Cloudflare Kumo, remove status/recovery banners and the mode toggle, add mouse block sorting, and report submission validation through toasts. Implements DEC-048–DEC-050.\n\n## Build and environment\n\nBase commit `f6993528410bebeae1dafd70d52f57c1cc3e34d4`, with dirty implementation. The [source manifest](../../evidence/2026-10-05T1005Z-kumo-admin/source-manifest.json) covers the tested application, tests, configuration, fixtures, and lockfile, including new files. macOS, Node 22.19.0, pnpm 10.34.1. Safari was driven through native UI controls against the existing development server at port 4321 and an owned production preview at port 4322. No independent verifier.\n\n## Results\n\n| Scenario | Expected | Observed | Result |\n| --- | --- | --- | --- |\n| Admin UI | Kumo controls and dialogs; requested banners/toggle absent | Dark buttons, selects, inputs, tabs, checkboxes, storage/block/reset dialogs mounted. No local/unsaved/recovery status or mode toggle | Passed |\n| Mouse sorting | Drag changes block and preview order without opening fields | Text moved above Hero in development and production; reverse drag restored original order. Counter state survived reordering | Passed |\n| Recovery | Reload retains edits without a banner | Development reload retained Text above Hero; no recovery notification | Passed |\n| Always-interactive preview | Blocks work without an editing-mode switch | Production Svelte counter incremented 0 → 1 and Vue accordion expanded | Passed |\n| Submission errors | Validate on submission and show a dismissible toast | Empty title produced no proactive issue panel; Publish showed “Cannot publish yet / Page title is required.” in a visible bottom-right toast. Close dismissed it | Passed |\n| Style and asset isolation | Kumo styles stay in admin surfaces and UI code stays off public routes | Preview designs retained; scoped stylesheet tests pass; public dependency graphs exclude Kumo/editor/provider code | Passed |\n| Automated checks | Types, tests, build and artifact checks pass | Zero type diagnostics, 57 tests passed, five static routes built, one copy of each framework runtime | Passed |\n\nEvidence: [browser observations](../../evidence/2026-10-05T1005Z-kumo-admin/browser-observations.txt), [verification log](../../evidence/2026-10-05T1005Z-kumo-admin/verification.log).\n\nBrowser testing caught unreliable native HTML drag events in Safari; the final implementation uses pointer capture with a movement threshold and keyboard sorting. It also caught Toasty's initial portal effect resolving before the container ref was attached. The container now mounts first; a regression test asserts that submission toasts remain inside the styled dark portal.\n\n## Limits and cleanup\n\nKumo form and portal tests use jsdom, with layout APIs stubbed; actual mouse movement, visibility, interaction and reload behavior were checked in Safari. Full cross-browser/touch coverage, password/Lock, real GitHub saves/publishing, R2 uploads, and Netlify deployment were outside this UI run. Existing provider tests remain mocked.\n\nTest-only content was restored in both origins, the owned test tab was closed, and preview PID 70790 was stopped. The user's existing development server remains running. No credentials, remote writes, commit, or deployment were involved.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-cleanup","title":"Limits and cleanup","depth":2}],"titleAnchor":"kumo-admin-refinement","links":["features/editor","features/publishing"],"attachments":[{"path":"evidence/2026-10-05T1005Z-kumo-admin/source-manifest.json","sha256":"62b4efe19ea9283091177c974ade54b9b7eacdee5668eddf059ef85948aefaee"},{"path":"evidence/2026-10-05T1005Z-kumo-admin/browser-observations.txt","sha256":"7b077ff247ea34a950ff9d9edd1a80418fe8f78c80e9f91ae6d5b43acba88a83"},{"path":"evidence/2026-10-05T1005Z-kumo-admin/verification.log","sha256":"923e2819dd930c8c31a1e2d6138ffd7c98ad93bc5ee4c410f7fbe4f07a4578df"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a> and the submission UI of \u003ca href=\"#/features/publishing\">FEAT-publishing\u003c/a>: replace admin controls with Cloudflare Kumo, remove status/recovery banners and the mode toggle, add mouse block sorting, and report submission validation through toasts. Implements DEC-048–DEC-050.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Base commit \u003ccode>f6993528410bebeae1dafd70d52f57c1cc3e34d4\u003c/code>, with dirty implementation. The \u003ca href=\"evidence/2026-10-05T1005Z-kumo-admin/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 62b4efe19ea9283091177c974ade54b9b7eacdee5668eddf059ef85948aefaee\">source manifest\u003c/a> covers the tested application, tests, configuration, fixtures, and lockfile, including new files. macOS, Node 22.19.0, pnpm 10.34.1. Safari was driven through native UI controls against the existing development server at port 4321 and an owned production preview at port 4322. No independent verifier.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Admin UI\u003c/td>\n\u003ctd>Kumo controls and dialogs; requested banners/toggle absent\u003c/td>\n\u003ctd>Dark buttons, selects, inputs, tabs, checkboxes, storage/block/reset dialogs mounted. No local/unsaved/recovery status or mode toggle\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Mouse sorting\u003c/td>\n\u003ctd>Drag changes block and preview order without opening fields\u003c/td>\n\u003ctd>Text moved above Hero in development and production; reverse drag restored original order. Counter state survived reordering\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recovery\u003c/td>\n\u003ctd>Reload retains edits without a banner\u003c/td>\n\u003ctd>Development reload retained Text above Hero; no recovery notification\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Always-interactive preview\u003c/td>\n\u003ctd>Blocks work without an editing-mode switch\u003c/td>\n\u003ctd>Production Svelte counter incremented 0 → 1 and Vue accordion expanded\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Submission errors\u003c/td>\n\u003ctd>Validate on submission and show a dismissible toast\u003c/td>\n\u003ctd>Empty title produced no proactive issue panel; Publish showed “Cannot publish yet / Page title is required.” in a visible bottom-right toast. Close dismissed it\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Style and asset isolation\u003c/td>\n\u003ctd>Kumo styles stay in admin surfaces and UI code stays off public routes\u003c/td>\n\u003ctd>Preview designs retained; scoped stylesheet tests pass; public dependency graphs exclude Kumo/editor/provider code\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003c/tr>\n or features were outside scope. No persistent content changes, new server, or remote writes were made. The test tab was closed; the existing development server was preserved.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"block-sidebar-hierarchy","links":["features/editor"],"attachments":[{"path":"evidence/2026-10-05T1014Z-block-sidebar/source-manifest.json","sha256":"34826258f9c51e1a6a6a96304b8d8080bfcdce718712c76cacb320d9970a9249"},{"path":"evidence/2026-10-05T1014Z-block-sidebar/browser-observations.txt","sha256":"ce57c9cf78bc36c080a4f81f90b933f7f4d6ba0f5db75076c9d37aae022b0054"},{"path":"evidence/2026-10-05T1014Z-block-sidebar/verification.log","sha256":"825d8c1bcd60c2324edfa3b63bfb474fd9937e0c1fb9313f00b34dec90476b13"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a>, DEC-051: opening a block hides parent sidebar navigation; All blocks restores it. The top toolbar and interactive preview remain available.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Dirty implementation on \u003ccode>f6993528410bebeae1dafd70d52f57c1cc3e34d4\u003c/code>; \u003ca href=\"evidence/2026-10-05T1014Z-block-sidebar/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 34826258f9c51e1a6a6a96304b8d8080bfcdce718712c76cacb320d9970a9249\">source manifest\u003c/a>. macOS, Node 22.19.0, pnpm 10.34.1. Fresh Safari tab against the existing development server at \u003ccode>http://127.0.0.1:4321/admin/\u003c/code>. No independent verifier.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003 tab was closed; the existing development server was preserved.\u003c/p>\n","backlinks":["features/editor","journal/2026-10-05-implementation"]},{"id":"verification/runs/2026-10-05T1054Z-admin-hierarchy","title":"Admin hierarchy and Home navigation","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Admin hierarchy and Home navigation\nupdated: 2026-10-05\nresult: Untested\n---\n# Admin hierarchy and Home navigation\n\n## Scope\n\n[FEAT-editor](../../features/editor.md), DEC-052–DEC-054: distinguish Add block from block rows, separate collection content and schemas, and move all global destinations to a standalone Home screen. Entry and block editing retain the existing shared Save draft/Publish workflow.\n\n## Build and environment\n\nDirty implementation on `f6993528410bebeae1dafd70d52f57c1cc3e34d4`; [final source manifest](../../evidence/2026-10-05T1054Z-admin-hierarchy/source-manifest.json). macOS, Node 22.19.0, pnpm 10.34.1. Native Safari against the existing development server at `http://127.0.0.1:4321/admin/`; Vitest/jsdom tests use real Kumo controls and mock only preview islands. No independent verifier.\n\nThe user refined the navigation during implementation: the final build opens a separate Home menu instead of a sidebar destination grid. The final verification log and manifest include that correction.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Add block placement | Compact header action distinct from draggable rows | Browser displayed plus/label aligned right beside Blocks, with no footer action | Passed | [Browser observations](../../evidence/2026-10-05T1054Z-admin-hierarchy/browser-observations.txt) |\n| Entry navigation and preview | Content → collection → entry → block; edits survive returns | Browser title edit updated preview, survived block round trip and appeared in the entry list. Final automated test passes | Passed | [Observations](../../evidence/2026-10-05T1054Z-admin-hierarchy/browser-observations.txt), [final checks](../../evidence/2026-10-05T1054Z-admin-hierarchy/verify.log) |\n| Home menu | Global destinations outside the sidebar; local edits retained between areas | Browser displayed the standalone menu without sidebar/preview. Final UI test exercises Pages, Media, Site and returning through Home with edits intact | Passed | [Observations](../../evidence/2026-10-05T1054Z-admin-hierarchy/browser-observations.txt), [final checks](../../evidence/2026-10-05T1054Z-admin-hierarchy/verify.log) |\n| Schema and entry separation | Definitions and values on separate screens; safe fields and defaults | Automated UI test edits label/default, checks populated key/removal locks, creates an entry with the new default and preserves existing content | Passed | [Final checks](../../evidence/2026-10-05T1054Z-admin-hierarchy/verify.log) |\n| Preview entry links and deletion | Links open Content; deleting returns to correct parent | Automated UI test follows the preview link, deletes the entry, then deletes its empty collection and checks the empty states | Passed | [Final checks](../../evidence/2026-10-05T1054Z-admin-hierarchy/verify.log) |\n| Schema/field browser layout | Dedicated screens fit the drawer and show only relevant controls | Browser review interrupted by active user interaction; automated behavior passed but final visual inspection was not completed | Untested | [Interruption and cleanup](../../evidence/2026-10-05T1054Z-admin-hierarchy/browser-observations.txt) |\n| Required verification | Types, tests, static build and asset checks pass | Zero diagnostics; 61 tests in 12 files passed; five static routes and runtime sharing checks passed | Passed | [Final checks](../../evidence/2026-10-05T1054Z-admin-hierarchy/verify.log) |\n\n## Limits and follow-up\n\nOverall Unt
