ges restores the captured block.\u003c/li>\n\u003cli>In a generic page add a FAQ block and bind Items to a compatible schema list with \u003ccode>question\u003c/code> (text) and \u003ccode>answer\u003c/code> (richtext). Populate an entry; published rendering uses those rows. Missing keys/types or required child values fail publication. Schema editing remains separate from entry editing.\u003c/li>\n\u003cli>Site → Choose footer offers three layouts. Edit nested links; Pages previews show the same shared footer. Header → Navigation permits grouped links. Test menu disclosures with Enter/Tab at a narrow containing width.\u003c/li>\n\u003cli>For native submission verification, use a disposable loopback endpoint and test-only values. Check the received POST and both success/error responses. Verify previews remain disabled. Remove the test page and stop its endpoint afterwards.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>All 72 new variants have automated rendering coverage. Browser checks sampled catalog, repeatable editing, shared chrome and public layouts; they are not a complete visual audit of every variant on every device. The theme is an adapted starting library, not finished brand-specific designs. External form service behavior, live GitHub/R2/Netlify operations and physical mobile devices are outside the local checks.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-06T0845Z-sortable-flip\">Optimistic FLIP sorting and Chartr reference behavior\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-06T0632Z-gutter-drop\">Gutter drop regression repair\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-06T0628Z-catalog-controls\">Close-icon alignment and tag scrollbar refinement\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-06T0619Z-catalog-polish\">Catalog polish and automated checks\u003c/a>; visual verification was blocked by the computer-use URL restriction.\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-06T1320Z-block-library\">Block-library implementation and checks\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["index","discussions/block-library","features/editor","features/generic-pages","features/index","features/static-blocks","journal/2026-10-06-block-library-implementation","verification/runs/2026-10-06T0619Z-catalog-polish","verification/runs/2026-10-06T0628Z-catalog-controls","verification/runs/2026-10-06T0632Z-gutter-drop","verification/runs/2026-10-06T0845Z-sortable-flip","verification/runs/2026-10-06T1320Z-block-library"]},{"id":"features/editor","title":"Visual editing and recovery","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Visual editing and recovery\nupdated: 2026-10-06\n---\n# Visual editing and recovery\n\n**ID:** FEAT-editor\n\n## Intent and basis\n\nThe [accepted design](../discussions/agreed-design.md) requires a side drawer alongside a live single-document preview for page editing, defined block fields, basic collection schemas, and tab recovery. The [versioning and Markdown contracts](../discussions/technical-contracts.md) prohibit guessed migrations and silent loss of unsupported formatting.\n\nDEC-052–DEC-054 established the Add block header action and separate Content and Collection schemas areas. DEC-074 replaces the standalone Home menu with persistent main navigation in a separate left sidebar. The current area stays highlighted even in nested editors; Pages opens by default. At widths up to 800px, Menu opens the same destinations in a Kumo dialog.\n\nDEC-055 requires consistent form and action layout. The [editor layout contract](../journal/2026-10-05-editor-layout.md) defines 8px label/control gaps, 16px field gaps, 24px section spacing/padding, grouped navigation fields and separate terminal actions. Custom widgets follow the same contract as built-in fields.\n\nDEC-056 adds Pages table → Page editor → Block editor. The full-page overview lists every page's title, type and URL path using [Kumo Table](https://kumo-ui.com/components/table/). It contains Add page, with no builder drawer or live preview. Main navigation remains available. Open a row (or its keyboard-accessible title button) to edit that page. Titles use plain table styling; hover/focus highlights the row, with a visible keyboard focus indicator. Adding first selects static or generic, then opens the new page; deleting returns to the table, including its empty state. Page edits survive returns and switching pages.\n\nDEC-057 confines live rendering to an individual page or its block editor. Content, Collection schemas, Media and Site use centered admin forms/lists with no builder drawer, preview or preview-width toggle, including nested entry, model and field screens. Preview islands are unmounted when leaving page editing. The content state and shared Save draft/Publish actions remain available across all views.\n\nDEC-076 standardizes the Pages table and every standard admin form/list at a centered 867px maximum content width, shrinking to fit narrower viewports. Both layout containers share `--admin-content-max-width`. This admin layout token is separate from the editable public-site width. The page-building drawer and compact dialogs retain their own layout.\n\n## Entry points and prerequisites\n\nOpen `/admin/` using [setup](../verification/setup.md). Without a configured password, the Pages table opens directly. Repository credentials are needed only for remote loading/saving. The main sidebar provides Pages, Content, Collection schemas, Media and Site. Area switching preserves local content; all nested parent-navigation buttons read ← Back and return to the parent screen within that area.\n\n## Expected outcomes\n\nThe [block library](block-library.md) adds themed/tagged browsing, shared chrome, repeated content and schema lists. Its record owns the expanded contract and verification recipe.\n\nThe shared sortable list uses optimistic FLIP animations for page blocks and every repeated-content list. From mouse-down, the carried row follows cursor Y at the original grab offset, with X locked; it is drawn above clipping containers. Neighbors animate into the temporary order over 150ms and interrupted movements start from the current visual position. The blue insertion marker has been removed. Edge scrolling uses a 32px activation band and a capped speed, following Chartr's shared sorter reference. Only the list changes while held; the site's content/preview order updates once on release. Releasing outside still commits, with positions above/below the list resolving to its ends. This explicitly supersedes the earlier outside-release cancellation behavior. Escape, system pointer cancellation, or conflicting content/disabled changes abort safely. Reduced motion retains exact pointer carrying and immediate reordering while skipping FLIP/settle motion.\n\nCreate/edit/delete pages and entries; reorder blocks by dragging their rows (Alt+Up/Down with keyboard focus). Kumo supplies admin controls, dialogs, and toasts; its styles are scoped away from preview blocks. Select a block to edit its fields and version. This replaces the parent editor controls, including page fields and the parent back link. Back returns to the same document and restores those controls. Same-key compatible values survive a version switch, unmatched values are null, and Cancel restores the last loaded/saved instance. Unknown versions preserve raw data and prevent publication.\n\nSchema rich-text fields and Text blocks provide visual headings, paragraphs, bold/italic, links, and lists with Markdown storage. Uploaded-image references and YouTube embeds round-trip in the visual editor. Unsupported Markdown remains available as source text. Custom React widgets and shared pure validators support compound block fields. Content browses collections → entry lists → schema-defined entry values only. Collection schemas browses models → collection definitions → individual fields, with label/key/type/required/options/default controls. Schema editing protects populated keys/types/options. Entries remain in Content and never appear in the Pages table. Add entry is confined to entry lists; Add collection belongs to the schema list. All Add actions (page, block, entry, collection, field and link) use the same blue Kumo primary variant, base size and plus icon. Add block remains aligned right beside Blocks, outside the draggable list. Main navigation preserves all local content edits. Site settings manage title, optional theme, and ID-based navigation.\n\nLocal content and its base/repository identity survive reloads silently in tab storage. This includes unfinished schema edits that cannot yet be saved. Export/import backups contain content, not credentials or binary uploads. Storage failure is visible. Lock clears GitHub/R2 credentials and returns to the gate.\n\nLocal development skips the unsaved-edit reload confirmation at the user's request; production retains it. Tab recovery continues in both. Site settings offers shared [typography, content max-width and page gutter](static-blocks.md), scoped to website rendering rather than admin layout. Typography and Layout use the same section/field spacing as other admin forms.\n\n## Verification recipe\n\n1. Open Pages. Verify all pages appear in a table with title/type/path columns, main navigation with Pages highlighted, and no builder drawer or preview. Open Home: page settings/blocks appear with a ← Back button, no selector or Add page. Open Hero: the sidebar starts with ← Back and shows no page fields, parent back link, or global destination menu. Back restores the page controls; reopen Hero. Change Heading and observe preview. Switch v2 → v1 → v2: Heading remains; Eyebrow/Alignment/Design start empty. Cancel restores the original.\n2. Drag Text up: the row follows cursor Y with X locked, neighboring rows animate and the website preview holds its original order until release. Try releasing over a row, a gutter and outside the list; the final sort commits in every case. Hover at a scroll edge to reach offscreen rows. Reverse midway through an animation, try variable-height row labels and reduced motion. Escape cancels; ordinary clicks still open an item. Edit Body visually and reload; development reloads directly, while production may require accepting the browser warning. Order and text should persist.\n3. Preview is always interactive. Increment the Svelte counter; select it in the drawer and change Starting number. Verify the preview uses the new number and retains its interactive increment until removal/reload.\n4. Content → Journal shows an entry list and Add entry in a standard admin view, with no model controls or preview. Open an entry, change Title and verify its heading updates; verify there is no block list or Add block action, then return to the entry list. Values persist and no live rendering appears at any level. Collection schemas → Journal instead shows the model and compact field rows in the same admin layout. Open Title: populated key/type and removal are disabled. Add a field with a default, then create an entry through Content and verify the default. A blank required title produces no proactive issue notice; Publish reports validation through a toast.\n5. Add a block through the header action and dialog. Switch directly to Site through the main sidebar; the builder drawer and preview disappear. Site → Discard edits resets local test content. Export/import and password/Lock browser paths still require a follow-up browser run.\n6. Inspect Hero Design, Media and Site. Labels sit above aligned controls; settings/add actions appear beside section headings. Each navigation link is one bounded group, with removal inside it. Backups and Session are separate sections. Connection groups Close/Connect at the bottom right. Schema field removal is separated from editable fields.\n7. Change a page title/path, return to Pages and open another page, then reopen the edited page: values persist and the table reflects them. Add page from the overview, choose Static page, rename it, then return. Delete that test page: Cancel keeps it; Continue returns to the table. With no pages, the table shows No pages yet and Add page remains available.\n8. Visit Media and Site through the main sidebar: both use a centered admin workspace with no builder drawer, website rendering or Mobile/Desktop button. Return to Pages → Home and verify the preview and width toggle return. A page-preview navigation link to an entry opens that entry's standard Content editor. Below 800px, Menu opens all five destinations; selecting one closes the dialog and changes the area.\n\nGeneric-page binding, assignment and routing behavior is mapped in [Generic pages and collection content](generic-pages.md). Tab recovery uses a new namespace and leaves the legacy snapshot untouched.\n\n## Coverage and limitations\n\nThe initial run observed core interactions on an intermediate build. The startup repair subsequently verified development startup, live heading edits/cancel, and production startup with Svelte/Vue interaction on the repaired build. Recovery, visual editor mounting/read-only behavior, Markdown meaning, and adapter lifecycle have unit coverage. The Kumo refinement run verifies mouse sorting, silent recovery, and submission toasts in the browser; full layout parity remains untested.\n\n## Verification history\n\n- [Optimistic FLIP sorting and Chartr reference behavior](../verification/runs/2026-10-06T0845Z-sortable-flip.md).\n- [Gutter drop regression repair](../verification/runs/2026-10-06T0632Z-gutter-drop.md).\n- [Initial implementation run](../verification/runs/2026-10-05T0819Z-implementation.md).\n- [Admin startup repair](../verification/runs/2026-10-05T0910Z-admin-startup.md).\n\n- [Kumo admin refinement](../verification/runs/2026-10-05T1005Z-kumo-admin.md).\n\n- [Block sidebar hierarchy](../verification/runs/2026-10-05T1014Z-block-sidebar.md).\n\n- [Admin hierarchy and Home navigation](../verification/runs/2026-10-05T1054Z-admin-hierarchy.md).\n\n- [Editor layout consistency](../verification/runs/2026-10-05T1108Z-editor-layout.md), including the previously outstanding schema-field browser inspection.\n\n- [Pages table hierarchy](../verification/runs/2026-10-05T1124Z-page-list.md).\n\n- [Page-only preview and standard admin views](../verification/runs/2026-10-05T1303Z-admin-views.md).\n\n- [Generic pages and schema-only entries](../verification/runs/2026-10-05T1650Z-generic-pages.md).\n\n- [Persistent admin sidebar](../verification/runs/2026-10-05T1725Z-admin-navigation.md).\n\n- [Shared content width and development reloads](../verification/runs/2026-10-05T1735Z-content-width.md).\n\n- [Standard admin content width](../verification/runs/2026-10-05T1750Z-admin-width.md).\n\n- [Table rows and consistent Back labels](../verification/runs/2026-10-05T1752Z-page-row.md).\n\n- [Site typography and page gutter](../verification/runs/2026-10-05T1810Z-site-design.md).\n\n- [Block library and repeated fields](../verification/runs/2026-10-06T1320Z-block-library.md).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"visual-editing-and-recovery","links":["discussions/agreed-design","discussions/technical-contracts","journal/2026-10-05-editor-layout","verificat l run observed core interactions on an intermediate build. The startup repair subsequently verified development startup, live heading edits/cancel, and production startup with Svelte/Vue interaction on the repaired build. Recovery, visual editor mounting/read-only behavior, Markdown meaning, and adapter lifecycle have unit coverage. The Kumo refinement run verifies mouse sorting, silent recovery, and submission toasts in the browser; full layout parity remains untested.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-06T0845Z-sortable-flip\">Optimistic FLIP sorting and Chartr reference behavior\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-06T0632Z-gutter-drop\">Gutter drop regression repair\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T0819Z-implementation\">Initial implementation run\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T0910Z-admin-startup\">Admin startup repair\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1005Z-kumo-admin\">Kumo admin refinement\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1014Z-block-sidebar\">Block sidebar hierarchy\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1054Z-admin-hierarchy\">Admin hierarchy and Home navigation\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1108Z-editor-layout\">Editor layout consistency\u003c/a>, including the previously outstanding schema-field browser inspection.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1124Z-page-list\">Pages table hierarchy\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1303Z-admin-views\">Page-only preview and standard admin views\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1650Z-generic-pages\">Generic pages and schema-only entries\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1725Z-admin-navigation\">Persistent admin sidebar\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1735Z-content-width\">Shared content width and development reloads\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1750Z-admin-width\">Standard admin content width\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1752Z-page-row\">Table rows and consistent Back labels\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1810Z-site-design\">Site typography and page gutter\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-06T1320Z-block-library\">Block library and repeated fields\u003c/a>.\u003c/p>\n\u003c/li>\n\u003c/ul>\n","backlinks":["decisions/index","discussions/agreed-design","features/block-library","features/index","verification/runs/2026-10-05T0819Z-implementation","verification/runs/2026-10-05T0910Z-admin-startup","verification/runs/2026-10-05T1005Z-kumo-admin","verification/runs/2026-10-05T1014Z-block-sidebar","verification/runs/2026-10-05T1054Z-admin-hierarchy","verification/runs/2026-10-05T1108Z-editor-layout","verification/runs/2026-10-05T1124Z-page-list","verification/runs/2026-10-05T1303Z-admin-views","verification/runs/2026-10-05T1650Z-generic-pages","verification/runs/2026-10-05T1725Z-admin-navigation","verification/runs/2026-10-05T1735Z-content-width","verification/runs/2026-10-05T1750Z-admin-width","verification/runs/2026-10-05T1752Z-page-row","verification/runs/2026-10-05T1810Z-site-design","verification/runs/2026-10-06T0632Z-gutter-drop","verification/runs/2026-10-06T0845Z-sortable-flip","verification/runs/2026-10-06T1320Z-block-library"]},{"id":"features/generic-pages","title":"Generic pages and collection content","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Generic pages and collection content\nupdated: 2026-10-06\n---\n# Generic pages and collection content\n\n**ID:** FEAT-generic-pages\n\n## Intent and basis\n\nDEC-058–DEC-073 in the [decision register](../decisions/index.md) separate schema data from reusable page layouts. The [technical contracts](../discussions/technical-contracts.md#generic-pages-and-field-bindings-dec-058-dec-073) define the stored shape, binding resolution and rich-text references.\n\n## Entry points and prerequisites\n\nUse [verification setup](../verification/setup.md). Pages → Add page selects Static page or Generic page. Collection schemas → Journal has the optional Generic page selector. Content → Journal opens field-only entries. Uploaded images must already exist in Media to insert them into rich text.\n\n## Expected outcomes\n\nThe [block library](block-library.md) adds themed/tagged browsing, shared chrome, repeated content and schema lists. Its record owns the expanded contract and verification recipe.\n\n- The Pages table lists title, type and URL. Generic pages have no URL field or public route. Their block catalog contains only generic blocks; static pages offer normal blocks, including Collection list.\n- Generic block fields have an optional Schema field string and a fixed/fallback value. Preview shows bound field-name placeholders. Compatible schemas may share a template.\n- Schemas with no assignment remain data-only. Assigned entries render at collection prefix plus slug. A static page at the prefix supplies an optional index; absent that page the route is 404. Collection list renders entry links only when entry routes exist.\n- Content entries contain schema fields and system slug metadata, with no block list or live website preview. Rich text supports images and YouTube while preserving surrounding Markdown.\n- Missing/type-incompatible bindings and missing embedded images permit drafts but block publication. Empty optional values use literal fallback or render empty; zero and false are preserved. Colliding public routes block publication.\n- New schema-only fixtures replace the old demo entries. Legacy imported entry blocks are rejected, not silently deleted. Old tab recovery is left under its original key.\n\n## Verification recipe\n\n1. Run `pnpm verify`. `tests/templates.test.ts` covers route ownership, data-only behavior, sharing, binding failures/fallbacks, legacy entry rejection, version switching and embedded references. Navigation tests exercise type selection, catalog filtering, binding edits and schema assignment. Rich-text tests exercise image insertion/removal, read-only state and Markdown round trips.\n2. Pages → Journal entry: expect `{{title}}`, `{{summary}}`, `{{image}}` and `{{body}}` placeholders. Open Entry heading: enter a missing key in Bind Heading, click Publish and expect a toast naming the collection and binding. Cancel block changes restores the original binding.\n3. Content → Journal → A slower way to build: expect schema fields only, no Blocks or live preview. In Body choose YouTube, enter a valid YouTube URL and insert. Reload, reopen the entry and verify the embed and surrounding text remain in visual editing mode. Remove the embed or discard the test edits through Site.\n4. Collection schemas → Journal: the selector offers None · data only and generic pages, excluding static pages. Choose None and verify the label remains visible; restore Journal entry. Schema editing stays separate from entry values.\n5. Open `/journal/` and follow A slower way to build. The entry uses the template with actual values and formatted body, no bound-name placeholders and no missing-media prompt for an empty optional image. The production artifact check verifies zero JavaScript for the index and both demo entries.\n\n## Coverage and limitations\n\nLocal build, mounted UI tests and native browser flows are covered by the run below. R2 upload credentials, external video playback, live GitHub saves/publishing and Netlify deployment are outside this local verification. No general migration of third-party content is implemented.\n\n## Verification history\n\n- [Generic-page implementation](../verification/runs/2026-10-05T1650Z-generic-pages.md).\n\n- [Block library and repeated fields](../verification/runs/2026-10-06T1320Z-block-library.md).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"generic-pages-and-collection-content","links":["decisions/index","discussions/technical-contracts","verification/setup","features/block-library","verification/runs/2026-10-05T1650Z-generic-pages","verification/runs/2026-10-06T1320Z-block-library"],"attachments":[],"html":"\u003cp>\u003cstrong>ID:\u003c/strong> FEAT-generic-pages\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>DEC-058–DEC-073 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a> separate schema data from reusable page layouts. The \u003ca href=\"#/discussions/technical-contracts~generic-pages-and-field-bindings-dec-058-dec-073\">technical contracts\u003c/a> define the stored shape, binding resolution and rich-text references.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\ ad credentials, external video playback, live GitHub saves/publishing and Netlify deployment are outside this local verification. No general migration of third-party content is implemented.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1650Z-generic-pages\">Generic-page implementation\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-06T1320Z-block-library\">Block library and repeated fields\u003c/a>.\u003c/p>\n\u003c/li>\n\u003c/ul>\n","backlinks":["features/editor","features/index","features/static-blocks","verification/runs/2026-10-05T1650Z-generic-pages","verification/runs/2026-10-06T1320Z-block-library"]},{"id":"features/index","title":"Feature map","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Feature map\nupdated: 2026-10-06\n---\n# Feature map\n\nThe first implementation follows the [agreed design](../discussions/agreed-design.md) and [technical contracts](../discussions/technical-contracts.md). This map describes intended behavior and executable checks; verification results apply only to the recorded build.\n\n- [Searchable block library](block-library.md) — FEAT-block-library.\n- [Static pages and registered blocks](static-blocks.md) — FEAT-static-blocks.\n- [Generic pages and collection content](generic-pages.md) — FEAT-generic-pages.\n- [Visual editing and recovery](editor.md) — FEAT-editor.\n- [Git draft saves and publishing](publishing.md) — FEAT-publishing.\n- [Direct media uploads](media.md) — FEAT-media.\n\nUse [verification setup](../verification/setup.md). The [initial run](../verification/runs/2026-10-05T0819Z-implementation.md) covers automated checks and records browser observations, unavailable browser follow-up, and untested live providers.\n","toc":[],"titleAnchor":"feature-map","links":["discussions/agreed-design","discussions/technical-contracts","features/block-library","features/static-blocks","features/generic-pages","features/editor","features/publishing","features/media","verification/setup","verification/runs/2026-10-05T0819Z-implementation"],"attachments":[],"html":"\u003cp>The first implementation follows the \u003ca href=\"#/discussions/agreed-design\">agreed design\u003c/a> and \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a>. This map describes intended behavior and executable checks; verification results apply only to the recorded build.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/features/block-library\">Searchable block library\u003c/a> — FEAT-block-library.\u003c/li>\n\u003cli>\u003ca href=\"#/features/static-blocks\">Static pages and registered blocks\u003c/a> — FEAT-static-blocks.\u003c/li>\n\u003cli>\u003ca href=\"#/features/generic-pages\">Generic pages and collection content\u003c/a> — FEAT-generic-pages.\u003c/li>\n\u003cli>\u003ca href=\"#/features/editor\">Visual editing and recovery\u003c/a> — FEAT-editor.\u003c/li>\n\u003cli>\u003ca href=\"#/features/publishing\">Git draft saves and publishing\u003c/a> — FEAT-publishing.\u003c/li>\n\u003cli>\u003ca href=\"#/features/media\">Direct media uploads\u003c/a> — FEAT-media.\u003c/li>\n\u003c/ul>\n\u003cp>Use \u003ca href=\"#/verification/setup\">verification setup\u003c/a>. The \u003ca href=\"#/verification/runs/2026-10-05T0819Z-implementation\">initial run\u003c/a> covers automated checks and records browser observations, unavailable browser follow-up, and untested live providers.\u003c/p>\n","backlinks":["index","discussions/agreed-design","discussions/technical-contracts","journal/2026-10-05-implementation"]},{"id":"features/media","title":"Direct media uploads","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Direct media uploads\nupdated: 2026-10-05\n---\n# Direct media uploads\n\n**ID:** FEAT-media\n\n## Intent and basis\n\nThe [agreed media design](../discussions/agreed-design.md) uses R2 with runtime credentials, original files, modest browser-generated variants, and IDs in content. It does not add an upload server or media transcoding service.\n\n## Entry points and prerequisites\n\n`/admin/` → Media → Storage settings. A test R2 bucket, public HTTPS media origin, authorized credentials, and CORS for the editor origin are required. The root README contains configuration details. The Media block selects an uploaded record.\n\n## Expected outcomes\n\nThe original uploads directly to R2. Decodable static raster images below the pixel limit get configured smaller WebP variants, with no upscaling; animated/unsupported formats retain their original. Non-image media uses native players or links. Metadata enters the draft, while credentials and binaries do not.\n\nFailed batches attempt to delete their own attempted keys. Successful uploads discarded before Save remain in R2 for manual cleanup. Public URLs may be accessible before Publish.\n\n## Verification recipe\n\n1. `pnpm test` exercises SDK-mocked upload batches, metadata, smaller variants, failed-batch cleanup, executable-format rejection, and decode fallback.\n2. With a disposable bucket, upload a large JPEG and a static PNG, inspect original/variant sizes and Content-Type, select them in a Media block, Save/Publish, and verify responsive image loading.\n3. Test animation preservation and denied CORS/credentials. Confirm no credentials in exported JSON or built assets, and clean up only the test object's prefix afterward.\n\nSteps 2–3 are unvalidated with real browser decoding and R2.\n\n## Coverage and limitations\n\nCanvas/SDK mocks are not proof of browser encoders, R2 CORS, or live object cleanup. No automatic deletion of successfully uploaded assets, image service, or video transcoding is supplied.\n\n## Verification history\n\n- [Initial implementation run](../verification/runs/2026-10-05T0819Z-implementation.md).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"direct-media-uploads","links":["discussions/agreed-design","verification/runs/2026-10-05T0819Z-implementation"],"attachments":[],"html":"\u003cp>\u003cstrong>ID:\u003c/strong> FEAT-media\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>The \u003ca href=\"#/discussions/agreed-design\">agreed media design\u003c/a> uses R2 with runtime credentials, original files, modest browser-generated variants, and IDs in content. It does not add an upload server or media transcoding service.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>\u003ccode>/admin/\u003c/code> → Media → Storage settings. A test R2 bucket, public HTTPS media origin, authorized credentials, and CORS for the editor origin are required. The root README contains configuration details. The Media block selects an uploaded record.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cp>The original uploads directly to R2. Decodable static raster images below the pixel limit get configured smaller WebP variants, with no upscaling; animated/unsupported formats retain their original. Non-image media uses native players or links. Metadata enters the draft, while credentials and binaries do not.\u003c/p>\n\u003cp>Failed batches attempt to delete their own attempted keys. Successful uploads discarded before Save remain in R2 for manual cleanup. Public URLs may be accessible before Publish.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003col>\n\u003cli>\u003ccode>pnpm test\u003c/code> exercises SDK-mocked upload batches, metadata, smaller variants, failed-batch cleanup, executable-format rejection, and decode fallback.\u003c/li>\n\u003cli>With a disposable bucket, upload a large JPEG and a static PNG, inspect original/variant sizes and Content-Type, select them in a Media block, Save/Publish, and verify responsive image loading.\u003c/li>\n\u003cli>Test animation preservation and denied CORS/credentials. Confirm no credentials in exported JSON or built assets, and clean up only the test object's prefix afterward.\u003c/li>\n\u003c/ol>\n\u003cp>Steps 2–3 are unvalidated with real browser decoding and R2.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>Canvas/SDK mocks are not proof of browser encoders, R2 CORS, or live object cleanup. No automatic deletion of successfully uploaded assets, image service, or video transcoding is supplied.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T0819Z-implementation\">Initial implementation run\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","verification/runs/2026-10-05T0819Z-implementation"]},{"id":"features/publishing","title":"Git draft saves and publishing","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Git draft saves and publishing\nupdated: 2026-10-05\n---\n# Git draft saves and publishing\n\n**ID:** FEAT-publishing\n\n## Intent and basis\n\nThe [save/recovery contract](../discussions/technical-contracts.md) requires one atomic draft commit, stale-save protection, immutable publication, and no forced overwrites. The user selected GitHub and Netlify.\n\n## Entry points and prerequisites\n\n`/admin/` → Connection; use a repository containing this source, a main branch, a writable draft branch, a per-editor Contents read/write token, and Netlify configured to build main. See the root README and [setup](../verification/setup.md). No live provider account was used in the initial verification.\n\n## Expected outcomes\n\nConnect reads content from a coherent commit and creates a missing draft branch from main. Save validates structural integrity and collection compatibility, writes a tree and one commit, then advances the draft without force. A concurrent writer rejects that update. Uncertain network responses are checked against the intended commit before edits are cleared.\n\nValidation errors appear in Kumo toasts when Save or Publish is submitted; no proactive issue panel is shown. Publish accepts only saved, fully valid content and a matching deployed source contract. It checks main ancestry and advances main to the validated snapshot without force, preserving any newer draft commits. Divergent history requires synchronization. The success message says deployment pending; no provider status is invented.\n\n## Verification recipe\n\n1. `pnpm test` runs the mock Git transport scenarios: missing branch, atomic multi-record save, stale preflight, ref-update race, lost response, incomplete Publish rejection, exact-snapshot publication, divergent main, and source mismatch.\n2. On a disposable real repository, connect, edit two records, Save, and inspect one commit containing both changes. Repeat with a second editor to exercise the conflict/recovery UI.\n3. Publish a valid saved draft, inspect main's exact SHA and unchanged newer draft commits, then observe the Netlify build result.\n\nSteps 2–3 are unvalidated live-provider recipes. Do not use a production site as a disposable fixture.\n\n## Coverage and limitations\n\nTransport mocks establish client transaction logic, not GitHub permissions, branch policies, CORS, or deployment success. The portal does not merge divergent branches, synchronize source automatically, or poll Netlify deployment status.\n\n## Verification history\n\n- [Initial implementation run](../verification/runs/2026-10-05T0819Z-implementation.md).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"git-draft-saves-and-publishing","links":["discussions/technical-contracts","verification/setup","verification/runs/2026-10-05T0819Z-implementation"],"attachments":[],"html":"\u003cp>\u003cstrong>ID:\u003c/strong> FEAT-publishing\u003c/p>\n\u003ch2 id=\"intent-and-basis\">Intent and basis\u003c/h2>\n\u003cp>The \u003ca href=\"#/discussions/technical-contracts\">save/recovery contract\u003c/a> requires one atomic draft commit, stale-save protection, immutable publication, and no forced overwrites. The user selected GitHub and Netlify.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>\u003ccode>/admin/\u003c/code> → Connection; use a repository containing this source, a main branch, a writable draft branch, a per-editor Contents read/write token, and Netlify configured to build main. See the root README and \u003ca href=\"#/verification/setup\">setup\u003c/a>. No live provider account was used in the initial verification.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cp>Connect reads content from a coherent commit and creates a missing draft branch from main. Save validates structural integrity and collection compatibility, writes a tree and one commit, then advances the draft without force. A concurrent writer rejects that update. Uncertain network responses are checked against the intended commit before edits are cleared.\u003c/p>\n\u003cp>Validation errors appear in Kumo toasts when Save or Publish is submitted; no proactive issue panel is shown. Publish accepts only saved, fully valid content and a matching deployed source contract. It checks main ancestry and advances main to the validated snapshot without force, preserving any newer draft commits. Divergent history requires synchronization. The success message says deployment pending; no provider status is invented.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003col>\n\u003cli>\u003ccode>pnpm test\u003c/code> runs the mock Git transport scenarios: missing branch, atomic multi-record save, stale preflight, ref-update race, lost response, incomplete Publish rejection, exact-snapshot publication, divergent main, and source mismatch.\u003c/li>\n\u003cli>On a disposable real repository, connect, edit two records, Save, and inspect one commit containing both changes. Repeat with a second editor to exercise the conflict/recovery UI.\u003c/li>\n\u003cli>Publish a valid saved draft, inspect main's exact SHA and unchanged newer draft commits, then observe the Netlify build result.\u003c/li>\n\u003c/ol>\n\u003cp>Steps 2–3 are unvalidated live-provider recipes. Do not use a production site as a disposable fixture.\u003c/p>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>Transport mocks establish client transaction logic, not GitHub permissions, branch policies, CORS, or deployment success. The portal does not merge divergent branches, synchronize source automatically, or poll Netlify deployment status.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T0819Z-implementation\">Initial implementation run\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","verification/runs/2026-10-05T0819Z-implementation","verification/runs/2026-10-05T1005Z-kumo-admin"]},{"id":"features/static-blocks","title":"Static pages and registered blocks","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Static pages and registered blocks\nupdated: 2026-10-06\n---\n# Static pages and registered blocks\n\n**ID:** FEAT-static-blocks\n\n## Intent and basis\n\nThe [accepted block contracts](../discussions/technical-contracts.md) require static public HTML, shared dependencies, retained block versions, and one renderer source for public and preview paths.\n\n## Entry points and prerequisites\n\nRun the [standard setup](../verification/setup.md). Public fixtures are `/`, `/blocks/`, `/journal/`, and `/journal/a-slower-way-to-build/` and `/journal/keep-the-essentials/`. Developer registrations live in `blocks.config.mjs` and `src/blocks/\u003cname>/vN/definition.json`.\n\n## Expected outcomes\n\nThe [block library](block-library.md) adds themed/tagged browsing, shared chrome, repeated content and schema lists. Its record owns the expanded contract and verification recipe.\n\nAstro generates static-page routes and assigned collection-entry routes with imports for only their used blocks. Generic pages themselves have no public route; collection indexes require an explicit static page. See [generic pages](generic-pages.md). React/Svelte/Vue use Astro hydration; vanilla modules expose render/mount with matching activation timing. Preview mounts immediately. Root dependency pins and manifest compatibility checks govern all retained implementations. Framework/runtime modules have one emitted implementation and shared URLs. Public routes never load the editor, GitHub client, or R2 client. Styles are scoped; the shell owns resets.\n\nDEC-075 adds **Site → Content max-width (px)**, persisted in `site.globals.contentMaxWidth`. Omitted or cleared values use 1200px. Public output and preview inherit `--site-content-max-width`; starter block containers and header/footer follow it, while blocks may retain narrower text measures or opt out. Admin workspace widths are unaffected.\n\nDEC-078 adds Site → Typography (separate body/heading font selectors, body size and unitless line height) and Layout → Page gutter. These persist with content, survive tab recovery, and apply equally to public HTML and page previews. Fonts use built-in stacks; defaults are system sans, 16px, 1.6 and 24px gutter. The starter blocks follow these shared styles without affecting admin controls. [Contract](../discussions/technical-contracts.md#block-source-contract-and-styles).\n\n\n## Verification recipe\n\n1. Run `pnpm verify`. Build inspection checks static output, referenced assets, unique runtime modules, and absence of editor/provider code in public graphs.\n2. Open `/blocks/`. Activate **Code** on the first Tabs block; the second block should remain on **Content**. Use arrow keys between tabs.\n3. Open `/`. The Svelte **Add one** button increments its counter; the Vue question toggles its answer. The vanilla quote renders without activation.\n4. Open the journal index and entries with JavaScript disabled: their visible content should remain complete. The artifact check establishes zero JavaScript module references for these fixtures; a final browser JavaScript-disabled check is unvalidated.\n5. In Site settings enter 680 for Content max-width. Open Pages → Home and inspect the centered content and full-width Hero background; switch to Journal entry to check generic blocks. Return to Site and reload: the value persists. Clear it to use 1200 again. Invalid nonpositive values must fail Save/Publish validation. Discard browser test edits when finished. The built public HTML must expose the value from `content/site.json` without client JavaScript.\n\n6. In an isolated admin tab, choose Arial body/Georgia headings, body size 18, line height 1.8 and gutter 40. Navigate to Home and the generic Journal entry preview; inspect font separation and horizontal insets. Reload, return to Site and confirm settings persist. Clear numeric overrides to restore defaults. Close the test tab without provider saves.\n\n## Coverage and limitations\n\nBuild graph checks establish emitted sharing, not a browser network trace. Reactive adapter updates/destruction have React/Vue unit coverage, and Svelte preview interaction was observed during implementation. The last public React interaction check was blocked by the native browser tool. Alternate renderer sources/parity fixtures are not implemented; all supplied blocks share source.\n\n## Verification history\n\n- [Initial implementation run](../verification/runs/2026-10-05T0819Z-implementation.md), dirty tree based on `f699352`; final source manifest is linked in the report.\n\n- [Generic pages and schema-only entries](../verification/runs/2026-10-05T1650Z-generic-pages.md).\n\n- [Shared content width and development reloads](../verification/runs/2026-10-05T1735Z-content-width.md).\n\n- [Site typography and page gutter](../verification/runs/2026-10-05T1810Z-site-design.md).\n\n- [Block library and repeated fields](../verification/runs/2026-10-06T1320Z-block-library.md).\n","toc":[{"id":"intent-and-basis","title":"Intent and basis","depth":2},{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limitations","title":"Coverage and limitations","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"static-pages-and-registered-blocks","links":["discussions/technical-contracts","verification/setup","features/block-library","features/generic-pages","discussions/technical-contracts","verification/runs/2026-10-05T The artifact check establishes zero JavaScript module references for these fixtures; a final browser JavaScript-disabled check is unvalidated.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>In Site settings enter 680 for Content max-width. Open Pages → Home and inspect the centered content and full-width Hero background; switch to Journal entry to check generic blocks. Return to Site and reload: the value persists. Clear it to use 1200 again. Invalid nonpositive values must fail Save/Publish validation. Discard browser test edits when finished. The built public HTML must expose the value from \u003ccode>content/site.json\u003c/code> without client JavaScript.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>In an isolated admin tab, choose Arial body/Georgia headings, body size 18, line height 1.8 and gutter 40. Navigate to Home and the generic Journal entry preview; inspect font separation and horizontal insets. Reload, return to Site and confirm settings persist. Clear numeric overrides to restore defaults. Close the test tab without provider saves.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"coverage-and-limitations\">Coverage and limitations\u003c/h2>\n\u003cp>Build graph checks establish emitted sharing, not a browser network trace. Reactive adapter updates/destruction have React/Vue unit coverage, and Svelte preview interaction was observed during implementation. The last public React interaction check was blocked by the native browser tool. Alternate renderer sources/parity fixtures are not implemented; all supplied blocks share source.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T0819Z-implementation\">Initial implementation run\u003c/a>, dirty tree based on \u003ccode>f699352\u003c/code>; final source manifest is linked in the report.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1650Z-generic-pages\">Generic pages and schema-only entries\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1735Z-content-width\">Shared content width and development reloads\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-05T1810Z-site-design\">Site typography and page gutter\u003c/a>.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/verification/runs/2026-10-06T1320Z-block-library\">Block library and repeated fields\u003c/a>.\u003c/p>\n\u003c/li>\n\u003c/ul>\n","backlinks":["decisions/index","features/editor","features/index","journal/2026-10-06-site-design","verification/runs/2026-10-05T0819Z-implementation","verification/runs/2026-10-05T1650Z-generic-pages","verification/runs/2026-10-05T1735Z-content-width","verification/runs/2026-10-05T1810Z-site-design","verification/runs/2026-10-06T1320Z-block-library"]},{"id":"journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-04\u003c/span>","updated":"2026-10-04","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-04\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `528c4b19-f488-4209-ab5c-b9c13f420f02`\n\n## Question 1\n\n```text\nRound: lean-sitebuilder\nQuestion: What does ‘all while being a static website’ permit?\nContext: Both the public site and editor can be static. Git writes still need authorization, and redeployment needs a build runner. GitHub’s standard web OAuth token exchange requires a client secret, which cannot safely live in the static bundle.\nRecommendation: A small on-demand auth/Git helper plus build jobs avoids an always-running CMS and supports a smoother login.\nOptions: Allow a small serverless auth/Git helper plus build jobs / No custom server-side code; accept a user-supplied Git token or compatible external auth service, plus build jobs\nSelected: Something else\nNotes: allow user access to the admin portal via a environmentvariable-set credential. then when \"submitting\",  a user-supplied git token is required. just github compatibility is fine for now\n```\n\n## Question 2\n\n```text\nRound: lean-sitebuilder\nQuestion: Who must be comfortable using the editor in the first version?\nContext: This shapes login, media uploads, and publishing feedback.\nRecommendation: Design for nontechnical site owners if you intend to hand sites to clients.\nOptions: Nontechnical clients and site owners / Me and developers who are comfortable with GitHub / Both developers and nontechnical clients from day one\nSelected: Nontechnical clients and site owners\nNotes: \n```\n\n## Question 3\n\n```text\nRound: lean-sitebuilder\nQuestion: How much CMS functionality belongs in the first version?\nContext: Posts and other structured collections add a separate content-modeling problem.\nRecommendation: Start with pages, navigation, site settings, and media to keep the first release focused.\nOptions: Pages, navigation, site settings, and media / Also include blog posts or other repeatable content collections / A general collection/schema builder comparable to Payload\nSelected: Also include blog posts or other repeatable content collections\nNotes: \n```\n\n## Question 4\n\n```text\nRound: lean-sitebuilder\nQuestion: Can block authors be required to follow a shared dependency contract?\nContext: React, Svelte, Vue, and vanilla blocks can coexist. Loading one shared runtime per framework requires compatible versions and declared dependencies; arbitrary self-bundled blocks cannot guarantee deduplication.\nRecommendation: Require declared dependencies and compatible shared versions so blocks can share libraries reliably.\nOptions: Require declared dependencies and compatible shared versions / Accept arbitrary bundles, even when libraries must be duplicated / Support only one interactive framework initially\nSelected: Require declared dependencies and compatible shared versions\nNotes: \n```\n\n## Question 5\n\n```text\nRound: lean-sitebuilder\nQuestion: How much layout freedom should the editor offer initially?\nContext: All options include the side drawer and live preview. The difference is what can be rearranged and styled.\nRecommendation: Start with ordered sections, schema-defined fields, repeatable items, and block-specific design controls to keep blocks predictable.\nOptions: Reorder sections and edit each block’s defined fields and design controls / Also support nested containers, columns, and blocks within blocks / Full Elementor-style positioning and responsive styling of individual elements\nSelected: Reorder sections and edit each block’s defined fields and design controls\nNotes: \n```\n\n## Question 6\n\n```text\nRound: lean-sitebuilder\nQuestion: Should Save publish after a rebuild, or should saving and publishing be separate?\nContext: Unsaved edits appear in the live preview first. This determines when they reach Git and become public.\nRecommendation: Explicit Save → Git commit → automatic rebuild matches your original description.\nOptions: Explicit Save commits and automatically redeploys / Save creates a draft; Publish separately triggers deployment / Autosave changes to Git and continuously redeploy\nSelected: Something else\nNotes: save produces commits, which are pushed to a branch with draft \"unpublished\" content. when another \"publish\" action is clicked, whatever is in the unpublished draft is merged to main branch, and then deployed\n```\n\n## Question 7\n\n```text\nRound: lean-sitebuilder\nQuestion: What should lean-sitebuilder inherit from astro-payload?\nContext: Migrating all existing sites would substantially expand the first release.\nRecommendation: Build a fresh core and port a few representative existing blocks to prove the new block contract.\nOptions: Fresh core with a few existing blocks ported / Fresh core and entirely new starter blocks; old project is reference only / Migration compatibility for existing astro-payload sites and content\nSelected: Fresh core and entirely new starter blocks; old project is reference only\nNotes: \n```\n","toc":[{"id":"question-1","title":"Question 1","depth":2},{"id":"question-2","title":"Question 2","depth":2},{"id":"question-3","title":"Question 3","depth":2},{"id":"question-4","title":"Question 4","depth":2},{"id":"question-5","title":"Question 5","depth":2},{"id":"question-6","title":"Question 6","depth":2},{"id":"question-7","title":"Question 7","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>528c4b19-f488-4209-ab5c-b9c13f420f02\u003c/code>\u003c/p>\n\u003ch2 id=\"question-1\">Question 1\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: What does ‘all while being a static website’ permit?\nContext: Both the public site and editor can be static. Git writes still need authorization, and redeployment needs a build runner. GitHub’s standard web OAuth token exchange requires a client secret, which cannot safely live in the static bundle.\nRecommendation: A small on-demand auth/Git helper plus build jobs avoids an always-running CMS and supports a smoother login.\nOptions: Allow a small serverless auth/Git helper plus build jobs / No custom server-side code; accept a user-supplied Git token or compatible external auth service, plus build jobs\nSelected: Something else\nNotes: allow user access to the admin portal via a environmentvariable-set credential. then when \"submitting\",  a user-supplied git token is required. just github compatibility is fine for now\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-2\">Question 2\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: Who must be comfortable using the editor in the first version?\nContext: This shapes login, media uploads, and publishing feedback.\nRecommendation: Design for nontechnical site owners if you intend to hand sites to clients.\nOptions: Nontechnical clients and site owners / Me and developers who are comfortable with GitHub / Both developers and nontechnical clients from day one\nSelected: Nontechnical clients and site owners\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-3\">Question 3\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: How much CMS functionality belongs in the first version?\nContext: Posts and other structured collections add a separate content-modeling problem.\nRecommendation: Start with pages, navigation, site settings, and media to keep the first release focused.\nOptions: Pages, navigation, site settings, and media / Also include blog posts or other repeatable content collections / A general collection/schema builder comparable to Payload\nSelected: Also include blog posts or other repeatable content collections\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-4\">Question 4\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: Can block authors be required to follow a shared dependency contract?\nContext: React, Svelte, Vue, and vanilla blocks can coexist. Loading one shared runtime per framework requires compatible versions and declared dependencies; arbitrary self-bundled blocks cannot guarantee deduplication.\nRecommendation: Require declared dependencies and compatible shared versions so blocks can share libraries reliably.\nOptions: Require declared dependencies and compatible shared versions / Accept arbitrary bundles, even when libraries must be duplicated / Support only one interactive framework initially\nSelected: Require declared dependencies and compatible shared versions\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-5\">Question 5\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: How much layout freedom should the editor offer initially?\nContext: All options include the side drawer and live preview. The difference is what can be rearranged and styled.\nRecommendation: Start with ordered sections, schema-defined fields, repeatable items, and block-specific design controls to keep blocks predictable.\nOptions: Reorder sections and edit each block’s defined fields and design controls / Also support nested containers, columns, and blocks within blocks / Full Elementor-style positioning and responsive styling of individual elements\nSelected: Reorder sections and edit each block’s defined fields and design controls\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-6\">Question 6\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: Should Save publish after a rebuild, or should saving and publishing be separate?\nContext: Unsaved edits appear in the live preview first. This determines when they reach Git and become public.\nRecommendation: Explicit Save → Git commit → automatic rebuild matches your original description.\nOptions: Explicit Save commits and automatically redeploys / Save creates a draft; Publish separately triggers deployment / Autosave changes to Git and continuously redeploy\nSelected: Something else\nNotes: save produces commits, which are pushed to a branch with draft \"unpublished\" content. when another \"publish\" action is clicked, whatever is in the unpublished draft is merged to main branch, and then deployed\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-7\">Question 7\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder\nQuestion: What should lean-sitebuilder inherit from astro-payload?\nContext: Migrating all existing sites would substantially expand the first release.\nRecommendation: Build a fresh core and port a few representative existing blocks to prove the new block contract.\nOptions: Fresh core with a few existing blocks ported / Fresh core and entirely new starter blocks; old project is reference only / Migration compatibility for existing astro-payload sites and content\nSelected: Fresh core and entirely new starter blocks; old project is reference only\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-one-decisions"]},{"id":"journal/2026-10-05-admin-hierarchy-decisions","title":"Admin hierarchy decisions","section":"Journal","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Admin hierarchy decisions\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Admin hierarchy decisions\n\nThe [submitted answers](2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4.md) resolve both choices raised by the [research](2026-10-05-admin-hierarchy-research.md).\n\n- Q46 chooses Add block beside the Blocks heading, aligned right (DEC-052). Its compact borderless appearance separates the action from the repeated draggable rows.\n- Q47 chooses alternative B: separate top-level Content and Collection schemas areas (DEC-053). This replaces the assistant's recommendation of A; authoring entries and configuring models have separate navigation destinations.\n\nThe [design](../discussions/admin-hierarchy-proposal.md) now reflects B and labels finer layout details as implementation direction. Shared saving/publication, field safety, and the existing block-detail hierarchy remain accepted. No consequential design questions remain for this scoped refinement. Application implementation and browser verification are the next work; this round changes documentation only.\n\nAnswers were saved before the temporary form and matching download were cleaned up. The wiki reader was rebuilt and checked; that validates documentation structure, not application behavior.\n","toc":[],"titleAnchor":"admin-hierarchy-decisions","links":["journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4","journal/2026-10-05-admin-hierarchy-research","discussions/admin-hierarchy-proposal"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4\">submitted answers\u003c/a> resolve both choices raised by the \u003ca href=\"#/journal/2026-10-05-admin-hierarchy-research\">research\u003c/a>.\u003c/p>\n\u003cul>\n\u003cli>Q46 chooses Add block beside the Blocks heading, aligned right (DEC-052). Its compact borderless appearance separates the action from the repeated draggable rows.\u003c/li>\n\u003cli>Q47 chooses alternative B: separate top-level Content and Collection schemas areas (DEC-053). This replaces the assistant's recommendation of A; authoring entries and configuring models have separate navigation destinations.\u003c/li>\n\u003c/ul>\n\u003cp>The \u003ca href=\"#/discussions/admin-hierarchy-proposal\">design\u003c/a> now reflects B and labels finer layout details as implementation direction. Shared saving/publication, field safety, and the existing block-detail hierarchy remain accepted. No consequential design questions remain for this scoped refinement. Application implementation and browser verification are the next work; this round changes documentation only.\u003c/p>\n\u003cp>Answers were saved before the temporary form and matching download were cleaned up. The wiki reader was rebuilt and checked; that validates documentation structure, not application behavior.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions"]},{"id":"journal/2026-10-05-admin-hierarchy-implementation","title":"Admin hierarchy implementation","section":"Journal","order":0,"metadata":{"status":"Implemented"},"metadataHtml":"\u003cspan>Status: Implemented\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Admin hierarchy implementation\nupdated: 2026-10-05\nstatus: Implemented\n---\n# Admin hierarchy implementation\n\nImplemented DEC-052–DEC-053 following the accepted answers: Add block is a compact header action; Content owns collection entries; Collection schemas owns definitions and individual field settings. Entries no longer appear in the Pages selector. Parent back links preserve content edits and block details replace parent controls.\n\nDuring implementation, the user rejected the sidebar destination grid and requested another nesting layer. DEC-054 records the resulting standalone Home screen with Pages, Content, Collection schemas, Media and Site. Area roots return to Home; the global menu does not appear inside the editing drawer.\n\nThe [verification run](../verification/runs/2026-10-05T1054Z-admin-hierarchy.md) records 61 passing tests, zero diagnostics, a successful static build and asset checks. Browser checks observed the header action, entry editing and Home layout; schema-screen visual inspection was interrupted by active user interaction and remains unverified. No live provider writes were performed.\n","toc":[],"titleAnchor":"admin-hierarchy-implementation","links":["verification/runs/2026-10-05T1054Z-admin-hierarchy"],"attachments":[],"html":"\u003cp>Implemented DEC-052–DEC-053 following the accepted answers: Add block is a compact header action; Content owns collection entries; Collection schemas owns definitions and individual field settings. Entries no longer appear in the Pages selector. Parent back links preserve content edits and block details replace parent controls.\u003c/p>\n\u003cp>During implementation, the user rejected the sidebar destination grid and requested another nesting layer. DEC-054 records the resulting standalone Home screen with Pages, Content, Collection schemas, Media and Site. Area roots return to Home; the global menu does not appear inside the editing drawer.\u003c/p>\n\u003cp>The \u003ca href=\"#/verification/runs/2026-10-05T1054Z-admin-hierarchy\">verification run\u003c/a> records 61 passing tests, zero diagnostics, a successful static build and asset checks. Browser checks observed the header action, entry editing and Home layout; schema-screen visual inspection was interrupted by active user interaction and remains unverified. No live provider writes were performed.\u003c/p>\n","backlinks":["index"]},{"id":"journal/2026-10-05-admin-hierarchy-research","title":"Admin hierarchy research","section":"Journal","order":0,"metadata":{"status":"Proposed"},"metadataHtml":"\u003cspan>Status: Proposed\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Admin hierarchy research\nupdated: 2026-10-05\nstatus: Proposed\n---\n# Admin hierarchy research\n\nThe user requested research on Add block alignment/list ambiguity and separation of collection schema editing from entry authoring. Inspected the existing UI source and official Carbon, NN/g, Sanity, Payload and Strapi documentation.\n\nThe [proposal](../discussions/admin-hierarchy-proposal.md) recommends moving Add block into the Blocks header, opening collections on an entry list, and providing an explicit separate schema screen. It also compares a top-level Content/Collection schemas split and per-collection Entries/Schema tabs. Source observations, user requirements and unaccepted design recommendations are distinguished.\n\nApplication code and accepted saving/schema contracts remain unchanged. The pending choice is navigation alternative A/B/C and button placement. No product verification was needed for this documentation-only research; wiki structure and links were checked.\n","toc":[],"titleAnchor":"admin-hierarchy-research","links":["discussions/admin-hierarchy-proposal"],"attachments":[],"html":"\u003cp>The user requested research on Add block alignment/list ambiguity and separation of collection schema editing from entry authoring. Inspected the existing UI source and official Carbon, NN/g, Sanity, Payload and Strapi documentation.\u003c/p>\n\u003cp>The \u003ca href=\"#/discussions/admin-hierarchy-proposal\">proposal\u003c/a> recommends moving Add block into the Blocks header, opening collections on an entry list, and providing an explicit separate schema screen. It also compares a top-level Content/Collection schemas split and per-collection Entries/Schema tabs. Source observations, user requirements and unaccepted design recommendations are distinguished.\u003c/p>\n\u003cp>Application code and accepted saving/schema contracts remain unchanged. The pending choice is navigation alternative A/B/C and button placement. No product verification was needed for this documentation-only research; wiki structure and links were checked.\u003c/p>\n","backlinks":["index","journal/2026-10-05-admin-hierarchy-decisions"]},{"id":"journal/2026-10-05-content-block-contracts","title":"Content and block contracts","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Content and block contracts\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Content and block contracts\n\nThe [submitted answers](2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134.md) establish DEC-035 through DEC-041 in the [decision register](../decisions/index.md): generated self-hosted vendor modules, permanent document IDs, Markdown strings inside JSON blocks, framework preview adapters, author-declared activation, and stable internal references.\n\nThe user rejects the proposed automated migration approach. Old block implementations remain installed and are marked deprecated. A version selector changes the selected implementation; compatible values carry over, while unrecognized, renamed, or incompatible fields start empty for the user to fill. No inferred rename conversion or developer migration-function framework is required. The [technical contracts](../discussions/technical-contracts.md) now reflect this model.\n\nRetained block versions still fall under the previously accepted compatible shared-dependency rule. Keeping an old block implementation does not implicitly authorize multiple React runtimes or incompatible library versions. Any integration conflict must be explained and fixed in block code/dependency requirements rather than silently bypassing that rule.\n\nThe remaining round covers editor components/styles, save scope, unsaved recovery, Markdown authoring, and incomplete draft validation. Those choices affect observable behavior and dependency selection. Application implementation has not started.\n","toc":[],"titleAnchor":"content-and-block-contracts","links":["journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134","decisions/index","discussions/technical-contracts"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134\">submitted answers\u003c/a> establish DEC-035 through DEC-041 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>: generated self-hosted vendor modules, permanent document IDs, Markdown strings inside JSON blocks, framework preview adapters, author-declared activation, and stable internal references.\u003c/p>\n\u003cp>The user rejects the proposed automated migration approach. Old block implementations remain installed and are marked deprecated. A version selector changes the selected implementation; compatible values carry over, while unrecognized, renamed, or incompatible fields start empty for the user to fill. No inferred rename conversion or developer migration-function framework is required. The \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a> now reflect this model.\u003c/p>\n\u003cp>Retained block versions still fall under the previously accepted compatible shared-dependency rule. Keeping an old block implementation does not implicitly authorize multiple React runtimes or incompatible library versions. Any integration conflict must be explained and fixed in block code/dependency requirements rather than silently bypassing that rule.\u003c/p>\n\u003cp>The remaining round covers editor components/styles, save scope, unsaved recovery, Markdown authoring, and incomplete draft validation. Those choices affect observable behavior and dependency selection. Application implementation has not started.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions"]},{"id":"journal/2026-10-05-editor-layout","title":"Consistent editor layout","section":"Journal","order":0,"metadata":{"status":"Implemented"},"metadataHtml":"\u003cspan>Status: Implemented\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Consistent editor layout\nupdated: 2026-10-05\nstatus: Implemented\n---\n# Consistent editor layout\n\nThe user reported inconsistent spacing and action placement in block Design fields, Media, navigation links, and backup/session controls, and requested research into sidebar editors and Cloudflare's Kumo usage. DEC-055 records the requirement. The exact spacing below is an implementation choice, not an interview answer.\n\n## Research and application\n\n- [Kumo Input](https://kumo-ui.com/components/input/) and [Select](https://kumo-ui.com/components/select/) compose visible labels, controls, descriptions, and errors through Field. The [Field source](https://github.com/cloudflare/kumo/blob/main/packages/kumo/src/components/field/field.tsx) uses `grid gap-2`; use that 8px label/control rhythm and Kumo's native label support for compound widgets.\n- [Kumo Dialog](https://kumo-ui.com/components/dialog/) demonstrates composed headings, content and action rows. Its base styling uses 24px padding and 16px gaps. Apply those dimensions to our drawer and forms, with closing/submitting actions together at the dialog's lower right.\n- [Kumo Button](https://kumo-ui.com/components/button/) provides primary, secondary, ghost and destructive variants. Use primary for a screen's main operation, ghost for header additions/settings, and secondary-destructive for removal. These assignments are our application convention.\n- [WordPress block design](https://developer.wordpress.org/block-editor/explanations/user-interface/block-design/) recommends sections and headers when inspector options grow. [Webflow's Style panel](https://help.webflow.com/hc/en-us/articles/33961362040723-Style-panel-overview) separates controls into meaningful sections. Group by task and selected object; do not add collapsible panels where a short visible group is sufficient.\n\n## Layout contract\n\nKumo owns controls, visual states and semantic colors. `src/editor/editor.module.css` owns layout; `PanelSection` supplies a heading, optional header action and content stack.\n\n| Relationship | Rule |\n| --- | --- |\n| Label to control | 8px; label above a full-width control, except checkboxes |\n| Adjacent fields | 16px, owned by the parent stack rather than each field's margins |\n| Drawer/dialog edges | 24px padding |\n| Separate sections | Divider with 24px space on either side |\n| Related action buttons | 8px; wrap naturally when needed |\n| List rows | 8px; additions belong beside the heading, outside the list |\n| Compound widget | Named fieldset and legend; internal controls follow the same stack |\n| Destructive document/block actions | Separate footer after the fields |\n\nUse `panelBody`/`formStack` for forms, `field` for a label/control pair, `PanelSection` for distinct tasks, and `actionFooter`/`dialogActions` for terminal controls. Avoid per-control spacing overrides. All layout remains scoped to the admin surfaces.\n\n## Result\n\nHero Design fields now stack and align with the other block controls. Media gives Upload file priority and places Storage settings beside the heading. Navigation links each have a bounded group containing Label, Destination, optional URL and a right-aligned removal action. Site settings, Navigation, Backups and Session are separate sections. Pages, schemas, blocks, dialogs, media cards and the login form use the same layout primitives.\n\nThe [verification run](../verification/runs/2026-10-05T1108Z-editor-layout.md) records 61 passing tests, a successful static build, and browser inspection of the affected layouts. Browser schema/field inspection also completes the visual check left open by the previous hierarchy run.\n","toc":[{"id":"research-and-application","title":"Research and application","depth":2},{"id":"layout-contract","title":"Layout contract","depth":2},{"id":"result","title":"Result","depth":2}],"titleAnchor":"consistent-editor-layout","links":["verification/runs/2026-10-05T1108Z-editor-layout"],"attachments":[],"html":"\u003cp>The user reported inconsistent spacing and action placement in block Design fields, Media, navigation links, and backup/session controls, and requested research into sidebar editors and Cloudflare's Kumo usage. DEC-055 records the requirement. The exact spacing below is an implementation choice, not an interview answer.\u003c/p>\n\u003ch2 id=\"research-and-application\">Research and application\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://kumo-ui.com/components/input/\" rel=\"noreferrer\">Kumo Input\u003c/a> and \u003ca href=\"https://kumo-ui.com/components/select/\" rel=\"noreferrer\">Select\u003c/a> compose visible labels, controls, descriptions, and errors through Field. The \u003ca href=\"https://github.com/cloudflare/kumo/blob/main/packages/kumo/src/components/field/field.tsx\" rel=\"noreferrer\">Field source\u003c/a> uses \u003ccode>grid gap-2\u003c/code>; use that 8px label/control rhythm and Kumo's native label support for compound widgets.\u003c/li>\n\u003cli>\u003ca h
