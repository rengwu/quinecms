<script type="application/json" id="wiki-data">{"title":"lean-sitebuilder","pages":[{"id":"index","title":"lean-sitebuilder","section":"Overview","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: lean-sitebuilder\nupdated: 2026-10-06\nstatus: Accepted\n---\n# lean-sitebuilder\n\nImplemented: [searchable block library](features/block-library.md), with 45 base layouts, 27 generic counterparts, repeatable content/schema lists, collection mappings, native forms and shared header/footer. [Implementation journal](journal/2026-10-06-block-library-implementation.md) and [verification report](verification/runs/2026-10-06T1320Z-block-library.md).\n\nLatest refinement: [catalog dialog polish](verification/runs/2026-10-06T0619Z-catalog-polish.md), with one scrolling body, a single-line tag strip, a persistent Reset control, smaller cards and a top-right close icon.\n\nSortable lists now use [optimistic FLIP motion inspired by Chartr](verification/runs/2026-10-06T0845Z-sortable-flip.md): direct vertical carrying, animated neighbors, edge scrolling and commit on release anywhere. Website preview order changes only after release.\n\nCurrent design: [generic pages and schema-only entries](journal/2026-10-05-generic-pages-discussion.md). DEC-058–DEC-073 revise the collection/page model described by the existing implementation below. Reconciliation through grill-form is complete; the user authorized implementation on 2026-10-06. See [the implementation and verification](verification/runs/2026-10-05T1650Z-generic-pages.md).\n\n[Round-one template decisions](journal/2026-10-05-generic-pages-round-one.md) and [submitted answers](journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0.md) resolve Q48–Q55. [Round-two decisions](journal/2026-10-05-generic-pages-round-two.md) and [submitted answers](journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b.md) resolve Q56–Q59. The interview itself changed only records; the subsequent implementation is documented in the [implementation journal](journal/2026-10-06-generic-pages-implementation.md).\n\nA Git-backed static site builder with the public website, visual admin editor, block code, and content in one repository and deployment. It replaces the always-running Payload CMS used by astro-payload. The first application implementation is present. Automated checks and the admin startup repair pass; live provider behavior remains unverified.\n\nThe first round established nontechnical editors, page sections with defined controls, reusable content collections, shared block dependencies, and GitHub-based draft/publish workflows. Save commits to an unpublished branch; Publish merges that branch to main and triggers deployment. The new core and starter blocks are fresh; astro-payload is reference material.\n\nThe editor login is a convenience gate. Each editor supplies their own GitHub token; both public and private site repositories are supported. The browser uses a GitHub SDK to save and merge; the user's Netlify integration deploys main. Pages use the block editor; entries contain schema fields and optionally render through a collection-assigned generic page. Every block supports immediate browser preview, and new block types are developer-installed with a rebuild.\n\nGitHub tokens persist for the tab session. Collections support developer-defined schemas and portal field editing. Shared drafts use stale-save protection with plain-language recovery. Media lives in Cloudflare R2, with URLs in Git. Blocks own their styling and may follow optional global settings such as dark/light mode.\n\nR2 credentials are entered at runtime. The collection editor supports basic fields and safe changes, with explicit static indexes and optional generic entry templates. Image uploads generate simple resized and lightly compressed variants; media URLs may be public before page publication. The interview is complete; the initial implementation is recorded in the feature map.\n\n- [Persistent admin sidebar](verification/runs/2026-10-05T1725Z-admin-navigation.md)\n- [Shared content width and development reloads](verification/runs/2026-10-05T1735Z-content-width.md)\n- [Standard admin content width](verification/runs/2026-10-05T1750Z-admin-width.md)\n- [Table rows and consistent Back labels](verification/runs/2026-10-05T1752Z-page-row.md)\n- [Site typography and page gutter](verification/runs/2026-10-05T1810Z-site-design.md)\n- [Feature map](features/index.md)\n- [Verification setup](verification/setup.md)\n- [Initial implementation run](verification/runs/2026-10-05T0819Z-implementation.md)\n- [Admin startup repair](verification/runs/2026-10-05T0910Z-admin-startup.md)\n- [Kumo admin refinement](verification/runs/2026-10-05T1005Z-kumo-admin.md)\n- [Implementation journal](journal/2026-10-05-implementation.md)\n- [Accepted decisions](decisions/index.md)\n- [Agreed design](discussions/agreed-design.md)\n- [Open questions](discussions/open-questions.md)\n- [Admin hierarchy implementation and Home navigation](verification/runs/2026-10-05T1054Z-admin-hierarchy.md)\n- [Admin hierarchy implementation journal](journal/2026-10-05-admin-hierarchy-implementation.md)\n- [Editor layout rules and research](journal/2026-10-05-editor-layout.md)\n- [Editor layout verification](verification/runs/2026-10-05T1108Z-editor-layout.md)\n- [Pages table hierarchy](verification/runs/2026-10-05T1124Z-page-list.md)\n- [Page-only preview and standard admin views](verification/runs/2026-10-05T1303Z-admin-views.md)\n- [Accepted admin hierarchy design](discussions/admin-hierarchy-proposal.md)\n- [Admin hierarchy research journal](journal/2026-10-05-admin-hierarchy-research.md)\n- [Admin hierarchy decisions](journal/2026-10-05-admin-hierarchy-decisions.md)\n- [Submitted admin hierarchy answers](journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4.md)\n ion/runs/2026-10-06T0619Z-catalog-polish","verification/runs/2026-10-06T0845Z-sortable-flip","journal/2026-10-05-generic-pages-discussion","verification/runs/2026-10-05T1650Z-generic-pages","journal/2026-10-05-generic-pages-round-one","journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0","journal/2026-10-05-generic-pages-round-two","journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b","journal/2026-10-06-generic-pages-implementation","verification/runs/2026-10-05T1725Z-admin-navigation","verification/runs/2026-10-05T1735Z-content-width","verification/runs/2026-10-05T1750Z-admin-width","verification/runs/2026-10-05T1752Z-page-row","verification/runs/2026-10-05T1810Z-site-design","features/index","verification/setup","verification/runs/2026-10-05T0819Z-implementation","verification/runs/2026-10-05T0910Z-admin-startup","verification/runs/2026-10-05T1005Z-kumo-admin","journal/2026-10-05-implementation","decisions/index","discussions/agreed-design","discussions/open-questions","verification/runs/2026-10-05T1054Z-admin-hierarchy","journal/2026-10-05-admin-hierarchy-implementation","journal/2026-10-05-editor-layout","verification/runs/2026-10-05T1108Z-editor-layout","verification/runs/2026-10-05T1124Z-page-list","verification/runs/2026-10-05T1303Z-admin-views","discussions/admin-hierarchy-proposal","journal/2026-10-05-admin-hierarchy-research","journal/2026-10-05-admin-hierarchy-decisions","journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4","discussions/technical-contracts","journal/2026-10-05-round-one-decisions","journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","journal/2026-10-05-round-two-decisions","journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","journal/2026-10-05-round-three-decisions","journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","journal/2026-10-05-round-four-decisions","journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","journal/2026-10-05-technical-foundations","journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275","journal/2026-10-05-content-block-contracts","journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134","journal/2026-10-05-editor-saving","journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc"],"attachments":[],"html":"\u003cp>Implemented: \u003ca href=\"#/features/block-library\">searchable block library\u003c/a>, with 45 base layouts, 27 generic counterparts, repeatable content/schema lists, collection mappings, native forms and shared header/footer. \u003ca href=\"#/journal/2026-10-06-block-library-implementation\">Implementation journal\u003c/a> and \u003ca href=\"#/verification/runs/2026-10-06T1320Z-block-library\">verification report\u003c/a>.\u003c/p>\n\u003cp>Latest refinement: \u003ca href=\"#/verification/runs/2026-10-06T0619Z-catalog-polish\">catalog dialog polish\u003c/a>, with one scrolling body, a single-line tag strip, a persistent Reset control, smaller cards and a top-right close icon.\u003c/p>\n\u003cp>Sortable lists now use \u003ca href=\"#/verification/runs/2026-10-06T0845Z-sortable-flip\">optimistic FLIP motion inspired by Chartr\u003c/a>: direct vertical carrying, animated neighbors, edge scrolling and commit on release anywhere. Website preview order changes only after release.\u003c/p>\n\u003cp>Current design: \u003ca href=\"#/journal/2026-10-05-generic-pages-discussion\">generic pages and schema-only entries\u003c/a>. DEC-058–DEC-073 revise the collection/page model described by the existing implementation below. Reconciliation through grill-form is complete; the user authorized implementation on 2026-10-06. See \u003ca href=\"#/verification/runs/2026-10-05T1650Z-generic-pages\">the implementation and verification\u003c/a>.\u003c/p>\n\u003cp>\u003ca href=\"#/journal/2026-10-05-generic-pages-round-one\">Round-one template decisions\u003c/a> and \u003ca href=\"#/journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0\">submitted answers\u003c/a> resolve Q48–Q55. \u003ca href=\"#/journal/2026-10-05-generic-pages-round-two\">Round-two decisions\u003c/a> and \u003ca href=\"#/journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b\">submitted answers\u003c/a> resolve Q56–Q59. The interview itself changed only records; the subsequent implementation is documented in the \u003ca href=\"#/journal/2026-10-06-generic-pages-implementation\">implementation journal\u003c/a>.\u003c/p>\n\u003cp>A Git-backed static site builder with the public website, visual admin editor, block code, and content in one repository and deployment. It replaces the always-running Payload CMS used by astro-payload. The first application implementation is present. Automated checks and the admin startup repair pass; live provider behavior remains unverified.\u003c/p>\n\u003cp>The first round established nontechnical editors, page sections with defined controls, reusable content collections, shared block dependencies, and GitHub-based draft/publish workflows. Save commits to an unpublished branch; Publish merges that branch to main and triggers deployment. The new core and starter blocks are fresh; astro-payload is reference material.\u003c/p>\n\u003cp>The editor login is a convenience gate. Each editor supplies their own GitHub token; both public and private site repositories are supported. The browser uses a GitHub SDK to save and merge; the user's Netlify integration deploys main. Pages use the block editor; entries contain schema fields and optionally render through a collection-assigned generic page. Every block supports immediate browser preview, and new block types are developer-installed with a rebuild.\u003c/p>\n\u003cp>GitHub tokens persist for the tab session. Collections support developer-defined schemas and portal field editing. Shared drafts use stale-save protection with plain-language recovery. Media lives in Cloudflare R2, with URLs in Git. Blocks own their styling and may follow optional global settings such as dark/light mode.\u003c/p>\n\u003cp>R2 credentials are entered at runtime. The collection editor supports basic fields and safe changes, with explicit static indexes and optional generic entry templates. Image uploads generate simple resized and lightly compressed variants; media URLs may be public before page publication. The interview is complete; the initial implementation is recorded in the feature map.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1725Z-admin-navigation\">Persistent admin sidebar\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1735Z-content-width\">Shared content width and development reloads\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1750Z-admin-width\">Standard admin content width\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1752Z-page-row\">Table rows and consistent Back labels\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1810Z-site-design\">Site typography and page gutter\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/features/index\">Feature map\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/setup\">Verification setup\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T0819Z-implementation\">Initial implementation run\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T0910Z-admin-startup\">Admin startup repair\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1005Z-kumo-admin\">Kumo admin refinement\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-implementation\">Implementation journal\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/decisions/index\">Accepted decisions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/discussions/agreed-design\">Agreed design\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/discussions/open-questions\">Open questions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1054Z-admin-hierarchy\">Admin hierarchy implementation and Home navigation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-admin-hierarchy-implementation\">Admin hierarchy implementation journal\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-editor-layout\">Editor layout rules and research\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1108Z-editor-layout\">Editor layout verification\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1124Z-page-list\">Pages table hierarchy\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/verification/runs/2026-10-05T1303Z-admin-views\">Page-only preview and standard admin views\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/discussions/admin-hierarchy-proposal\">Accepted admin hierarchy design\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-admin-hierarchy-research\">Admin hierarchy research journal\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-admin-hierarchy-decisions\">Admin hierarchy decisions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4\">Submitted admin hierarchy answers\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>The technical interview has selected Astro/TypeScript, a React editor, separate JSON content files, a small field model, shared rendering source, and a single-document preview. The technical interview is complete. The \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a> specify generated vendor modules, stable-ID JSON records, Markdown authoring, retained block versions, rendering interfaces, scoped styles, session recovery, and atomic draft saves with publication validation. Untested engineering recommendations are labeled separately.\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-round-one-decisions\">Round-one interpretation\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02\">Submitted round-one answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-round-two-decisions\">Round-two interpretation\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2\">Submitted round-two answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-round-three-decisions\">Round-three interpretation\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59\">Submitted round-three answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-round-four-decisions\">Round-four interpretation\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa\">Submitted round-four answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-technical-foundations\">Technical foundations\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275\">Submitted technical-round-one answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-content-block-contracts\">Content and block contract decisions\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134\">Submitted technical-round-two answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-editor-saving\">Editor and saving decisions\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc\">Submitted technical-round-three answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003c/ul>\n","backlinks":[]},{"id":"decisions/index","title":"Decisions","section":"Decisions","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Decisions\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Decisions\n\nAccepted on 2026-10-05 from the original request and [round-one answers](../journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02.md). See the [interpretation journal](../journal/2026-10-05-round-one-decisions.md) and [remaining questions](../discussions/open-questions.md). These are intended requirements, not implemented features.\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-001 | Keep the public website, static admin editor, blocks, and content records in one Git repository and deployment. Remove the always-running Payload CMS dependency. | Original request: lightweight, durable ownership with Git as the source of content. Q18 later explicitly places media files in R2; see DEC-019. |\n| DEC-002 | Support GitHub first; require a user-supplied Git token for submissions. Provide editor entry using an environment-configured credential. | Q1 custom answer. DEC-009–DEC-012 clarify access/deployment; DEC-016 sets token retention. No custom auth helper is required. |\n| DEC-003 | Design the first release for nontechnical clients and site owners. | Q2: editor usability must cover people without a developer workflow. |\n| DEC-004 | Include pages, navigation, site settings, media, and blog posts or other repeatable content collections. | Q3 selected the collections-inclusive scope. A general visual schema builder has not been requested. |\n| DEC-005 | Allow blocks from multiple frameworks subject to declared dependencies and compatible shared library versions. | Original request and Q4: deduplicate compatible shared runtimes per page; different frameworks still have distinct runtimes. |\n| DEC-006 | Reorder page sections and edit each block's defined fields and design controls, with a side drawer and live preview. | Original request and Q5. Nested layout construction and arbitrary element positioning are outside the selected initial scope. |\n| DEC-007 | Save creates commits on an unpublished draft branch. Publish merges that draft branch into main and then deploys. | Q6 custom answer: saving and going live are separate actions; publishing applies the branch's accumulated changes. |\n| DEC-008 | Build a fresh core and entirely new starter blocks. Use astro-payload as reference only. | Q7: no migration compatibility or block porting commitment. |\n\n## Round two — 2026-10-05\n\nAccepted from [round-two answers](../journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2.md); see the [interpretation](../journal/2026-10-05-round-two-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-009 | The environment-configured login is a convenience gate; GitHub authorization protects repository access. | Q8 explicitly accepts the static gate's limits. It must not be described as protection for private resources. |\n| DEC-010 | Support both private and public site repositories. | Q9. Private draft reads require GitHub authorization; public repository drafts are public. Netlify hosting does not change repository visibility. |\n| DEC-011 | Each editor supplies their own GitHub token. | Q10. DEC-016 sets token retention; no tokens belong in the deployed bundle or planning records. |\n| DEC-012 | Use a browser GitHub SDK client for repository changes. Publish merges to main; the user's existing Netlify Git integration owns deployment. | Q11 custom answer. No builder-managed deployment service or Netlify API integration is requested. Schema authoring is subsequently defined in DEC-017 and DEC-022. |\n| DEC-013 | Posts and collection entries use the same block editor as pages, alongside structured metadata. | Q12. |\n| DEC-014 | Every block must support immediate browser preview of unsaved changes. | Q13. Shared rendering logic is preferred where feasible; preview/published parity must be verified during implementation. |\n| DEC-015 | Developers install and register new block types in source, followed by a rebuild. | Q14. Adding instances of existing blocks remains an editor action. No portal block marketplace is required. |\n\n## Round three — 2026-10-05\n\nAccepted from [round-three answers](../journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59.md); see the [interpretation](../journal/2026-10-05-round-three-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-016 | Retain the editor's GitHub token for the browser tab's session, including reloads. | Q15. Session retention is intended; persistent device-wide remembering was not selected. |\n| DEC-017 | Support developer-defined schemas and allow users to create collections and edit collection fields in the portal. | Q16 selects option 2 and notes “1 and 2.” Visual editing of block field definitions was not selected; DEC-022 narrows the collection editor. |\n| DEC-018 | Use shared drafts with stale-save protection and a simple recovery flow. | Q17 accepts manual reapplication but stresses nontechnical users. Preserve unsaved work, prevent silent overwrites, and explain recovery in plain language. No Git conflict editor or live collaboration is required; freedom from all concurrent changes cannot be guaranteed. |\n| DEC-019 | Store media in Cloudflare R2; Git content references media URLs. | Q18 custom answer supersedes the earlier in-repository upload proposal. The accompanying request for environment-based upload credentials is superseded by runtime credentials in DEC-021; DEC-024 defines upload processing. |\n| DEC-020 | Blocks primarily own their styling. Expose optional global variables/settings such as dark/light mode; each block decides whether to follow them. | Q19 selected shared defaults with overrides and explicitly made adherence optional. A mandatory shared theme is not required. |\n\n## Round four — 2026-10-05\n\nAccepted from [round-four answers](../journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa.md); see the [interpretation](../journal/2026-10-05-round-four-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-021 | Supply R2 upload credentials in the editor at runtime, preserving the entirely static application. | Q20. This replaces the earlier request to provide upload secrets through build environment variables. Public bucket configuration may still use environment settings. No secret-holding upload helper is required. |\n| DEC-022 | Start with basic text, number, date, toggle, select, and media fields, with safe schema changes only. | Q21. Support additions and label/default edits; avoid destructive changes to populated fields. Nested models, relations, and migration tooling are outside the selected first-release scope. |\n| DEC-023 | Generate standard listing and entry pages automatically for collections created through the portal. | Q22. Entry bodies use the block editor. A portal template designer is not required initially. |\n| DEC-024 | Automatically produce a web-optimized image set from sufficiently large uploads, using resizing and light compression with simple methods. | Q23 selection and notes. This extends original-file media uploads with image processing; it does not request a Next.js image server or audio/video transcoding. Exact widths, encodings, quality, and limits are implementation choices. |\n| DEC-025 | Media URLs may be publicly accessible immediately after upload, before the referencing page is published. | Q24. Page publication remains governed by the Git draft/main workflow; private draft-media promotion is unnecessary. |\n\n## Technical foundations — 2026-10-05\n\nAccepted from [technical-round-one answers](../journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275.md); see the [interpretation](../journal/2026-10-05-technical-foundations.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-026 | Use Astro with TypeScript as the public site's static build foundation. | Q25. |\n| DEC-027 | Use React with TypeScript for the admin drawer and CMS screens. | Q26. Blocks retain their independent framework choice. |\n| DEC-028 | Store structured content and definitions as JSON. | Q27. |\n| DEC-029 | Use separate files per page, entry, and definition. | Q28. DEC-036 subsequently selects permanent-ID filenames; concrete records are defined in the technical contracts. |\n| DEC-030 | Use a small purpose-built, serializable field model. | Q29. The agreed basic collection field set remains in force. |\n| DEC-031 | Share rendering source between published output and preview by default; separate implementations require parity checks. | Q30. No requirement to make build-only templates magically browser-renderable. |\n| DEC-032 | Keep editor and preview in one document, scope their styles, and share runtimes. | Q31. No iframe exception to runtime sharing is selected. |\n| DEC-033 | Offer built-in field controls and optional custom widgets. | Q32. The technical contracts define the React custom-widget interface; implementation remains unverified. |\n| DEC-034 | Serve shared block libraries as registered static vendor assets, minified where practical; avoid duplicate compatible framework/library versions. | Q30 custom suggestion reinforces DEC-005. Package/version examples in the answer are illustrative, not version pins. DEC-035 subsequently selects build-generated shared assets. |\n\n## Content and block contracts — 2026-10-05\n\nAccepted from [technical-round-two answers](../journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134.md); see the [interpretation](../journal/2026-10-05-content-block-contracts.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-035 | The build generates self-hosted shared vendor modules. | Q33 settles the mechanism left open in DEC-034. Keep compatible dependencies shared and minified where practical. |\n| DEC-036 | Use permanent IDs for document filenames, with editable public paths/slugs inside. | Q34. Content identity does not change when a URL changes. |\n| DEC-037 | Store formatted block prose as Markdown strings inside JSON props. | Q35. This does not enable executable MDX or arbitrary scripts. DEC-046 subsequently selects visual formatting controls. |\n| DEC-038 | Retain deprecated block implementations alongside newer versions and expose a version selector. | Q36 custom answer. Users manually switch and fill unmatched/new/renamed/incompatible fields, which start empty. Preserve directly compatible fields; do not infer renamed-field mappings. Explicit automated migration functions were not selected. |\n| DEC-039 | Use framework adapters with mount/update/destroy for browser preview. | Q37. Normal framework components use adapters; custom/vanilla blocks implement the shared lifecycle. |\n| DEC-040 | Block authors declare never/visible/idle/load public activation behavior. | Q38. Immediate editor preview is separate from public activation timing. |\n| DEC-041 | Use stable IDs for internal content/media references, and URLs for external resources. | Q39. Resolve references when rendering output. |\n\n## Editor and saving — 2026-10-05\n\nAccepted from [technical-round-three answers](../journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc.md); see the [interpretation](../journal/2026-10-05-editor-saving.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-042 | Original choice: Base UI with CSS Modules for the React editor. **Superseded by DEC-048.** | Q40. Preserved as interview history; grill-form stays native HTML. |\n| DEC-043 | Use CSS Modules or framework-scoped styles for blocks. | Q41. Shared shell owns global styles; block styles must not leak into the editor or other blocks. |\n| DEC-044 | Save all pending editor changes in one draft commit. | Q42. Related page, schema, navigation, and media metadata changes persist together. |\n| DEC-045 | Recover unsaved edits within the tab session, including reloads. | Q43. This does not select indefinite device-wide recovery or storing binary uploads. |\n| DEC-046 | Provide visual formatting controls that save Markdown. | Q44. Keep the supported formatting set small and round-trip it consistently. |\n| DEC-047 | Save incomplete drafts; require valid required content and references before Publish. | Q45. Structural corruption is still rejected. Newly empty fields after a version switch may be saved for later completion. |\n\n## Admin refinement — 2026-10-05\n\nAccepted directly from the user's implementation feedback.\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-048 | Use Cloudflare Kumo for all admin UI controls, dialogs, and notifications. | Replaces DEC-042. Keep its styling scoped to admin surfaces so preview blocks retain their designs. |\n| DEC-049 | Keep the live preview interactive at all times and sort block rows by dragging. | Remove Interact/Edit blocks toggle and visible up/down buttons. Keyboard sorting remains available for accessibility. |\n| DEC-050 | Recover silently and show validation errors in toasts on submission. | Remove saved/local/unsaved status text, recovery banners, and the proactive publication issue list. Save/Publish validation rules remain unchanged. |\n| DEC-051 | Opening a block replaces parent-level sidebar navigation with the block editor. | Direct UI feedback: hide tabs, page/entry selector and Add page; All blocks returns to the parent view. |\n\n## Admin hierarchy choices — 2026-10-05\n\nAccepted from [Q46–Q47](../journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4.md). See the [design](../discussions/admin-hierarchy-proposal.md) and [interpretation](../journal/2026-10-05-admin-hierarchy-decisions.md). Implementation is recorded in the [admin hierarchy run](../verification/runs/2026-10-05T1054Z-admin-hierarchy.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-052 | Place a compact, borderless + Add block action beside the Blocks heading, aligned right. Remove the list-footer action. | Q46 selects header placement to distinguish the action from draggable block rows. A visible label remains alongside the plus icon. Affects [visual editing](../features/editor.md). |\n| DEC-053 | Provide separate top-level Content and Collection schemas areas for collection entry authoring and schema editing. | Q47 selects alternative B over the recommended A and per-collection tabs. Content browses collections and edits entry values/bodies; Collection schemas edits model definitions. This makes the two tasks explicit and keeps their controls out of one another's views. Affects [visual editing](../features/editor.md); shared Save draft/Publish and safe schema changes remain in force. |\n\n## Home navigation — 2026-10-05\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-054 | Put Pages, Content, Collection schemas, Media and Site on a separate Home menu screen, outside the editing sidebar. | Direct implementation feedback rejected the sidebar destination grid and requested another nesting level. Each area returns to Home; nested collection, entry, field and block screens return to their immediate parent. Affects [visual editing](../features/editor.md). |\n\n## Editor layout consistency — 2026-10-05\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-055 | Apply a shared layout standard across admin forms, custom widgets, sections and action groups. | Direct feedback identified inconsistent Design, Media and Site layouts and requested research into sidebar editors and Kumo. The [research and implemented layout contract](../journal/2026-10-05-editor-layout.md) distinguish the user's requirement from our specific spacing choices. Kumo continues to own all controls. |\n\n## Pages overview — 2026-10-05\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-056 | Add a Pages table between Home and an individual page editor. | Direct feedback requested one more hierarchy level listing all pages in a table. The overview shows titles and URL paths; opening a page enters its settings/blocks, and its back link returns to Pages. Add page belongs to the overview. See [visual editing](../features/editor.md). |\n\n## Preview scope — 2026-10-05\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-057 | Show the live website preview only while editing pages and their blocks. Content, Collection schemas, Media and Site use standard admin views. | Direct instruction limits right-side rendering to Pages. Other areas use a centered, wider form/list workspace with no drawer, live rendering or preview-width control. Entry block editing and shared draft saves remain available. Home and the Pages table keep their existing overview layouts. Affects [visual editing](../features/editor.md). |\n\n## Generic pages — discussion requirements, 2026-10-05\n\nDirect requirements from the user, recorded in the [discussion journal](../journal/2026-10-05-generic-pages-discussion.md). Not implemented; follow-up choices are open.\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-058 | Collection entries contain schema-defined fields only, with no independent blocks. | Replaces the entry-block editing portion of the earlier design and DEC-057's retained entry blocks. The user distinguishes content data from its rendering layout. |\n| DEC-059 | Pages have static and generic types. Generic pages contain only registered generic blocks, not normal blocks. | Static pages hold predefined content; generic pages define reusable entry layouts. |\n| DEC-060 | Each generic-block field can optionally bind to a schema field by its parameter-name string. | The matching field supplies the selected entry's content/value. DEC-066–DEC-067 resolve missing, empty and incompatible binding behavior. |\n| DEC-061 | Each collection schema can optionally select a generic page. | Makes layout assignment a collection-level choice. DEC-062–DEC-064 resolve template sharing, entry URLs and behavior without an assignment. |\n\n## Generic pages — round one, 2026-10-05\n\nAccepted from [Q48–Q55](../journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0.md); see the [interpretation](../journal/2026-10-05-generic-pages-round-one.md). These changes are not implemented.\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-062 | Without a generic page, a collection is data-only and generates no individual entry routes. | Q48. Footer links are a motivating example, explicitly outside this implementation's scope. |\n| DEC-063 | Allow one generic page to serve multiple compatible collection schemas. | Q49. Bound field names and value types must be compatible across assigned schemas. |\n| DEC-064 | Entry URLs use collection prefix plus entry slug; generic pages have no standalone public URL. | Q50. Layout identity is independent of the collection's route. |\n| DEC-065 | A collection index route exists only when a static page occupies it; otherwise it returns 404. | Q51 custom answer rejects automatic listing generation. DEC-070–DEC-071 subsequently settle assignment mechanics and a collection-list block. |\n| DEC-066 | Missing or incompatible field bindings may be saved in drafts but prevent publication. | Q52. Fixed fallback values do not conceal invalid bindings. |\n| DEC-067 | An empty optional bound value uses the block field's fixed fallback, otherwise renders empty. | Q53. Applies to a valid binding whose entry value is empty. |\n| DEC-068 | Add visual rich-text schema fields, with uploaded images and YouTube embeds. | Q54 and custom note expand basic fields and the current formatting-only editor. DEC-072 subsequently limits the initial embed scope to these two types. |\n| DEC-069 | Generic-page previews display bound field-name placeholders. | Q55. A real-entry selector or separate sample-data authoring UI was not chosen. |\n\n## Generic pages — round two, 2026-10-05\n\nAccepted from [Q56–Q59](../journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b.md); see the [interpretation](../journal/2026-10-05-generic-pages-round-two.md). The scoped interview is complete; these changes are not implemented.\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-070 | Match a static page's URL to the collection prefix to supply its index page. | Q56. No separate index-page assignment control; the static page owns the route. |\n| DEC-071 | Include a basic collection-list block for static pages in this version. | Q57. An explicitly created index page can show collection entries without automatic index generation. Footer integration remains out of scope. |\n| DEC-072 | Limit initial rich-text embeds to uploaded images and YouTube videos. | Q58. Other providers and uploaded audio/video embeds are outside this initial rich-text scope. |\n| DEC-073 | Replace the current project's existing demo entries with completely new schema-only entries when implementing. | Q59 custom answer explicitly says the existing entries are unnecessary. No conversion/preservation workflow is required for these fixtures; this is not a general destructive migration policy. |\n\nImplementation of DEC-058–DEC-073 was authorized on 2026-10-06 and is recorded in the [generic-page implementation journal](../journal/2026-10-06-generic-pages-implementation.md).\n\n## Main navigation — 2026-10-06\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-074 | Move Pages, Content, Collection schemas, Media and Site into a persistent main sidebar. | Direct screenshot feedback replaces the Home destination menu from DEC-054. The page/block drawer remains a separate nested editor; preview scope from DEC-057 is unchanged. Defaulting to Pages, active-area highlighting and a narrow-screen Menu dialog are implementation choices. See the [implementation journal](../journal/2026-10-06-admin-navigation.md). |\n\n## Shared content width — 2026-10-06\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-075 | Content max-width is a site-wide variable that blocks are advised to follow. | Direct user instruction. Block styling remains independent; there is no forced wrapper. The 1200px default, pixel input and `--site-content-max-width` naming are implementation choices. See [static blocks](../features/static-blocks.md). |\n\n## Admin content width — 2026-10-06\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-076 | Standardize admin main content at 867px across screens. | Direct user instruction. Pages, Content, Collection schemas, Media and Site, including nested standard admin editors, share one centered maximum width and shrink on narrow viewports. See [visual editing](../features/editor.md). |\n\n## Admin action consistency — 2026-10-06\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-077 | Use ← Back for every parent-navigation button and the blue primary variant for every Add action. | Direct screenshot feedback. This supersedes the borderless Add block styling from DEC-052 while retaining its header placement. [Implementation](../journal/2026-10-06-table-and-back.md). |\n\n## Site typography and gutter — 2026-10-06\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-078 | Add site-wide body font, heading font, body font size, body line height and page gutter settings. | Direct user selection from the proposed globals. These supplement content max-width and apply to public rendering/live preview; block adoption remains advised. Section spacing, text width, palette and radius were not selected. [Implementation](../journal/2026-10-06-site-design.md). |\n\n## Block library — 2026-10-06\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-079 | Each block belongs to one theme and has multiple tags. | Direct user request, with Tailwind UI / hero / header examples. Theme denotes the block library/design family; detailed metadata mechanics remain implementation work. |\n| DEC-080 | Enlarge and redesign Add a block for searching and filtering by theme, tags and block name, with controls above a block grid. | Direct screenshot feedback anticipates a large catalog. Card preview/selection behavior remains open. |\n| DEC-081 | Adapt approximately 3–5 distinct blocks per category from the legacy TailwindBlocks library to the current system. | User requests refitting/reimplementation and working behavior, not verbatim copying. Inventory contains 15 categories and 123 variants. [Planning record](../journal/2026-10-06-block-library-plan.md); behavioral scope remains under discussion. |\n\n## Block library — round one, 2026-10-06\n\nAccepted from [Q60–Q65](../journal/2026-10-05-grill-821c1394-1fd0-47f5-a950-f71d9c006099.md); [interpretation and references](../journal/2026-10-06-block-library-round-one.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-082 | The block card's primary action adds immediately; Preview is a separate action. | Q60 rejects preview-before-add as the default click behavior. |\n| DEC-083 | Include useful generic counterparts with the static block import now. | Q61; retain the distinction between fixed page content and schema-bound generic layouts. |\n| DEC-084 | Repeated block content supports adding, removing and reordering items. | Q62 selects editable lists over fixed item slots. Whether collection schemas also gain list fields remains Q67. |\n| DEC-085 | Blog blocks populate cards from collection entries using field mappings. | Q63 selects collection data rather than duplicate manually authored article cards. |\n| DEC-086 | Contact and newsletter forms submit to an editor-configured external endpoint. | Q64; an actual destination is required for publication, with delivery handled outside the static builder. |\n| DEC-087 | Footer layouts are configured once as a shared site-wide footer. | Q65 rejects ordinary per-page footers. Shared header/navigation remains Q66. |\n| DEC-088 | Use TDCX, Accenture, ASML, Couchbase, Convex and Source Network as capability/design benchmarks. | Direct user clarification of the desired range of sites. This does not independently select exact reproduction, every animation, or new backend integrations. |\n\n## Block library — round two, 2026-10-06\n\nAccepted from [Q66–Q68](../journal/2026-10-06-grill-d9dd6be8-d154-41d3-a042-1d645992c592.md); see the [round-two interpretation](../journal/2026-10-06-block-library-round-two.md) and [consolidated scope](../discussions/block-library.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-089 | Add a shared configurable header with grouped navigation in this pass. | Q66 selects shared header/navigation now, alongside the shared footer from DEC-087. |\n| DEC-090 | Add structured list fields to collection schemas and compatible list bindings in generic blocks. | Q67 extends the earlier scalar/rich-text field contract. Initial rows use existing field types; unrestricted recursive nesting is outside this selected increment. |\n| DEC-091 | Block authoring edits content only; appearance comes from the block theme and site settings. | Q68 rejects the proposed per-block Design controls. New theme blocks should not expose arbitrary color, spacing, alignment or CSS override panels. Shared site typography/width/gutter remain available. |\n","toc":[{"id":"round-two-2026-10-05","title":"Round two — 2026-10-05","depth":2},{"id":"round-three-2026-10-05","title":"Round three — 2026-10-05","depth":2},{"id":"round-four-2026-10-05","title":"Round four — 2026-10-05","depth":2},{"id":"technical-foundations-2026-10-05","title":"Technical foundations — 2026-10-05","depth":2},{"id":"content-and-block-contracts-2026-10-05","title":"Content and block contracts — 2026-10-05","depth":2},{"id":"editor-and-saving-2026-10-05","title":"Editor and saving — 2026-10-05","depth":2},{"id":"admin-refinement-2026-10-05","title":"Admin refinement — 2026-10-05","depth":2},{"id":"admin-hierarchy-choices-2026-10-05","title":"Admin hierarchy choices — 2026-10-05","depth":2},{"id":"home-navigation-2026-10-05","title":"Home navigation — 2026-10-05","depth":2},{"id":"editor-layout-consistency-2026-10-05","title":"Editor layout consistency — 2026-10-05","depth":2},{"id":"pages-overview-2026-10-05","title":"Pages overview — 2026-10-05","depth":2},{"id":"preview-scope-2026-10-05","title":"Preview scope — 2026-10-05","depth":2},{"id":"generic-pages-discussion-requirements-2026-10-05","title":"Generic pages — discussion requirements, 2026-10-05","depth":2},{"id":"generic-pages-round-one-2026-10-05","title":"Generic pages — round one, 2026-10-05","depth":2},{"id":"generic-pages-round-two-2026-10-05","title":"Generic pages — round two, 2026-10-05","depth":2},{"id":"main-navigation-2026-10-06","title":"Main navigation — 2026-10-06","depth":2},{"id":"shared-content-width-2026-10-06","title":"Shared content width — 2026-10-06","depth":2},{"id":"admin-content-width-2026-10-06","title":"Admin content width — 2026-10-06","depth":2},{"id":"admin-action-consistency-2026-10-06","title":"Admin action consistency — 2026-10-06","depth":2},{"id":"site-typography-and-gutter-2026-10-06","title":"Site typography and gutter — 2026-10-06","depth":2},{"id":"block-library-2026-10-06","title":"Block library — 2026-10-06","depth":2},{"id":"block-library-round-one-2026-10-06","title":"Block library — round one, 2026-10-06","depth":2},{"id":"block-library-round-two-2026-10-06","title":"Block library — round two, 2026-10-06","depth":2}],"titleAnchor":"decisions","links":["journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","journal/2026-10-05-round-one-decisions","discussions/open-questions","journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","journal/2026-10-05-round-two-decisions","journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","journal/2026-10-05-round-three-decisions","journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","journal/2026-10-05-round-four-decisions","journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275","journal/2026-10-05-technical-foundations","journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134","journal/2026-10-05-content-block-contracts","journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc","journal/2026-10-05-editor-saving","journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4","discussions/admin-hierarchy-proposal","journal/2026-10-05-admin-hierarchy-decisions","verification/runs/2026-10-05T1054Z-admin-hierarchy","features/editor","features/editor","features/editor","journal/2026-10-05-editor-layout","features/editor","features/editor","journal/2026-10-05-generic-pages-discussion","journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0","journal/2026-10-05-generic-pages-round-one","journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b","journal/2026-10-05-generic-pages-round-two","journal/2026-10-06-generic-pages-implementation","journal/2026-10-06-admin-navigation","features/static-blocks","features/editor","journal/2026-10-06-table-and-back","journal/2026-10-06-site-design","journal/2026-10-06-block-library-plan","journal/2026-10-05-grill-821c1394-1fd0-47f5-a950-f71d9c006099","journal/2026-10-06-block-library-round-one","journal/2026-10-06-grill-d9dd6be8-d154-41d3-a042-1d645992c592","journal/2026-10-06-block-library-round-two","discussions/block-library"],"attachments":[],"html":"\u003cp>Accepted on 2026-10-05 from the original request and \u003ca href=\"#/journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02\">round-one answers\u003c/a>. See the \u003ca href=\"#/journal/2026-10-05-round-one-decisions\">interpretation journal\u003c/a> and \u003ca href=\"#/discussions/open-questions\">remaining questions\u003c/a>. These are intended requirements, not implemented features.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-001\u003c/td>\n\u003ctd>Keep the public website, static admin editor, blocks, and content records in one Git repository and deployment. Remove the always-running Payload CMS dependency.\u003c/td>\n\u003ctd>Original request: lightweight, durable ownership with Git as the source of content. Q18 later explicitly places media files in R2; see DEC-019.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-002\u003c/td>\n\u003ctd>Support GitHub first; require a user-supplied Git token for submissions. Provide editor entry using an environment-configured credential.\u003c/td>\n\u003ctd>Q1 custom answer. DEC-009–DEC-012 clarify access/deployment; DEC-016 sets token retention. No custom auth helper is required.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-003\u003c/td>\n\u003ctd>Design the first release for nontechnical clients and site owners.\u003c/td>\n\u003ctd>Q2: editor usability must cover people without a developer workflow.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-004\u003c/td>\n\u003ctd>Include pages, navigation, site settings, media, and blog posts or other repeatable content collections.\u003c/td>\n\u003ctd>Q3 selected the collections-inclusive scope. A general visual schema builder has not been requested.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-005\u003c/td>\n\u003ctd>Allow blocks from multiple frameworks subject to declared dependencies and compatible shared library versions.\u003c/td>\n\u003ctd>Original request and Q4: deduplicate compatible shared runtimes per page; different frameworks still have distinct runtimes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-006\u003c/td>\n\u003ctd>Reorder page sections and edit each block's defined fields and design controls, with a side drawer and live preview.\u003c/td>\n\u003ctd>Original request and Q5. Nested layout construction and arbitrary element positioning are outside the selected initial scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-007\u003c/td>\n\u003ctd>Save creates commits on an unpublished draft branch. Publish merges that draft branch into main and then deploys.\u003c/td>\n\u003ctd>Q6 custom answer: saving and going live are separate actions; publishing applies the branch's accumulated changes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-008\u003c/td>\n\u003ctd>Build a fresh core and entirely new starter blocks. Use astro-payload as reference only.\u003c/td>\n\u003ctd>Q7: no migration compatibility or block porting commitment.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-two-2026-10-05\">Round two — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2\">round-two answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-two-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-009\u003c/td>\n\u003ctd>The environment-configured login is a convenience gate; GitHub authorization protects repository access.\u003c/td>\n\u003ctd>Q8 explicitly accepts the static gate's limits. It must not be described as protection for private resources.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-010\u003c/td>\n\u003ctd>Support both private and public site repositories.\u003c/td>\n\u003ctd>Q9. Private draft reads require GitHub authorization; public repository drafts are public. Netlify hosting does not change repository visibility.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-011\u003c/td>\n\u003ctd>Each editor supplies their own GitHub token.\u003c/td>\n\u003ctd>Q10. DEC-016 sets token retention; no tokens belong in the deployed bundle or planning records.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-012\u003c/td>\n\u003ctd>Use a browser GitHub SDK client for repository changes. Publish merges to main; the user's existing Netlify Git integration owns deployment.\u003c/td>\n\u003ctd>Q11 custom answer. No builder-managed deployment service or Netlify API integration is requested. Schema authoring is subsequently defined in DEC-017 and DEC-022.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-013\u003c/td>\n\u003ctd>Posts and collection entries use the same block editor as pages, alongside structured metadata.\u003c/td>\n\u003ctd>Q12.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-014\u003c/td>\n\u003ctd>Every block must support immediate browser preview of unsaved changes.\u003c/td>\n\u003ctd>Q13. Shared rendering logic is preferred where feasible; preview/published parity must be verified during implementation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-015\u003c/td>\n\u003ctd>Developers install and register new block types in source, followed by a rebuild.\u003c/td>\n\u003ctd>Q14. Adding instances of existing blocks remains an editor action. No portal block marketplace is required.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-three-2026-10-05\">Round three — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59\">round-three answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-three-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-016\u003c/td>\n\u003ctd>Retain the editor's GitHub token for the browser tab's session, including reloads.\u003c/td>\n\u003ctd>Q15. Session retention is intended; persistent device-wide remembering was not selected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-017\u003c/td>\n\u003ctd>Support developer-defined schemas and allow users to create collections and edit collection fields in the portal.\u003c/td>\n\u003ctd>Q16 selects option 2 and notes “1 and 2.” Visual editing of block field definitions was not selected; DEC-022 narrows the collection editor.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-018\u003c/td>\n\u003ctd>Use shared drafts with stale-save protection and a simple recovery flow.\u003c/td>\n\u003ctd>Q17 accepts manual reapplication but stresses nontechnical users. Preserve unsaved work, prevent silent overwrites, and explain recovery in plain language. No Git conflict editor or live collaboration is required; freedom from all concurrent changes cannot be guaranteed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-019\u003c/td>\n\u003ctd>Store media in Cloudflare R2; Git content references media URLs.\u003c/td>\n\u003ctd>Q18 custom answer supersedes the earlier in-repository upload proposal. The accompanying request for environment-based upload credentials is superseded by runtime credentials in DEC-021; DEC-024 defines upload processing.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-020\u003c/td>\n\u003ctd>Blocks primarily own their styling. Expose optional global variables/settings such as dark/light mode; each block decides whether to follow them.\u003c/td>\n\u003ctd>Q19 selected shared defaults with overrides and explicitly made adherence optional. A mandatory shared theme is not required.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-four-2026-10-05\">Round four — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa\">round-four answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-four-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-021\u003c/td>\n\u003ctd>Supply R2 upload credentials in the editor at runtime, preserving the entirely static application.\u003c/td>\n\u003ctd>Q20. This replaces the earlier request to provide upload secrets through build environment variables. Public bucket configuration may still use environment settings. No secret-holding upload helper is required.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-022\u003c/td>\n\u003ctd>Start with basic text, number, date, toggle, select, and media fields, with safe schema changes only.\u003c/td>\n\u003ctd>Q21. Support additions and label/default edits; avoid destructive changes to populated fields. Nested models, relations, and migration tooling are outside the selected first-release scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-023\u003c/td>\n\u003ctd>Generate standard listing and entry pages automatically for collections created through the portal.\u003c/td>\n\u003ctd>Q22. Entry bodies use the block editor. A portal template designer is not required initially.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-024\u003c/td>\n\u003ctd>Automatically produce a web-optimized image set from sufficiently large uploads, using resizing and light compression with simple methods.\u003c/td>\n\u003ctd>Q23 selection and notes. This extends original-file media uploads with image processing; it does not request a Next.js image server or audio/video transcoding. Exact widths, encodings, quality, and limits are implementation choices.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-025\u003c/td>\n\u003ctd>Media URLs may be publicly accessible immediately after upload, before the referencing page is published.\u003c/td>\n\u003ctd>Q24. Page publication remains governed by the Git draft/main workflow; private draft-media promotion is unnecessary.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"technical-foundations-2026-10-05\">Technical foundations — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275\">technical-round-one answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-technical-foundations\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-026\u003c/td>\n\u003ctd>Use Astro with TypeScript as the public site's static build foundation.\u003c/td>\n\u003ctd>Q25.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-027\u003c/td>\n\u003ctd>Use React with TypeScript for the admin drawer and CMS screens.\u003c/td>\n\u003ctd>Q26. Blocks retain their independent framework choice.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-028\u003c/td>\n\u003ctd>Store structured content and definitions as JSON.\u003c/td>\n\u003ctd>Q27.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-029\u003c/td>\n\u003ctd>Use separate files per page, entry, and definition.\u003c/td>\n\u003ctd>Q28. DEC-036 subsequently selects permanent-ID filenames; concrete records are defined in the technical contracts.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-030\u003c/td>\n\u003ctd>Use a small purpose-built, serializable field model.\u003c/td>\n\u003ctd>Q29. The agreed basic collection field set remains in force.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-031\u003c/td>\n\u003ctd>Share rendering source between published output and preview by default; separate implementations require parity checks.\u003c/td>\n\u003ctd>Q30. No requirement to make build-only templates magically browser-renderable.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-032\u003c/td>\n\u003ctd>Keep editor and preview in one document, scope their styles, and share runtimes.\u003c/td>\n\u003ctd>Q31. No iframe exception to runtime sharing is selected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-033\u003c/td>\n\u003ctd>Offer built-in field controls and optional custom widgets.\u003c/td>\n\u003ctd>Q32. The technical contracts define the React custom-widget interface; implementation remains unverified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-034\u003c/td>\n\u003ctd>Serve shared block libraries as registered static vendor assets, minified where practical; avoid duplicate compatible framework/library versions.\u003c/td>\n\u003ctd>Q30 custom suggestion reinforces DEC-005. Package/version examples in the answer are illustrative, not version pins. DEC-035 subsequently selects build-generated shared assets.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"content-and-block-contracts-2026-10-05\">Content and block contracts — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134\">technical-round-two answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-content-block-contracts\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-035\u003c/td>\n\u003ctd>The build generates self-hosted shared vendor modules.\u003c/td>\n\u003ctd>Q33 settles the mechanism left open in DEC-034. Keep compatible dependencies shared and minified where practical.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-036\u003c/td>\n\u003ctd>Use permanent IDs for document filenames, with editable public paths/slugs inside.\u003c/td>\n\u003ctd>Q34. Content identity does not change when a URL changes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-037\u003c/td>\n\u003ctd>Store formatted block prose as Markdown strings inside JSON props.\u003c/td>\n\u003ctd>Q35. This does not enable executable MDX or arbitrary scripts. DEC-046 subsequently selects visual formatting controls.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-038\u003c/td>\n\u003ctd>Retain deprecated block implementations alongside newer versions and expose a version selector.\u003c/td>\n\u003ctd>Q36 custom answer. Users manually switch and fill unmatched/new/renamed/incompatible fields, which start empty. Preserve directly compatible fields; do not infer renamed-field mappings. Explicit automated migration functions were not selected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-039\u003c/td>\n\u003ctd>Use framework adapters with mount/update/destroy for browser preview.\u003c/td>\n\u003ctd>Q37. Normal framework components use adapters; custom/vanilla blocks implement the shared lifecycle.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-040\u003c/td>\n\u003ctd>Block authors declare never/visible/idle/load public activation behavior.\u003c/td>\n\u003ctd>Q38. Immediate editor preview is separate from public activation timing.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-041\u003c/td>\n\u003ctd>Use stable IDs for internal content/media references, and URLs for external resources.\u003c/td>\n\u003ctd>Q39. Resolve references when rendering output.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"editor-and-saving-2026-10-05\">Editor and saving — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc\">technical-round-three answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-editor-saving\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-042\u003c/td>\n\u003ctd>Original choice: Base UI with CSS Modules for the React editor. \u003cstrong>Superseded by DEC-048.\u003c/strong>\u003c/td>\n\u003ctd>Q40. Preserved as interview history; grill-form stays native HTML.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-043\u003c/td>\n\u003ctd>Use CSS Modules or framework-scoped styles for blocks.\u003c/td>\n\u003ctd>Q41. Shared shell owns global styles; block styles must not leak into the editor or other blocks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-044\u003c/td>\n\u003ctd>Save all pending editor changes in one draft commit.\u003c/td>\n\u003ctd>Q42. Related page, schema, navigation, and media metadata changes persist together.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-045\u003c/td>\n\u003ctd>Recover unsaved edits within the tab session, including reloads.\u003c/td>\n\u003ctd>Q43. This does not select indefinite device-wide recovery or storing binary uploads.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-046\u003c/td>\n\u003ctd>Provide visual formatting controls that save Markdown.\u003c/td>\n\u003ctd>Q44. Keep the supported formatting set small and round-trip it consistently.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-047\u003c/td>\n\u003ctd>Save incomplete drafts; require valid required content and references before Publish.\u003c/td>\n\u003ctd>Q45. Structural corruption is still rejected. Newly empty fields after a version switch may be saved for later completion.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"admin-refinement-2026-10-05\">Admin refinement — 2026-10-05\u003c/h2>\n\u003cp>Accepted directly from the user's implementation feedback.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-048\u003c/td>\n\u003ctd>Use Cloudflare Kumo for all admin UI controls, dialogs, and notifications.\u003c/td>\n\u003ctd>Replaces DEC-042. Keep its styling scoped to admin surfaces so preview blocks retain their designs.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-049\u003c/td>\n\u003ctd>Keep the live preview interactive at all times and sort block rows by dragging.\u003c/td>\n\u003ctd>Remove Interact/Edit blocks toggle and visible up/down buttons. Keyboard sorting remains available for accessibility.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-050\u003c/td>\n\u003ctd>Recover silently and show validation errors in toasts on submission.\u003c/td>\n\u003ctd>Remove saved/local/unsaved status text, recovery banners, and the proactive publication issue list. Save/Publish validation rules remain unchanged.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-051\u003c/td>\n\u003ctd>Opening a block replaces parent-level sidebar navigation with the block editor.\u003c/td>\n\u003ctd>Direct UI feedback: hide tabs, page/entry selector and Add page; All blocks returns to the parent view.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"admin-hierarchy-choices-2026-10-05\">Admin hierarchy choices — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-d3cb2bf4-2763-40ad-bc3a-9213d73c86a4\">Q46–Q47\u003c/a>. See the \u003ca href=\"#/discussions/admin-hierarchy-proposal\">design\u003c/a> and \u003ca href=\"#/journal/2026-10-05-admin-hierarchy-decisions\">interpretation\u003c/a>. Implementation is recorded in the \u003ca href=\"#/verification/runs/2026-10-05T1054Z-admin-hierarchy\">admin hierarchy run\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-052\u003c/td>\n\u003ctd>Place a compact, borderless + Add block action beside the Blocks heading, aligned right. Remove the list-footer action.\u003c/td>\n\u003ctd>Q46 selects header placement to distinguish the action from draggable block rows. A visible label remains alongside the plus icon. Affects \u003ca href=\"#/features/editor\">visual editing\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-053\u003c/td>\n\u003ctd>Provide separate top-level Content and Collection schemas areas for collection entry authoring and schema editing.\u003c/td>\n\u003ctd>Q47 selects alternative B over the recommended A and per-collection tabs. Content browses collections and edits entry values/bodies; Collection schemas edits model definitions. This makes the two tasks explicit and keeps their controls out of one another's views. Affects \u003ca href=\"#/features/editor\">visual editing\u003c/a>; shared Save draft/Publish and safe schema changes remain in force.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"home-navigation-2026-10-05\">Home navigation — 2026-10-05\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-054\u003c/td>\n\u003ctd>Put Pages, Content, Collection schemas, Media and Site on a separate Home menu screen, outside the editing sidebar.\u003c/td>\n\u003ctd>Direct implementation feedback rejected the sidebar destination grid and requested another nesting level. Each area returns to Home; nested collection, entry, field and block screens return to their immediate parent. Affects \u003ca href=\"#/features/editor\">visual editing\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"editor-layout-consistency-2026-10-05\">Editor layout consistency — 2026-10-05\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-055\u003c/td>\n\u003ctd>Apply a shared layout standard across admin forms, custom widgets, sections and action groups.\u003c/td>\n\u003ctd>Direct feedback identified inconsistent Design, Media and Site layouts and requested research into sidebar editors and Kumo. The \u003ca href=\"#/journal/2026-10-05-editor-layout\">research and implemented layout contract\u003c/a> distinguish the user's requirement from our specific spacing choices. Kumo continues to own all controls.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"pages-overview-2026-10-05\">Pages overview — 2026-10-05\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-056\u003c/td>\n\u003ctd>Add a Pages table between Home and an individual page editor.\u003c/td>\n\u003ctd>Direct feedback requested one more hierarchy level listing all pages in a table. The overview shows titles and URL paths; opening a page enters its settings/blocks, and its back link returns to Pages. Add page belongs to the overview. See \u003ca href=\"#/features/editor\">visual editing\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"preview-scope-2026-10-05\">Preview scope — 2026-10-05\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-057\u003c/td>\n\u003ctd>Show the live website preview only while editing pages and their blocks. Content, Collection schemas, Media and Site use standard admin views.\u003c/td>\n\u003ctd>Direct instruction limits right-side rendering to Pages. Other areas use a centered, wider form/list workspace with no drawer, live rendering or preview-width control. Entry block editing and shared draft saves remain available. Home and the Pages table keep their existing overview layouts. Affects \u003ca href=\"#/features/editor\">visual editing\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"generic-pages-discussion-requirements-2026-10-05\">Generic pages — discussion requirements, 2026-10-05\u003c/h2>\n\u003cp>Direct requirements from the user, recorded in the \u003ca href=\"#/journal/2026-10-05-generic-pages-discussion\">discussion journal\u003c/a>. Not implemented; follow-up choices are open.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-058\u003c/td>\n\u003ctd>Collection entries contain schema-defined fields only, with no independent blocks.\u003c/td>\n\u003ctd>Replaces the entry-block editing portion of the earlier design and DEC-057's retained entry blocks. The user distinguishes content data from its rendering layout.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-059\u003c/td>\n\u003ctd>Pages have static and generic types. Generic pages contain only registered generic blocks, not normal blocks.\u003c/td>\n\u003ctd>Static pages hold predefined content; generic pages define reusable entry layouts.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-060\u003c/td>\n\u003ctd>Each generic-block field can optionally bind to a schema field by its parameter-name string.\u003c/td>\n\u003ctd>The matching field supplies the selected entry's content/value. DEC-066–DEC-067 resolve missing, empty and incompatible binding behavior.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-061\u003c/td>\n\u003ctd>Each collection schema can optionally select a generic page.\u003c/td>\n\u003ctd>Makes layout assignment a collection-level choice. DEC-062–DEC-064 resolve template sharing, entry URLs and behavior without an assignment.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"generic-pages-round-one-2026-10-05\">Generic pages — round one, 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-d557fd13-2a71-44e6-9b9a-4543b858f2b0\">Q48–Q55\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-generic-pages-round-one\">interpretation\u003c/a>. These changes are not implemented.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-062\u003c/td>\n\u003ctd>Without a generic page, a collection is data-only and generates no individual entry routes.\u003c/td>\n\u003ctd>Q48. Footer links are a motivating example, explicitly outside this implementation's scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-063\u003c/td>\n\u003ctd>Allow one generic page to serve multiple compatible collection schemas.\u003c/td>\n\u003ctd>Q49. Bound field names and value types must be compatible across assigned schemas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-064\u003c/td>\n\u003ctd>Entry URLs use collection prefix plus entry slug; generic pages have no standalone public URL.\u003c/td>\n\u003ctd>Q50. Layout identity is independent of the collection's route.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-065\u003c/td>\n\u003ctd>A collection index route exists only when a static page occupies it; otherwise it returns 404.\u003c/td>\n\u003ctd>Q51 custom answer rejects automatic listing generation. DEC-070–DEC-071 subsequently settle assignment mechanics and a collection-list block.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-066\u003c/td>\n\u003ctd>Missing or incompatible field bindings may be saved in drafts but prevent publication.\u003c/td>\n\u003ctd>Q52. Fixed fallback values do not conceal invalid bindings.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-067\u003c/td>\n\u003ctd>An empty optional bound value uses the block field's fixed fallback, otherwise renders empty.\u003c/td>\n\u003ctd>Q53. Applies to a valid binding whose entry value is empty.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-068\u003c/td>\n\u003ctd>Add visual rich-text schema fields, with uploaded images and YouTube embeds.\u003c/td>\n\u003ctd>Q54 and custom note expand basic fields and the current formatting-only editor. DEC-072 subsequently limits the initial embed scope to these two types.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-069\u003c/td>\n\u003ctd>Generic-page previews display bound field-name placeholders.\u003c/td>\n\u003ctd>Q55. A real-entry selector or separate sample-data authoring UI was not chosen.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"generic-pages-round-two-2026-10-05\">Generic pages — round two, 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-192c91a8-c5db-4b3b-9e4f-84772508186b\">Q56–Q59\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-generic-pages-round-two\">interpretation\u003c/a>. The scoped interview is complete; these changes are not implemented.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-070\u003c/td>\n\u003ctd>Match a static page's URL to the collection prefix to supply its index page.\u003c/td>\n\u003ctd>Q56. No separate index-page assignment control; the static page owns the route.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-071\u003c/td>\n\u003ctd>Include a basic collection-list block for static pages in this version.\u003c/td>\n\u003ctd>Q57. An explicitly created index page can show collection entries without automatic index generation. Footer integration remains out of scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-072\u003c/td>\n\u003ctd>Limit initial rich-text embeds to uploaded images and YouTube videos.\u003c/td>\n\u003ctd>Q58. Other providers and uploaded audio/video embeds are outside this initial rich-text scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-073\u003c/td>\n\u003ctd>Replace the current project's existing demo entries with completely new schema-only entries when implementing.\u003c/td>\n\u003ctd>Q59 custom answer explicitly says the existing entries are unnecessary. No conversion/preservation workflow is required for these fixtures; this is not a general destructive migration policy.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Implementation of DEC-058–DEC-073 was authorized on 2026-10-06 and is recorded in the \u003ca href=\"#/journal/2026-10-06-generic-pages-implementation\">generic-page implementation journal\u003c/a>.\u003c/p>\n\u003ch2 id=\"main-navigat
