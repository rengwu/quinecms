Notes / Provide build output only; the owner configures deployment\nSelected: (notes only)\nNotes: the site builder pushes content and schema changes to github with a SDK client. publish merges to main. when main is pushed, my netlify deployment will detect that and deploy it on its own, which you dont need to worry much about\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-12\">Question 12\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: How should users write the body of a blog post or collection entry?\nContext: Entries will also have structured metadata such as title and date.\nRecommendation: Reuse the block editor for entry bodies to keep one consistent editing experience.\nOptions: Use the same block editor as pages / Use a rich-text editor for entry bodies / Let each collection choose blocks or rich text\nSelected: Use the same block editor as pages\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-13\">Question 13\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: Can we require block authors to provide a browser-compatible preview?\nContext: The editor must render unsaved changes immediately. A block that can only render during a build cannot do this without a separate preview implementation.\nRecommendation: Require a browser preview for every block, sharing rendering logic with the published version where possible.\nOptions: Yes; every block must support immediate browser preview / Allow build-only blocks with a placeholder while editing\nSelected: Yes; every block must support immediate browser preview\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-14\">Question 14\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round two\nQuestion: How should new block types become available in the editor?\nContext: This concerns installing a new block type, not adding another instance of an already-installed block to a page.\nRecommendation: A developer adds and registers block code, then rebuilds. This lets the build compile frameworks and share compatible dependencies.\nOptions: Developer installs and registers blocks in the repo, then rebuilds / Editors must be able to install new block types through the portal\nSelected: Developer installs and registers blocks in the repo, then rebuilds\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-two-decisions"]},{"id":"journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `534ae93e-c689-4899-b4a0-b2c01b8f8134`\n\n## Question 33\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: Who should produce and maintain the shared vendor files?\nContext: Your registered, statically hosted vendor idea can be implemented by the build: one compatible dependency set produces minified shared modules on the site's own host. Blocks import the same URLs. A manually maintained vendor folder/import map offers direct control but also needs dependency and browser-module compatibility maintenance. Your example version numbers will not be treated as pins.\nRecommendation: Let the build generate self-hosted vendor/shared modules from the registry and lockfile. Validate compatible versions and inspect the output for duplication; load only dependencies needed by the current page.\nOptions: Build-generated, self-hosted vendor modules / Explicitly maintained vendor files and import maps\nSelected: Build-generated, self-hosted vendor modules\nNotes: \n```\n\n## Question 34\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: Should a document's filename follow its permanent ID or its public URL?\nContext: For example: content/pages/page_abc.json could store { id: 'page_abc', path: '/about', blocks: [...] }. Renaming /about would not rename the file. A slug-based filename is easier to browse manually but changes when the URL does.\nRecommendation: Use permanent IDs for filenames and store editable paths/slugs inside. This separates content identity from public URLs.\nOptions: Permanent ID filenames; editable URL in the document / Readable slug/path filenames, with a permanent ID inside\nSelected: Permanent ID filenames; editable URL in the document\nNotes: \n```\n\n## Question 35\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: How should formatted prose inside a text block be stored?\nContext: The outer content file stays JSON. This choice concerns paragraphs, links, emphasis, and lists inside a block, and does not require the user to edit source markup directly.\nRecommendation: Store Markdown strings and render them consistently in preview and build. Keep the supported syntax small, with no executable MDX or arbitrary embedded scripts.\nOptions: Markdown strings inside block props / Sanitized HTML strings inside block props / Structured rich-text JSON nodes inside block props\nSelected: Markdown strings inside block props\nNotes: \n```\n\n## Question 36\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: How should saved block data survive a block author changing its fields?\nContext: A block instance could store { id: 'block_abc', type: 'core/hero', version: 1, props: {...} }. A later version might rename or reorganize those props. This is developer-owned compatibility, separate from the simple collection schema editor.\nRecommendation: Version each block's saved data and let authors supply explicit migration functions. Preserve unsupported data and stop unsafe editing/publishing rather than silently dropping fields.\nOptions: Versioned data with explicit developer migration functions / Authors must keep old saved props compatible without migration functions / Keep old block implementations installed alongside new versions\nSelected: Keep old block implementations installed alongside new versions\nNotes: keep it simple here. old block implementations simply gets \"deprecated\" but still available. blocks would have a \"version\" selection field. users would need to manually migrate to the shape of the latest block by selecting the newer version of the block, in which newer unrecognized/renamed/irreconcilable fields would be empty, then manually fill them back in.\n```\n\n## Question 37\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: What should the browser-facing block interface use?\nContext: With framework adapters, most authors write a normal React/Svelte/Vue component. The adapter provides mount(host, props, context), update(props, context), and destroy(). Vanilla/custom blocks implement that lifecycle directly. The static build uses the shared rendering source where possible.\nRecommendation: Use framework adapters with this small common lifecycle. This gives the editor a consistent way to update, reorder, and remove blocks without imposing its React framework on them.\nOptions: Framework adapters with mount/update/destroy / Require every block to expose a Web Component wrapper instead\nSelected: Framework adapters with mount/update/destroy\nNotes: \n```\n\n## Question 38\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: When should a published block load its interactive JavaScript?\nContext: Public pages can contain built HTML before interactivity starts. An author can declare never for static blocks, visible for offscreen widgets, idle for low-priority behavior, or load for immediate interaction. The editor still mounts blocks immediately for live preview.\nRecommendation: Let block authors declare the activation policy; static blocks need no client runtime, and interactive blocks load when appropriate.\nOptions: Author-declared never/visible/idle/load policy / Activate every interactive block as soon as the page loads\nSelected: Author-declared never/visible/idle/load policy\nNotes: \n```\n\n## Question 39\n\n```text\nRound: lean-sitebuilder — content and block contracts\nQuestion: How should content refer to internal pages and uploaded media?\nContext: A block can store a media ID whose record contains R2 URLs and image variants, or copy those URLs directly into its props. Navigation can similarly reference a page ID or its current path. The build resolves IDs to ordinary URLs in published HTML.\nRecommendation: Use stable IDs for internal content/media and explicit URLs for external links. This keeps page renames and media metadata changes from requiring edits in every referring block.\nOptions: Stable IDs for internal references; URLs for external resources / Store paths and media URLs directly wherever they are used\nSelected: Stable IDs for internal references; URLs for external resources\nNotes: \n```\n","toc":[{"id":"question-33","title":"Question 33","depth":2},{"id":"question-34","title":"Question 34","depth":2},{"id":"question-35","title":"Question 35","depth":2},{"id":"question-36","title":"Question 36","depth":2},{"id":"question-37","title":"Question 37","depth":2},{"id":"question-38","title":"Question 38","depth":2},{"id":"question-39","title":"Question 39","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>534ae93e-c689-4899-b4a0-b2c01b8f8134\u003c/code>\u003c/p>\n\u003ch2 id=\"question-33\">Question 33\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: Who should produce and maintain the shared vendor files?\nContext: Your registered, statically hosted vendor idea can be implemented by the build: one compatible dependency set produces minified shared modules on the site's own host. Blocks import the same URLs. A manually maintained vendor folder/import map offers direct control but also needs dependency and browser-module compatibility maintenance. Your example version numbers will not be treated as pins.\nRecommendation: Let the build generate self-hosted vendor/shared modules from the registry and lockfile. Validate compatible versions and inspect the output for duplication; load only dependencies needed by the current page.\nOptions: Build-generated, self-hosted vendor modules / Explicitly maintained vendor files and import maps\nSelected: Build-generated, self-hosted vendor modules\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-34\">Question 34\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: Should a document's filename follow its permanent ID or its public URL?\nContext: For example: content/pages/page_abc.json could store { id: 'page_abc', path: '/about', blocks: [...] }. Renaming /about would not rename the file. A slug-based filename is easier to browse manually but changes when the URL does.\nRecommendation: Use permanent IDs for filenames and store editable paths/slugs inside. This separates content identity from public URLs.\nOptions: Permanent ID filenames; editable URL in the document / Readable slug/path filenames, with a permanent ID inside\nSelected: Permanent ID filenames; editable URL in the document\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-35\">Question 35\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: How should formatted prose inside a text block be stored?\nContext: The outer content file stays JSON. This choice concerns paragraphs, links, emphasis, and lists inside a block, and does not require the user to edit source markup directly.\nRecommendation: Store Markdown strings and render them consistently in preview and build. Keep the supported syntax small, with no executable MDX or arbitrary embedded scripts.\nOptions: Markdown strings inside block props / Sanitized HTML strings inside block props / Structured rich-text JSON nodes inside block props\nSelected: Markdown strings inside block props\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-36\">Question 36\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: How should saved block data survive a block author changing its fields?\nContext: A block instance could store { id: 'block_abc', type: 'core/hero', version: 1, props: {...} }. A later version might rename or reorganize those props. This is developer-owned compatibility, separate from the simple collection schema editor.\nRecommendation: Version each block's saved data and let authors supply explicit migration functions. Preserve unsupported data and stop unsafe editing/publishing rather than silently dropping fields.\nOptions: Versioned data with explicit developer migration functions / Authors must keep old saved props compatible without migration functions / Keep old block implementations installed alongside new versions\nSelected: Keep old block implementations installed alongside new versions\nNotes: keep it simple here. old block implementations simply gets \"deprecated\" but still available. blocks would have a \"version\" selection field. users would need to manually migrate to the shape of the latest block by selecting the newer version of the block, in which newer unrecognized/renamed/irreconcilable fields would be empty, then manually fill them back in.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-37\">Question 37\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: What should the browser-facing block interface use?\nContext: With framework adapters, most authors write a normal React/Svelte/Vue component. The adapter provides mount(host, props, context), update(props, context), and destroy(). Vanilla/custom blocks implement that lifecycle directly. The static build uses the shared rendering source where possible.\nRecommendation: Use framework adapters with this small common lifecycle. This gives the editor a consistent way to update, reorder, and remove blocks without imposing its React framework on them.\nOptions: Framework adapters with mount/update/destroy / Require every block to expose a Web Component wrapper instead\nSelected: Framework adapters with mount/update/destroy\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-38\">Question 38\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: When should a published block load its interactive JavaScript?\nContext: Public pages can contain built HTML before interactivity starts. An author can declare never for static blocks, visible for offscreen widgets, idle for low-priority behavior, or load for immediate interaction. The editor still mounts blocks immediately for live preview.\nRecommendation: Let block authors declare the activation policy; static blocks need no client runtime, and interactive blocks load when appropriate.\nOptions: Author-declared never/visible/idle/load policy / Activate every interactive block as soon as the page loads\nSelected: Author-declared never/visible/idle/load policy\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-39\">Question 39\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — content and block contracts\nQuestion: How should content refer to internal pages and uploaded media?\nContext: A block can store a media ID whose record contains R2 URLs and image variants, or copy those URLs directly into its props. Navigation can similarly reference a page ID or its current path. The build resolves IDs to ordinary URLs in published HTML.\nRecommendation: Use stable IDs for internal content/media and explicit URLs for external links. This keeps page renames and media metadata changes from requiring edits in every referring block.\nOptions: Stable IDs for internal references; URLs for external resources / Store paths and media URLs directly wherever they are used\nSelected: Stable IDs for internal references; URLs for external resources\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-content-block-contracts"]},{"id":"journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `b9adf54c-f21e-4219-b2a3-932c862859dc`\n\n## Question 40\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: Which UI approach should the React editor use?\nContext: This affects dialogs, menus, field controls, and the drawer. Base UI provides unstyled React primitives; a styled kit provides more ready-made design. The native-only rule remains specific to the throwaway grill-form.\nRecommendation: Use Base UI for complex controls, native elements where sufficient, and CSS Modules for a small custom design. Import only what the editor uses.\nOptions: Base UI plus CSS Modules / A styled shadcn/ui setup with Tailwind / Native controls and custom React components only\nSelected: Base UI plus CSS Modules\nNotes: \n```\n\n## Question 41\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: How should block authors scope their CSS?\nContext: The editor and preview share a document. Global resets or selectors such as button { ... } could change other blocks or the editor. Scoped CSS still lets each block have its own design.\nRecommendation: Require CSS Modules or the framework's scoped styles. Keep shared resets/theme variables in the site shell and avoid block-owned global rules.\nOptions: CSS Modules or framework-scoped styles / Author-managed block namespaces, checked during the build\nSelected: CSS Modules or framework-scoped styles\nNotes: \n```\n\n## Question 42\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: What should the main Save button commit?\nContext: An editor might change a page, site navigation, and a collection definition before saving. Related file changes can be committed together to the draft branch.\nRecommendation: Save all pending editor changes as one commit, with a clear unsaved-changes indicator. This avoids accidentally leaving part of a site change behind.\nOptions: All pending editor changes in one draft commit / Only the current page or record and its required related changes\nSelected: All pending editor changes in one draft commit\nNotes: \n```\n\n## Question 43\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: How should unsaved content survive an accidental reload?\nContext: This is recovery of text/content edits, separate from Git Save. Binary uploads are not included. Persistent recovery would leave a copy of draft content on that device after the tab closes.\nRecommendation: Restore unsaved edits within the tab session. It matches the chosen GitHub-token session model without retaining draft content indefinitely.\nOptions: Recover edits within the tab session, including reloads / Keep a local recovery copy across browser restarts / Keep edits in memory only; reloading loses unsaved work\nSelected: Recover edits within the tab session, including reloads\nNotes: \n```\n\n## Question 44\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: How should users edit the Markdown stored inside text blocks?\nContext: The storage format is already Markdown. A visual editor hides its syntax, while a textarea exposes markup but is simpler to implement and extend. Both can update the page preview live.\nRecommendation: Use a visual editor limited to headings, paragraphs, emphasis, links, and lists, saving Markdown. This suits nontechnical editors while keeping the feature set small.\nOptions: Visual formatting controls that save Markdown / Markdown textarea with a small formatting toolbar / Both visual and source modes\nSelected: Visual formatting controls that save Markdown\nNotes: \n```\n\n## Question 45\n\n```text\nRound: lean-sitebuilder — editor and saving\nQuestion: Can Save preserve an incomplete draft?\nContext: Switching a block version may leave new required fields empty, as you requested. Structurally invalid files still need protection; this question concerns ordinary incomplete content.\nRecommendation: Allow incomplete drafts to be saved, with clear field errors. Require valid content and resolvable references before Publish, so users can safely stop and return later.\nOptions: Save incomplete drafts; validate required content before Publish / Require all required content to be valid before Save\nSelected: Save incomplete drafts; validate required content before Publish\nNotes: \n```\n","toc":[{"id":"question-40","title":"Question 40","depth":2},{"id":"question-41","title":"Question 41","depth":2},{"id":"question-42","title":"Question 42","depth":2},{"id":"question-43","title":"Question 43","depth":2},{"id":"question-44","title":"Question 44","depth":2},{"id":"question-45","title":"Question 45","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>b9adf54c-f21e-4219-b2a3-932c862859dc\u003c/code>\u003c/p>\n\u003ch2 id=\"question-40\">Question 40\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: Which UI approach should the React editor use?\nContext: This affects dialogs, menus, field controls, and the drawer. Base UI provides unstyled React primitives; a styled kit provides more ready-made design. The native-only rule remains specific to the throwaway grill-form.\nRecommendation: Use Base UI for complex controls, native elements where sufficient, and CSS Modules for a small custom design. Import only what the editor uses.\nOptions: Base UI plus CSS Modules / A styled shadcn/ui setup with Tailwind / Native controls and custom React components only\nSelected: Base UI plus CSS Modules\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-41\">Question 41\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: How should block authors scope their CSS?\nContext: The editor and preview share a document. Global resets or selectors such as button { ... } could change other blocks or the editor. Scoped CSS still lets each block have its own design.\nRecommendation: Require CSS Modules or the framework's scoped styles. Keep shared resets/theme variables in the site shell and avoid block-owned global rules.\nOptions: CSS Modules or framework-scoped styles / Author-managed block namespaces, checked during the build\nSelected: CSS Modules or framework-scoped styles\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-42\">Question 42\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: What should the main Save button commit?\nContext: An editor might change a page, site navigation, and a collection definition before saving. Related file changes can be committed together to the draft branch.\nRecommendation: Save all pending editor changes as one commit, with a clear unsaved-changes indicator. This avoids accidentally leaving part of a site change behind.\nOptions: All pending editor changes in one draft commit / Only the current page or record and its required related changes\nSelected: All pending editor changes in one draft commit\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-43\">Question 43\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: How should unsaved content survive an accidental reload?\nContext: This is recovery of text/content edits, separate from Git Save. Binary uploads are not included. Persistent recovery would leave a copy of draft content on that device after the tab closes.\nRecommendation: Restore unsaved edits within the tab session. It matches the chosen GitHub-token session model without retaining draft content indefinitely.\nOptions: Recover edits within the tab session, including reloads / Keep a local recovery copy across browser restarts / Keep edits in memory only; reloading loses unsaved work\nSelected: Recover edits within the tab session, including reloads\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-44\">Question 44\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: How should users edit the Markdown stored inside text blocks?\nContext: The storage format is already Markdown. A visual editor hides its syntax, while a textarea exposes markup but is simpler to implement and extend. Both can update the page preview live.\nRecommendation: Use a visual editor limited to headings, paragraphs, emphasis, links, and lists, saving Markdown. This suits nontechnical editors while keeping the feature set small.\nOptions: Visual formatting controls that save Markdown / Markdown textarea with a small formatting toolbar / Both visual and source modes\nSelected: Visual formatting controls that save Markdown\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-45\">Question 45\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — editor and saving\nQuestion: Can Save preserve an incomplete draft?\nContext: Switching a block version may leave new required fields empty, as you requested. Structurally invalid files still need protection; this question concerns ordinary incomplete content.\nRecommendation: Allow incomplete drafts to be saved, with clear field errors. Require valid content and resolvable references before Publish, so users can safely stop and return later.\nOptions: Save incomplete drafts; validate required content before Publish / Require all required content to be valid before Save\nSelected: Save incomplete drafts; validate required content before Publish\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-editor-saving"]},{"id":"journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `c9c27420-78c7-4c08-ac09-edd5289ddf59`\n\n## Question 15\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How long should the editor remember your GitHub token?\nContext: Private repository drafts need the token when loading, as well as saving. Browser storage makes repeat visits easier but retains a credential on that device.\nRecommendation: Keep it in memory while the editor is open; ask again after a reload. This avoids storing the token on disk through the app.\nOptions: In memory only; enter it again after reloading / Keep it for the browser tab's session, including reloads / Remember it on this device until I sign out\nSelected: Keep it for the browser tab's session, including reloads\nNotes: \n```\n\n## Question 16\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: When you say the portal saves schema changes, what should users be able to change?\nContext: A schema defines fields such as a post's title, date, and category. Editing those definitions is different from editing a post's values. New block rendering code is still installed by a developer, as agreed.\nRecommendation: Start with developer-defined schemas and let the portal edit their content. Add a visual schema editor only if users need to create their own content models.\nOptions: Developers define schemas; the portal edits content values only / Users can create collections and change their fields in the portal / Users can edit collection schemas and existing blocks' field definitions in the portal\nSelected: Users can create collections and change their fields in the portal\nNotes: 1 and 2\n```\n\n## Question 17\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How much simultaneous editing should the first release support?\nContext: Everyone's saved drafts accumulate before Publish. If another edit has changed the same content, an older save must not silently overwrite it.\nRecommendation: Use one shared draft branch with stale-save protection. Preserve local edits and ask the editor to refresh and reapply conflicting changes; add richer collaboration later.\nOptions: Shared drafts with stale-save protection; manual reapplication is acceptable / Parallel editing with an in-app interface to compare and resolve conflicts / Live collaborative editing, with other people's changes appearing immediately\nSelected: Shared drafts with stale-save protection; manual reapplication is acceptable\nNotes: keep it lean and simple to understand. we dont want conflicts, or any problems that a layman non-technical person might not understand.\n```\n\n## Question 18\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: Which media should users be able to upload in the first release?\nContext: Uploaded files will be committed to the same repository. Supporting large audio or video files substantially increases repository size and upload work.\nRecommendation: Support images and downloadable documents first, with validation and size limits.\nOptions: Images only / Images and downloadable documents / Also upload audio and video files\nSelected: Something else\nNotes: i'm planning to use cloudflare R2 for media. accept cloudflare r2 tokens in env vars. and the github-saved content just points to media hosted in the r2 bucket.\n```\n\n## Question 19\n\n```text\nRound: lean-sitebuilder — round three\nQuestion: How should site-wide styling work alongside each block's own design?\nContext: You want independently designed blocks. Shared colors, fonts, and spacing can still make a site consistent without removing block-specific controls.\nRecommendation: Provide site-wide defaults that blocks can inherit, with each block exposing its own overrides and keeping its CSS scoped.\nOptions: Shared site defaults with block-specific overrides / Every block manages its own styling independently / All blocks must follow a single site-wide theme\nSelected: Shared site defaults with block-specific overrides\nNotes: there are site-wide switches, yes, like dark/light mode and other more general styles and settings. but mostly, each block will manage its own styling independently. the site-wide switches are just global variables which the blocks may or may not listen or adhere to.\n```\n","toc":[{"id":"question-15","title":"Question 15","depth":2},{"id":"question-16","title":"Question 16","depth":2},{"id":"question-17","title":"Question 17","depth":2},{"id":"question-18","title":"Question 18","depth":2},{"id":"question-19","title":"Question 19","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>c9c27420-78c7-4c08-ac09-edd5289ddf59\u003c/code>\u003c/p>\n\u003ch2 id=\"question-15\">Question 15\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: How long should the editor remember your GitHub token?\nContext: Private repository drafts need the token when loading, as well as saving. Browser storage makes repeat visits easier but retains a credential on that device.\nRecommendation: Keep it in memory while the editor is open; ask again after a reload. This avoids storing the token on disk through the app.\nOptions: In memory only; enter it again after reloading / Keep it for the browser tab's session, including reloads / Remember it on this device until I sign out\nSelected: Keep it for the browser tab's session, including reloads\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-16\">Question 16\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: When you say the portal saves schema changes, what should users be able to change?\nContext: A schema defines fields such as a post's title, date, and category. Editing those definitions is different from editing a post's values. New block rendering code is still installed by a developer, as agreed.\nRecommendation: Start with developer-defined schemas and let the portal edit their content. Add a visual schema editor only if users need to create their own content models.\nOptions: Developers define schemas; the portal edits content values only / Users can create collections and change their fields in the portal / Users can edit collection schemas and existing blocks' field definitions in the portal\nSelected: Users can create collections and change their fields in the portal\nNotes: 1 and 2\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-17\">Question 17\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: How much simultaneous editing should the first release support?\nContext: Everyone's saved drafts accumulate before Publish. If another edit has changed the same content, an older save must not silently overwrite it.\nRecommendation: Use one shared draft branch with stale-save protection. Preserve local edits and ask the editor to refresh and reapply conflicting changes; add richer collaboration later.\nOptions: Shared drafts with stale-save protection; manual reapplication is acceptable / Parallel editing with an in-app interface to compare and resolve conflicts / Live collaborative editing, with other people's changes appearing immediately\nSelected: Shared drafts with stale-save protection; manual reapplication is acceptable\nNotes: keep it lean and simple to understand. we dont want conflicts, or any problems that a layman non-technical person might not understand.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-18\">Question 18\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: Which media should users be able to upload in the first release?\nContext: Uploaded files will be committed to the same repository. Supporting large audio or video files substantially increases repository size and upload work.\nRecommendation: Support images and downloadable documents first, with validation and size limits.\nOptions: Images only / Images and downloadable documents / Also upload audio and video files\nSelected: Something else\nNotes: i'm planning to use cloudflare R2 for media. accept cloudflare r2 tokens in env vars. and the github-saved content just points to media hosted in the r2 bucket.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-19\">Question 19\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round three\nQuestion: How should site-wide styling work alongside each block's own design?\nContext: You want independently designed blocks. Shared colors, fonts, and spacing can still make a site consistent without removing block-specific controls.\nRecommendation: Provide site-wide defaults that blocks can inherit, with each block exposing its own overrides and keeping its CSS scoped.\nOptions: Shared site defaults with block-specific overrides / Every block manages its own styling independently / All blocks must follow a single site-wide theme\nSelected: Shared site defaults with block-specific overrides\nNotes: there are site-wide switches, yes, like dark/light mode and other more general styles and settings. but mostly, each block will manage its own styling independently. the site-wide switches are just global variables which the blocks may or may not listen or adhere to.\n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-three-decisions"]},{"id":"journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","title":"Interview answers","section":"Journal","order":0,"metadata":{"status":"Submitted"},"metadataHtml":"\u003cspan>Status: Submitted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Interview answers\nsection: Journal\nupdated: 2026-10-05\nstatus: Submitted\n---\n# Interview answers\n\nSubmitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\n\nSession: `eb7e62a0-bf4d-4474-a805-bc47c92b41aa`\n\n## Question 20\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How should the editor get permission to upload media to R2?\nContext: The bucket address can come from environment variables. But if a build embeds R2 write credentials in the static site, visitors can extract them despite the login gate. Keeping environment credentials secret requires a separate service to authorize uploads.\nRecommendation: To preserve the entirely static app, let the editor supply bucket-scoped R2 credentials at runtime and retain them for the tab session, like the GitHub token.\nOptions: Supply R2 credentials in the editor; keep the app entirely static / Allow a small authenticated serverless upload helper that keeps R2 credentials in server-side environment variables / Upload media outside the editor and paste its URL; no upload credentials in the app\nSelected: Supply R2 credentials in the editor; keep the app entirely static\nNotes: \n```\n\n## Question 21\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How much should the first collection schema editor support?\nContext: You chose both developer-defined schemas and collections created through the portal. This question sets the portal's initial field-editing scope; entry bodies still use blocks.\nRecommendation: Start with basic fields and safe changes: add fields, edit labels/defaults, and avoid destructive changes to populated fields. This keeps existing content usable without a migration interface.\nOptions: Basic text, number, date, toggle, select, and media fields; safe changes only / Also support nested/repeating fields and links between collections / Also support changing populated field types and migrating existing content\nSelected: Basic text, number, date, toggle, select, and media fields; safe changes only\nNotes: \n```\n\n## Question 22\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: How should a collection created in the portal appear on the public site?\nContext: For example, a new Recipes collection needs a listing and individual recipe URLs, unless it is only used as data inside other pages.\nRecommendation: Generate a standard listing and entry page layout for each collection. Entry bodies use the existing block editor; developers can later add custom templates.\nOptions: Generate standard listing and entry pages automatically / Let users design reusable listing and entry templates with blocks in the portal / Create data only; developers or existing page blocks decide where it appears\nSelected: Generate standard listing and entry pages automatically\nNotes: \n```\n\n## Question 23\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: Should the media uploader just store files, or also process them?\nContext: R2 stores files. Image resizing and video transcoding would be additional behavior, with extra processing and failure cases.\nRecommendation: Start with original-file uploads for common images, documents, audio, and video, with configurable size/type limits. Add processing separately when needed.\nOptions: Upload original files only / Also resize and compress images automatically / Also process video/audio for playback\nSelected: Also resize and compress images automatically\nNotes: uploading a large enough image would generate an image set that is optimized for web, light compression would be applied as well. somewhat like how next.js's Image component does optimization. but only do the simplest and leanest way here, don't overengineer, only apply simpler methods.\n```\n\n## Question 24\n\n```text\nRound: lean-sitebuilder — round four\nQuestion: May uploaded media be accessible at its direct URL before Publish?\nContext: In a public R2 asset bucket, someone with an uploaded file's URL can access it even while the page referencing it is still a draft. The draft page itself does not become published.\nRecommendation: Allow public media URLs immediately for a simpler static workflow. Choose private drafts only if unpublished media must be confidential.\nOptions: Yes; media URLs may work immediately, while pages remain drafts / No; media must remain private until the content is published\nSelected: Yes; media URLs may work immediately, while pages remain drafts\nNotes: \n```\n","toc":[{"id":"question-20","title":"Question 20","depth":2},{"id":"question-21","title":"Question 21","depth":2},{"id":"question-22","title":"Question 22","depth":2},{"id":"question-23","title":"Question 23","depth":2},{"id":"question-24","title":"Question 24","depth":2}],"titleAnchor":"interview-answers","links":[],"attachments":[],"html":"\u003cp>Submitted answers; interpretation and accepted decisions are recorded through grill-me/plan.\u003c/p>\n\u003cp>Session: \u003ccode>eb7e62a0-bf4d-4474-a805-bc47c92b41aa\u003c/code>\u003c/p>\n\u003ch2 id=\"question-20\">Question 20\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: How should the editor get permission to upload media to R2?\nContext: The bucket address can come from environment variables. But if a build embeds R2 write credentials in the static site, visitors can extract them despite the login gate. Keeping environment credentials secret requires a separate service to authorize uploads.\nRecommendation: To preserve the entirely static app, let the editor supply bucket-scoped R2 credentials at runtime and retain them for the tab session, like the GitHub token.\nOptions: Supply R2 credentials in the editor; keep the app entirely static / Allow a small authenticated serverless upload helper that keeps R2 credentials in server-side environment variables / Upload media outside the editor and paste its URL; no upload credentials in the app\nSelected: Supply R2 credentials in the editor; keep the app entirely static\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-21\">Question 21\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: How much should the first collection schema editor support?\nContext: You chose both developer-defined schemas and collections created through the portal. This question sets the portal's initial field-editing scope; entry bodies still use blocks.\nRecommendation: Start with basic fields and safe changes: add fields, edit labels/defaults, and avoid destructive changes to populated fields. This keeps existing content usable without a migration interface.\nOptions: Basic text, number, date, toggle, select, and media fields; safe changes only / Also support nested/repeating fields and links between collections / Also support changing populated field types and migrating existing content\nSelected: Basic text, number, date, toggle, select, and media fields; safe changes only\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-22\">Question 22\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: How should a collection created in the portal appear on the public site?\nContext: For example, a new Recipes collection needs a listing and individual recipe URLs, unless it is only used as data inside other pages.\nRecommendation: Generate a standard listing and entry page layout for each collection. Entry bodies use the existing block editor; developers can later add custom templates.\nOptions: Generate standard listing and entry pages automatically / Let users design reusable listing and entry templates with blocks in the portal / Create data only; developers or existing page blocks decide where it appears\nSelected: Generate standard listing and entry pages automatically\nNotes: \n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-23\">Question 23\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: Should the media uploader just store files, or also process them?\nContext: R2 stores files. Image resizing and video transcoding would be additional behavior, with extra processing and failure cases.\nRecommendation: Start with original-file uploads for common images, documents, audio, and video, with configurable size/type limits. Add processing separately when needed.\nOptions: Upload original files only / Also resize and compress images automatically / Also process video/audio for playback\nSelected: Also resize and compress images automatically\nNotes: uploading a large enough image would generate an image set that is optimized for web, light compression would be applied as well. somewhat like how next.js's Image component does optimization. but only do the simplest and leanest way here, don't overengineer, only apply simpler methods.\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"question-24\">Question 24\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">Round: lean-sitebuilder — round four\nQuestion: May uploaded media be accessible at its direct URL before Publish?\nContext: In a public R2 asset bucket, someone with an uploaded file's URL can access it even while the page referencing it is still a draft. The draft page itself does not become published.\nRecommendation: Allow public media URLs immediately for a simpler static workflow. Choose private drafts only if unpublished media must be confidential.\nOptions: Yes; media URLs may work immediately, while pages remain drafts / No; media must remain private until the content is published\nSelected: Yes; media URLs may work immediately, while pages remain drafts\nNotes: \n\u003c/code>\u003c/pre>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-four-decisions"]},{"id":"journal/2026-10-05-round-four-decisions","title":"Round four decisions","section":"Journal","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Round four decisions\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Round four decisions\n\nThe [submitted answers](2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa.md) settle Q20–Q24 as DEC-021 through DEC-025 in the [decision register](../decisions/index.md).\n\nR2 credentials are entered at runtime, resolving the conflict between secret build environment values and browser-only upload authorization. A serverless helper is not required. Uploaded media may be public immediately while pages remain drafts.\n\nThe collection editor supports basic fields and safe changes; standard listing and entry pages are generated automatically. The user selected automatic image resizing/compression and clarified that sufficiently large images should yield a small, optimized image set using simple methods. This is a functional comparison to Next.js Image, not a request for its server architecture.\n\nThe product interview has sufficient clarity to conclude. The [agreed design](../discussions/agreed-design.md) consolidates the requirements. Implementation mechanics remain to be designed and tested, rather than becoming another round of speculative preference questions. Application implementation and deployment have not started.\n","toc":[],"titleAnchor":"round-four-decisions","links":["journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","decisions/index","discussions/agreed-design"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa\">submitted answers\u003c/a> settle Q20–Q24 as DEC-021 through DEC-025 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003cp>R2 credentials are entered at runtime, resolving the conflict between secret build environment values and browser-only upload authorization. A serverless helper is not required. Uploaded media may be public immediately while pages remain drafts.\u003c/p>\n\u003cp>The collection editor supports basic fields and safe changes; standard listing and entry pages are generated automatically. The user selected automatic image resizing/compression and clarified that sufficiently large images should yield a small, optimized image set using simple methods. This is a functional comparison to Next.js Image, not a request for its server architecture.\u003c/p>\n\u003cp>The product interview has sufficient clarity to conclude. The \u003ca href=\"#/discussions/agreed-design\">agreed design\u003c/a> consolidates the requirements. Implementation mechanics remain to be designed and tested, rather than becoming another round of speculative preference questions. Application implementation and deployment have not started.\u003c/p>\n","backlinks":["index","decisions/index"]},{"id":"journal/2026-10-05-round-one-decisions","title":"Round one decisions","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Round one decisions\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Round one decisions\n\nThe [submitted answers](2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02.md) establish the initial [decision register](../decisions/index.md). The raw transcript's date follows the form session's UTC creation timestamp; this interpretation uses the user's local date.\n\nThe user's custom publishing answer supersedes the assistant's proposed Save-and-deploy behavior: Save writes an unpublished branch; Publish merges that branch into main and deploys. The user's custom authentication answer requests a configured editor credential and a separately supplied GitHub token, rather than accepting the proposed serverless helper. The security meaning of that editor credential still needs clarification.\n\nThe remaining choices accept nontechnical editors, collections alongside pages, a shared dependency contract, section-level layouts, and a completely fresh implementation. No existing blocks or sites must be migrated.\n\nNext, clarify access/privacy, token ownership, deployment, collection authoring, and the block installation/preview contract through [round-two questions](../discussions/open-questions.md). Application implementation has not started.\n","toc":[],"titleAnchor":"round-one-decisions","links":["journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","decisions/index","discussions/open-questions"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02\">submitted answers\u003c/a> establish the initial \u003ca href=\"#/decisions/index\">decision register\u003c/a>. The raw transcript's date follows the form session's UTC creation timestamp; this interpretation uses the user's local date.\u003c/p>\n\u003cp>The user's custom publishing answer supersedes the assistant's proposed Save-and-deploy behavior: Save writes an unpublished branch; Publish merges that branch into main and deploys. The user's custom authentication answer requests a configured editor credential and a separately supplied GitHub token, rather than accepting the proposed serverless helper. The security meaning of that editor credential still needs clarification.\u003c/p>\n\u003cp>The remaining choices accept nontechnical editors, collections alongside pages, a shared dependency contract, section-level layouts, and a completely fresh implementation. No existing blocks or sites must be migrated.\u003c/p>\n\u003cp>Next, clarify access/privacy, token ownership, deployment, collection authoring, and the block installation/preview contract through \u003ca href=\"#/discussions/open-questions\">round-two questions\u003c/a>. Application implementation has not started.\u003c/p>\n","backlinks":["index","decisions/index"]},{"id":"journal/2026-10-05-round-three-decisions","title":"Round three decisions","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Round three decisions\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Round three decisions\n\nThe [submitted answers](2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59.md) establish DEC-016 through DEC-020 in the [decision register](../decisions/index.md).\n\nGitHub tokens persist for the tab session, including reloads. Collection schemas can originate in developer code/configuration or be created and edited through the portal; block code and its registration still belong to developers. Shared drafts and stale-save protection are accepted, with a strong preference for understandable recovery that avoids exposing Git concepts to editors.\n\nMedia moves to R2, with references in Git. This explicitly changes the earlier proposed in-repository media storage. The requested environment credentials create an unresolved architectural issue: a build-only secret cannot authorize later arbitrary browser uploads unless authorization reaches the browser or a service acts on its behalf. Embedding a secret in publicly delivered JavaScript would expose it; the convenience login does not prevent this.\n\nCloudflare documents bucket-scoped S3 access credentials, temporary signed upload URLs, and browser CORS configuration. These support two candidate approaches: editors supply credentials at runtime, or an authenticated on-demand helper keeps credentials server-side and grants uploads. Neither alternative has been accepted. Sources: [R2 authentication](https://developers.cloudflare.com/r2/api/tokens/), [presigned URLs](https://developers.cloudflare.com/r2/api/s3/presigned-urls/), [CORS](https://developers.cloudflare.com/r2/buckets/cors/).\n\nGlobal settings such as light/dark mode are optional signals that blocks may follow; independent styling remains primary. The [remaining questions](../discussions/open-questions.md) concern R2 authorization and the initial collection/schema behavior. No implementation has started.\n","toc":[],"titleAnchor":"round-three-decisions","links":["journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","decisions/index","discussions/open-questions"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59\">submitted answers\u003c/a> establish DEC-016 through DEC-020 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003cp>GitHub tokens persist for the tab session, including reloads. Collection schemas can originate in developer code/configuration or be created and edited through the portal; block code and its registration still belong to developers. Shared drafts and stale-save protection are accepted, with a strong preference for understandable recovery that avoids exposing Git concepts to editors.\u003c/p>\n\u003cp>Media moves to R2, with references in Git. This explicitly changes the earlier proposed in-repository media storage. The requested environment credentials create an unresolved architectural issue: a build-only secret cannot authorize later arbitrary browser uploads unless authorization reaches the browser or a service acts on its behalf. Embedding a secret in publicly delivered JavaScript would expose it; the convenience login does not prevent this.\u003c/p>\n\u003cp>Cloudflare documents bucket-scoped S3 access credentials, temporary signed upload URLs, and browser CORS configuration. These support two candidate approaches: editors supply credentials at runtime, or an authenticated on-demand helper keeps credentials server-side and grants uploads. Neither alternative has been accepted. Sources: \u003ca href=\"https://developers.cloudflare.com/r2/api/tokens/\" rel=\"noreferrer\">R2 authentication\u003c/a>, \u003ca href=\"https://developers.cloudflare.com/r2/api/s3/presigned-urls/\" rel=\"noreferrer\">presigned URLs\u003c/a>, \u003ca href=\"https://developers.cloudflare.com/r2/buckets/cors/\" rel=\"noreferrer\">CORS\u003c/a>.\u003c/p>\n\u003cp>Global settings such as light/dark mode are optional signals that blocks may follow; independent styling remains primary. The \u003ca href=\"#/discussions/open-questions\">remaining questions\u003c/a> concern R2 authorization and the initial collection/schema behavior. No implementation has started.\u003c/p>\n","backlinks":["index","decisions/index"]},{"id":"journal/2026-10-05-round-two-decisions","title":"Round two decisions","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Round two decisions\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Round two decisions\n\nThe [submitted answers](2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2.md) settle Q8–Q14 as DEC-009 through DEC-015 in the [decision register](../decisions/index.md).\n\nThe editor login is explicitly a convenience gate. Editors each provide their own GitHub token, and both public and private repositories are supported. Repository authorization remains distinct from hosting: private draft reads require authorization; public repository branches remain publicly readable.\n\nThe user's Netlify integration already owns deployment after main changes. The builder only needs its GitHub SDK save/merge workflow and portable static output. This replaces the unaccepted GitHub Actions/Pages recommendation. Netlify documents automatic deployment from connected Git updates in its [deployment guide](https://docs.netlify.com/deploy/create-deploys/); no hosting configuration was inspected or changed here.\n\nPages and collection entries share block authoring. Every block supplies immediate browser preview, and new block types are developer-installed with a rebuild. These decisions remove the build-only preview and portal installer branches.\n\nThe user's phrase “content and schema changes” needs clarification: changing collection definitions visually is a larger scope than editing values using developer-defined schemas. The next round also covers token retention, simultaneous editing, media scope, and how global styling interacts with independent blocks. These are [open questions](../discussions/open-questions.md), not inferred defaults. Application implementation has not started.\n","toc":[],"titleAnchor":"round-two-decisions","links":["journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","decisions/index","discussions/open-questions"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2\">submitted answers\u003c/a> settle Q8–Q14 as DEC-009 through DEC-015 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003cp>The editor login is explicitly a convenience gate. Editors each provide their own GitHub token, and both public and private repositories are supported. Repository authorization remains distinct from hosting: private draft reads require authorization; public repository branches remain publicly readable.\u003c/p>\n\u003cp>The user's Netlify integration already owns deployment after main changes. The builder only needs its GitHub SDK save/merge workflow and portable static output. This replaces the unaccepted GitHub Actions/Pages recommendation. Netlify documents automatic deployment from connected Git updates in its \u003ca href=\"https://docs.netlify.com/deploy/create-deploys/\" rel=\"noreferrer\">deployment guide\u003c/a>; no hosting configuration was inspected or changed here.\u003c/p>\n\u003cp>Pages and collection entries share block authoring. Every block supplies immediate browser preview, and new block types are developer-installed with a rebuild. These decisions remove the build-only preview and portal installer branches.\u003c/p>\n\u003cp>The user's phrase “content and schema changes” needs clarification: changing collection definitions visually is a larger scope than editing values using developer-defined schemas. The next round also covers token retention, simultaneous editing, media scope, and how global styling interacts with independent blocks. These are \u003ca href=\"#/discussions/open-questions\">open questions\u003c/a>, not inferred defaults. Application implementation has not started.\u003c/p>\n","backlinks":["index","decisions/index"]},{"id":"journal/2026-10-05-technical-foundations","title":"Technical foundations","section":"Journal","order":0,"metadata":{"status":"Exploring"},"metadataHtml":"\u003cspan>Status: Exploring\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Technical foundations\nupdated: 2026-10-05\nstatus: Exploring\n---\n# Technical foundations\n\nThe [submitted answers](2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275.md) accept Astro/TypeScript, React/TypeScript for the editor, separate JSON content files, and a small field-schema vocabulary. Rendering source is shared by default, with explicit parity checks for separate renderers. Editor and preview share one document, and custom field widgets are supported. These are DEC-026 through DEC-033 in the [decision register](../decisions/index.md).\n\nThe user additionally proposes statically hosted, preferably minified registered vendor assets for libraries shared by blocks. DEC-034 captures this direction; the named library versions are examples rather than dependency pins. Build-managed, self-hosted shared chunks appear compatible with that goal, but the user has not yet chosen that mechanism over manually maintained vendor modules/import maps.\n\nThe next [contract proposals](../discussions/technical-contracts.md) cover vendor ownership, stable identities, formatted-text storage, block data evolution, preview adapter lifecycle, public activation policy, and content references. They are not accepted definitions yet. No application code has been created.\n","toc":[],"titleAnchor":"technical-foundations","links":["journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275","decisions/index","discussions/technical-contracts"],"attachments":[],"html":"\u003cp>The \u003ca href=\"#/journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275\">submitted answers\u003c/a> accept Astro/TypeScript, React/TypeScript for the editor, separate JSON content files, and a small field-schema vocabulary. Rendering source is shared by default, with explicit parity checks for separate renderers. Editor and preview share one document, and custom field widgets are supported. These are DEC-026 through DEC-033 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003cp>The user additionally proposes statically hosted, preferably minified registered vendor assets for libraries shared by blocks. DEC-034 captures this direction; the named library versions are examples rather than dependency pins. Build-managed, self-hosted shared chunks appear compatible with that goal, but the user has not yet chosen that mechanism over manually maintained vendor modules/import maps.\u003c/p>\n\u003cp>The next \u003ca href=\"#/discussions/technical-contracts\">contract proposals\u003c/a> cover vendor ownership, stable identities, formatted-text storage, block data evolution, preview adapter lifecycle, public activation policy, and content references. They are not accepted definitions yet. No application code has been created.\u003c/p>\n","backlinks":["index","decisions/index","discussions/open-questions"]}],"sections":["Overview","Decisions","Discussions","Journal"]}</script>
<script>(() => {
  'use strict';
  const {title:wikiTitle,pages,sections} = JSON.parse(document.getElementById('wiki-data').textContent);
  const byId = new Map(pages.map(p=>[p.id,p]));
  const $ = id => document.getElementById(id);
  const colorScheme = matchMedia('(prefers-color-scheme: dark)');
  const colorInputs = document.querySelectorAll('input[name="color"]');
  function setColor(preference) {
    if (!['automatic', 'light', 'dark'].includes(preference)) preference = 'automatic';
    document.documentElement.dataset.colorPreference = preference;
    document.documentElement.dataset.theme = preference === 'automatic' ? (colorScheme.matches ? 'dark' : 'light') : preference;
    colorInputs.forEach(input => { input.checked = input.value === preference; });
  }
  setColor(document.documentElement.dataset.colorPreference);
  colorInputs.forEach(input => input.addEventListener('change', () => {
    setColor(input.value);
    try { localStorage.setItem('planning-wiki-color', input.value); } catch {}
  }));
  colorScheme.addEventListener('change', () => setColor(document.documentElement.dataset.colorPreference));
  window.addEventListener('storage', event => {
    if (event.key === 'planning-wiki-color' || event.key === null) setColor(event.newValue);
  });
  document.addEventListener('click', event => {
    if (!$('appearance').contains(event.target)) $('appearance').open = false;
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('appearance').open) {
      $('appearance').open = false;
      $('appearance').querySelector('summary').focus();
    }
  });
  let current = null;
  const link = (label,href) => { const a=document.createElement('a'); a.textContent=label; a.href=href; return a; };
  const route = id => '#/'+id.split('/').map(s=>encodeURIComponent(s).replace(/~/g,'%7E')).join('/');
  for (const section of sections) {
    const group=document.createElement('div');group.className='nav-group';
    const label=document.createElement('div');label.className='nav-group-label';label.textContent=section;group.append(label);
    pages.filter(p=>p.section===section).forEach(p=>{const a=link(p.id==='index'?'Main page':p.title,route(p.id));a.dataset.page=p.id;group.append(a);});
    $('navigation').append(group);
  }
  if (matchMedia('(max-width: 700px)').matches) $('navigation-details').open=false;
  function mode(source) {
    $('article-view').hidden=source;
    $('source-view').hidden=!source;
    $('read-tab').classList.toggle('selected',!source);
    $('source-tab').classList.toggle('selected',source);
    $('read-tab').setAttribute('aria-pressed',String(!source));
    $('source-tab').setAttribute('aria-pressed',String(source));
    $('contents').hidden=source || !current?.toc.length;
  }
  function markText(text,query) {
    const fragment=document.createDocumentFragment();
    const lower=text.toLowerCase(), needle=query.toLowerCase();
    let start=0, at;
    while (needle && (at=lower.indexOf(needle,start))!==-1) {
      fragment.append(document.createTextNode(text.slice(start,at)));
      const mark=document.createElement('mark');mark.textContent=text.slice(at,at+query.length);fragment.append(mark);start=at+query.length;
    }
    fragment.append(document.createTextNode(text.slice(start)));return fragment;
  }
  function search(query) {
    current=null;
    $('search').value=query;
    $('page-title').textContent='Search results';
    $('page-meta').hidden=true;document.querySelector('.toolbar').hidden=true;
    $('article-view').hidden=true;$('source-view').hidden=true;$('search-results').hidden=false;$('toc').replaceChildren();
    $('contents').hidden=true;
    const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
    const matches=terms.length?pages.filter(p=>terms.every(t=>(p.title+' '+p.source).toLowerCase().includes(t))).sort((a,b)=>Number(b.title.toLowerCase().includes(query.toLowerCase()))-Number(a.title.toLowerCase().includes(query.toLowerCase()))):[];
    $('result-count').textContent=terms.length?`${matches.length} ${matches.length===1?'article':'articles'} matching “${query}”${matches.length?'':'. Try fewer words or a broader term.'}`:'Enter a word or phrase to search all articles.';
    $('results').replaceChildren();
    for (const p of matches) {
      const card=document.createElement('div');card.className='result';
      const small=document.createElement('small');small.textContent=p.section;
      const h=document.createElement('h2'),a=link('',route(p.id));a.append(markText(p.title,query));h.append(a);
      const excerpt=document.createElement('p');
      const plain=p.source.replace(/^---\n[\s\S]*?\n---\n/,'').replace(/[#*`|]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ');
      const position=plain.toLowerCase().indexOf(terms[0]);const start=Math.max(0,position-65);
      excerpt.append(markText((start?'…':'')+plain.slice(start,start+240)+(plain.length>start+240?'…':''),query));
      card.append(small,h,excerpt);$('results').append(card);
    }
    document.title='Search — '+wikiTitle;
  }
  function render() {
    const rawHash=location.hash.slice(1);
    document.querySelectorAll('[aria-current=page]').forEach(a=>a.removeAttribute('aria-current'));
    if(rawHash.startsWith('/search?')) {search(new URLSearchParams(rawHash.slice(8)).get('q')||'');window.scrollTo(0,0);return;}
    let id='index',anchor='';
    try {
      const parts=(rawHash.startsWith('/')?rawHash.slice(1):'index').split('~');
      id=decodeURIComponent(parts[0]);anchor=decodeURIComponent(parts[1]||'');
    } catch {id='__invalid_route__';}

    const p=byId.get(id||'index');
    $('search-results').hidden=true;document.querySelector('.toolbar').hidden=!p;$('page-meta').hidden=!p;
    current=p||null;mode(false);
    if(!p){
      $('page-title').textContent='Page not found';
      $('article').replaceChildren(link('Return to the main page',route('index')));$('toc').replaceChildren();$('backlinks').hidden=true;document.title='Page not found — '+wikiTitle;return;
    }
    $('search').value='';$('page-title').textContent=p.title;
    $('page-meta').innerHTML=p.metadataHtml;
    $('page-meta').hidden=!p.metadataHtml;
    $('article').innerHTML=p.html;
    $('source-text').textContent=p.source;$('source-path').textContent=p.id+'.md';
    $('toc').replaceChildren();
    p.toc.forEach(h=>{const a=link(h.title,route(p.id)+'~'+h.id);if(h.depth>2)a.className='nested';$('toc').append(a);});
    $('backlink-list').replaceChildren();$('backlinks').hidden=!p.backlinks.length;
    p.backlinks.forEach(id=>$('backlink-list').append(link(byId.get(id).title,route(id))));
    document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===p.id)a.setAttribute('aria-current','page');});
    document.title=p.id==='index'?wikiTitle:p.title+' — '+wikiTitle;
    if(anchor)requestAnimationFrame(()=>{if(anchor===p.titleAnchor)$('page-title').scrollIntoView();else document.getElementById(anchor)?.scrollIntoView();});else window.scrollTo(0,0);
  }
  $('search-form').addEventListener('submit',e=>{e.preventDefault();const hash='/search?q='+encodeURIComponent($('search').value.trim());if(location.hash==='#'+hash)render();else location.hash=hash;});
  $('read-tab').addEventListener('click',()=>mode(false));$('source-tab').addEventListener('click',()=>mode(true));
  $('print').addEventListener('click',()=>{mode(false);window.print();});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const target=$('search-results').hidden?$('article'):$('main');target.focus();target.scrollIntoView();});
  $('download').addEventListener('click',()=>{
    if(!current)return;const url=URL.createObjectURL(new Blob([current.source],{type:'text/markdown;charset=utf-8'}));
    const a=link('',url);a.download=current.id.split('/').pop()+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('search').focus();}});
  document.addEventListener('click',e=>{const a=e.target.closest('a');if(a?.getAttribute('href')?.startsWith('#/')&&matchMedia('(max-width: 700px)').matches)$('navigation-details').open=false;});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>
