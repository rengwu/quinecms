<script type="application/json" id="wiki-data">{"title":"lean-sitebuilder","pages":[{"id":"index","title":"lean-sitebuilder","section":"Overview","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: lean-sitebuilder\nupdated: 2026-10-05\nstatus: Accepted\n---\n# lean-sitebuilder\n\nA Git-backed static site builder with the public website, visual admin editor, block code, and content in one repository and deployment. It replaces the always-running Payload CMS used by astro-payload. Planning only; no application behavior is implemented or verified.\n\nThe first round established nontechnical editors, page sections with defined controls, reusable content collections, shared block dependencies, and GitHub-based draft/publish workflows. Save commits to an unpublished branch; Publish merges that branch to main and triggers deployment. The new core and starter blocks will be fresh; astro-payload is reference material.\n\nThe editor login is a convenience gate. Each editor supplies their own GitHub token; both public and private site repositories are supported. The browser uses a GitHub SDK to save and merge; the user's Netlify integration deploys main. Pages and collection entries share the block editor. Every block supports immediate browser preview, and new block types are developer-installed with a rebuild.\n\nGitHub tokens persist for the tab session. Collections support developer-defined schemas and portal field editing. Shared drafts use stale-save protection with plain-language recovery. Media lives in Cloudflare R2, with URLs in Git. Blocks own their styling and may follow optional global settings such as dark/light mode.\n\nR2 credentials are entered at runtime. The collection editor supports basic fields and safe changes, with automatic listing/entry pages. Image uploads generate simple resized and lightly compressed variants; media URLs may be public before page publication. The interview is complete; the agreed product scope is ready for an implementation plan.\n\n- [Accepted decisions](decisions/index.md)\n- [Agreed design](discussions/agreed-design.md)\n- [Open questions](discussions/open-questions.md)\n\nThe technical interview has selected Astro/TypeScript, a React editor, separate JSON content files, a small field model, shared rendering source, and a single-document preview. The technical interview is complete. The [technical contracts](discussions/technical-contracts.md) specify generated vendor modules, stable-ID JSON records, Markdown authoring, retained block versions, rendering interfaces, scoped styles, session recovery, and atomic draft saves with publication validation. Untested engineering recommendations are labeled separately.\n\n- [Round-one interpretation](journal/2026-10-05-round-one-decisions.md)\n- [Submitted round-one answers](journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02.md)\n- [Round-two interpretation](journal/2026-10-05-round-two-decisions.md)\n- [Submitted round-two answers](journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2.md)\n- [Round-three interpretation](journal/2026-10-05-round-three-decisions.md)\n- [Submitted round-three answers](journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59.md)\n- [Round-four interpretation](journal/2026-10-05-round-four-decisions.md)\n- [Submitted round-four answers](journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa.md)\n- [Technical foundations](journal/2026-10-05-technical-foundations.md)\n- [Submitted technical-round-one answers](journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275.md)\n- [Content and block contract decisions](journal/2026-10-05-content-block-contracts.md)\n- [Submitted technical-round-two answers](journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134.md)\n\n- [Editor and saving decisions](journal/2026-10-05-editor-saving.md)\ k editor. Every block supports immediate browser preview, and new block types are developer-installed with a rebuild.\u003c/p>\n\u003cp>GitHub tokens persist for the tab session. Collections support developer-defined schemas and portal field editing. Shared drafts use stale-save protection with plain-language recovery. Media lives in Cloudflare R2, with URLs in Git. Blocks own their styling and may follow optional global settings such as dark/light mode.\u003c/p>\n\u003cp>R2 credentials are entered at runtime. The collection editor supports basic fields and safe changes, with automatic listing/entry pages. Image uploads generate simple resized and lightly compressed variants; media URLs may be public before page publication. The interview is complete; the agreed product scope is ready for an implementation plan.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/decisions/index\">Accepted decisions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/discussions/agreed-design\">Agreed design\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/discussions/open-questions\">Open questions\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>The technical interview has selected Astro/TypeScript, a React editor, separate JSON content files, a small field model, shared rendering source, and a single-document preview. The technical interview is complete. The \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a> specify generated vendor modules, stable-ID JSON records, Markdown authoring, retained block versions, rendering interfaces, scoped styles, session recovery, and atomic draft saves with publication validation. Untested engineering recommendations are labeled separately.\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-round-one-decisions\">Round-one interpretation\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02\">Submitted round-one answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-round-two-decisions\">Round-two interpretation\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2\">Submitted round-two answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-round-three-decisions\">Round-three interpretation\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59\">Submitted round-three answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-round-four-decisions\">Round-four interpretation\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa\">Submitted round-four answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-technical-foundations\">Technical foundations\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275\">Submitted technical-round-one answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-content-block-contracts\">Content and block contract decisions\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134\">Submitted technical-round-two answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-editor-saving\">Editor and saving decisions\u003c/a>\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003ca href=\"#/journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc\">Submitted technical-round-three answers\u003c/a>\u003c/p>\n\u003c/li>\n\u003c/ul>\n","backlinks":[]},{"id":"decisions/index","title":"Decisions","section":"Decisions","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Decisions\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Decisions\n\nAccepted on 2026-10-05 from the original request and [round-one answers](../journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02.md). See the [interpretation journal](../journal/2026-10-05-round-one-decisions.md) and [remaining questions](../discussions/open-questions.md). These are intended requirements, not implemented features.\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-001 | Keep the public website, static admin editor, blocks, and content records in one Git repository and deployment. Remove the always-running Payload CMS dependency. | Original request: lightweight, durable ownership with Git as the source of content. Q18 later explicitly places media files in R2; see DEC-019. |\n| DEC-002 | Support GitHub first; require a user-supplied Git token for submissions. Provide editor entry using an environment-configured credential. | Q1 custom answer. DEC-009–DEC-012 clarify access/deployment; DEC-016 sets token retention. No custom auth helper is required. |\n| DEC-003 | Design the first release for nontechnical clients and site owners. | Q2: editor usability must cover people without a developer workflow. |\n| DEC-004 | Include pages, navigation, site settings, media, and blog posts or other repeatable content collections. | Q3 selected the collections-inclusive scope. A general visual schema builder has not been requested. |\n| DEC-005 | Allow blocks from multiple frameworks subject to declared dependencies and compatible shared library versions. | Original request and Q4: deduplicate compatible shared runtimes per page; different frameworks still have distinct runtimes. |\n| DEC-006 | Reorder page sections and edit each block's defined fields and design controls, with a side drawer and live preview. | Original request and Q5. Nested layout construction and arbitrary element positioning are outside the selected initial scope. |\n| DEC-007 | Save creates commits on an unpublished draft branch. Publish merges that draft branch into main and then deploys. | Q6 custom answer: saving and going live are separate actions; publishing applies the branch's accumulated changes. |\n| DEC-008 | Build a fresh core and entirely new starter blocks. Use astro-payload as reference only. | Q7: no migration compatibility or block porting commitment. |\n\n## Round two — 2026-10-05\n\nAccepted from [round-two answers](../journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2.md); see the [interpretation](../journal/2026-10-05-round-two-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-009 | The environment-configured login is a convenience gate; GitHub authorization protects repository access. | Q8 explicitly accepts the static gate's limits. It must not be described as protection for private resources. |\n| DEC-010 | Support both private and public site repositories. | Q9. Private draft reads require GitHub authorization; public repository drafts are public. Netlify hosting does not change repository visibility. |\n| DEC-011 | Each editor supplies their own GitHub token. | Q10. DEC-016 sets token retention; no tokens belong in the deployed bundle or planning records. |\n| DEC-012 | Use a browser GitHub SDK client for repository changes. Publish merges to main; the user's existing Netlify Git integration owns deployment. | Q11 custom answer. No builder-managed deployment service or Netlify API integration is requested. Schema authoring is subsequently defined in DEC-017 and DEC-022. |\n| DEC-013 | Posts and collection entries use the same block editor as pages, alongside structured metadata. | Q12. |\n| DEC-014 | Every block must support immediate browser preview of unsaved changes. | Q13. Shared rendering logic is preferred where feasible; preview/published parity must be verified during implementation. |\n| DEC-015 | Developers install and register new block types in source, followed by a rebuild. | Q14. Adding instances of existing blocks remains an editor action. No portal block marketplace is required. |\n\n## Round three — 2026-10-05\n\nAccepted from [round-three answers](../journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59.md); see the [interpretation](../journal/2026-10-05-round-three-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-016 | Retain the editor's GitHub token for the browser tab's session, including reloads. | Q15. Session retention is intended; persistent device-wide remembering was not selected. |\n| DEC-017 | Support developer-defined schemas and allow users to create collections and edit collection fields in the portal. | Q16 selects option 2 and notes “1 and 2.” Visual editing of block field definitions was not selected; DEC-022 narrows the collection editor. |\n| DEC-018 | Use shared drafts with stale-save protection and a simple recovery flow. | Q17 accepts manual reapplication but stresses nontechnical users. Preserve unsaved work, prevent silent overwrites, and explain recovery in plain language. No Git conflict editor or live collaboration is required; freedom from all concurrent changes cannot be guaranteed. |\n| DEC-019 | Store media in Cloudflare R2; Git content references media URLs. | Q18 custom answer supersedes the earlier in-repository upload proposal. The accompanying request for environment-based upload credentials is superseded by runtime credentials in DEC-021; DEC-024 defines upload processing. |\n| DEC-020 | Blocks primarily own their styling. Expose optional global variables/settings such as dark/light mode; each block decides whether to follow them. | Q19 selected shared defaults with overrides and explicitly made adherence optional. A mandatory shared theme is not required. |\n\n## Round four — 2026-10-05\n\nAccepted from [round-four answers](../journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa.md); see the [interpretation](../journal/2026-10-05-round-four-decisions.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-021 | Supply R2 upload credentials in the editor at runtime, preserving the entirely static application. | Q20. This replaces the earlier request to provide upload secrets through build environment variables. Public bucket configuration may still use environment settings. No secret-holding upload helper is required. |\n| DEC-022 | Start with basic text, number, date, toggle, select, and media fields, with safe schema changes only. | Q21. Support additions and label/default edits; avoid destructive changes to populated fields. Nested models, relations, and migration tooling are outside the selected first-release scope. |\n| DEC-023 | Generate standard listing and entry pages automatically for collections created through the portal. | Q22. Entry bodies use the block editor. A portal template designer is not required initially. |\n| DEC-024 | Automatically produce a web-optimized image set from sufficiently large uploads, using resizing and light compression with simple methods. | Q23 selection and notes. This extends original-file media uploads with image processing; it does not request a Next.js image server or audio/video transcoding. Exact widths, encodings, quality, and limits are implementation choices. |\n| DEC-025 | Media URLs may be publicly accessible immediately after upload, before the referencing page is published. | Q24. Page publication remains governed by the Git draft/main workflow; private draft-media promotion is unnecessary. |\n\n## Technical foundations — 2026-10-05\n\nAccepted from [technical-round-one answers](../journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275.md); see the [interpretation](../journal/2026-10-05-technical-foundations.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-026 | Use Astro with TypeScript as the public site's static build foundation. | Q25. |\n| DEC-027 | Use React with TypeScript for the admin drawer and CMS screens. | Q26. Blocks retain their independent framework choice. |\n| DEC-028 | Store structured content and definitions as JSON. | Q27. |\n| DEC-029 | Use separate files per page, entry, and definition. | Q28. DEC-036 subsequently selects permanent-ID filenames; concrete records are defined in the technical contracts. |\n| DEC-030 | Use a small purpose-built, serializable field model. | Q29. The agreed basic collection field set remains in force. |\n| DEC-031 | Share rendering source between published output and preview by default; separate implementations require parity checks. | Q30. No requirement to make build-only templates magically browser-renderable. |\n| DEC-032 | Keep editor and preview in one document, scope their styles, and share runtimes. | Q31. No iframe exception to runtime sharing is selected. |\n| DEC-033 | Offer built-in field controls and optional custom widgets. | Q32. The technical contracts define the React custom-widget interface; implementation remains unverified. |\n| DEC-034 | Serve shared block libraries as registered static vendor assets, minified where practical; avoid duplicate compatible framework/library versions. | Q30 custom suggestion reinforces DEC-005. Package/version examples in the answer are illustrative, not version pins. DEC-035 subsequently selects build-generated shared assets. |\n\n## Content and block contracts — 2026-10-05\n\nAccepted from [technical-round-two answers](../journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134.md); see the [interpretation](../journal/2026-10-05-content-block-contracts.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-035 | The build generates self-hosted shared vendor modules. | Q33 settles the mechanism left open in DEC-034. Keep compatible dependencies shared and minified where practical. |\n| DEC-036 | Use permanent IDs for document filenames, with editable public paths/slugs inside. | Q34. Content identity does not change when a URL changes. |\n| DEC-037 | Store formatted block prose as Markdown strings inside JSON props. | Q35. This does not enable executable MDX or arbitrary scripts. DEC-046 subsequently selects visual formatting controls. |\n| DEC-038 | Retain deprecated block implementations alongside newer versions and expose a version selector. | Q36 custom answer. Users manually switch and fill unmatched/new/renamed/incompatible fields, which start empty. Preserve directly compatible fields; do not infer renamed-field mappings. Explicit automated migration functions were not selected. |\n| DEC-039 | Use framework adapters with mount/update/destroy for browser preview. | Q37. Normal framework components use adapters; custom/vanilla blocks implement the shared lifecycle. |\n| DEC-040 | Block authors declare never/visible/idle/load public activation behavior. | Q38. Immediate editor preview is separate from public activation timing. |\n| DEC-041 | Use stable IDs for internal content/media references, and URLs for external resources. | Q39. Resolve references when rendering output. |\n\n## Editor and saving — 2026-10-05\n\nAccepted from [technical-round-three answers](../journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc.md); see the [interpretation](../journal/2026-10-05-editor-saving.md).\n\n| ID | Decision | Basis and rationale |\n| --- | --- | --- |\n| DEC-042 | Use Base UI with CSS Modules for the React editor. | Q40. Native controls remain suitable where sufficient; grill-form stays native HTML. |\n| DEC-043 | Use CSS Modules or framework-scoped styles for blocks. | Q41. Shared shell owns global styles; block styles must not leak into the editor or other blocks. |\n| DEC-044 | Save all pending editor changes in one draft commit. | Q42. Related page, schema, navigation, and media metadata changes persist together. |\n| DEC-045 | Recover unsaved edits within the tab session, including reloads. | Q43. This does not select indefinite device-wide recovery or storing binary uploads. |\n| DEC-046 | Provide visual formatting controls that save Markdown. | Q44. Keep the supported formatting set small and round-trip it consistently. |\n| DEC-047 | Save incomplete drafts; require valid required content and references before Publish. | Q45. Structural corruption is still rejected. Newly empty fields after a version switch may be saved for later completion. |\n","toc":[{"id":"round-two-2026-10-05","title":"Round two — 2026-10-05","depth":2},{"id":"round-three-2026-10-05","title":"Round three — 2026-10-05","depth":2},{"id":"round-four-2026-10-05","title":"Round four — 2026-10-05","depth":2},{"id":"technical-foundations-2026-10-05","title":"Technical foundations — 2026-10-05","depth":2},{"id":"content-and-block-contracts-2026-10-05","title":"Content and block contracts — 2026-10-05","depth":2},{"id":"editor-and-saving-2026-10-05","title":"Editor and saving — 2026-10-05","depth":2}],"titleAnchor":"decisions","links":["journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02","journal/2026-10-05-round-one-decisions","discussions/open-questions","journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2","journal/2026-10-05-round-two-decisions","journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59","journal/2026-10-05-round-three-decisions","journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa","journal/2026-10-05-round-four-decisions","journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275","journal/2026-10-05-technical-foundations","journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134","journal/2026-10-05-content-block-contracts","journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc","journal/2026-10-05-editor-saving"],"attachments":[],"html":"\u003cp>Accepted on 2026-10-05 from the original request and \u003ca href=\"#/journal/2026-10-04-grill-528c4b19-f488-4209-ab5c-b9c13f420f02\">round-one answers\u003c/a>. See the \u003ca href=\"#/journal/2026-10-05-round-one-decisions\">interpretation journal\u003c/a> and \u003ca href=\"#/discussions/open-questions\">remaining questions\u003c/a>. These are intended requirements, not implemented features.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-001\u003c/td>\n\u003ctd>Keep the public website, static admin editor, blocks, and content records in one Git repository and deployment. Remove the always-running Payload CMS dependency.\u003c/td>\n\u003ctd>Original request: lightweight, durable ownership with Git as the source of content. Q18 later explicitly places media files in R2; see DEC-019.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-002\u003c/td>\n\u003ctd>Support GitHub first; require a user-supplied Git token for submissions. Provide editor entry using an environment-configured credential.\u003c/td>\n\u003ctd>Q1 custom answer. DEC-009–DEC-012 clarify access/deployment; DEC-016 sets token retention. No custom auth helper is required.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-003\u003c/td>\n\u003ctd>Design the first release for nontechnical clients and site owners.\u003c/td>\n\u003ctd>Q2: editor usability must cover people without a developer workflow.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-004\u003c/td>\n\u003ctd>Include pages, navigation, site settings, media, and blog posts or other repeatable content collections.\u003c/td>\n\u003ctd>Q3 selected the collections-inclusive scope. A general visual schema builder has not been requested.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-005\u003c/td>\n\u003ctd>Allow blocks from multiple frameworks subject to declared dependencies and compatible shared library versions.\u003c/td>\n\u003ctd>Original request and Q4: deduplicate compatible shared runtimes per page; different frameworks still have distinct runtimes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-006\u003c/td>\n\u003ctd>Reorder page sections and edit each block's defined fields and design controls, with a side drawer and live preview.\u003c/td>\n\u003ctd>Original request and Q5. Nested layout construction and arbitrary element positioning are outside the selected initial scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-007\u003c/td>\n\u003ctd>Save creates commits on an unpublished draft branch. Publish merges that draft branch into main and then deploys.\u003c/td>\n\u003ctd>Q6 custom answer: saving and going live are separate actions; publishing applies the branch's accumulated changes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-008\u003c/td>\n\u003ctd>Build a fresh core and entirely new starter blocks. Use astro-payload as reference only.\u003c/td>\n\u003ctd>Q7: no migration compatibility or block porting commitment.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-two-2026-10-05\">Round two — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-1a1e4868-048d-45f3-a291-5f8b6c42aae2\">round-two answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-two-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-009\u003c/td>\n\u003ctd>The environment-configured login is a convenience gate; GitHub authorization protects repository access.\u003c/td>\n\u003ctd>Q8 explicitly accepts the static gate's limits. It must not be described as protection for private resources.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-010\u003c/td>\n\u003ctd>Support both private and public site repositories.\u003c/td>\n\u003ctd>Q9. Private draft reads require GitHub authorization; public repository drafts are public. Netlify hosting does not change repository visibility.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-011\u003c/td>\n\u003ctd>Each editor supplies their own GitHub token.\u003c/td>\n\u003ctd>Q10. DEC-016 sets token retention; no tokens belong in the deployed bundle or planning records.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-012\u003c/td>\n\u003ctd>Use a browser GitHub SDK client for repository changes. Publish merges to main; the user's existing Netlify Git integration owns deployment.\u003c/td>\n\u003ctd>Q11 custom answer. No builder-managed deployment service or Netlify API integration is requested. Schema authoring is subsequently defined in DEC-017 and DEC-022.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-013\u003c/td>\n\u003ctd>Posts and collection entries use the same block editor as pages, alongside structured metadata.\u003c/td>\n\u003ctd>Q12.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-014\u003c/td>\n\u003ctd>Every block must support immediate browser preview of unsaved changes.\u003c/td>\n\u003ctd>Q13. Shared rendering logic is preferred where feasible; preview/published parity must be verified during implementation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-015\u003c/td>\n\u003ctd>Developers install and register new block types in source, followed by a rebuild.\u003c/td>\n\u003ctd>Q14. Adding instances of existing blocks remains an editor action. No portal block marketplace is required.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-three-2026-10-05\">Round three — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-c9c27420-78c7-4c08-ac09-edd5289ddf59\">round-three answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-three-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-016\u003c/td>\n\u003ctd>Retain the editor's GitHub token for the browser tab's session, including reloads.\u003c/td>\n\u003ctd>Q15. Session retention is intended; persistent device-wide remembering was not selected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-017\u003c/td>\n\u003ctd>Support developer-defined schemas and allow users to create collections and edit collection fields in the portal.\u003c/td>\n\u003ctd>Q16 selects option 2 and notes “1 and 2.” Visual editing of block field definitions was not selected; DEC-022 narrows the collection editor.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-018\u003c/td>\n\u003ctd>Use shared drafts with stale-save protection and a simple recovery flow.\u003c/td>\n\u003ctd>Q17 accepts manual reapplication but stresses nontechnical users. Preserve unsaved work, prevent silent overwrites, and explain recovery in plain language. No Git conflict editor or live collaboration is required; freedom from all concurrent changes cannot be guaranteed.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-019\u003c/td>\n\u003ctd>Store media in Cloudflare R2; Git content references media URLs.\u003c/td>\n\u003ctd>Q18 custom answer supersedes the earlier in-repository upload proposal. The accompanying request for environment-based upload credentials is superseded by runtime credentials in DEC-021; DEC-024 defines upload processing.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-020\u003c/td>\n\u003ctd>Blocks primarily own their styling. Expose optional global variables/settings such as dark/light mode; each block decides whether to follow them.\u003c/td>\n\u003ctd>Q19 selected shared defaults with overrides and explicitly made adherence optional. A mandatory shared theme is not required.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-four-2026-10-05\">Round four — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-eb7e62a0-bf4d-4474-a805-bc47c92b41aa\">round-four answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-round-four-decisions\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-021\u003c/td>\n\u003ctd>Supply R2 upload credentials in the editor at runtime, preserving the entirely static application.\u003c/td>\n\u003ctd>Q20. This replaces the earlier request to provide upload secrets through build environment variables. Public bucket configuration may still use environment settings. No secret-holding upload helper is required.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-022\u003c/td>\n\u003ctd>Start with basic text, number, date, toggle, select, and media fields, with safe schema changes only.\u003c/td>\n\u003ctd>Q21. Support additions and label/default edits; avoid destructive changes to populated fields. Nested models, relations, and migration tooling are outside the selected first-release scope.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-023\u003c/td>\n\u003ctd>Generate standard listing and entry pages automatically for collections created through the portal.\u003c/td>\n\u003ctd>Q22. Entry bodies use the block editor. A portal template designer is not required initially.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-024\u003c/td>\n\u003ctd>Automatically produce a web-optimized image set from sufficiently large uploads, using resizing and light compression with simple methods.\u003c/td>\n\u003ctd>Q23 selection and notes. This extends original-file media uploads with image processing; it does not request a Next.js image server or audio/video transcoding. Exact widths, encodings, quality, and limits are implementation choices.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-025\u003c/td>\n\u003ctd>Media URLs may be publicly accessible immediately after upload, before the referencing page is published.\u003c/td>\n\u003ctd>Q24. Page publication remains governed by the Git draft/main workflow; private draft-media promotion is unnecessary.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"technical-foundations-2026-10-05\">Technical foundations — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-103bfb33-1e8a-4133-9528-3baf8aa57275\">technical-round-one answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-technical-foundations\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-026\u003c/td>\n\u003ctd>Use Astro with TypeScript as the public site's static build foundation.\u003c/td>\n\u003ctd>Q25.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-027\u003c/td>\n\u003ctd>Use React with TypeScript for the admin drawer and CMS screens.\u003c/td>\n\u003ctd>Q26. Blocks retain their independent framework choice.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-028\u003c/td>\n\u003ctd>Store structured content and definitions as JSON.\u003c/td>\n\u003ctd>Q27.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-029\u003c/td>\n\u003ctd>Use separate files per page, entry, and definition.\u003c/td>\n\u003ctd>Q28. DEC-036 subsequently selects permanent-ID filenames; concrete records are defined in the technical contracts.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-030\u003c/td>\n\u003ctd>Use a small purpose-built, serializable field model.\u003c/td>\n\u003ctd>Q29. The agreed basic collection field set remains in force.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-031\u003c/td>\n\u003ctd>Share rendering source between published output and preview by default; separate implementations require parity checks.\u003c/td>\n\u003ctd>Q30. No requirement to make build-only templates magically browser-renderable.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-032\u003c/td>\n\u003ctd>Keep editor and preview in one document, scope their styles, and share runtimes.\u003c/td>\n\u003ctd>Q31. No iframe exception to runtime sharing is selected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-033\u003c/td>\n\u003ctd>Offer built-in field controls and optional custom widgets.\u003c/td>\n\u003ctd>Q32. The technical contracts define the React custom-widget interface; implementation remains unverified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-034\u003c/td>\n\u003ctd>Serve shared block libraries as registered static vendor assets, minified where practical; avoid duplicate compatible framework/library versions.\u003c/td>\n\u003ctd>Q30 custom suggestion reinforces DEC-005. Package/version examples in the answer are illustrative, not version pins. DEC-035 subsequently selects build-generated shared assets.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"content-and-block-contracts-2026-10-05\">Content and block contracts — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-534ae93e-c689-4899-b4a0-b2c01b8f8134\">technical-round-two answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-content-block-contracts\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-035\u003c/td>\n\u003ctd>The build generates self-hosted shared vendor modules.\u003c/td>\n\u003ctd>Q33 settles the mechanism left open in DEC-034. Keep compatible dependencies shared and minified where practical.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-036\u003c/td>\n\u003ctd>Use permanent IDs for document filenames, with editable public paths/slugs inside.\u003c/td>\n\u003ctd>Q34. Content identity does not change when a URL changes.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-037\u003c/td>\n\u003ctd>Store formatted block prose as Markdown strings inside JSON props.\u003c/td>\n\u003ctd>Q35. This does not enable executable MDX or arbitrary scripts. DEC-046 subsequently selects visual formatting controls.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-038\u003c/td>\n\u003ctd>Retain deprecated block implementations alongside newer versions and expose a version selector.\u003c/td>\n\u003ctd>Q36 custom answer. Users manually switch and fill unmatched/new/renamed/incompatible fields, which start empty. Preserve directly compatible fields; do not infer renamed-field mappings. Explicit automated migration functions were not selected.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-039\u003c/td>\n\u003ctd>Use framework adapters with mount/update/destroy for browser preview.\u003c/td>\n\u003ctd>Q37. Normal framework components use adapters; custom/vanilla blocks implement the shared lifecycle.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-040\u003c/td>\n\u003ctd>Block authors declare never/visible/idle/load public activation behavior.\u003c/td>\n\u003ctd>Q38. Immediate editor preview is separate from public activation timing.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-041\u003c/td>\n\u003ctd>Use stable IDs for internal content/media references, and URLs for external resources.\u003c/td>\n\u003ctd>Q39. Resolve references when rendering output.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"editor-and-saving-2026-10-05\">Editor and saving — 2026-10-05\u003c/h2>\n\u003cp>Accepted from \u003ca href=\"#/journal/2026-10-05-grill-b9adf54c-f21e-4219-b2a3-932c862859dc\">technical-round-three answers\u003c/a>; see the \u003ca href=\"#/journal/2026-10-05-editor-saving\">interpretation\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis and rationale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-042\u003c/td>\n\u003ctd>Use Base UI with CSS Modules for the React editor.\u003c/td>\n\u003ctd>Q40. Native controls remain suitable where sufficient; grill-form stays native HTML.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-043\u003c/td>\n\u003ctd>Use CSS Modules or framework-scoped styles for blocks.\u003c/td>\n\u003ctd>Q41. Shared shell owns global styles; block styles must not leak into the editor or other blocks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-044\u003c/td>\n\u003ctd>Save all pending editor changes in one draft commit.\u003c/td>\n\u003ctd>Q42. Related page, schema, navigation, and media metadata changes persist together.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-045\u003c/td>\n\u003ctd>Recover unsaved edits within the tab session, including reloads.\u003c/td>\n\u003ctd>Q43. This does not select indefinite device-wide recovery or storing binary uploads.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-046\u003c/td>\n\u003ctd>Provide visual formatting controls that save Markdown.\u003c/td>\n\u003ctd>Q44. Keep the supported formatting set small and round-trip it consistently.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-047\u003c/td>\n\u003ctd>Save incomplete drafts; require valid required content and references before Publish.\u003c/td>\n\u003ctd>Q45. Structural corruption is still rejected. Newly empty fields after a version switch may be saved for later completion.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n","backlinks":["index","discussions/agreed-design","discussions/open-questions","discussions/technical-contracts","journal/2026-10-05-content-block-contracts","journal/2026-10-05-round-four-decisions","journal/2026-10-05-round-one-decisions","journal/2026-10-05-round-three-decisions","journal/2026-10-05-round-two-decisions","journal/2026-10-05-technical-foundations"]},{"id":"discussions/agreed-design","title":"Agreed design","section":"Discussions","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Agreed design\nupdated: 2026-10-05\nstatus: Accepted\n---\n# Agreed design\n\nProduct scope established through four interview rounds. The [decision register](../decisions/index.md) preserves each choice and its source; this page consolidates the intended behavior. Nothing here is a claim of implemented or verified software.\n\n## Repository and deployment\n\nOne site repository contains the public site, static admin editor, registered block code, schemas, and content records. Media files live in Cloudflare R2 and are referenced by URL in Git. Both public and private GitHub repositories work. The user's existing Netlify integration builds and deploys main; the builder does not manage hosting infrastructure.\n\nThe application requires no always-running CMS or custom server-side service. The admin login is a convenience gate configured at build time. Repository operations use the editor's own GitHub token, retained for the tab session including reloads. Editors supply R2 credentials at runtime; upload secrets are not embedded in the public build.\n\n## Editing and publishing\n\nNontechnical owners edit pages and collection entries through a drawer over a live preview. They add, remove, customize, and reorder registered sections using each block's fields and design controls. Save commits content/schema changes to a shared draft branch through a GitHub SDK client. Publish merges accumulated drafts into main, after which Netlify deploys.\n\nStale-save protection prevents silent overwrites. Recovery preserves unsaved work and uses plain language. There is no requirement for live collaborative editing or a Git merge-conflict interface.\n\n## Blocks and styling\n\nBlocks are independently authored in React, Svelte, Vue, or vanilla HTML/CSS/JavaScript under a common registration contract. Each supplies an immediate browser preview and published rendering behavior. Developers add new block types in source and rebuild; users add instances through the editor.\n\nDeclare dependencies and require compatible versions so shared libraries load once per page. Different frameworks retain their distinct runtimes; arbitrary self-bundled incompatible libraries are not promised deduplication. Blocks primarily own their styling. Optional global variables such as light/dark mode provide shared signals, with adoption left to each block.\n\n## Collections\n\nSupport developer-defined schemas and portal creation/editing of collection definitions. Start with text, number, date, toggle, select, and media fields. Permit safe edits such as adding fields or changing labels/defaults; avoid destructive changes to populated fields.\n\nGenerate standard public listing and entry pages automatically. Entry bodies use the same block editor as pages. Nested schemas, relations, migration tooling, and a visual template designer are outside the selected initial scope.\n\n## Media\n\nUpload files to R2 and retain their metadata/URLs in content records. Media may be accessible by URL immediately, even before its page is published. Large enough image uploads generate a small set of resized, lightly compressed web variants using simple methods. Audio/video transcoding is not required.\n\n## Implementation direction — proposed\n\nUse browser-native image decoding, canvas resizing, and blob encoding before upload, with a small fixed set of widths and no upscaling. Record variant URLs and dimensions for responsive image markup. This avoids an image transformation service. Exact widths, encodings, limits, orientation/animation handling, and fallback behavior require implementation validation. Browser canvas supports destination resizing and export with encoding/quality settings: [drawImage](https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/drawImage), [toBlob](https://developer.mozilla.org/en-US/docs/Web/API/HTMLCanvasElement/toBlob).\n\nThe old astro-payload repository has separate renderer and Payload-schema registries in `sites/default/astro/src/blocks/blockRenderers.ts` and `blockSchemas.ts`. That registration concept is relevant reference material; the new core and starter blocks will be fresh, with no Payload dependency or migration commitment.\n\nNext, translate the accepted scope into the data model, block/preview contract, implementation plan, and observable acceptance criteria. Framework/library selection and starter-block coverage remain engineering choices to explain in that plan. Implementation has not been authorized by the interview answers alone.\n","toc":[{"id":"repository-and-deployment","title":"Repository and deployment","depth":2},{"id":"editing-and-publishing","title":"Editing and publishing","depth":2},{"id":"blocks-and-styling","title":"Blocks and styling","depth":2},{"id":"collections","title":"Collections","depth":2},{"id":"media","title":"Media","depth":2},{"id":"implementation-direction-proposed","title":"Implementation direction — proposed","depth":2}],"titleAnchor":"agreed-design","links":["decisions/index"],"attachments":[],"html":"\u003cp>Product scope established through four interview rounds. The \u003ca href=\"#/decisions/index\">decision register\u003c/a> preserves each choice and its source; this page consolidates the intended behavior. Nothing here is a claim of implemented or verified software.\u003c/p>\n\u003ch2 id=\"repository-and-deployment\">Repository and deployment\u003c/h2>\n\u003cp>One site repository contains the public site, static admin editor, registered block code, schemas, and content records. Media files live in Cloudflare R2 and are referenced by URL in Git. Both public and private GitHub repositories work. The user's existing Netlify integration builds and deploys main; the builder does not manage hosting infrastructure.\u003c/p>\n\u003cp>The application requires no always-running CMS or custom server-side service. The admin login is a convenience gate configured at build time. Repository operations use the editor's own GitHub token, retained for the tab session including reloads. Editors supply R2 credentials at runtime; upload secrets are not embedded in the public build.\u003c/p>\n\u003ch2 id=\"editing-and-publishing\">Editing and publishing\u003c/h2>\n\u003cp>Nontechnical owners edit pages and collection entries through a drawer over a live preview. They add, remove, customize, and reorder registered sections using each block's fields and design controls. Save commits content/schema changes to a shared draft branch through a GitHub SDK client. Publish merges accumulated drafts into main, after which Netlify deploys.\u003c/p>\n\u003cp>Stale-save protection prevents silent overwrites. Recovery preserves unsaved work and uses plain language. There is no requirement for live collaborative editing or a Git merge-conflict interface.\u003c/p>\n\u003ch2 id=\"blocks-and-styling\">Blocks and styling\u003c/h2>\n\u003cp>Blocks are independently authored in React, Svelte, Vue, or vanilla HTML/CSS/JavaScript under a common registration contract. Each supplies an immediate browser preview and published rendering behavior. Developers add new block types in source and rebuild; users add instances through the editor.\u003c/p>\n\u003cp>Declare dependencies and require compatible versions so shared libraries load once per page. Different frameworks retain their distinct runtimes; arbitrary self-bundled incompatible libraries are not promised deduplication. Blocks primarily own their styling. Optional global variables such as light/dark mode provide shared signals, with adoption left to each block.\u003c/p>\n\u003ch2 id=\"collections\">Collections\u003c/h2>\n\u003cp>Support developer-defined schemas and portal creation/editing of collection definitions. Start with text, number, date, toggle, select, and media fields. Permit safe edits such as adding fields or changing labels/defaults; avoid destructive changes to populated fields.\u003c/p>\n\u003cp>Generate standard public listing and entry pages automatically. Entry bodies use the same block editor as pages. Nested schemas, relations, migration tooling, and a visual template designer are outside the selected initial scope.\u003c/p>\n\u003ch2 id=\"media\">Media\u003c/h2>\n\u003cp>Upload files to R2 and retain their metadata/URLs in content records. Media may be accessible by URL immediately, even before its page is published. Large enough image uploads generate a small set of resized, lightly compressed web variants using simple methods. Audio/video transcoding is not required.\u003c/p>\n\u003ch2 id=\"implementation-direction-proposed\">Implementation direction — proposed\u003c/h2>\n\u003cp>Use browser-native image decoding, canvas resizing, and blob encoding before upload, with a small fixed set of widths and no upscaling. Record variant URLs and dimensions for responsive image markup. This avoids an image transformation service. Exact widths, encodings, limits, orientation/animation handling, and fallback behavior require implementation validation. Browser canvas supports destination resizing and export with encoding/quality settings: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/CanvasRenderingContext2D/drawImage\" rel=\"noreferrer\">drawImage\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLCanvasElement/toBlob\" rel=\"noreferrer\">toBlob\u003c/a>.\u003c/p>\n\u003cp>The old astro-payload repository has separate renderer and Payload-schema registries in \u003ccode>sites/default/astro/src/blocks/blockRenderers.ts\u003c/code> and \u003ccode>blockSchemas.ts\u003c/code>. That registration concept is relevant reference material; the new core and starter blocks will be fresh, with no Payload dependency or migration commitment.\u003c/p>\n\u003cp>Next, translate the accepted scope into the data model, block/preview contract, implementation plan, and observable acceptance criteria. Framework/library selection and starter-block coverage remain engineering choices to explain in that plan. Implementation has not been authorized by the interview answers alone.\u003c/p>\n","backlinks":["index","discussions/open-questions","journal/2026-10-05-round-four-decisions"]},{"id":"discussions/open-questions","title":"Open questions","section":"Discussions","order":0,"metadata":{"status":"Interviews complete"},"metadataHtml":"\u003cspan>Status: Interviews complete\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Open questions\nupdated: 2026-10-05\nstatus: Interviews complete\n---\n# Open questions\n\nThe four-round product interview establishes the [agreed design](agreed-design.md). The user subsequently requested a technical grill to choose the stack, content format, block contracts, and related implementation decisions. The technical interview is now complete as well. Accepted choices are recorded below; untested engineering details are identified in the technical specification.\n\n## Technical round one — resolved\n\nQ25–Q32 are accepted as DEC-026–DEC-033. The additional shared-vendor direction is DEC-034. See [technical foundations](../journal/2026-10-05-technical-foundations.md).\n\n## Technical round two — resolved\n\nQ33–Q39 are accepted as DEC-035–DEC-041. The user chose retained deprecated block implementations and manual version switching, replacing the proposed automated migration functions. See [content/block decisions](../journal/2026-10-05-content-block-contracts.md).\n\n## Technical round three — resolved\n\n| Question | Decision | Accepted outcome |\n| --- | --- | --- |\n| Q40 | Editor UI components | Base UI primitives with CSS Modules; native controls where sufficient. |\n| Q41 | Block CSS scoping | CSS Modules/framework-scoped styles, with no unscoped global resets/selectors. |\n| Q42 | Save scope | All pending editor changes in one draft commit. |\n| Q43 | Unsaved content recovery | Per-tab session recovery, excluding binary uploads. |\n| Q44 | Markdown authoring interface | A visual editor for a limited Markdown feature set. |\n| Q45 | Incomplete draft persistence | Save structurally valid incomplete drafts; block Publish until required content is valid. |\n\nQ40–Q45 are accepted as DEC-042–DEC-047. See the [editor/saving journal](../journal/2026-10-05-editor-saving.md). Concrete definitions, engineering recommendations, and verification targets are consolidated in [technical contracts](technical-contracts.md). No further questionnaire is needed for the scoped design.\n\nBase UI supplies unstyled React primitives and documents tree-shakable imports and CSS Modules usage: [quick start](https://base-ui.com/react/overview/quick-start). This is the selected editor library; grill-form remains native HTML.\n\nFor Git transactions, the proposed engineering path creates a tree and commit based on the loaded draft head, then advances the branch without force. A concurrent branch advance to a divergent commit must reject the update; preserve local work and explain recovery. Q42 selects all pending edits in one commit. See GitHub's [trees](https://docs.github.com/en/rest/git/trees#create-a-tree), [commits](https://docs.github.com/en/rest/git/commits#create-a-commit), and [reference updates](https://docs.github.com/en/rest/git/refs#update-a-reference). This is a design proposal requiring race-condition testing, not a claim that a preflight read alone provides locking.\n\nResearch: Astro supports static prerendering and multiple UI framework integrations, but `.astro` templates have no browser component runtime. A live unsaved editor requires browser-renderable implementations. See [static rendering](https://docs.astro.build/en/guides/on-demand-rendering/) and [framework components](https://docs.astro.build/en/guides/framework-components/). JSON Schema supplies a portable validation vocabulary; editor controls/layout still need UI metadata. See [JSON Schema](https://json-schema.org/overview/what-is-jsonschema). An iframe creates a separate browsing context; using it isolates document styling but does not share live framework instances with the parent. See [iframe](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/iframe). The shared-document preview boundary was selected in Q31.\n\n## Resolved in round two\n\nQ8–Q14 are resolved by DEC-009 through DEC-015 in the [decision register](../decisions/index.md): convenience login, both repository visibilities, individual tokens, Netlify-managed deployment, shared page/post block editing, browser previews, and developer-installed blocks.\n\n## Resolved in round three\n\nQ15–Q17 and Q19 are resolved by DEC-016–DEC-018 and DEC-020: tab-session tokens, developer and portal collection schemas, simple shared drafts, and optional global styling. Q18 establishes R2 storage (DEC-019) but leaves upload authorization and media type scope open.\n\n## Resolved in round four\n\nQ20–Q24 are resolved by DEC-021–DEC-025 in the [decision register](../decisions/index.md).\n\n| Question | Outcome | Scope |\n| --- | --- | --- |\n| Q20 | Runtime editor-supplied R2 credentials | Keep the application static; no secret-holding upload helper. |\n| Q21 | Basic fields and safe schema changes | No nested models, relations, or migration tooling initially. |\n| Q22 | Automatic standard listing and entry pages | Existing block editor supplies entry bodies. |\n| Q23 | Simple image resizing and light compression | Generate web image sets for sufficiently large images; no audio/video transcoding. |\n| Q24 | Media URLs may be public before Publish | Page publication remains separate. |\n\n## Engineering work for the implementation plan\n\nDefine the content/schema file formats, block authoring and preview interfaces, dependency sharing, Git save/merge concurrency handling, schema compatibility validation, and upload metadata. Propose concrete starter blocks and validation scenarios. Choose image widths/encodings/limits and browser fallbacks, and document repository permissions and R2 CORS setup. The contract definitions now specify these behaviors. Exact library pins, build integration, limits, and validation fixtures remain engineering work. No unimplemented behavior is certified by the interview or wiki checks.\n\nR2 credential retention was not separately selected; propose the same tab-session behavior as GitHub when specifying the editor session. Do not mistake that proposed default for an explicitly answered question. The optional future capabilities excluded above can be reconsidered if the user expands scope.\n\n## Research\n\nAstro documents that its Vite-provided environment values are statically replaced at build time and that public variables are available to client code. The inference for a fully static editor is that checking a configured credential in client code is a UI gate, not server-enforced authorization. [Environment variables](https://docs.astro.build/en/guides/environment-variables/).\n\nGitHub documents repository-scoped fine-grained tokens and branch merging through its API. Exact required permissions and branch protection compatibility must be validated in implementation. [Personal access tokens](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens), [branch API](https://docs.github.com/en/rest/branches/branches#merge-a-branch).\n\nGitHub Pages offers static hosting; private-repository availability depends on the account plan. This is a deployment option, not an accepted provider choice. [GitHub Pages](https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages).\n","toc":[{"id":"technical-round-one-resolved","title":"Technical round one — resolved","depth":2},{"id":"technical-round-two-resolved","title":"Technical round two — resolved","depth":2},{"id":"technical-round-three-resolved","title":"Technical round three — resolved","depth":2},{"id":"resolved-in-round-two","title":"Resolved in round two","depth":2},{"id":"resolved-in-round-three","title":"Resolved in round three","depth":2},{"id":"resolved-in-round-four","title":"Resolved in round four","depth":2},{"id":"engineering-work-for-the-implementation-plan","title":"Engineering work for the implementation plan","depth":2},{"id":"research","title":"Research","depth":2}],"titleAnchor":"open-questions","links":["discussions/agreed-design","journal/2026-10-05-technical-foundations","journal/2026-10-05-content-block-contracts","journal/2026-10-05-editor-saving","discussions/technical-contracts","decisions/index","decisions/index"],"attachments":[],"html":"\u003cp>The four-round product interview establishes the \u003ca href=\"#/discussions/agreed-design\">agreed design\u003c/a>. The user subsequently requested a technical grill to choose the stack, content format, block contracts, and related implementation decisions. The technical interview is now complete as well. Accepted choices are recorded below; untested engineering details are identified in the technical specification.\u003c/p>\n\u003ch2 id=\"technical-round-one-resolved\">Technical round one — resolved\u003c/h2>\n\u003cp>Q25–Q32 are accepted as DEC-026–DEC-033. The additional shared-vendor direction is DEC-034. See \u003ca href=\"#/journal/2026-10-05-technical-foundations\">technical foundations\u003c/a>.\u003c/p>\n\u003ch2 id=\"technical-round-two-resolved\">Technical round two — resolved\u003c/h2>\n\u003cp>Q33–Q39 are accepted as DEC-035–DEC-041. The user chose retained deprecated block implementations and manual version switching, replacing the proposed automated migration functions. See \u003ca href=\"#/journal/2026-10-05-content-block-contracts\">content/block decisions\u003c/a>.\u003c/p>\n\u003ch2 id=\"technical-round-three-resolved\">Technical round three — resolved\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Question\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Accepted outcome\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Q40\u003c/td>\n\u003ctd>Editor UI components\u003c/td>\n\u003ctd>Base UI primitives with CSS Modules; native controls where sufficient.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q41\u003c/td>\n\u003ctd>Block CSS scoping\u003c/td>\n\u003ctd>CSS Modules/framework-scoped styles, with no unscoped global resets/selectors.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q42\u003c/td>\n\u003ctd>Save scope\u003c/td>\n\u003ctd>All pending editor changes in one draft commit.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q43\u003c/td>\n\u003ctd>Unsaved content recovery\u003c/td>\n\u003ctd>Per-tab session recovery, excluding binary uploads.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q44\u003c/td>\n\u003ctd>Markdown authoring interface\u003c/td>\n\u003ctd>A visual editor for a limited Markdown feature set.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q45\u003c/td>\n\u003ctd>Incomplete draft persistence\u003c/td>\n\u003ctd>Save structurally valid incomplete drafts; block Publish until required content is valid.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Q40–Q45 are accepted as DEC-042–DEC-047. See the \u003ca href=\"#/journal/2026-10-05-editor-saving\">editor/saving journal\u003c/a>. Concrete definitions, engineering recommendations, and verification targets are consolidated in \u003ca href=\"#/discussions/technical-contracts\">technical contracts\u003c/a>. No further questionnaire is needed for the scoped design.\u003c/p>\n\u003cp>Base UI supplies unstyled React primitives and documents tree-shakable imports and CSS Modules usage: \u003ca href=\"https://base-ui.com/react/overview/quick-start\" rel=\"noreferrer\">quick start\u003c/a>. This is the selected editor library; grill-form remains native HTML.\u003c/p>\n\u003cp>For Git transactions, the proposed engineering path creates a tree and commit based on the loaded draft head, then advances the branch without force. A concurrent branch advance to a divergent commit must reject the update; preserve local work and explain recovery. Q42 selects all pending edits in one commit. See GitHub's \u003ca href=\"https://docs.github.com/en/rest/git/trees#create-a-tree\" rel=\"noreferrer\">trees\u003c/a>, \u003ca href=\"https://docs.github.com/en/rest/git/commits#create-a-commit\" rel=\"noreferrer\">commits\u003c/a>, and \u003ca href=\"https://docs.github.com/en/rest/git/refs#update-a-reference\" rel=\"noreferrer\">reference updates\u003c/a>. This is a design proposal requiring race-condition testing, not a claim that a preflight read alone provides locking.\u003c/p>\n\u003cp>Research: Astro supports static prerendering and multiple UI framework integrations, but \u003ccode>.astro\u003c/code> templates have no browser component runtime. A live unsaved editor requires browser-renderable implementations. See \u003ca href=\"https://docs.astro.build/en/guides/on-demand-rendering/\" rel=\"noreferrer\">static rendering\u003c/a> and \u003ca href=\"https://docs.astro.build/en/guides/framework-components/\" rel=\"noreferrer\">framework components\u003c/a>. JSON Schema supplies a portable validation vocabulary; editor controls/layout still need UI metadata. See \u003ca href=\"https://json-schema.org/overview/what-is-jsonschema\" rel=\"noreferrer\">JSON Schema\u003c/a>. An iframe creates a separate browsing context; using it isolates document styling but does not share live framework instances with the parent. See \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/iframe\" rel=\"noreferrer\">iframe\u003c/a>. The shared-document preview boundary was selected in Q31.\u003c/p>\n\u003ch2 id=\"resolved-in-round-two\">Resolved in round two\u003c/h2>\n\u003cp>Q8–Q14 are resolved by DEC-009 through DEC-015 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>: convenience login, both repository visibilities, individual tokens, Netlify-managed deployment, shared page/post block editing, browser previews, and developer-installed blocks.\u003c/p>\n\u003ch2 id=\"resolved-in-round-three\">Resolved in round three\u003c/h2>\n\u003cp>Q15–Q17 and Q19 are resolved by DEC-016–DEC-018 and DEC-020: tab-session tokens, developer and portal collection schemas, simple shared drafts, and optional global styling. Q18 establishes R2 storage (DEC-019) but leaves upload authorization and media type scope open.\u003c/p>\n\u003ch2 id=\"resolved-in-round-four\">Resolved in round four\u003c/h2>\n\u003cp>Q20–Q24 are resolved by DEC-021–DEC-025 in the \u003ca href=\"#/decisions/index\">decision register\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Question\u003c/th>\n\u003cth>Outcome\u003c/th>\n\u003cth>Scope\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Q20\u003c/td>\n\u003ctd>Runtime editor-supplied R2 credentials\u003c/td>\n\u003ctd>Keep the application static; no secret-holding upload helper.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q21\u003c/td>\n\u003ctd>Basic fields and safe schema changes\u003c/td>\n\u003ctd>No nested models, relations, or migration tooling initially.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q22\u003c/td>\n\u003ctd>Automatic standard listing and entry pages\u003c/td>\n\u003ctd>Existing block editor supplies entry bodies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q23\u003c/td>\n\u003ctd>Simple image resizing and light compression\u003c/td>\n\u003ctd>Generate web image sets for sufficiently large images; no audio/video transcoding.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Q24\u003c/td>\n\u003ctd>Media URLs may be public before Publish\u003c/td>\n\u003ctd>Page publication remains separate.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"engineering-work-for-the-implementation-plan\">Engineering work for the implementation plan\u003c/h2>\n\u003cp>Define the content/schema file formats, block authoring and preview interfaces, dependency sharing, Git save/merge concurrency handling, schema compatibility validation, and upload metadata. Propose concrete starter blocks and validation scenarios. Choose image widths/encodings/limits and browser fallbacks, and document repository permissions and R2 CORS setup. The contract definitions now specify these behaviors. Exact library pins, build integration, limits, and validation fixtures remain engineering work. No unimplemented behavior is certified by the interview or wiki checks.\u003c/p>\n\u003cp>R2 credential retention was not separately selected; propose the same tab-session behavior as GitHub when specifying the editor session. Do not mistake that proposed default for an explicitly answered question. The optional future capabilities excluded above can be reconsidered if the user expands scope.\u003c/p>\n\u003ch2 id=\"research\">Research\u003c/h2>\n\u003cp>Astro documents that its Vite-provided environment values are statically replaced at build time and that public variables are available to client code. The inference for a fully static editor is that checking a configured credential in client code is a UI gate, not server-enforced authorization. \u003ca href=\"https://docs.astro.build/en/guides/environment-variables/\" rel=\"noreferrer\">Environment variables\u003c/a>.\u003c/p>\n\u003cp>GitHub documents repository-scoped fine-grained tokens and branch merging through its API. Exact required permissions and branch protection compatibility must be validated in implementation. \u003ca href=\"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens\" rel=\"noreferrer\">Personal access tokens\u003c/a>, \u003ca href=\"https://docs.github.com/en/rest/branches/branches#merge-a-branch\" rel=\"noreferrer\">branch API\u003c/a>.\u003c/p>\n\u003cp>GitHub Pages offers static hosting; private-repository availability depends on the account plan. This is a deployment option, not an accepted provider choice. \u003ca href=\"https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages\" rel=\"noreferrer\">GitHub Pages\u003c/a>.\u003c/p>\n","backlinks":["index","decisions/index","journal/2026-10-05-round-one-decisions","journal/2026-10-05-round-three-decisions","journal/2026-10-05-round-two-decisions"]},{"id":"discussions/technical-contracts","title":"Technical contracts","section":"Discussions","order":0,"metadata":{"status":"Specified; implementation unverified"},"metadataHtml":"\u003cspan>Status: Specified; implementation unverified\u003c/span> \u003cspan>Last updated: 2026-10-05\u003c/span>","updated":"2026-10-05","summary":"","source":"---\ntitle: Technical contracts\nupdated: 2026-10-05\nstatus: Specified; implementation unverified\n---\n# Technical contracts\n\nThe accepted foundation and contract choices are DEC-026–DEC-047 in the [decision register](../decisions/index.md). The technical interview is complete. Concrete definitions below are engineering specifications derived from those decisions, not implemented or verified APIs. Supporting library choices and exact adapter integration remain subject to implementation validation.\n\n## Shared dependencies — Q33\n\nAccepted: build-generated self-hosted vendor modules. Proposed mechanics: a site-owned dependency registry and lockfile. Block manifests declare compatible ranges; imports resolve to the site's selected versions. Incompatible requirements fail validation rather than silently installing another framework runtime or rewriting compatibility declarations. Emit minified, hashed ESM vendor/shared chunks in the site's static output. Block entry points import the same module URLs; load only the graph required by the current page or preview. Retained deprecated block implementations must follow the same compatibility rule.\n\nUse the build's module graph instead of requiring every package to be a single manually maintained script. Packages may have multiple entry points and transitive dependencies. Sharing must include the React editor, block adapters, and block widgets. Build output inspection and browser checks must verify the result; a configuration flag alone is not proof.\n\nVite documents resolving duplicated dependencies to a root copy, along with limitations for certain SSR ESM outputs: [resolve.dedupe](https://vite.dev/config/shared-options#resolve-dedupe). Its [production build](https://vite.dev/guide/build) manages emitted assets. Browser [import maps](https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/script/type/importmap) can map names to module URLs, but do not make incompatible package APIs compatible. Exact implementation must match the Vite version bundled with the chosen Astro release; versions have not been pinned.\n\n## Documents and identity — Q34\n\nAccepted: immutable record IDs and ID-based filenames, with editable paths/slugs stored inside. Draft concrete page shape:\n\n```json\n{\n  \"formatVersion\": 1,\n  \"id\": \"page_about\",\n  \"path\": \"/about\",\n  \"title\": \"About\",\n  \"blocks\": [\n    {\n      \"id\": \"block_intro\",\n      \"type\": \"core/hero\",\n      \"version\": 1,\n      \"props\": { \"heading\": \"About us\" }\n    }\n  ]\n}\n```\n\nProposed path: `content/pages/\u003cid>.json`. Entries use `content/entries/\u003ccollectionId>/\u003cid>.json` with `collectionId`, `slug`, custom `values`, and ordered `blocks`. Definitions live in `content/collections/\u003cid>.json`; settings and media metadata have separate records. Example IDs above are readable placeholders; the concrete definitions below specify ID generation. Reserved route validation is required before publishing. Draft/main branches determine publication; no second per-record publication flag is implied.\n\n## Text inside blocks — Q35\n\nAccepted: JSON remains the outer format, with Markdown strings for formatted prose inside text blocks. Use a shared renderer and a restricted safe feature set. This does not add arbitrary executable Markdown/MDX or change the accepted collection field scope. Users edit through visual formatting controls for headings, paragraphs, emphasis, links, and lists. Unsupported externally edited Markdown must be preserved or explicitly rejected for visual editing, never silently discarded on a round-trip.\n\n## Versioning — Q36\n\nAccepted: retain old implementations, mark them deprecated, and let users explicitly choose the block version. A block instance's `type` plus `version` selects its renderer and field definition. Deprecated means still renderable and selectable, not automatically upgraded. No automated migration functions.\n\nOn an explicit version switch, carry over fields only when keys and value types remain compatible with the target definition. New, renamed, incompatible, or otherwise unmatched target fields begin empty for manual entry; do not guess mappings or silently fill new fields with defaults. Preserve the original instance during the unsaved edit so cancellation can restore it. Save is the boundary for persisting the new version. Required empty values may be saved in drafts but block Publish.\n\nProposed source layout: `src/blocks/\u003cname>/v1/`, `v2/`, each with its own definition and renderer. The registry maps `(type, version)` to an installed implementation. Newly added instances default to the latest nondeprecated version; the version selector still exposes retained versions. Keep an independent `formatVersion` on file envelopes. If an implementation is genuinely missing, preserve its raw data and show a repairable error rather than dropping the instance. These guardrails preserve the user's manual model without inventing a migration subsystem.\n\n## Block manifest and rendering — Q37\n\nIllustrative source organization: `src/blocks/\u003cname>/definition.ts`, a shared rendering component/template, optional styles, and optional custom widgets. An explicit registry imports installed blocks. A definition declares a stable type, data version, fields/defaults, framework, renderer entries, dependency requirements, and activation policy. Content JSON only names the block type and supplies JSON values; it contains no import paths or executable callbacks.\n\nAccepted: framework adapters around ordinary React/Svelte/Vue components; vanilla/custom blocks implement the same lifecycle directly. Draft signature:\n\n```ts\ninterface PreviewHandle\u003cProps> {\n  update(props: Props, context: BlockContext): void;\n  destroy(): void;\n}\ntype Mount\u003cProps> = (\n  host: HTMLElement,\n  props: Props,\n  context: BlockContext\n) => PreviewHandle\u003cProps>;\n```\n\nThe host is a stable block root. Updates receive the complete structurally valid props object, which may contain blank or missing draft values; preview renderers must tolerate these and show placeholders. Public renderers receive publish-valid values. Removal cleans up listeners, subscriptions, and the framework root. Reordering preserves instance IDs and avoids remounting unnecessarily. The build renderer consumes the same validated props/context through Astro's static rendering path. Astro integration details must be validated before treating this as a final interface.\n\nProposed context contains stable instance identity, optional global theme/settings, and media/reference resolution. GitHub/R2 clients and credentials are not passed as block props. This is an API separation, not a security sandbox: developer-installed code in the same document is trusted code.\n\nCustom field widgets are React components that receive a JSON value, change callback, field configuration, and validation/read-only state. Their saved values still pass the field schema. Exact signatures depend on the answers and must remain small.\n\n## Activation — Q38\n\nAccepted: a block declaration of `never`, `visible`, `idle`, or `load` for public-page browser activation, with complete static HTML where appropriate. Preview always mounts the necessary renderer so edits appear immediately; this differs from public hydration policy. Framework runtime/dependency loading is shared, regardless of when block instances activate. Astro provides these public hydration modes; see [client directives](https://docs.astro.build/en/reference/directives-reference/#client-directives). Custom adapters must honor equivalent behavior where Astro directives do not apply directly.\n\n## References — Q39\n\nAccepted: stable IDs for internal page/entry/media references, with explicit URLs for external links. Proposed record detail: media records contain R2 object URLs, image variants, dimensions, MIME type, and size. Blocks reference media IDs plus presentation data such as alt text. The build resolves IDs to URLs; published pages need not fetch the source metadata registry. This avoids duplicating a variant set into every block but adds a reference-resolution step.\n\n\n\n## Supporting stack choices\n\nThe selected core is Astro/TypeScript, React, Base UI, and CSS Modules, with Astro's compatible Vite toolchain. Use native controls where sufficient. Blocks use React/Svelte/Vue integrations or the vanilla adapter. Exact package versions must be pinned together during scaffolding; illustrative versions mentioned in answers are not pins.\n\nEngineering recommendations for remaining supporting tools:\n\n- Octokit for the requested browser GitHub SDK, importing only required client/API features. Its [official repository](https://github.com/octokit/octokit.js) documents browser support.\n- AWS SDK v3 S3 client for R2, loaded with the media editor. Cloudflare supplies an [R2 example](https://developers.cloudflare.com/r2/examples/aws/aws-sdk-js-v3/).\n- Lexical's React integration with a restricted Markdown transformer set as the visual-editor candidate. Its [Markdown package](https://lexical.dev/docs/packages/lexical-markdown) supports import/export and selectable transformers. Verify fidelity and bundle cost before adoption; do not persist Lexical's internal document format as the content source.\n- pnpm with one lockfile and a Node version supported by the selected Astro release. No separate independently bundled copy of the admin's React runtime.\n\nThese recommendations identify an implementation direction, not user-approved package pins or measured integration results.\n\n## Concrete record definitions\n\nThese are the initial engineering definitions. Use JSON with two-space indentation and a final newline. Sort object keys consistently where meaningful; preserve array order for blocks, navigation, fields, and select options. Generate IDs once using UUIDs with entity prefixes; the shorter readable IDs in examples are illustrative. Renaming a route does not rename its ID file.\n\n```ts\ntype JsonValue = null | boolean | number | string | JsonValue[] | JsonObject;\ninterface JsonObject { [key: string]: JsonValue }\ninterface Envelope { formatVersion: 1; id: string }\ninterface BlockInstance {\n  id: string;\n  type: string;          // e.g. core/hero\n  version: number;      // installed implementation version\n  props: JsonObject;\n}\ninterface PageRecord extends Envelope {\n  path: string;         // absolute public route\n  title: string;\n  blocks: BlockInstance[];\n}\ninterface EntryRecord extends Envelope {\n  collectionId: string;\n  slug: string;         // route segment under the collection\n  values: JsonObject;\n  blocks: BlockInstance[];\n}\ninterface CollectionRecord extends Envelope {\n  name: string;\n  path: string;\n  fields: FieldSpec[];\n  titleField: string;   // key of a text field in values\n  template: \"standard\";\n}\ntype LinkRef =\n  | { kind: \"page\" | \"entry\"; id: string; fragment?: string }\n  | { kind: \"external\"; url: string };\ninterface MediaRef { mediaId: string; alt?: string }\ninterface MediaFile {\n  key: string; url: string; mime: string; bytes: number;\n  width?: number; height?: number;\n}\ninterface MediaRecord extends Envelope {\n  name: string;\n  original: MediaFile;\n  variants: MediaFile[];\n}\ninterface SiteRecord extends Envelope {\n  title: string;\n  globals: JsonObject;\n  navigation: { id: string; label: string; to: LinkRef }[];\n}\n```\n\nFiles live under `content/pages/`, `content/entries/\u003ccollectionId>/`, `conten
