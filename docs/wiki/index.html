updated":"2026-10-06","summary":"","source":"---\ntitle: Gutter drop regression verification\nupdated: 2026-10-06\nresult: Untested\n---\n# Gutter drop regression verification\n\n## Scope\n\n[FEAT-editor](../../features/editor.md) and [FEAT-block-library](../../features/block-library.md). The shared sortable list cleared its target when hit testing found the list's gap instead of an item. It also used the previous pointer-move target on release. The repair resolves gaps to adjacent insertion positions and hit-tests the actual release coordinates, retaining cancellation outside the originating list. This applies to page blocks and repeated content without changing spacing or the field model.\n\n## Build and environment\n\nDirty tree based on `02194ecefe35a72455ba807fcdd4c86566db0f8f`; macOS, Node 22.19.0, pnpm 10.34.1. Existing uncommitted work was preserved. [Source manifest](../../evidence/2026-10-06T0632Z-gutter-drop/source-manifest.json): 377 files, SHA-256 `143537d26e4e3f9cde5d14bfcfddb7bb3b459e2c6cbe88671571aed47f68ca75`. Mounted React tests use jsdom with explicit row bounds and browser-hit-test results.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Reproduce reported bug before repair | Gap drops fail on the old component; existing behavior remains covered | Six upward/downward gap cases and two final-release cases failed; nine existing cases passed | Passed | [Baseline log](../../evidence/2026-10-06T0632Z-gutter-drop/baseline.log) |\n| Drop throughout a gap, in either direction | Indicator remains visible, release inserts at the gap, no accidental item opening | Six cases cover near-top/middle/near-bottom points in an 8px gutter; all pass after repair | Passed | [Verify log](../../evidence/2026-10-06T0632Z-gutter-drop/verify.log) |\n| Resolve actual release location | Final gap release wins over an earlier row target; releasing outside cancels | Both regression cases pass; short-click, cancellation, disabled and keyboard cases still pass | Passed | Verify log |\n| Full application checks | Clean types, regressions, static build and artifact checks | `pnpm verify`: zero diagnostics, 97 tests across 16 files passed, six routes built, runtime/asset checks passed | Passed | Verify log |\n| Native pointer/browser check | Physical drag feedback and release match mounted event behavior | Not exercised because computer-use access remains restricted on the current browser URL | Untested | [Browser restriction record](2026-10-06T0619Z-catalog-polish.md) |\n\n## Limits and follow-up\n\nThe automated regression demonstrates the event-handler fix with explicit geometry; it does not prove native pointer capture or visual feedback across browsers. When browser access is available, drag repeated items up/down and release at several points within a gutter; verify the indicator and final order, then cancel by releasing outside the list. The aggregate remains Untested because that selected native check is outstanding. No provider data, content files, browser sessions or server processes were changed. Logs are retained, scratch logs removed; verification was by the implementing agent.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"gutter-drop-regression-verification","links":["features/editor","features/block-library","verification/runs/2026-10-06T0619Z-catalog-polish"],"attachments":[{"path":"evidence/2026-10-06T0632Z-gutter-drop/source-manifest.json","sha256":"143537d26e4e3f9cde5d14bfcfddb7bb3b459e2c6cbe88671571aed47f68ca75"},{"path":"evidence/2026-10-06T0632Z-gutter-drop/baseline.log","sha256":"ee8ea4bbd920f5f94c92d17640339bed0ed6ad51345b4703bd3065b14fe66d39"},{"path":"evidence/2026-10-06T0632Z-gutter-drop/verify.log","sha256":"1aab7bf71f9cd9e356e8a61ff63cb8a54d7e60a5a35ebd52fe7f386e6830cc77"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a> and \u003ca href=\"#/features/block-library\">FEAT-block-library\u003c/a>. The shared sortable list cleared its target when hit testing found the list's gap instead of an item. It also used the previous pointer-move target on release. The repair resolves gaps to adjacent insertion positions and hit-tests the actual release coordinates, retaining cancellation outside the originating list. This applies to page blocks and repeated content without changing spacing or the field model.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Dirty tree based on \u003ccode>02194ecefe35a72455ba807fcdd4c86566db0f8f\u003c/code>; macOS, Node 22.19.0, pnpm 10.34.1. Existing uncommitted work was preserved. \u003ca href=\"evidence/2026-10-06T0632Z-gutter-drop/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 143537d26e4e3f9cde5d14bfcfddb7bb3b459e2c6cbe88671571aed47f68ca75\">Source manifest\u003c/a>: 377 files, SHA-256 \u003ccode>143537d26e4e3f9cde5d14bfcfddb7bb3b459e2c6cbe88671571aed47f68ca75\u003c/code>. Mounted React tests use jsdom with explicit row bounds and browser-hit-test results.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Reproduce reported bug before repair\u003c/td>\n\u003ctd>Gap drops fail on the old component; existing behavior remains covered\u003c/td>\n\u003ctd>Six upward/downward gap cases and two final-release cases failed; nine existing cases passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-06T0632Z-gutter-drop/baseline.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ee8ea4bbd920f5f94c92d17640339bed0ed6ad51345b4703bd3065b14fe66d39\">Baseline log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Drop throughout a gap, in either direction\u003c/td>\n\u003ctd>Indicator remains visible, release inserts at the gap, no accidental item opening\u003c/td>\n\u003ctd>Six cases cover near-top/middle/near-bottom points in an 8px gutter; all pass after repair\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-06T0632Z-gutter-drop/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1aab7bf71f9cd9e356e8a61ff63cb8a54d7e60a5a35ebd52fe7f386e6830cc77\">Verify log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Resolve actual release location\u003c/td>\n\u003ctd>Final gap release wins over an earlier row target; releasing outside cancels\u003c/td>\n\u003ctd>Both regression cases pass; short-click, cancellation, disabled and keyboard cases still pass\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Full application checks\u003c/td>\n\u003ctd>Clean types, regressions, static build and artifact checks\u003c/td>\n\u003ctd>\u003ccode>pnpm verify\u003c/code>: zero diagnostics, 97 tests across 16 files passed, six routes built, runtime/asset checks passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native pointer/browser check\u003c/td>\n\u003ctd>Physical drag feedback and release match mounted event behavior\u003c/td>\n\u003ctd>Not exercised because computer-use access remains restricted on the current browser URL\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/runs/2026-10-06T0619Z-catalog-polish\">Browser restriction record\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>The automated regression demonstrates the event-handler fix with explicit geometry; it does not prove native pointer capture or visual feedback across browsers. When browser access is available, drag repeated items up/down and release at several points within a gutter; verify the indicator and final order, then cancel by releasing outside the list. The aggregate remains Untested because that selected native check is outstanding. No provider data, content files, browser sessions or server processes were changed. Logs are retained, scratch logs removed; verification was by the implementing agent.\u003c/p>\n","backlinks":["features/block-library","features/editor"]},{"id":"verification/runs/2026-10-06T0845Z-sortable-flip","title":"Optimistic FLIP sorting verification","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Optimistic FLIP sorting verification\nupdated: 2026-10-06\nresult: Untested\n---\n# Optimistic FLIP sorting verification\n\n## Scope\n\n[FEAT-editor](../../features/editor.md) and [FEAT-block-library](../../features/block-library.md). The user requested optimistic FLIP motion on all sortable lists, direct vertical carrying from mouse-down with X locked, removal of the blue insertion indicator, and commits even when released outside the list. Subsequent feedback named Chartr's sidebar space/session sorting as the behavioral reference.\n\n`BlockList` now holds a local display order, so page content and website rendering stay unchanged during a drag. A fixed inert overlay preserves the pointer's grab offset without sidebar clipping. Only displaced list rows receive FLIP motion while held; release settles the carried row into its committed slot. Capture starts on the button to preserve normal clicks and transfers to the stable list when dragging starts. Keyboard sorting, reduced motion, snapshot invalidation and explicit/system cancellation remain supported.\n\n## Build and environment\n\nDirty tree based on `02194ecefe35a72455ba807fcdd4c86566db0f8f`; macOS, Node 22.19.0, pnpm 10.34.1. [Source manifest](../../evidence/2026-10-06T0845Z-sortable-flip/source-manifest.json): 378 files, SHA-256 `ebd15ebf2bbd374354123dd5dc255aa6dc18e75108734fa5c545f58afcb2da12`. Existing uncommitted implementation work was preserved.\n\nRead-only Chartr reference: `components/list_sorter.rs`, `chrome/tab_sorter.rs` and `chrome/sidebar.rs` under its `crates/chartr/src/` directory. [Reference hashes](../../evidence/2026-10-06T0845Z-sortable-flip/chartr-reference.json) record the inspected source. Its held-row offsets, temporary model order, interruptible 150ms slides, variable-size geometry and 32px capped edge scrolling informed the implementation. The user's explicit outside-release requirement takes precedence over Chartr's lane-exit suspension/cancellation. No Chartr files were changed, and no native Chartr/browser visual comparison was performed.\n\nThe browser implementation uses [Element.animate](https://developer.mozilla.org/en-US/docs/Web/API/Element/animate) for list-only transforms and [pointer capture](https://developer.mozilla.org/en-US/docs/Web/API/Pointer_events) for continued tracking beyond the hit area. The 150ms cubic easing approximates Chartr's quintic ease-out rather than copying its Rust frame loop.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Local optimistic order and preview isolation | Hover reorders only the list; release commits once | Mounted controlled harness observes changed row order with unchanged committed content, then one commit on release | Passed | [Verify log](../../evidence/2026-10-06T0845Z-sortable-flip/verify.log), `tests/block-list.test.ts` |\n| Exact carrying and outside release | Preserve grab offset and X; movement outside continues; outside release commits | Pointer tests cover sub-threshold motion, large positive/negative X, continued Y movement, no early commit and successful release; inert overlay removed afterwards | Passed | Verify log |\n| FLIP, interruption and settle | Only neighbor rows animate while held; re-target from current visual position; held row settles on release | Animation-spy tests check displaced rows, interruption compensation, stable repeated targeting and final carried-row translation | Passed | Verify log |\n| Variable heights, gutters and scrolling | Use measured slots, retain gap drops and keep held row attached during scrolling | Up/down gap cases pass; mixed-height test checks 88px neighbor displacement and exact grab offset; frame-driven edge-scroll test checks bounded scrolling without overlay drift | Passed | Verify log |\n| Accessibility, lifecycle and invalidation | Clicks/keyboard work, reduced motion skips animation, canceled/conflicting work does not commit, resources stop | Keyboard/focus and short-click tests pass; reduced-motion, Escape/pointer-cancel/capture-loss, disabled/external changes, animation/frame cleanup and overlay unmount are covered | Passed | Verify log |\n| Full application verification | Clean types, tests, build and artifact checks | `pnpm verify` passed: zero diagnostics, 108 tests across 16 files, six routes built, shared-runtime/asset checks passed | Passed | Verify log |\n| Native motion and physical pointer check | Rendered motion matches the intended Chartr-like feel and native pointer capture behaves correctly | Not exercised: computer-use access remains restricted on the current browser URL | Untested | [Browser restriction record](2026-10-06T0619Z-catalog-polish.md) |\n\n## Limits and follow-up\n\nThe aggregate is Untested because native visual/physical interaction remains outstanding. Geometry, animation, hit boundaries and animation-frame progression are controlled in jsdom; these tests do not certify browser paint smoothness or physical mouse/touch behavior. When access is available, compare sidebar dragging with Chartr, including fast reversals, varied row heights, edge scrolling, releasing to either side, above/below the list, and reduced motion. Confirm the website preview changes only on release and remains unanimated.\n\nNo browser sessions, servers, provider actions or content files were changed. Evidence survives cleanup of owned scratch logs. Verification was by the implementing agent; no independent review is claimed.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"optimistic-flip-sorting-verification","links":["features/editor","features/block-library","verification/runs/2026-10-06T0619Z-catalog-polish"],"attachments":[{"path":"evidence/2026-10-06T0845Z-sortable-flip/source-manifest.json","sha256":"ebd15ebf2bbd374354123dd5dc255aa6dc18e75108734fa5c545f58afcb2da12"},{"path":"evidence/2026-10-06T0845Z-sortable-flip/chartr-reference.json","sha256":"8f5bc311dc50614e3bcb5308f2b2d4272b30942b4b31e8f34bccbe3e3fc92e8e"},{"path":"evidence/2026-10-06T0845Z-sortable-flip/verify.log","sha256":"63f48ecfe0e3ca99bb55de4ffa6ef4b9a18bf93c3bc536d8c33ae9c4ed60fc9d"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/editor\">FEAT-editor\u003c/a> and \u003ca href=\"#/features/block-library\">FEAT-block-library\u003c/a>. The user requested optimistic FLIP motion on all sortable lists, direct vertical carrying from mouse-down with X locked, removal of the blue insertion indicator, and commits even when released outside the list. Subsequent feedback named Chartr's sidebar space/session sorting as the behavioral reference.\u003c/p>\n\u003cp>\u003ccode>BlockList\u003c/code> now holds a local display order, so page content and website rendering stay unchanged during a drag. A fixed inert overlay preserves the pointer's grab offset without sidebar clipping. Only displaced list rows receive FLIP motion while held; release settles the carried row into its committed slot. Capture starts on the button to preserve normal clicks and transfers to the stable list when dragging starts. Keyboard sorting, reduced motion, snapshot invalidation and explicit/system cancellation remain supported.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Dirty tree based on \u003ccode>02194ecefe35a72455ba807fcdd4c86566db0f8f\u003c/code>; macOS, Node 22.19.0, pnpm 10.34.1. \u003ca href=\"evidence/2026-10-06T0845Z-sortable-flip/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ebd15ebf2bbd374354123dd5dc255aa6dc18e75108734fa5c545f58afcb2da12\">Source manifest\u003c/a>: 378 files, SHA-256 \u003ccode>ebd15ebf2bbd374354123dd5dc255aa6dc18e75108734fa5c545f58afcb2da12\u003c/code>. Existing uncommitted implementation work was preserved.\u003c/p>\n\u003cp>Read-only Chartr reference: \u003ccode>components/list_sorter.rs\u003c/code>, \u003ccode>chrome/tab_sorter.rs\u003c/code> and \u003ccode>chrome/sidebar.rs\u003c/code> under its \u003ccode>crates/chartr/src/\u003c/code> directory. \u003ca href=\"evidence/2026-10-06T0845Z-sortable-flip/chartr-reference.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 8f5bc311dc50614e3bcb5308f2b2d4272b30942b4b31e8f34bccbe3e3fc92e8e\">Reference hashes\u003c/a> record the inspected source. Its held-row offsets, temporary model order, interruptible 150ms slides, variable-size geometry and 32px capped edge scrolling informed the implementation. The user's explicit outside-release requirement takes precedence over Chartr's lane-exit suspension/cancellation. No Chartr files were changed, and no native Chartr/browser visual comparison was performed.\u003c/p>\n\u003cp>The browser implementation uses \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Element/animate\" rel=\"noreferrer\">Element.animate\u003c/a> for list-only transforms and \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Pointer_events\" rel=\"noreferrer\">pointer capture\u003c/a> for continued tracking beyond the hit area. The 150ms cubic easing approximates Chartr's quintic ease-out rather than copying its Rust frame loop.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Local optimistic order and preview isolation\u003c/td>\n\u003ctd>Hover reorders only the list; release commits once\u003c/td>\n\u003ctd>Mounted controlled harness observes changed row order with unchanged committed content, then one commit on release\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-06T0845Z-sortable-flip/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 63f48ecfe0e3ca99bb55de4ffa6ef4b9a18bf93c3bc536d8c33ae9c4ed60fc9d\">Verify log\u003c/a>, \u003ccode>tests/block-list.test.ts\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Exact carrying and outside release\u003c/td>\n\u003ctd>Preserve grab offset and X; movement outside continues; outside release commits\u003c/td>\n\u003ctd>Pointer tests cover sub-threshold motion, large positive/negative X, continued Y movement, no early commit and successful release; inert overlay removed afterwards\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FLIP, interruption and settle\u003c/td>\n\u003ctd>Only neighbor rows animate while held; re-target from current visual position; held row settles on release\u003c/td>\n\u003ctd>Animation-spy tests check displaced rows, interruption compensation, stable repeated targeting and final carried-row translation\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Variable heights, gutters and scrolling\u003c/td>\n\u003ctd>Use measured slots, retain gap drops and keep held row attached during scrolling\u003c/td>\n\u003ctd>Up/down gap cases pass; mixed-height test checks 88px neighbor displacement and exact grab offset; frame-driven edge-scroll test checks bounded scrolling without overlay drift\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Accessibility, lifecycle and invalidation\u003c/td>\n\u003ctd>Clicks/keyboard work, reduced motion skips animation, canceled/conflicting work does not commit, resources stop\u003c/td>\n\u003ctd>Keyboard/focus and short-click tests pass; reduced-motion, Escape/pointer-cancel/capture-loss, disabled/external changes, animation/frame cleanup and overlay unmount are covered\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Full application verification\u003c/td>\n\u003ctd>Clean types, tests, build and artifact checks\u003c/td>\n\u003ctd>\u003ccode>pnpm verify\u003c/code> passed: zero diagnostics, 108 tests across 16 files, six routes built, shared-runtime/asset checks passed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native motion and physical pointer check\u003c/td>\n\u003ctd>Rendered motion matches the intended Chartr-like feel and native pointer capture behaves correctly\u003c/td>\n\u003ctd>Not exercised: computer-use access remains restricted on the current browser URL\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/runs/2026-10-06T0619Z-catalog-polish\">Browser restriction record\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>The aggregate is Untested because native visual/physical interaction remains outstanding. Geometry, animation, hit boundaries and animation-frame progression are controlled in jsdom; these tests do not certify browser paint smoothness or physical mouse/touch behavior. When access is available, compare sidebar dragging with Chartr, including fast reversals, varied row heights, edge scrolling, releasing to either side, above/below the list, and reduced motion. Confirm the website preview changes only on release and remains unanimated.\u003c/p>\n\u003cp>No browser sessions, servers, provider actions or content files were changed. Evidence survives cleanup of owned scratch logs. Verification was by the implementing agent; no independent review is claimed.\u003c/p>\n","backlinks":["index","features/block-library","features/editor"]},{"id":"verification/runs/2026-10-06T1320Z-block-library","title":"Block library implementation verification","section":"Verification","order":0,"metadata":{"result":"Untested"},"metadataHtml":"\u003cspan>Result: Untested\u003c/span> \u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Block library implementation verification\nupdated: 2026-10-06\nresult: Untested\n---\n# Block library implementation verification\n\n## Scope\n\n[FEAT-block-library](../../features/block-library.md), [FEAT-editor](../../features/editor.md), [FEAT-static-blocks](../../features/static-blocks.md) and [FEAT-generic-pages](../../features/generic-pages.md). Covers the accepted catalog/layout/list/shared-chrome/form increment. The aggregate is **Untested** because the final production-browser mount check lost UI access; completed automated and development-browser scenarios passed.\n\n## Build and environment\n\nDirty tree based on `02194ecefe35a72455ba807fcdd4c86566db0f8f`; macOS, Node 22.19.0, pnpm 10.34.1, native Safari. The [source manifest](../../evidence/2026-10-06T1320Z-block-library/source-manifest.json) fingerprints 282 application, test, content and configuration files. Manifest SHA-256: `5c2bb2c4f4a2401d0be0511dc7979a9bf27b2b87682006e1bac3fcecd2069af3`.\n\nDevelopment instance: pre-existing `127.0.0.1:4321`; isolated test window and `/admin/?verify=block-library-20261006`, without provider saves. A temporary public composition used the same renderer sources and an owned loopback form endpoint at port 4338. It was removed before the final build. Production preview at port 4339 served the final build for an HTTP check; both owned servers were subsequently stopped.\n\n## Results\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Type/build/regression checks | Clean diagnostics, tests, static build and asset checks | `pnpm verify`: zero diagnostics, 89 tests in 16 files passed, six routes built, one copy of each framework runtime | Passed | [Verify log](../../evidence/2026-10-06T1320Z-block-library/verify.log) |\n| Catalog contract | Theme/tag/name filtering, separate Preview and direct Add, kind/placement/version constraints | Mounted tests cover combinations, reset, mobile preview and single insertion; Safari search/preview/add worked. Catalog sizing and stacking defects found in an earlier inspection were fixed before the successful check | Passed | [Browser observations](../../evidence/2026-10-06T1320Z-block-library/browser-observations.txt), verify log |\n| Repeated fields and recovery | Edit/add/remove/order, stable IDs and reload persistence | Mounted tests cover edit/add/delete/keyboard order. Safari edited and pointer-dragged a FAQ row, then verified its value and order after reload | Passed | Browser observations, verify log |\n| Schema lists and bindings | One-level row schema, typed mappings, required children, fallback, populated-key protection | Contract tests cover malformed data, incompatible rows, required values, empty fallback, serialization and protected child keys | Passed | Verify log |\n| Variant rendering | 45 base + 27 generic variants, safe default/empty/long rendering | All 72 render without throwing across the three input scenarios, with escaped content and disabled preview forms; representative public composition included all 15 categories | Passed | Verify log, browser observations |\n| Collection-backed cards | Mapped entry values and valid routes, no unrelated field leakage | Tests check compatible mappings/scoped context; public fixture showed real Journal titles, summaries and entry links | Passed | Verify log, browser observations |\n| Shared header/footer | Shared settings, grouped keyboard/mobile links, selected-footer generation | Safari chose a footer in Site. Public disclosures opened with pointer and keyboard at desktop/375px container widths; mobile footer fit. Tests cover round trips, legacy fallback, placement and selected generated imports | Passed | Browser observations, verify log |\n| Native forms | Required inputs, real POST, honest success/error, no preview submissions | Safari required-field validation blocked an empty form. Two test-only POSTs reached the owned endpoint, yielding success and controlled 503 response. Preview rendering tests verify disabled submission | Passed | [Requests](../../evidence/2026-10-06T1320Z-block-library/form-requests.log), browser observations |\n| Generation/runtime behavior | No directory-removal race, no duplicated runtimes or editor/provider code in public routes | Generator test verifies unchanged-file timestamps and stale-file pruning. Final artifact checks pass; journal/index and both entry routes retain zero JavaScript modules | Passed | Verify log |\n| Final production-browser mount | Admin React UI mounts from built assets | Production `/admin/` returned HTTP 200, but native UI returned `cgWindowNotFound` for both browsers and after reset; mounting was not observed | Untested | Browser observations |\n\n## Limits and follow-up\n\nRepeat only the final production-browser smoke check when UI access is available. Browser sampling is not a full visual/device matrix for all 72 layouts. Physical mobile devices, third-party form service behavior, live GitHub/R2 saves and Netlify deployment were not selected; none were changed. Forms rely on their configured endpoint's response page.\n\nThe temporary page, endpoint, production-preview process and scratch logs were cleaned up; evidence remains. The original development server was preserved. UI access loss prevented confirmation of test-window closure, so no unrelated browser sessions were touched. Verification was performed by the implementing agent; no independent review is claimed.\n","toc":[{"id":"scope","title":"Scope","depth":2},{"id":"build-and-environment","title":"Build and environment","depth":2},{"id":"results","title":"Results","depth":2},{"id":"limits-and-follow-up","title":"Limits and follow-up","depth":2}],"titleAnchor":"block-library-implementation-verification","links":["features/block-library","features/editor","features/static-blocks","features/generic-pages"],"attachments":[{"path":"evidence/2026-10-06T1320Z-block-library/source-manifest.json","sha256":"5c2bb2c4f4a2401d0be0511dc7979a9bf27b2b87682006e1bac3fcecd2069af3"},{"path":"evidence/2026-10-06T1320Z-block-library/verify.log","sha256":"2a1dee90d41fda947070d4bff3c4b01079c76bfa4dab42eec46dc65e6b0fb4d1"},{"path":"evidence/2026-10-06T1320Z-block-library/browser-observations.txt","sha256":"e4030222b74a3556cf62a17c12bb7877f37cf17c1ee2eefa3acb93cfa2b8bc93"},{"path":"evidence/2026-10-06T1320Z-block-library/form-requests.log","sha256":"e7192874ca79a722f340cf0e4fd65b1a97a2f670f389a32dc9586540a5a8a32d"}],"html":"\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003ca href=\"#/features/block-library\">FEAT-block-library\u003c/a>, \u003ca href=\"#/features/editor\">FEAT-editor\u003c/a>, \u003ca href=\"#/features/static-blocks\">FEAT-static-blocks\u003c/a> and \u003ca href=\"#/features/generic-pages\">FEAT-generic-pages\u003c/a>. Covers the accepted catalog/layout/list/shared-chrome/form increment. The aggregate is \u003cstrong>Untested\u003c/strong> because the final production-browser mount check lost UI access; completed automated and development-browser scenarios passed.\u003c/p>\n\u003ch2 id=\"build-and-environment\">Build and environment\u003c/h2>\n\u003cp>Dirty tree based on \u003ccode>02194ecefe35a72455ba807fcdd4c86566db0f8f\u003c/code>; macOS, Node 22.19.0, pnpm 10.34.1, native Safari. The \u003ca href=\"evidence/2026-10-06T1320Z-block-library/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5c2bb2c4f4a2401d0be0511dc7979a9bf27b2b87682006e1bac3fcecd2069af3\">source manifest\u003c/a> fingerprints 282 application, test, content and configuration files. Manifest SHA-256: \u003ccode>5c2bb2c4f4a2401d0be0511dc7979a9bf27b2b87682006e1bac3fcecd2069af3\u003c/code>.\u003c/p>\n\u003cp>Development instance: pre-existing \u003ccode>127.0.0.1:4321\u003c/code>; isolated test window and \u003ccode>/admin/?verify=block-library-20261006\u003c/code>, without provider saves. A temporary public composition used the same renderer sources and an owned loopback form endpoint at port 4338. It was removed before the final build. Production preview at port 4339 served the final build for an HTTP check; both owned servers were subsequently stopped.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Type/build/regression checks\u003c/td>\n\u003ctd>Clean diagnostics, tests, static build and asset checks\u003c/td>\n\u003ctd>\u003ccode>pnpm verify\u003c/code>: zero diagnostics, 89 tests in 16 files passed, six routes built, one copy of each framework runtime\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-06T1320Z-block-library/verify.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 2a1dee90d41fda947070d4bff3c4b01079c76bfa4dab42eec46dc65e6b0fb4d1\">Verify log\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Catalog contract\u003c/td>\n\u003ctd>Theme/tag/name filtering, separate Preview and direct Add, kind/placement/version constraints\u003c/td>\n\u003ctd>Mounted tests cover combinations, reset, mobile preview and single insertion; Safari search/preview/add worked. Catalog sizing and stacking defects found in an earlier inspection were fixed before the successful check\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-06T1320Z-block-library/browser-observations.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e4030222b74a3556cf62a17c12bb7877f37cf17c1ee2eefa3acb93cfa2b8bc93\">Browser observations\u003c/a>, verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Repeated fields and recovery\u003c/td>\n\u003ctd>Edit/add/remove/order, stable IDs and reload persistence\u003c/td>\n\u003ctd>Mounted tests cover edit/add/delete/keyboard order. Safari edited and pointer-dragged a FAQ row, then verified its value and order after reload\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Browser observations, verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Schema lists and bindings\u003c/td>\n\u003ctd>One-level row schema, typed mappings, required children, fallback, populated-key protection\u003c/td>\n\u003ctd>Contract tests cover malformed data, incompatible rows, required values, empty fallback, serialization and protected child keys\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Variant rendering\u003c/td>\n\u003ctd>45 base + 27 generic variants, safe default/empty/long rendering\u003c/td>\n\u003ctd>All 72 render without throwing across the three input scenarios, with escaped content and disabled preview forms; representative public composition included all 15 categories\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log, browser observations\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Collection-backed cards\u003c/td>\n\u003ctd>Mapped entry values and valid routes, no unrelated field leakage\u003c/td>\n\u003ctd>Tests check compatible mappings/scoped context; public fixture showed real Journal titles, summaries and entry links\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log, browser observations\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shared header/footer\u003c/td>\n\u003ctd>Shared settings, grouped keyboard/mobile links, selected-footer generation\u003c/td>\n\u003ctd>Safari chose a footer in Site. Public disclosures opened with pointer and keyboard at desktop/375px container widths; mobile footer fit. Tests cover round trips, legacy fallback, placement and selected generated imports\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Browser observations, verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Native forms\u003c/td>\n\u003ctd>Required inputs, real POST, honest success/error, no preview submissions\u003c/td>\n\u003ctd>Safari required-field validation blocked an empty form. Two test-only POSTs reached the owned endpoint, yielding success and controlled 503 response. Preview rendering tests verify disabled submission\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-10-06T1320Z-block-library/form-requests.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: e7192874ca79a722f340cf0e4fd65b1a97a2f670f389a32dc9586540a5a8a32d\">Requests\u003c/a>, browser observations\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Generation/runtime behavior\u003c/td>\n\u003ctd>No directory-removal race, no duplicated runtimes or editor/provider code in public routes\u003c/td>\n\u003ctd>Generator test verifies unchanged-file timestamps and stale-file pruning. Final artifact checks pass; journal/index and both entry routes retain zero JavaScript modules\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>Verify log\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Final production-browser mount\u003c/td>\n\u003ctd>Admin React UI mounts from built assets\u003c/td>\n\u003ctd>Production \u003ccode>/admin/\u003c/code> returned HTTP 200, but native UI returned \u003ccode>cgWindowNotFound\u003c/code> for both browsers and after reset; mounting was not observed\u003c/td>\n\u003ctd>Untested\u003c/td>\n\u003ctd>Browser observations\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"limits-and-follow-up\">Limits and follow-up\u003c/h2>\n\u003cp>Repeat only the final production-browser smoke check when UI access is available. Browser sampling is not a full visual/device matrix for all 72 layouts. Physical mobile devices, third-party form service behavior, live GitHub/R2 saves and Netlify deployment were not selected; none were changed. Forms rely on their configured endpoint's response page.\u003c/p>\n\u003cp>The temporary page, endpoint, production-preview process and scratch logs were cleaned up; evidence remains. The original development server was preserved. UI access loss prevented confirmation of test-window closure, so no unrelated browser sessions were touched. Verification was performed by the implementing agent; no independent review is claimed.\u003c/p>\n","backlinks":["index","discussions/block-library","features/block-library","features/editor","features/generic-pages","features/static-blocks","journal/2026-10-06-block-library-implementation"]},{"id":"verification/setup","title":"Verification setup","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-10-06\u003c/span>","updated":"2026-10-06","summary":"","source":"---\ntitle: Verification setup\nupdated: 2026-10-06\n---\n# Verification setup\n\nRun from the lean-sitebuilder repository with Node 22.12+ and pinned pnpm 10.34.1. The initial run used macOS, Node 22.19.0, and Helium via the native computer-use tool.\n\n## Commands and readiness\n\n```sh\npnpm install --frozen-lockfile\npnpm verify\npnpm preview --port 4321\n```\n\nThe preview serves the built static `dist/` on `http://127.0.0.1:4321`. Check `/` and `/admin/` return HTTP 200. Use a different explicit port if another process owns 4321; do not stop unrelated processes. `pnpm dev` is the source development alternative. Re-run it after adding routes or changing registrations, because generation happens before startup.\n\nFor editor startup changes, exercise `/admin/` in both development and production preview. HTTP 200 and a successful build do not prove that React mounted: verify the Pages table and main sidebar first, then open a page row to check the drawer and live preview, change a block field and cancel it, and check the browser console. The [startup repair](runs/2026-10-05T0910Z-admin-startup.md) caught a development-only missing React preamble that the initial production checks missed.\n\n## Identity and isolation\n\nRecord `git rev-parse HEAD` and dirty status. Hash application files, tests, content, configuration, and lockfile for a dirty build; the initial report links its manifest. `pnpm build` produces `.astro/client-graph.json`; `pnpm check:build` verifies output references/sharing and reports gzip module sizes. These sizes exclude dynamically loaded editor tools and runtime-fetched content; they are not a full page transfer measurement.\n\nUse a fresh browser tab for local fixtures. No password or provider configuration is needed for local editing. Session recovery survives reload; Site → Discard edits resets to the loaded baseline. Browser-only changes do not alter local content files. Do not reuse the user's unrelated tabs or data as fixtures.\n\n## Available drivers and fixtures\n\n- Vitest unit tests cover JSON validation/versioning, Git transactions through a fake transport, recovery storage, React/Vue lifecycle, activation policy, Markdown import/export, Lexical mounting, and media uploads through mocked SDK/canvas APIs.\n- Production artifact checks inspect real emitted files and their module graph.\n- Native browser automation can drive the actual editor. The initial run lost window access; the startup repair subsequently verified development editing and production mounting/interactions in Safari.\n- Live GitHub/R2/Netlify checks require separately configured disposable resources and credentials. None were available or modified during the initial run.\n\nPublic fixtures are Home, Block examples, an explicit static Journal index, and two entries rendered through the Journal entry generic page. Generic pages are editable under Pages but have no standalone public route. Main and draft content live in Git once connected; the local demo is read-only at the filesystem boundary.\n\n## Evidence and cleanup\n\nStore outcome logs, source manifests, and observations under `evidence/\u003crun-id>/`, without tokens or private content. Link them from the run. Preserve evidence before cleanup.\n\nAstro 7 starts this preview in the background. Check `pnpm exec astro preview status`, then stop the owned instance with `pnpm exec astro preview stop`; verify status reports no running preview. Do not rely on closing its launcher terminal. Close/reset test tabs when the browser tool is available; if it is not, record remaining browser-only fixture edits instead of manipulating another session. Remove any exported test backups only when their identity is known. There are no polling collectors or background provider workers.\n","toc":[{"id":"commands-and-readiness","title":"Commands and readiness","depth":2},{"id":"identity-and-isolation","title":"Identity and isolation","depth":2},{"id":"available-drivers-and-fixtures","title":"Available drivers and fixtures","depth":2},{"id":"evidence-and-cleanup","title":"Evidence and cleanup","depth":2}],"titleAnchor":"verification-setup","links":["verification/runs/2026-10-05T0910Z-admin-startup"],"attachments":[],"html":"\u003cp>Run from the lean-sitebuilder repository with Node 22.12+ and pinned pnpm 10.34.1. The initial run used macOS, Node 22.19.0, and Helium via the native computer-use tool.\u003c/p>\n\u003ch2 id=\"commands-and-readiness\">Commands and readiness\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">pnpm install --frozen-lockfile\npnpm verify\npnpm preview --port 4321\n\u003c/code>\u003c/pre>\n\u003cp>The preview serves the built static \u003ccode>dist/\u003c/code> on \u003ccode>http://127.0.0.1:4321\u003c/code>. Check \u003ccode>/\u003c/code> and \u003ccode>/admin/\u003c/code> return HTTP 200. Use a different explicit port if another process owns 4321; do not stop unrelated processes. \u003ccode>pnpm dev\u003c/code> is the source development alternative. Re-run it after adding routes or changing registrations, because generation happens before startup.\u003c/p>\n\u003cp>For editor startup changes, exercise \u003ccode>/admin/\u003c/code> in both development and production preview. HTTP 200 and a successful build do not prove that React mounted: verify the Pages table and main sidebar first, then open a page row to check the drawer and live preview, change a block field and cancel it, and check the browser console. The \u003ca href=\"#/verification/runs/2026-10-05T0910Z-admin-startup\">startup repair\u003c/a> caught a development-only missing React preamble that the initial production checks missed.\u003c/p>\n\u003ch2 id=\"identity-and-isolation\">Identity and isolation\u003c/h2>\n\u003cp>Record \u003ccode>git rev-parse HEAD\u003c/code> and dirty status. Hash application files, tests, content, configuration, and lockfile for a dirty build; the initial report links its manifest. \u003ccode>pnpm build\u003c/code> produces \u003ccode>.astro/client-graph.json\u003c/code>; \u003ccode>pnpm check:build\u003c/code> verifies output references/sharing and reports gzip module sizes. These sizes exclude dynamically loaded editor tools and runtime-fetched content; they are not a full page transfer measurement.\u003c/p>\n\u003cp>Use a fresh browser tab for local fixtures. No password or provider configuration is needed for local editing. Session recovery survives reload; Site → Discard edits resets to the loaded baseline. Browser-only changes do not alter local content files. Do not reuse the user's unrelated tabs or data as fixtures.\u003c/p>\n\u003ch2 id=\"available-drivers-and-fixtures\">Available drivers and fixtures\u003c/h2>\n\u003cul>\n\u003cli>Vitest unit tests cover JSON validation/versioning, Git transactions through a fake transport, recovery storage, React/Vue lifecycle, activation policy, Markdown import/export, Lexical mounting, and media uploads through mocked SDK/canvas APIs.\u003c/li>\n\u003cli>Production artifact checks inspect real emitted files and their module graph.\u003c/li>\n\u003cli>Native browser automation can drive the actual editor. The initial run lost window access; the startup repair subsequently verified development editing and production mounting/interactions in Safari.\u003c/li>\n\u003cli>Live GitHub/R2/Netlify checks require separately configured disposable resources and credentials. None were available or modified during the initial run.\u003c/li>\n\u003c/ul>\n\u003cp>Public fixtures are Home, Block examples, an explicit static Journal index, and two entries rendered through the Journal entry generic page. Generic pages are editable under Pages but have no standalone public route. Main and draft content live in Git once connected; the local demo is read-only at the filesystem boundary.\u003c/p>\n\u003ch2 id=\"evidence-and-cleanup\">Evidence and cleanup\u003c/h2>\n\u003cp>Store outcome logs, source manifests, and observations under \u003ccode>evidence/&lt;run-id&gt;/\u003c/code>, without tokens or private content. Link them from the run. Preserve evidence before cleanup.\u003c/p>\n\u003cp>Astro 7 starts this preview in the background. Check \u003ccode>pnpm exec astro preview status\u003c/code>, then stop the owned instance with \u003ccode>pnpm exec astro preview stop\u003c/code>; verify status reports no running preview. Do not rely on closing its launcher terminal. Close/reset test tabs when the browser tool is available; if it is not, record remaining browser-only fixture edits instead of manipulating another session. Remove any exported test backups only when their identity is known. There are no polling collectors or background provider workers.\u003c/p>\n","backlinks":["index","features/editor","features/generic-pages","features/index","features/publishing","features/static-blocks","journal/2026-10-05-implementation","verification/runs/2026-10-05T0819Z-implementation"]}],"sections":["Overview","Decisions","Discussions","Features","Journal","Verification"]}</script>
<script>(() => {
  'use strict';
  const {title:wikiTitle,pages,sections} = JSON.parse(document.getElementById('wiki-data').textContent);
  const byId = new Map(pages.map(p=>[p.id,p]));
  const $ = id => document.getElementById(id);
  const colorScheme = matchMedia('(prefers-color-scheme: dark)');
  const colorInputs = document.querySelectorAll('input[name="color"]');
  function setColor(preference) {
    if (!['automatic', 'light', 'dark'].includes(preference)) preference = 'automatic';
    document.documentElement.dataset.colorPreference = preference;
    document.documentElement.dataset.theme = preference === 'automatic' ? (colorScheme.matches ? 'dark' : 'light') : preference;
    colorInputs.forEach(input => { input.checked = input.value === preference; });
  }
  setColor(document.documentElement.dataset.colorPreference);
  colorInputs.forEach(input => input.addEventListener('change', () => {
    setColor(input.value);
    try { localStorage.setItem('planning-wiki-color', input.value); } catch {}
  }));
  colorScheme.addEventListener('change', () => setColor(document.documentElement.dataset.colorPreference));
  window.addEventListener('storage', event => {
    if (event.key === 'planning-wiki-color' || event.key === null) setColor(event.newValue);
  });
  document.addEventListener('click', event => {
    if (!$('appearance').contains(event.target)) $('appearance').open = false;
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('appearance').open) {
      $('appearance').open = false;
      $('appearance').querySelector('summary').focus();
    }
  });
  let current = null;
  const link = (label,href) => { const a=document.createElement('a'); a.textContent=label; a.href=href; return a; };
  const route = id => '#/'+id.split('/').map(s=>encodeURIComponent(s).replace(/~/g,'%7E')).join('/');
  for (const section of sections) {
    const group=document.createElement('div');group.className='nav-group';
    const label=document.createElement('div');label.className='nav-group-label';label.textContent=section;group.append(label);
    pages.filter(p=>p.section===section).forEach(p=>{const a=link(p.id==='index'?'Main page':p.title,route(p.id));a.dataset.page=p.id;group.append(a);});
    $('navigation').append(group);
  }
  if (matchMedia('(max-width: 700px)').matches) $('navigation-details').open=false;
  function mode(source) {
    $('article-view').hidden=source;
    $('source-view').hidden=!source;
    $('read-tab').classList.toggle('selected',!source);
    $('source-tab').classList.toggle('selected',source);
    $('read-tab').setAttribute('aria-pressed',String(!source));
    $('source-tab').setAttribute('aria-pressed',String(source));
    $('contents').hidden=source || !current?.toc.length;
  }
  function markText(text,query) {
    const fragment=document.createDocumentFragment();
    const lower=text.toLowerCase(), needle=query.toLowerCase();
    let start=0, at;
    while (needle && (at=lower.indexOf(needle,start))!==-1) {
      fragment.append(document.createTextNode(text.slice(start,at)));
      const mark=document.createElement('mark');mark.textContent=text.slice(at,at+query.length);fragment.append(mark);start=at+query.length;
    }
    fragment.append(document.createTextNode(text.slice(start)));return fragment;
  }
  function search(query) {
    current=null;
    $('search').value=query;
    $('page-title').textContent='Search results';
    $('page-meta').hidden=true;document.querySelector('.toolbar').hidden=true;
    $('article-view').hidden=true;$('source-view').hidden=true;$('search-results').hidden=false;$('toc').replaceChildren();
    $('contents').hidden=true;
    const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
    const matches=terms.length?pages.filter(p=>terms.every(t=>(p.title+' '+p.source).toLowerCase().includes(t))).sort((a,b)=>Number(b.title.toLowerCase().includes(query.toLowerCase()))-Number(a.title.toLowerCase().includes(query.toLowerCase()))):[];
    $('result-count').textContent=terms.length?`${matches.length} ${matches.length===1?'article':'articles'} matching “${query}”${matches.length?'':'. Try fewer words or a broader term.'}`:'Enter a word or phrase to search all articles.';
    $('results').replaceChildren();
    for (const p of matches) {
      const card=document.createElement('div');card.className='result';
      const small=document.createElement('small');small.textContent=p.section;
      const h=document.createElement('h2'),a=link('',route(p.id));a.append(markText(p.title,query));h.append(a);
      const excerpt=document.createElement('p');
      const plain=p.source.replace(/^---\n[\s\S]*?\n---\n/,'').replace(/[#*`|]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ');
      const position=plain.toLowerCase().indexOf(terms[0]);const start=Math.max(0,position-65);
      excerpt.append(markText((start?'…':'')+plain.slice(start,start+240)+(plain.length>start+240?'…':''),query));
      card.append(small,h,excerpt);$('results').append(card);
    }
    document.title='Search — '+wikiTitle;
  }
  function render() {
    const rawHash=location.hash.slice(1);
    document.querySelectorAll('[aria-current=page]').forEach(a=>a.removeAttribute('aria-current'));
    if(rawHash.startsWith('/search?')) {search(new URLSearchParams(rawHash.slice(8)).get('q')||'');window.scrollTo(0,0);return;}
    let id='index',anchor='';
    try {
      const parts=(rawHash.startsWith('/')?rawHash.slice(1):'index').split('~');
      id=decodeURIComponent(parts[0]);anchor=decodeURIComponent(parts[1]||'');
    } catch {id='__invalid_route__';}

    const p=byId.get(id||'index');
    $('search-results').hidden=true;document.querySelector('.toolbar').hidden=!p;$('page-meta').hidden=!p;
    current=p||null;mode(false);
    if(!p){
      $('page-title').textContent='Page not found';
      $('article').replaceChildren(link('Return to the main page',route('index')));$('toc').replaceChildren();$('backlinks').hidden=true;document.title='Page not found — '+wikiTitle;return;
    }
    $('search').value='';$('page-title').textContent=p.title;
    $('page-meta').innerHTML=p.metadataHtml;
    $('page-meta').hidden=!p.metadataHtml;
    $('article').innerHTML=p.html;
    $('source-text').textContent=p.source;$('source-path').textContent=p.id+'.md';
    $('toc').replaceChildren();
    p.toc.forEach(h=>{const a=link(h.title,route(p.id)+'~'+h.id);if(h.depth>2)a.className='nested';$('toc').append(a);});
    $('backlink-list').replaceChildren();$('backlinks').hidden=!p.backlinks.length;
    p.backlinks.forEach(id=>$('backlink-list').append(link(byId.get(id).title,route(id))));
    document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===p.id)a.setAttribute('aria-current','page');});
    document.title=p.id==='index'?wikiTitle:p.title+' — '+wikiTitle;
    if(anchor)requestAnimationFrame(()=>{if(anchor===p.titleAnchor)$('page-title').scrollIntoView();else document.getElementById(anchor)?.scrollIntoView();});else window.scrollTo(0,0);
  }
  $('search-form').addEventListener('submit',e=>{e.preventDefault();const hash='/search?q='+encodeURIComponent($('search').value.trim());if(location.hash==='#'+hash)render();else location.hash=hash;});
  $('read-tab').addEventListener('click',()=>mode(false));$('source-tab').addEventListener('click',()=>mode(true));
  $('print').addEventListener('click',()=>{mode(false);window.print();});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const target=$('search-results').hidden?$('article'):$('main');target.focus();target.scrollIntoView();});
  $('download').addEventListener('click',()=>{
    if(!current)return;const url=URL.createObjectURL(new Blob([current.source],{type:'text/markdown;charset=utf-8'}));
    const a=link('',url);a.download=current.id.split('/').pop()+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('search').focus();}});
  document.addEventListener('click',e=>{const a=e.target.closest('a');if(a?.getAttribute('href')?.startsWith('#/')&&matchMedia('(max-width: 700px)').matches)$('navigation-details').open=false;});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
